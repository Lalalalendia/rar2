[package]
name = "pub-re"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[workspace]
resolver = "2"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
pub-cfb = { path = "../../vendor/producer-a/crates/pub-cfb" }

[dev-dependencies]
cfb = "0.14"
tempfile = "3"
