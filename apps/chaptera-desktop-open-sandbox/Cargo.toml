[package]
name = "chaptera-desktop-open-sandbox"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[workspace]

[dependencies]
anyhow = "1"
chaptera-desktop-open-protocol = { path = "../../crates/chaptera-desktop-open-protocol" }
chaptera-untrusted-pub-scan = { path = "../../crates/chaptera-untrusted-pub-scan" }
rappct = "=0.13.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
    "Win32_System_WindowsProgramming",
] }
