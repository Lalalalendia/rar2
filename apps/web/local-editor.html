<!doctype html>
<meta charset="utf-8">
<title>Chaptera Local Editor</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#111317;color:#eef1f5}
body{display:grid;grid-template-rows:auto 1fr}
header{background:#171b21;border-bottom:1px solid #2b323d;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
h1{font-size:16px;margin:0 10px 0 0}
button,select{border:1px solid #394352;background:#252b34;color:#eef1f5;border-radius:7px;padding:7px 10px}
button{cursor:pointer}button:hover{background:#303845}
#state{font-size:12px;color:#9aa4b2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;min-width:200px}
#disclosure{font-size:12px;color:#aeb8c6;display:flex;gap:12px;flex-wrap:wrap;width:100%}
#text-tools{display:grid;grid-template-columns:minmax(320px,1fr) auto auto;gap:8px;align-items:start;width:100%}
#text-tools[hidden]{display:none}
#text-value{min-height:84px;max-height:220px;resize:vertical;border:1px solid #394352;background:#101318;color:#eef1f5;border-radius:7px;padding:8px;font:13px/1.35 ui-monospace,SFMono-Regular,Consolas,monospace}
#font-tools{display:flex;gap:9px;align-items:center;width:100%;flex-wrap:wrap;font-size:12px;color:#b8c1cc}
#font-choice{max-width:230px}
#font-message{flex:1;min-width:180px}
#font-sample{font-size:22px;padding:2px 9px;border:1px solid #394352;background:#252b34;color:#eee;white-space:nowrap}
button:disabled{cursor:not-allowed;opacity:.45}
#host-wrap{overflow:auto;background:#d9d9d9;position:relative}
#host{width:1200px;height:3600px;position:relative;touch-action:none;background:#e9e9e9}
.bad{color:#ff8d8d}.ok{color:#70e5a3}.warn{color:#ffd166}
</style>
<header>
  <h1>Chaptera Local Editor</h1>
  <button id="undo">Undo</button>
  <button id="redo">Redo</button>
  <button id="reopen">Reopen</button>
  <button id="edit-text" disabled>Edit text</button>
  <button id="save-pub" disabled>Download PUB</button>
  <select id="target"><option value="idml">IDML</option><option value="odg">ODG</option></select>
  <button id="preview">Export preview</button>
  <span id="state">connecting…</span>
  <div id="disclosure">
    <span id="fidelity"></span>
    <span id="capabilities"></span>
    <span id="loss"></span>
    <span id="pubsave"></span>
  </div>
  <div id="text-tools" hidden>
    <textarea id="text-value" spellcheck="false" aria-label="Story text"></textarea>
    <button id="apply-text">Apply text</button>
    <button id="cancel-text">Cancel</button>
  </div>
  <div id="font-tools" role="group" aria-label="Physical font preview">
    <label for="font-choice">Admitted font</label>
    <select id="font-choice" disabled><option value="">No admitted fonts</option></select>
    <button id="preview-physical-font" disabled>Preview bytes</button>
    <span id="font-message" role="status">Browser preview only; not an Editor font change.</span>
    <span id="font-sample" aria-label="Font preview sample">Aa Bb 123</span>
  </div>
</header>
<div id="host-wrap"><div id="host" aria-label="Chaptera editor canvas"></div></div>
<script type="module">
import {BrowserEditorShellV1} from "./editor-shell-v1.mjs";
import {HttpEditorServiceV1} from "./editor-service-client-v1.mjs";
import {projectAdmittedFontChoices,chooseAdmittedFontCandidate} from "./font-environment-v1.mjs";
import {BrowserObservabilityV1} from "./observability-v1.mjs";
import {prepareStoryTextForTextarea, restoreStoryTextFromTextarea} from "./story-line-endings-v1.mjs";

const params=new URLSearchParams(location.search);
const api=params.get("api") ?? "http://127.0.0.1:18765";
const emuPerCssPx=Number(params.get("emu_per_css_px") ?? "12700");
const panYCssPx=Number(params.get("pan_y_css_px") ?? "-2600");
const stateEl=document.querySelector("#state");
const host=document.querySelector("#host");
const editTextButton=document.querySelector("#edit-text");
const savePubButton=document.querySelector("#save-pub");
const textTools=document.querySelector("#text-tools");
const textValue=document.querySelector("#text-value");
const fontChoice=document.querySelector("#font-choice");
const previewFontButton=document.querySelector("#preview-physical-font");
const fontMessage=document.querySelector("#font-message");
const fontSample=document.querySelector("#font-sample");
let currentFontContext=null;
let editingStory=null;
let editableStoryIds=new Set();
let seq=0;
const observability=new BrowserObservabilityV1({
  sessionIncarnation:"session:local-editor",
  browserFamily:navigator.userAgent.includes("Firefox")?"firefox":"chromium",
  idFactory:(prefix)=>prefix+":local-"+String(++seq).padStart(6,"0"),
});
const service=new HttpEditorServiceV1(api,{observability});
let shell=null;

function opId(kind){return "local-"+kind+"-"+crypto.randomUUID();}
function showError(error){stateEl.className="bad";stateEl.textContent=String(error?.message??error);}
function selectedStory(){
  if(!shell?.snapshot || !shell.selection.nodeId) return null;
  const frame=shell.snapshot.story_frames.find(x=>x.node_id===shell.selection.nodeId);
  if(!frame) return null;
  const story=shell.snapshot.stories.find(x=>x.story_id===frame.story_id);
  return story?{node_id:shell.selection.nodeId,frame,story}:null;
}
function syncTextControls(){
  const selected=selectedStory();
  editTextButton.disabled=!selected||!editableStoryIds.has(selected.story.story_id);
  if(editingStory && (!selected || selected.story.story_id!==editingStory.story_id)){
    editingStory=null;
    textTools.hidden=true;
  }
}
function showState(state){
  stateEl.className="";
  stateEl.textContent="revision "+state.revision_id+(state.selected_node_id?" · selected "+state.selected_node_id:"");
  syncTextControls();
}

async function disclosure(){
  const scene=shell.snapshot;
  // A new revision may make previously authorized PUB bytes ineligible.
  // Fail closed while recalculating capability, including on HTTP failure.
  savePubButton.disabled=true;
  // Unsupported editable export must not suppress independent Story/PUB capability
  // facts or leave the editor without bound commands.
  const [exportResult,pubPreview,editorCaps,fontResult]=await Promise.all([
    service.exportPreview(document.querySelector("#target").value)
      .then(value=>({ok:true,value}),()=>({ok:false})),
    service.nativePubPreview(),
    service.editorCapabilities(),
    Promise.all([service.fontEnvironment(),service.fontAuthoringAdmission()])
      .then(([environment,admission])=>({ok:true,value:{environment,admission}}),
            error=>({ok:false,error})),
  ]);
  // Never admit a preview fetched for a different (possibly older) revision.
  if(shell.snapshot.revision_id!==scene.revision_id||
     pubPreview.revision_id!==scene.revision_id||
     editorCaps.revision_id!==scene.revision_id){
    throw new Error("PUB capability refresh is stale relative to current Editor revision");
  }
  editableStoryIds=new Set(editorCaps.editable_story_ids??[]);
  showFontChoices(scene,fontResult);
  syncTextControls();
  const caps=scene.capabilities ?? [];
  document.querySelector("#fidelity").textContent="Fidelity: "+scene.fidelity.state+
    (scene.fidelity.reasons?.length?" — "+scene.fidelity.reasons.join(", "):"");
  document.querySelector("#capabilities").textContent="Capabilities: "+
    (caps.length?caps.map(x=>x.key+"="+x.state).join("; "):"none");
  const loss=document.querySelector("#loss");
  if(exportResult.ok){
    const preview=exportResult.value;
    const losses=(preview.items??[]).filter(x=>x.disposition!=="preserved");
    loss.className=preview.can_serialize?"ok":"bad";
    loss.textContent="Export "+preview.target.format.toUpperCase()+": "+
      (preview.can_serialize?"ready":"blocked")+" · blocking="+preview.counts.blocking+
      " · losses="+losses.length;
  }else{
    loss.className="bad";
    loss.textContent="Export: blocked (this target has no validated preview)";
  }
  const pub=document.querySelector("#pubsave");
  pub.className=pubPreview.can_download===true?"ok":"warn";
  pub.textContent="PUB: "+(pubPreview.can_download===true
    ?"Exact-byte Publisher verified"
    :pubPreview.can_serialize
      ?"Writer candidate only · Publisher not verified"
      :"Project-only · "+(pubPreview.blocker_code??"writer blocked"));
  savePubButton.disabled=pubPreview.can_download!==true;
}

function showFontChoices(scene, fontResult){
  currentFontContext=null;
  fontChoice.replaceChildren(new Option("No admitted fonts", ""));
  fontChoice.disabled=true;
  previewFontButton.disabled=true;
  fontSample.style.fontFamily="";
  fontMessage.className="warn";
  fontMessage.textContent="No physical font permitted for browser preview.";
  if(!fontResult.ok){
    fontMessage.textContent="Font admission unavailable; no implicit substitution.";
    return;
  }
  try{
    const {environment,admission}=fontResult.value;
    const choices=projectAdmittedFontChoices(scene,environment,admission);
    // Only the same current Scene snapshot may produce an actionable choice.
    if(shell.snapshot.revision_id!==scene.revision_id ||
       shell.snapshot.snapshot_id!==scene.snapshot_id){
      throw new Error("font picker response is stale");
    }
    if(!choices.length) return;
    fontChoice.replaceChildren();
    for(const choice of choices){
      const option=new Option(
        (choice.display_family??"Physical font")+" · "+
        (choice.display_style??"Regular")+" · "+choice.resource_id.slice(0,8),
        choice.resource_id
      );
      fontChoice.append(option);
    }
    currentFontContext={environment,admission,scene_snapshot_id:scene.snapshot_id};
    fontChoice.disabled=false;
    previewFontButton.disabled=false;
    fontMessage.textContent="Exact font available for preview. No document edit or PDF relayout yet.";
  }catch(error){
    fontMessage.className="bad";
    fontMessage.textContent="Font picker blocked: "+String(error?.message??error);
  }
}

async function previewSelectedFont(){
  if(!currentFontContext||!shell?.snapshot) return;
  const scene=shell.snapshot;
  if(scene.snapshot_id!==currentFontContext.scene_snapshot_id) {
    throw new Error("selected font candidate belongs to a stale Scene");
  }
  const {environment,admission}=currentFontContext;
  const candidate=chooseAdmittedFontCandidate(scene,environment,admission,fontChoice.value);
  const physical=environment.fonts.find(
    font=>font.resource_id===candidate.resource_id&&
      font.content_hash===candidate.content_hash&&
      font.face_index===candidate.face_index
  );
  if(!physical) throw new Error("selected font lacks exact delivery descriptor");
  previewFontButton.disabled=true;
  fontMessage.textContent="Checking exact physical font bytes…";
  try{
    const bytes=await service.exactFontResourceBytes(physical);
    if(shell.snapshot.snapshot_id!==scene.snapshot_id ||
       shell.snapshot.revision_id!==scene.revision_id) {
      throw new Error("font delivery finished after the Scene changed");
    }
    const family="ChapteraPreview_"+candidate.content_hash.slice(0,16);
    const fontFace=new FontFace(family,bytes,{style:"normal",weight:"400"});
    await fontFace.load();
    if(shell.snapshot.snapshot_id!==scene.snapshot_id) {
      throw new Error("font preview became stale during font load");
    }
    document.fonts.add(fontFace);
    fontSample.style.fontFamily='"'+family+'"';
    fontMessage.className="warn";
    fontMessage.textContent="Verified byte preview only — Story, layout, saved PUB and PDF unchanged.";
  }finally{
    previewFontButton.disabled=!currentFontContext ||
      shell.snapshot.snapshot_id!==currentFontContext.scene_snapshot_id;
  }
}

function openTextEditor(){
  const selected=selectedStory();
  if(!selected||!editableStoryIds.has(selected.story.story_id)) return;
  const original=selected.story.text;
  // A textarea normalizes CR/CRLF to LF. Persist the exact source paragraph
  // separator convention so a text-only mutation cannot rewrite other lines.
  const sourceText=prepareStoryTextForTextarea(original);
  editingStory={
    story_id:selected.story.story_id,
    node_id:selected.node_id,
    original_text:original,
    terminal_cr:sourceText.terminal_cr,
    line_ending_kind:sourceText.line_ending_kind,
  };
  textValue.value=sourceText.value;
  textTools.hidden=false;
  textValue.focus();
}
function closeTextEditor(){
  editingStory=null;
  textTools.hidden=true;
}
async function applyTextEdit(){
  if(!editingStory) return;
  const snapshot=shell.snapshot;
  const current=snapshot.stories.find(x=>x.story_id===editingStory.story_id);
  if(!current || current.text!==editingStory.original_text){
    throw new Error("Story changed since text editor opened");
  }
  const replacement=restoreStoryTextFromTextarea(textValue.value,editingStory);
  if(replacement===editingStory.original_text){
    closeTextEditor();
    return;
  }
  const request={
    protocol_version:"chaptera.story-range-intent.v1",
    document_id:snapshot.document_id,
    source_hash:snapshot.source_hash,
    base_revision_id:snapshot.revision_id,
    client_operation_id:opId("story"),
    command:{
      kind:"replace_story_range",
      story_id:editingStory.story_id,
      start_scalar:0,
      end_scalar:Array.from(editingStory.original_text).length,
      expected_before:editingStory.original_text,
      replacement_text:replacement,
    },
  };
  savePubButton.disabled=true;
  const accepted=await service.commit(request);
  if(accepted.protocol_version!=="chaptera.commit-accepted.v1"){
    throw new Error("Story edit rejected: "+JSON.stringify(accepted));
  }
  const scene=await service.sceneForRevision(accepted.revision_id);
  closeTextEditor();
  shell.loadSnapshot(scene,{preserveSelection:true});
  await disclosure();
}
async function downloadNativePub(){
  const preview=await service.nativePubPreview();
  if(preview.can_download!==true) throw new Error("Publisher-native approval missing for exact PUB bytes");
  const result=await service.nativePubDownload();
  const url=URL.createObjectURL(result.blob);
  try{
    const anchor=document.createElement("a");
    anchor.href=url;
    anchor.download="chaptera-edited.pub";
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
  }finally{
    URL.revokeObjectURL(url);
  }
}

async function history(kind){
  // Undo/Redo revoke any prior Download PUB UI admission immediately.
  savePubButton.disabled=true;
  const snapshot=shell.snapshot;
  const accepted=await service.historyTransition({
    protocol_version:"chaptera.history-transition-intent.v1",
    document_id:snapshot.document_id,
    source_hash:snapshot.source_hash,
    base_revision_id:snapshot.revision_id,
    client_operation_id:opId(kind),
    command:{kind},
  });
  const scene=await service.sceneForRevision(accepted.revision_id);
  shell.loadSnapshot(scene,{preserveSelection:false});
  await disclosure();
  return accepted;
}

async function start(){
  const snapshot=await service.currentScene();
  shell=new BrowserEditorShellV1({
    host,
    service,
    rendererKind:"svg",
    view:{emu_per_css_px:emuPerCssPx,pan_y_css_px:panYCssPx},
    operationIdFactory:()=>opId("move"),
    onState:(state)=>showState(state),
  });
  shell.loadSnapshot(snapshot,{preserveSelection:false});
  shell.bindPointerEvents();
  await disclosure();
  document.querySelector("#undo").onclick=()=>history("undo").catch(showError);
  document.querySelector("#redo").onclick=()=>history("redo").catch(showError);
  document.querySelector("#reopen").onclick=async()=>{
    try{
      savePubButton.disabled=true;
      const response=await fetch(api+"/v1/harness/reopen",{method:"POST",headers:{"x-chaptera-principal-id":"synthetic-editor"}});
      const scene=await response.json();
      if(!response.ok) throw new Error(JSON.stringify(scene));
      shell.loadSnapshot(scene,{preserveSelection:false});
      await disclosure();
    }catch(error){showError(error)}
  };
  document.querySelector("#preview").onclick=()=>disclosure().catch(showError);
  document.querySelector("#target").onchange=()=>disclosure().catch(showError);
  editTextButton.onclick=()=>{try{openTextEditor()}catch(error){showError(error)}};
  document.querySelector("#apply-text").onclick=()=>applyTextEdit().catch(showError);
  document.querySelector("#cancel-text").onclick=()=>closeTextEditor();
  previewFontButton.onclick=()=>previewSelectedFont().catch(error=>{
    fontMessage.className="bad";
    fontMessage.textContent=String(error?.message??error);
  });
  fontChoice.onchange=()=>{
    fontSample.style.fontFamily="";
    fontMessage.className="warn";
    fontMessage.textContent="Candidate selected; preview only. No Editor font change.";
  };
  savePubButton.onclick=()=>downloadNativePub().catch(showError);
  document.querySelector("#host-wrap").scrollTop=2480;
}
start().catch(showError);
</script>
