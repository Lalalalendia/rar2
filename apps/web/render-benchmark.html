<!doctype html>
<meta charset="utf-8">
<title>Chaptera Web Renderer Benchmark</title>
<style>
  html, body { margin: 0; font-family: system-ui, sans-serif; background: #eee; }
  #host { width: 1200px; height: 800px; overflow: hidden; position: relative; }
</style>
<div id="host"></div>
<script type="module">
  import { createRenderer, RENDERER_KINDS } from "./render-v1.mjs";

  const host = document.getElementById("host");
  const BASE_VIEW = {
    emu_per_css_px: 9525,
    zoom: 1,
    pan_x_css_px: 0,
    pan_y_css_px: 0,
    page_gap_css_px: 32,
    page_margin_css_px: 24
  };

  const raf2 = () => new Promise((resolve) => {
    requestAnimationFrame(() => requestAnimationFrame(resolve));
  });

  function focusedView(snapshot, baseView = BASE_VIEW) {
    const populated = new Set(snapshot.nodes.map((node) => node.page_id));
    const pages = [...snapshot.pages].sort((a, b) => a.order - b.order);
    let precedingCssPx = 0;
    for (const page of pages) {
      if (populated.has(page.page_id)) {
        return {
          view: {
            ...baseView,
            pan_y_css_px: baseView.pan_y_css_px - precedingCssPx
          },
          mode: "first_populated_page",
          page_id: page.page_id,
          page_order: page.order,
          preceding_css_px: precedingCssPx
        };
      }
      precedingCssPx +=
        (page.height_emu / baseView.emu_per_css_px) * baseView.zoom
        + baseView.page_gap_css_px;
    }
    return {
      view: { ...baseView },
      mode: "no_populated_page",
      page_id: null,
      page_order: null,
      preceding_css_px: 0
    };
  }

  function benchmarkFocus(snapshot, meta, baseView = BASE_VIEW) {
    if (meta.focus_first_populated_page === true) {
      return focusedView(snapshot, baseView);
    }
    return {
      view: { ...baseView },
      mode: "base_view",
      page_id: null,
      page_order: null,
      preceding_css_px: 0
    };
  }

  function quantile(values, q) {
    if (!values.length) return null;
    const ordered = [...values].sort((a, b) => a - b);
    const index = Math.min(ordered.length - 1, Math.floor((ordered.length - 1) * q));
    return ordered[index];
  }

  function sampleStats(values) {
    return {
      samples: values.length,
      p50_ms: quantile(values, 0.50),
      p95_ms: quantile(values, 0.95),
      max_ms: values.length ? Math.max(...values) : null
    };
  }

  async function constructAndPaint(fn) {
    const start = performance.now();
    const value = fn();
    await raf2();
    return { value, ms: performance.now() - start };
  }

  window.runRenderBenchmark = async function runRenderBenchmark(payloadText, meta) {
    const parseStart = performance.now();
    const snapshot = JSON.parse(payloadText);
    const parseMs = performance.now() - parseStart;
    const immutableBefore = JSON.stringify(snapshot);
    const focus = benchmarkFocus(snapshot, meta);
    const benchmarkView = focus.view;
    const selected = (
      focus.page_id
        ? snapshot.nodes.find((node) => node.page_id === focus.page_id)
        : null
    ) ?? snapshot.nodes[0] ?? null;
    const preview = selected ? {
      x: selected.bounds.x + 12700,
      y: selected.bounds.y + 12700,
      width: selected.bounds.width,
      height: selected.bounds.height
    } : null;

    const results = [];
    for (const kind of RENDERER_KINDS) {
      host.replaceChildren();
      const first = await constructAndPaint(() =>
        createRenderer(kind, host, snapshot, benchmarkView)
      );
      const renderer = first.value;
      const initial = renderer.stats();

      if (!initial.available) {
        results.push({
          renderer: kind,
          available: false,
          unavailable_reason: initial.unavailable_reason,
          first_render_ms: first.ms,
          pan_zoom: sampleStats([]),
          selection_overlay: sampleStats([]),
          transient_preview: sampleStats([]),
          dom_elements: initial.dom_elements
        });
        renderer.destroy();
        continue;
      }

      const panZoom = [];
      for (let i = 0; i < 24; i += 1) {
        const start = performance.now();
        const basePanView = {
          ...BASE_VIEW,
          zoom: i % 2 ? 1.25 : 0.85,
          pan_x_css_px: (i % 7) * 4,
          pan_y_css_px: -(i % 5) * 3
        };
        renderer.setView(
          meta.focus_first_populated_page === true
            ? focusedView(snapshot, basePanView).view
            : basePanView
        );
        panZoom.push(performance.now() - start);
      }
      await raf2();

      const selection = [];
      for (let i = 0; i < 80; i += 1) {
        const start = performance.now();
        renderer.updateOverlay({
          selected_node_id: selected?.node_id ?? null
        });
        selection.push(performance.now() - start);
      }

      const drag = [];
      for (let i = 0; i < 80; i += 1) {
        const start = performance.now();
        renderer.updateOverlay({
          selected_node_id: selected?.node_id ?? null,
          preview_bounds: preview ? {
            ...preview,
            x: preview.x + i * 1000,
            y: preview.y + i * 500
          } : null
        });
        drag.push(performance.now() - start);
      }
      await raf2();

      const finalStats = renderer.stats();
      results.push({
        renderer: kind,
        available: true,
        unavailable_reason: null,
        first_render_ms: first.ms,
        pan_zoom: sampleStats(panZoom),
        selection_overlay: sampleStats(selection),
        transient_preview: sampleStats(drag),
        dom_elements: finalStats.dom_elements
      });
      renderer.destroy();
    }

    if (JSON.stringify(snapshot) !== immutableBefore) {
      throw new Error("renderer mutated the BrowserSceneSnapshotV1 input");
    }

    return {
      input_class: meta.input_class,
      fixture: meta.fixture,
      real_pub: meta.real_pub === true,
      representative_corpus: meta.representative_corpus === true,
      technology_decision_allowed: meta.technology_decision_allowed === true,
      viewport_focus: {
        mode: focus.mode,
        page_id: focus.page_id,
        page_order: focus.page_order,
        pan_y_css_px: benchmarkView.pan_y_css_px,
        preceding_css_px: focus.preceding_css_px
      },
      payload_bytes: new TextEncoder().encode(payloadText).byteLength,
      parse_ms: parseMs,
      pages: snapshot.pages.length,
      nodes: snapshot.nodes.length,
      stories: snapshot.stories.length,
      resources: snapshot.resources.length,
      diagnostics: snapshot.diagnostics.length,
      fidelity: snapshot.fidelity,
      resource_decode: {
        measured: false,
        reason: "protocol fixtures expose opaque handles, not fetchable production bytes"
      },
      memory: performance.memory
        ? { used_js_heap_bytes: performance.memory.usedJSHeapSize }
        : null,
      renderers: results
    };
  };

  window.runReaderPictureContractProbe = async function runReaderPictureContractProbe() {
    const pixel = "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mNk+A8AAQUBAScY42YAAAAASUVORK5CYII=";
    const baseScene = {
      protocol_version: "chaptera.scene.v1",
      document_id: "18888888-8888-4888-8888-888888888888",
      source_hash: "a".repeat(64),
      revision_id: "sha256:" + "b".repeat(64),
      snapshot_id: "sha256:" + "c".repeat(64),
      layout_environment: {
        environment_id: "sha256:" + "d".repeat(64),
        engine_revision: "reader-picture-dom-probe",
        font_set_fingerprint: "sha256:" + "e".repeat(64),
        resource_fingerprint: "sha256:" + "f".repeat(64),
      },
      stacking_fidelity: "exact",
      pages: [{
        page_id: "17777777-7777-4777-8777-777777777777",
        order: 0,
        width_emu: 7772400,
        height_emu: 10058400,
      }],
      nodes: [{
        node_id: "16666666-6666-4666-8666-666666666666",
        page_id: "17777777-7777-4777-8777-777777777777",
        parent_node_id: null,
        kind: "picture_frame",
        bounds: { x: 95250, y: 190500, width: 952500, height: 476250 },
        z_order: 0,
        paint_order: 0,
        paint_id: null,
        resource_id: "image:probe",
        transform: { a: "1", b: "0", c: "0", d: "1", tx: 0, ty: 0 },
        visual_authority: "reader_scene",
      }],
      stories: [],
      story_frames: [],
      paints: [],
      resources: [{
        resource_id: "image:probe",
        kind: "image",
        mime: "image/png",
        content_hash: null,
        byte_len: null,
        availability: "inline_data_url",
        fetch_handle: null,
        inline_data_url: pixel,
      }],
      diagnostics: [],
      capabilities: [{ key: "render.resources", state: "supported", note: null }],
      fidelity: { state: "supported", reasons: [] },
    };

    const cropScene = structuredClone(baseScene);
    cropScene.nodes[0].image_source_window = {
      left_q16: 16384,
      top_q16: 0,
      right_q16: 49152,
      bottom_q16: 65536,
    };
    cropScene.nodes[0].image_recolor = {
      target_rgb: [51, 102, 153],
      preserve_grays: false,
    };
    host.replaceChildren();
    let renderer = createRenderer("svg", host, cropScene, BASE_VIEW);
    await raf2();
    const viewport = host.querySelector('svg[data-picture-viewport="fixed-frame"]');
    const cropped = viewport?.querySelector("image");
    const filter = host.querySelector("filter[color-interpolation-filters='sRGB']");
    if (!viewport || !cropped || !filter) {
      renderer.destroy();
      throw new Error("Reader crop/recolor fixed-frame SVG contract missing");
    }
    const cropReceipt = {
      viewport_authority: viewport.getAttribute("data-picture-authority"),
      viewport_width: Number(viewport.getAttribute("width")),
      image_x: Number(cropped.getAttribute("x")),
      image_width: Number(cropped.getAttribute("width")),
      recolor_authority: cropped.getAttribute("data-image-recolor-authority"),
      filter_bound: String(cropped.getAttribute("filter") ?? "").startsWith("url(#chaptera-editor-image-"),
    };
    renderer.destroy();

    const rotationScene = structuredClone(baseScene);
    rotationScene.nodes[0].image_content_rotation_degrees = 270;
    host.replaceChildren();
    renderer = createRenderer("svg", host, rotationScene, BASE_VIEW);
    await raf2();
    const rotated = host.querySelector('svg[data-picture-viewport="fixed-frame"] image');
    if (!rotated) {
      renderer.destroy();
      throw new Error("Reader rotation fixed-frame SVG contract missing");
    }
    const rotationReceipt = {
      transform: rotated.getAttribute("transform"),
      viewport_fixed: host.querySelectorAll('svg[data-picture-viewport="fixed-frame"]').length === 1,
    };
    renderer.destroy();

    const genericScene = structuredClone(baseScene);
    delete genericScene.nodes[0].visual_authority;
    host.replaceChildren();
    renderer = createRenderer("svg", host, genericScene, BASE_VIEW);
    await raf2();
    const generic = host.querySelector('image[data-resource-authority="browser-scene-inline"]');
    const genericReceipt = {
      preserved: generic !== null,
      reader_viewport_count: host.querySelectorAll('svg[data-picture-viewport="fixed-frame"]').length,
    };
    renderer.destroy();

    if (cropReceipt.viewport_authority !== "reader-picture-content") {
      throw new Error("Reader picture authority marker changed");
    }
    if (Math.abs(cropReceipt.image_x + 50) > 1e-9 || Math.abs(cropReceipt.image_width - 200) > 1e-9) {
      throw new Error("Reader crop DOM geometry changed: " + JSON.stringify(cropReceipt));
    }
    if (cropReceipt.recolor_authority !== "source-picture-recolor" || !cropReceipt.filter_bound) {
      throw new Error("Reader recolor DOM contract changed");
    }
    if (!String(rotationReceipt.transform ?? "").startsWith("rotate(270 ")) {
      throw new Error("Reader cardinal rotation DOM contract changed");
    }
    if (!rotationReceipt.viewport_fixed) {
      throw new Error("Reader rotation lost fixed-frame viewport");
    }
    if (!genericReceipt.preserved || genericReceipt.reader_viewport_count !== 0) {
      throw new Error("generic BrowserScene inline image path regressed");
    }

    return { crop: cropReceipt, rotation: rotationReceipt, generic: genericReceipt };
  };

  window.runReaderTableContractProbe = async function runReaderTableContractProbe() {
    const scene = {
      protocol_version: "chaptera.editor-render-scene.v1",
      document_id: "28888888-8888-4888-8888-888888888888",
      source_hash: "1".repeat(64),
      revision_id: "sha256:" + "2".repeat(64),
      snapshot_id: "sha256:" + "3".repeat(64),
      layout_environment: {
        environment_id: "sha256:" + "4".repeat(64),
        engine_revision: "reader-table-dom-probe",
        font_set_fingerprint: "sha256:" + "5".repeat(64),
        resource_fingerprint: "sha256:" + "6".repeat(64),
      },
      stacking_fidelity: "exact",
      pages: [{
        page_id: "27777777-7777-4777-8777-777777777777",
        order: 0,
        width_emu: 7772400,
        height_emu: 10058400,
      }],
      nodes: [{
        node_id: "26666666-6666-4666-8666-666666666666",
        page_id: "27777777-7777-4777-8777-777777777777",
        parent_node_id: null,
        kind: "table",
        bounds: { x: 95250, y: 190500, width: 952500, height: 476250 },
        z_order: 0,
        paint_order: 0,
        paint_id: null,
        resource_id: null,
        image_source_window: null,
        image_content_rotation_degrees: null,
        image_recolor: null,
        transform: { a: "1", b: "0", c: "0", d: "1", tx: 0, ty: 0 },
        editable: true,
        origin_node_id: null,
        preview_text_style: null,
        text_bounds: null,
        text_layout: null,
        visual_authority: "reader_scene",
        table: {
          story_id: "story:table",
          rows: 1,
          columns: 1,
          cells: [{
            cell_id: "cell:0:0",
            row: 0,
            column: 0,
            row_span: 1,
            column_span: 1,
            text: "Cell",
            bounds: { x: 95250, y: 190500, width: 952500, height: 476250 },
            fill_rgb: [12, 34, 56],
            fill_visible: true,
          }],
          borders: [{
            x1_emu: 95250,
            y1_emu: 190500,
            x2_emu: 1047750,
            y2_emu: 190500,
            rgb: [1, 2, 3],
            width_emu: 12700,
          }],
        },
      }],
      stories: [],
      story_frames: [],
      paints: [],
      resources: [],
      diagnostics: [],
      capabilities: [{ key: "render.table", state: "supported", note: null }],
      fidelity: { state: "supported", reasons: [] },
    };

    host.replaceChildren();
    const renderer = createRenderer("svg", host, scene, BASE_VIEW);
    await raf2();
    const fill = host.querySelector('[data-table-cell-paint-authority="source-t595"]');
    const border = host.querySelector('[data-table-border-authority="source-t840"]');
    const text = host.querySelector('[data-preview-reason="table_cell_preview"]');
    const receipt = {
      fill_x: Number(fill?.getAttribute("x")),
      fill_y: Number(fill?.getAttribute("y")),
      fill_width: Number(fill?.getAttribute("width")),
      fill_color: fill?.getAttribute("fill") ?? null,
      border_width: Number(border?.getAttribute("stroke-width")),
      border_color: border?.getAttribute("stroke") ?? null,
      text_authority: text?.getAttribute("data-text-authority") ?? null,
      cell_text: text?.textContent ?? null,
    };
    renderer.destroy();

    if (!fill || !border || !text) {
      throw new Error("Reader table fill/border/preview DOM contract missing");
    }
    if (receipt.fill_x !== 34 || receipt.fill_y !== 44 || receipt.fill_width !== 100) {
      throw new Error("Reader table CSS geometry changed: " + JSON.stringify(receipt));
    }
    if (receipt.fill_color !== "rgb(12 34 56)") {
      throw new Error("Reader table fill authority changed");
    }
    if (Math.abs(receipt.border_width - (12700 / 9525)) > 1e-9 || receipt.border_color !== "rgb(1 2 3)") {
      throw new Error("Reader table border authority changed");
    }
    if (receipt.text_authority !== "browser-preview-only" || receipt.cell_text !== "Cell") {
      throw new Error("Reader table text preview authority changed");
    }
    return receipt;
  };

  window.renderForScreenshot = async function renderForScreenshot(payloadText, kind, options = {}) {
    const snapshot = JSON.parse(payloadText);
    host.replaceChildren();
    if (window.__screenshotRenderer) {
      window.__screenshotRenderer.destroy();
      window.__screenshotRenderer = null;
    }
    const focus = options.focus_first_populated_page === true
      ? focusedView(snapshot)
      : {
          view: { ...BASE_VIEW },
          mode: "base_view",
          page_id: null,
          page_order: null,
          preceding_css_px: 0
        };
    const renderer = createRenderer(kind, host, snapshot, focus.view);
    if (!renderer.stats().available) {
      renderer.destroy();
      return {
        available: false,
        unavailable_reason: renderer.stats().unavailable_reason ?? null,
        focus
      };
    }
    if (options.include_overlay !== false && snapshot.nodes[0]) {
      renderer.updateOverlay({ selected_node_id: snapshot.nodes[0].node_id });
    }
    await raf2();
    window.__screenshotRenderer = renderer;
    return {
      available: true,
      focus: {
        mode: focus.mode,
        page_id: focus.page_id,
        page_order: focus.page_order,
        pan_y_css_px: focus.view.pan_y_css_px,
        preceding_css_px: focus.preceding_css_px
      }
    };
  };
</script>
