[package]
name = "chaptera-desktop-shaped-flow-runtime"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[dependencies]
chaptera-caret-layout-feed = { path = "../chaptera-caret-layout-feed" }
chaptera-scene-instance = { path = "../chaptera-scene-instance" }
chaptera-text-caret-map-adapter = { path = "../chaptera-text-caret-map-adapter" }
chaptera-text-format-overlay = { path = "../chaptera-text-format-overlay" }
chaptera-viewer-render-plan = { path = "../chaptera-viewer-render-plan", features = ["projected-scene-instances"] }
pub-editor = { path = "../../vendor/producer-a/crates/pub-editor" }
pub-layout = { path = "../../vendor/producer-a/crates/pub-layout" }
pub-line-placement = { path = "../pub-line-placement" }
pub-model = { path = "../../vendor/producer-a/crates/pub-model" }
pub-viewer = { path = "../../vendor/producer-a/crates/pub-viewer", features = ["cmo-slot-compose"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
font-test-data = "=0.8.0"

[workspace]
resolver = "2"

[target.'cfg(target_os = "windows")'.dependencies]
fontdb = "=0.24.0"
