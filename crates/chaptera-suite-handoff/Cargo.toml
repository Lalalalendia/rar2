[package]
name = "chaptera-suite-handoff"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
license = "MIT OR Apache-2.0"

[dependencies]
chaptera-untrusted-pub-scan = { path = "../chaptera-untrusted-pub-scan" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_System_Com", "Win32_UI_Shell"] }

[workspace]
resolver = "2"
