name: PUB native SYID header counter discriminator

on:
  pull_request:
    paths:
      - ".github/workflows/pub-native-syid-header-control.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pub-native-syid-header-control.yml"

permissions:
  contents: read

concurrency:
  group: pub-native-syid-header-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  prepare-syid:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Generate baseline length-changing writer candidate
        run: |
          set -euo pipefail
          cargo run --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-writer --bin pub_story_native_handoff -- generate \
            --output-dir out/native-syid-header
      - name: Restore only pinned physical Quill SYID header counter
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import struct

          root = Path("out/native-syid-header")
          original = (root / "source.pub").read_bytes()
          candidate = (root / "candidate.pub").read_bytes()
          manifest_path = root / "handoff.json"
          manifest = json.loads(manifest_path.read_text())
          sha = lambda b: hashlib.sha256(b).hexdigest()
          original_hash = "424c69173ff08948c2529c8084b4ac2403f1ff1057146f4edd02fc29b44481fc"
          writer_hash = "a92543b6f2b6ac3a8ae2481e15a2188a338ddc2a92832580f8987079fa4f70f8"
          restored_hash = "1b325681b3506b96cefc0904312b248c905bc6dd5a793eea48b03f9dc5551fe0"
          if manifest.get("schema") != "chaptera.pub-native-story-handoff.v1":
              raise SystemExit("handoff schema mismatch")
          if len(original) != 72192 or len(candidate) != 72192:
              raise SystemExit("unexpected Sample3 fixture length")
          if sha(original) != original_hash or sha(candidate) != writer_hash:
              raise SystemExit("unexpected pinned original or baseline writer bytes")
          if manifest.get("source_sha256") != original_hash:
              raise SystemExit("original manifest/source SHA mismatch")
          if manifest.get("candidate_sha256") != writer_hash:
              raise SystemExit("writer manifest/candidate SHA mismatch")
          # This absolute byte offset belongs to Quill/QuillSub/CONTENTS
          # logical offset 3584 in THIS exact pinned Sample3 CFB only.
          offset = 68096
          if struct.unpack_from("<I", original, offset)[0] != 9:
              raise SystemExit("original Quill SYID.header is no longer 9")
          if struct.unpack_from("<I", candidate, offset)[0] != 10:
              raise SystemExit("writer Quill SYID.header is no longer 10")
          mutated = bytearray(candidate)
          struct.pack_into("<I", mutated, offset, 9)
          variant = bytes(mutated)
          diff = [i for i, (a, b) in enumerate(zip(candidate, variant)) if a != b]
          if diff != [offset] or sha(variant) != restored_hash:
              raise SystemExit("variant differs outside exact one-byte SYID header revert")
          (root / "candidate.pub").write_bytes(variant)
          manifest["candidate_sha256"] = restored_hash
          manifest["research_variant"] = "syid_header_only_revert_10_to_9"
          manifest_path.write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          print("PASS exact Quill SYID header-only reversion; all other writer changes retained")
          PY
      - name: Prove altered header still preserves target Story under current Reader
        run: |
          set -euo pipefail
          cargo run --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-writer --bin pub_story_native_handoff -- verify \
            --pub out/native-syid-header/candidate.pub \
            --manifest out/native-syid-header/handoff.json
      - uses: actions/upload-artifact@v4
        with:
          name: pub-native-syid-header-input-${{ github.run_id }}
          path: |
            out/native-syid-header/source.pub
            out/native-syid-header/candidate.pub
            out/native-syid-header/handoff.json
          if-no-files-found: error
          retention-days: 14

  native-syid:
    needs: prepare-syid
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Lalalalendia/rar2' }}
    runs-on: [self-hosted, Windows, X64, chaptera-publisher-oracle]
    concurrency:
      group: pub-re-native-publisher-oracle
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Supply Git Bash for pinned Rust verifier
        shell: powershell
        run: |
          $gitBashDir = 'C:\Program Files\Git\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $gitBashDir 'bash.exe') -PathType Leaf)) {
            throw 'git_bash_unavailable'
          }
          $gitBashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Download verified original and SYID-restore candidate from this run
        uses: actions/download-artifact@v4
        with:
          name: pub-native-syid-header-input-${{ github.run_id }}
          path: ${{ runner.temp }}/chaptera-native-syid/input
      - name: Build current source-safe Reader verifier
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-writer --bin pub_story_native_handoff
          if ($LASTEXITCODE -ne 0) { throw 'syid_reader_verifier_build_failed' }
      - name: Matched unmodified Sample3 Publisher Open SaveAs Reopen control
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & tools/windows/pub-runtime/Invoke-StoryNativeSourceControl.ps1 `
            -BundleDir (Join-Path $env:RUNNER_TEMP 'chaptera-native-syid/input') `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'chaptera-native-syid/private-original')
          if (-not $?) { throw 'original_source_control_failed' }
      - name: Guarded native SaveAs of SYID-restore writer candidate
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & tools/windows/pub-runtime/Invoke-StoryNativeRoundtripGuarded.ps1 `
            -BundleDir (Join-Path $env:RUNNER_TEMP 'chaptera-native-syid/input') `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'chaptera-native-syid/private-candidate')
          if (-not $?) { throw 'syid_revert_native_saveas_failed' }
      - name: Upload original source-safe status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-native-syid-original-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/chaptera-native-syid/private-original/source-control-status.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload candidate source-safe status and native receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-native-syid-candidate-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/chaptera-native-syid/private-candidate/native-roundtrip-status.json
            ${{ runner.temp }}/chaptera-native-syid/private-candidate/native-roundtrip-stage.json
            ${{ runner.temp }}/chaptera-native-syid/private-candidate/native-roundtrip-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: Clear all private original/candidate native files and logs
        if: always()
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'chaptera-native-syid'
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop
          }
