name: PUB PDF CLI Viewer text witness 027

on:
  pull_request:
    paths:
      - ".github/workflows/pub-pdf-cli-viewer-text-witness-027.yml"
      - "vendor/producer-a/crates/pub-cli/Cargo.toml"
      - "vendor/producer-a/crates/pub-cli/src/fixed_pdf.rs"
      - "crates/chaptera-viewer-render-plan/**"

permissions:
  contents: read

concurrency:
  group: pub-pdf-cli-viewer-text-027-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  witness-027:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Install pinned visual comparator
        run: python -m pip install --disable-pip-version-check --no-cache-dir "PyMuPDF==1.26.7" "Pillow==12.3.0"

      - name: Acquire exact natural-corpus witness 027
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/027.pub"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/Lalalalendia/lalamu/f78cc6f455f4dc222868f9cc035511a6ca7a91ea/pub-corpus/corpus/native/unclassified/ffa9e40e03bb37df27fae0e1766b95db36f64fc8bda84758ad6cc6147e269bb0.pub" \
            --output "$fixture"
          test "$(sha256sum "$fixture" | awk '{print $1}')" = "ffa9e40e03bb37df27fae0e1766b95db36f64fc8bda84758ad6cc6147e269bb0"
          test "$(wc -c < "$fixture" | tr -d ' ')" = "3851264"
          echo "CHAPTERA_WITNESS_027=$fixture" >> "$GITHUB_ENV"

      - name: Build public PDF CLI
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-cli --bin pub

      - name: Materialize exact fallback resource
        shell: bash
        run: |
          set -euo pipefail
          font="$RUNNER_TEMP/chaptera-fallback.ttf"
          cargo run -q -p chaptera-desktop-fallback-font-resource --bin materialize-fallback-font -- "$font"
          test -s "$font"
          echo "CHAPTERA_FIXED_OUTPUT_FONT=$font" >> "$GITHUB_ENV"

      - name: Convert witness through current public CLI
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/witness-027"
          mkdir -p "$out"
          vendor/producer-a/target/debug/pub convert "$CHAPTERA_WITNESS_027" \
            --to pdf \
            --output "$out/candidate.pdf" \
            --fallback-font "$CHAPTERA_FIXED_OUTPUT_FONT"
          test -s "$out/candidate.pdf"
          echo "CHAPTERA_WITNESS_OUT=$out" >> "$GITHUB_ENV"

      - name: Compare exact pages to registered Publisher fingerprint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/pub-pdf-cli-viewer-text-027
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          import fitz
          from PIL import Image

          sys.path.insert(0, "tools")
          from cloud_reader_visual_fingerprint_v1 import GRID_H, GRID_W, compare_grid, reference_grid

          reference = json.loads(
              Path("tools/corpus/receipts/publisher-visual-golden-batch-01-fingerprint-v1.json").read_text()
          )
          pair = next(row for row in reference["pairs"] if row["basename"] == "027_ffa9e40e03bb37df")
          assert pair["pub_sha256"] == "ffa9e40e03bb37df27fae0e1766b95db36f64fc8bda84758ad6cc6147e269bb0"
          assert pair["reference_pages"] == 10

          candidate_path = Path(os.environ["CHAPTERA_WITNESS_OUT"]) / "candidate.pdf"
          document = fitz.open(candidate_path)
          assert document.page_count == pair["reference_pages"], (document.page_count, pair["reference_pages"])

          pages = []
          for index, reference_page in enumerate(pair["pages"]):
              pix = document[index].get_pixmap(dpi=144, colorspace=fitz.csRGB, alpha=False)
              image = Image.frombytes("RGB", (pix.width, pix.height), pix.samples)
              candidate_grid = image.resize((GRID_W, GRID_H), Image.Resampling.BOX).tobytes()
              metrics = compare_grid(candidate_grid, reference_grid(reference_page))
              pages.append({"page": index + 1, **metrics})

          mean = sum(page["changed_cell_fraction"] for page in pages) / len(pages)
          baseline = 0.307958984375
          receipt = {
              "schema": "chaptera.pub-pdf-cli-viewer-text-witness-027.v1",
              "source_sha256": pair["pub_sha256"],
              "publisher_pdf_sha256": pair["pdf_sha256"],
              "reference_pages": pair["reference_pages"],
              "old_cli_mean_changed_cell_fraction": baseline,
              "current_mean_changed_cell_fraction": mean,
              "delta_from_old_cli": mean - baseline,
              "pages": pages,
              "claims": {
                  "same_registered_publisher_reference": True,
                  "raw_pub_pdf_or_text_emitted": False,
                  "screening_grid_not_full_pixel_parity": True,
              },
          }
          out = Path("target/pub-pdf-cli-viewer-text-027/receipt.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          assert mean < baseline, (mean, baseline)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pub-pdf-cli-viewer-text-witness-027
          path: target/pub-pdf-cli-viewer-text-027/receipt.json
          if-no-files-found: warn
          retention-days: 30
