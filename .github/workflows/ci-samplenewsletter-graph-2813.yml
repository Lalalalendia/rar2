name: CI SampleNewsletter resolved-graph semantic proof 2813

on:
  pull_request:
    paths:
      - ".github/workflows/ci-samplenewsletter-graph-2813.yml"
      - "tools/ci/compare_resolved_graph_2813.py"
      - "tools/ci/test_compare_resolved_graph_2813.py"

permissions:
  contents: read

concurrency:
  group: graph-2813-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

jobs:
  exact-pinned-graph-delta:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Checkout candidate exactly
        uses: actions/checkout@v4
        with:
          path: candidate
          persist-credentials: false

      - name: Checkout last accepted graph producer exactly
        uses: actions/checkout@v4
        with:
          ref: f11cb71c7e53774946fab211a0bb7d59c1179eb7
          path: baseline
          persist-credentials: false

      - name: Check source-free comparison unit tests
        run: python -m unittest discover -s candidate/tools/ci -p 'test_compare_resolved_graph_2813.py'

      - name: Materialize exact pinned public fixture
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --retry-delay 2 \
            "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" \
            --output "$RUNNER_TEMP/sample-newsletter.pub"
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          p = Path(os.environ["RUNNER_TEMP"]) / "sample-newsletter.pub"
          assert p.stat().st_size == 291840
          assert hashlib.sha256(p.read_bytes()).hexdigest() == (
              "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          )
          print("source public SHA-256 and byte size verified")
          PY

      - name: Build accepted old canonical graph generator
        run: cargo build --manifest-path baseline/vendor/producer-a/Cargo.toml -p chaptera-producer-a

      - name: Build current candidate canonical graph generator
        run: cargo build --manifest-path candidate/vendor/producer-a/Cargo.toml -p chaptera-producer-a

      - name: Reproduce both exact CDM graphs without uploading contents
        shell: bash
        run: |
          set -euo pipefail
          baseline/vendor/producer-a/target/debug/chaptera-producer-a \
            resolved-graph "$RUNNER_TEMP/sample-newsletter.pub" \
            > "$RUNNER_TEMP/baseline-graph.json"
          candidate/vendor/producer-a/target/debug/chaptera-producer-a \
            resolved-graph "$RUNNER_TEMP/sample-newsletter.pub" \
            > "$RUNNER_TEMP/candidate-graph.json"
          python candidate/tools/ci/compare_resolved_graph_2813.py \
            --baseline "$RUNNER_TEMP/baseline-graph.json" \
            --candidate "$RUNNER_TEMP/candidate-graph.json" \
            --expected-baseline f85927cde6e2569b9ea7a6a5f634e303d83b1956e0e498d6211cf44cd669ab07 \
            --expected-candidate 12c594f1be824c0272cf28ebbc03f949a437a4d49db1b508fe2d73f66ff1c12f \
            --report "$RUNNER_TEMP/source-neutral-graph-2813.json"

      - name: Publish only the source-neutral count/proof receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: graph-2813-source-neutral-proof
          path: ${{ runner.temp }}/source-neutral-graph-2813.json
          if-no-files-found: warn
          retention-days: 14
