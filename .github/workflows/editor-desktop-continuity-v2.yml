name: Editor Desktop Continuity V2 Contract

on:
  pull_request:
    paths:
      - ".github/workflows/editor-desktop-continuity-v2.yml"
      - "packages/product/editor-desktop-continuity/v2/**"
      - "tools/validate_editor_desktop_continuity_v2_receipt.py"
      - "tools/run_editor_desktop_continuity_v2.py"
      - "apps/chaptera-desktop/src/acceptance.rs"
      - "apps/chaptera-desktop/src/acceptance_v2.rs"
      - "apps/chaptera-desktop/src/main.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned schema validator
        run: python -m pip install --disable-pip-version-check --no-cache-dir jsonschema==4.23.0
      - name: Compile and self-test V2 receipt validator
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/validate_editor_desktop_continuity_v2_receipt.py \
            tools/run_editor_desktop_continuity_v2.py
          python tools/validate_editor_desktop_continuity_v2_receipt.py --self-test

      - name: Check current desktop V2 producer
        run: |
          set -euo pipefail
          cargo check --locked -p chaptera-desktop
