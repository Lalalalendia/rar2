name: Workflow YAML syntax guard

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "tools/ci/check_workflow_yaml_syntax.rb"
      - "tools/ci/test_reader_residual_fanout.py"
      - "tools/ci/validate_reader_binary_artifact.py"
      - "tools/ci/test_validate_reader_binary_artifact.py"
      - "tools/ci/test_reader_build_once_wiring.py"
      - "tools/ci/validate_editor_binary_artifact.py"
      - "tools/ci/test_validate_editor_binary_artifact.py"
      - "tools/ci/test_editor_build_once_wiring.py"
      - "tools/ci/migration-consumer-runtime.Dockerfile"
      - "tools/ci/test_migration_consumer_runtime_wiring.py"
      - "tools/ci/test_shaped_flow_runtime_routing.py"
      - "tools/ci/test_pub_viewer_authoring_projection_routing.py"
      - "tools/ci/test_pub_viewer_images_routing.py"
      - "tools/ci/test_pub_quill_text_color_routing.py"
      - "tools/ci/test_pub_quill_font_catalog_routing.py"
      - "tools/ci/test_pub_reader_paint_projection_routing.py"
      - "tools/ci/test_pub_reader_page_projection_routing.py"
      - "tools/ci/test_pub_reader_source_paint_order_routing.py"
      - "tools/ci/test_pub_editor_session_table_routing.py"
      - "tools/ci/test_pub_editor_session_image_routing.py"
      - "tools/ci/test_pub_editor_session_text_routing.py"
      - "tools/ci/test_pub_editor_session_geometry_routing.py"
      - "tools/ci/test_pub_reader_story_frame_analysis_routing.py"
      - "tools/ci/test_pub_reader_typography_projection_routing.py"
      - "tools/ci/test_pub_reader_direct_transform_routing.py"
      - "tools/ci/test_pub_reader_grouped_projection_routing.py"
      - "tools/ci/test_pub_reader_source_graph_model_routing.py"
      - "tools/ci/test_pub_reader_anchor_geometry_routing.py"
      - "tools/ci/test_pub_reader_story_materialization_routing.py"
      - "tools/ci/test_pub_reader_quill_admission_routing.py"
      - "tools/ci/test_pub_reader_publication_document_routing.py"
      - "tools/ci/test_pub_reader_contents_access_routing.py"
      - "tools/ci/test_no_publisher_selfhosted_actions.py"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: MEASURE - inventory Actions cache refs and closed PR bytes (read only)
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/action-cache-inventory.json"
          gh api -X GET "repos/$GH_REPO/actions/caches?per_page=100" > "$output"
          python - "$output" <<'PY'
          import collections
          import json
          import os
          import re
          import subprocess
          import sys

          with open(sys.argv[1], encoding="utf-8") as source:
              body = json.load(source)
          caches = body.get("actions_caches", [])
          total = body.get("total_count", -1)
          if total != len(caches):
              raise SystemExit(f"FAIL_CLOSED: incomplete cache inventory: {len(caches)}/{total}")
          seen = {}
          groups = collections.defaultdict(lambda: [0, 0])
          rows = []
          for cache in caches:
              ref = cache.get("ref", "")
              owner = "other"
              matched = re.fullmatch(r"refs/pull/([1-9][0-9]*)/merge", ref)
              if ref == "refs/heads/main":
                  owner = "main"
              elif matched:
                  number = int(matched.group(1))
                  if number not in seen:
                      request = subprocess.run(
                          ["gh", "api", "-X", "GET",
                           f"repos/{os.environ['GH_REPO']}/pulls/{number}"],
                          capture_output=True, text=True, timeout=20,
                      )
                      if request.returncode != 0:
                          seen[number] = "unknown"
                          print(f"PR_LOOKUP_FAILED pr={number} exit={request.returncode}")
                      else:
                          pr = json.loads(request.stdout)
                          seen[number] = pr.get("state", "unknown")
                  owner = f"{seen[number]}-pr"
              elif ref.startswith("refs/pull/"):
                  owner = "other-pr-ref"
              size = int(cache.get("size_in_bytes", 0))
              groups[owner][0] += 1
              groups[owner][1] += size
              rows.append((size, int(cache.get("id", 0)), owner, ref,
                           cache.get("key", ""), cache.get("version", "")))
          print(f"CACHE_COUNT={total}")
          print(f"CACHE_TOTAL_BYTES={sum(row[0] for row in rows)}")
          for owner in sorted(groups):
              count, size = groups[owner]
              print(f"CACHE_SCOPE category={owner} count={count} bytes={size}")
          for size, ident, owner, ref, key, version in sorted(rows, reverse=True):
              print(
                  f"CACHE_ENTRY id={ident} scope={owner} ref={ref} "
                  f"bytes={size} key={key} version={version}"
              )
          closed = sorted(ident for size, ident, owner, *_ in rows if owner == "closed-pr")
          print("CLOSED_PR_CACHE_IDS_DRY_RUN=" + ",".join(map(str, closed)))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              print(f"Cache inventory entries: {total}", file=summary)
              for owner in sorted(groups):
                  count, size = groups[owner]
                  print(f"Cache scope {owner}: count={count} bytes={size}", file=summary)
              print(f"Closed PR cache IDs (DRY RUN only): {closed}", file=summary)
          PY
      - name: Parse every workflow YAML
        run: ruby tools/ci/check_workflow_yaml_syntax.rb
      - name: Guard narrowed Reader workflow fanout
        run: python tools/ci/test_reader_residual_fanout.py
      - name: Test Reader binary artifact validator
        run: python tools/ci/test_validate_reader_binary_artifact.py
      - name: Guard Reader build-once wiring
        run: python tools/ci/test_reader_build_once_wiring.py
      - name: Test Editor binary artifact validator
        run: python tools/ci/test_validate_editor_binary_artifact.py
      - name: Guard Editor build-once wiring
        run: python tools/ci/test_editor_build_once_wiring.py
      - name: Guard migration consumer runtime producer
        run: python tools/ci/test_migration_consumer_runtime_wiring.py
      - name: Guard shaped-flow runtime routing
        run: python tools/ci/test_shaped_flow_runtime_routing.py
      - name: Guard pub-viewer authoring projection routing
        run: python tools/ci/test_pub_viewer_authoring_projection_routing.py
      - name: Guard pub-viewer image routing
        run: python tools/ci/test_pub_viewer_images_routing.py
      - name: Guard pub-quill text-color routing
        run: python tools/ci/test_pub_quill_text_color_routing.py
      - name: Guard pub-quill FONT catalog routing
        run: python tools/ci/test_pub_quill_font_catalog_routing.py
      - name: Guard pub-reader paint projection routing
        run: python tools/ci/test_pub_reader_paint_projection_routing.py
      - name: Guard pub-reader page projection routing
        run: python tools/ci/test_pub_reader_page_projection_routing.py
      - name: Guard pub-reader source paint order routing
        run: python tools/ci/test_pub_reader_source_paint_order_routing.py
      - name: Guard pub-editor session-table routing
        run: python tools/ci/test_pub_editor_session_table_routing.py
      - name: Guard pub-editor session-image routing
        run: python tools/ci/test_pub_editor_session_image_routing.py
      - name: Guard pub-editor session-text routing
        run: python tools/ci/test_pub_editor_session_text_routing.py
      - name: Guard pub-editor session-geometry routing
        run: python tools/ci/test_pub_editor_session_geometry_routing.py
      - name: Guard pub-reader story frame analysis routing
        run: python tools/ci/test_pub_reader_story_frame_analysis_routing.py
      - name: Guard pub-reader typography projection routing
        run: python tools/ci/test_pub_reader_typography_projection_routing.py
      - name: Guard pub-reader direct transform routing
        run: python tools/ci/test_pub_reader_direct_transform_routing.py
      - name: Guard pub-reader grouped projection routing
        run: python tools/ci/test_pub_reader_grouped_projection_routing.py
      - name: Guard pub-reader source graph model routing
        run: python tools/ci/test_pub_reader_source_graph_model_routing.py
      - name: Guard pub-reader anchor geometry routing
        run: python tools/ci/test_pub_reader_anchor_geometry_routing.py
      - name: Guard pub-reader Story materialization routing
        run: python tools/ci/test_pub_reader_story_materialization_routing.py
      - name: Guard pub-reader Quill admission routing
        run: python tools/ci/test_pub_reader_quill_admission_routing.py
      - name: Guard pub-reader publication document routing
        run: python tools/ci/test_pub_reader_publication_document_routing.py
      - name: Guard pub-reader Contents access routing
        run: python tools/ci/test_pub_reader_contents_access_routing.py
      - name: Guard Publisher native execution boundary
        run: python tools/ci/test_no_publisher_selfhosted_actions.py
