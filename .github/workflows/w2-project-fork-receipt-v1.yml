name: W2 project fork receipt V1

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-editor/**"
      - "!vendor/producer-a/crates/pub-editor/src/session_table.rs"
      - "!vendor/producer-a/crates/pub-editor/src/session_image.rs"
      - "packages/protocol/project-fork/**"
      - "tools/validate_project_fork_receipt.py"
      - ".github/workflows/w2-project-fork-receipt-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w2-project-fork-receipt-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  receipt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install receipt validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Check existing fork contract
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --test project_fork_v1
      - name: Build source-free fork receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/w2-project-fork-receipt
          cargo run --quiet --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --bin project_fork_receipt_v1             > target/w2-project-fork-receipt/receipt.json
      - name: Validate source-free fork receipt
        run: python tools/validate_project_fork_receipt.py target/w2-project-fork-receipt/receipt.json
      - name: Check pub-editor formatting
        run: cargo fmt --manifest-path vendor/producer-a/Cargo.toml -p pub-editor -- --check
      - uses: actions/upload-artifact@v4
        with:
          name: w2-project-fork-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/w2-project-fork-receipt/receipt.json
          if-no-files-found: error
