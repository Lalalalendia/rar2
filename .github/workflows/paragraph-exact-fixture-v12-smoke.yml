name: paragraph-exact-fixture-v12-smoke

on:
  push:
    branches:
      - delivery/paragraph-exact-fixture-v12-smoke
    paths:
      - delivery/paragraph-exact-fixture-v12/RUN_NATIVE.ps1
      - .github/workflows/paragraph-exact-fixture-v12-smoke.yml

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Parse exact launcher under Windows PowerShell 5.1
        shell: powershell
        run: |
          $path = Join-Path $PWD 'delivery\paragraph-exact-fixture-v12\RUN_NATIVE.ps1'
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Run launcher self-test
        shell: powershell
        run: |
          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File delivery\paragraph-exact-fixture-v12\RUN_NATIVE.ps1 -SelfTest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
