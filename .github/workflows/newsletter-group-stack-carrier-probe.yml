name: Newsletter grouped stack carrier census

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-reader/src/lib.rs"
      - ".github/workflows/newsletter-group-stack-carrier-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Acquire exact public controls
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/group-stack-fixtures" target/manual-group-stack
          python - <<'PY'
          import hashlib, os, urllib.request
          from pathlib import Path
          expected = {
              "SampleBrochure": "ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87",
              "SampleNewsletter": "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf",
          }
          base = "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher"
          root = Path(os.environ["RUNNER_TEMP"]) / "group-stack-fixtures"
          for name, digest in expected.items():
              data = urllib.request.urlopen(f"{base}/{name}.pub", timeout=30).read()
              actual = hashlib.sha256(data).hexdigest()
              assert actual == digest
              (root / f"{name}.pub").write_bytes(data)
          PY

      - name: Build measurement test
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --lib exact_group_stack_carrier_census_is_source_safe --no-run

      - name: Measure grouped stack carriers
        shell: bash
        run: |
          set -euo pipefail
          run_probe() {
            local name="$1"
            local sha="$2"
            CHAPTERA_GROUP_STACK_FIXTURE="$RUNNER_TEMP/group-stack-fixtures/$name.pub"             CHAPTERA_GROUP_STACK_SHA256="$sha"             CHAPTERA_GROUP_STACK_OUT="target/manual-group-stack/$name.group-stack.json"               cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-reader                 exact_group_stack_carrier_census_is_source_safe -- --ignored --nocapture                 | tee "target/manual-group-stack/$name.group-stack.txt"
          }
          run_probe SampleBrochure ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87
          run_probe SampleNewsletter 6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: newsletter-group-stack-carrier-census
          path: target/manual-group-stack/
          if-no-files-found: warn
          retention-days: 3
