name: Chaptera Editor Windows exact-candidate binary
on:
  workflow_call:
    inputs:
      artifact_name:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      artifact_name:
        description: Artifact name
        required: false
        default: chaptera-editor-windows-binary-manual
        type: string
permissions:
  contents: read
jobs:
  build-editor-binary:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact candidate checkout
        shell: pwsh
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "${{ github.sha }}") { throw "candidate checkout mismatch: expected ${{ github.sha }}, got $actual" }
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Restore validated Windows Cargo dependencies
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: chaptera-windows-desktop-deps-v1
          add-job-id-key: "false"
          key: ${{ hashFiles('Cargo.toml', 'vendor/producer-a/Cargo.toml') }}
          workspaces: ". -> target"
          cache-bin: "false"
          cache-workspace-crates: "false"
          cache-on-failure: "false"
          save-if: "false"
      - name: Build Editor release binary once
        run: cargo build -p chaptera-desktop --release --bin chaptera-editor
      - name: Stage exact-candidate Editor binary and manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $built = "target/release/chaptera-editor.exe"
          if (-not (Test-Path $built)) { throw "Editor release build did not produce $built" }
          $out = Join-Path $env:RUNNER_TEMP "chaptera-editor-binary"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $exe = Join-Path $out "chaptera-editor.exe"
          Copy-Item $built $exe -Force
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $exe).Length
          $rustc = (& rustc --version).Trim()
          if (-not $rustc.StartsWith("rustc 1.94.1 ")) { throw "unexpected rustc identity: $rustc" }
          @{
            schema_version = "chaptera.editor-windows-binary.v1"
            candidate_sha = "${{ github.sha }}"
            pr_head_sha = "${{ github.event.pull_request.head.sha }}"
            target = "x86_64-pc-windows-msvc"
            toolchain = "1.94.1"
            rustc_version = $rustc
            profile = "release"
            features = @()
            binary_entry = "chaptera-editor.exe"
            binary_sha256 = $hash
            binary_byte_len = $bytes
          } | ConvertTo-Json -Depth 4 | Set-Content -Encoding utf8 (Join-Path $out "chaptera-editor-binary.json")
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Self-validate staged exact-candidate artifact
        run: python tools/ci/validate_editor_binary_artifact.py --artifact-dir "${{ runner.temp }}/chaptera-editor-binary" --expected-candidate-sha "${{ github.sha }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name || github.event.inputs.artifact_name }}
          path: |
            ${{ runner.temp }}/chaptera-editor-binary/chaptera-editor.exe
            ${{ runner.temp }}/chaptera-editor-binary/chaptera-editor-binary.json
          if-no-files-found: error
          retention-days: 1
