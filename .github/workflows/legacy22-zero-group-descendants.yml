name: Legacy22 zero-size Group descendants

on:
  pull_request:
    paths:
      - ".github/workflows/legacy22-zero-group-descendants.yml"
      - "tools/legacy22_zero_group_descendants_probe.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/zero-group-descendants

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820
      - name: Instrument disposable checkout
        run: |
          python tools/legacy22_zero_group_descendants_probe.py instrument             --source-root .             --output target/zero-group-descendants/instrumentation.json
      - name: Build instrumented Reader worker
        run: cargo build -p chaptera-server --bin chaptera --jobs 2
      - name: Observe exact control and targets
        run: |
          python tools/legacy22_zero_group_descendants_probe.py observe             --source-root .             --corpus out/pinned1050/materialized/native             --output target/zero-group-descendants/summary.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy22-zero-group-descendants
          path: target/zero-group-descendants/summary.json
          if-no-files-found: error
          retention-days: 30
