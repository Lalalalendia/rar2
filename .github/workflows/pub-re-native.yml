name: PUB RE native Publisher experiment

on:
  workflow_dispatch:
    inputs:
      manifest_name:
        description: "Manifest filename under PUB_RE_MANIFEST_ROOT on the dedicated Windows runner"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pub-re-native-publisher-oracle
  cancel-in-progress: false

jobs:
  native:
    runs-on: [self-hosted, Windows, X64, chaptera-publisher-oracle]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Resolve local manifest safely
        shell: pwsh
        env:
          PUB_RE_MANIFEST_NAME: ${{ inputs.manifest_name }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          if ([string]::IsNullOrWhiteSpace($env:PUB_RE_MANIFEST_ROOT)) {
            throw "PUB_RE_MANIFEST_ROOT is not configured on the dedicated runner"
          }
          if ($env:PUB_RE_MANIFEST_NAME -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\.json$') {
            throw "manifest_name must be a simple .json filename"
          }

          $manifest = Join-Path $env:PUB_RE_MANIFEST_ROOT $env:PUB_RE_MANIFEST_NAME
          if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
            throw "requested native experiment manifest is not present"
          }

          $output = Join-Path $env:RUNNER_TEMP ("pub-re-native-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $output | Out-Null

          "PUB_RE_NATIVE_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PUB_RE_NATIVE_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build standalone PUB RE
        shell: pwsh
        run: cargo build --release --manifest-path tools/pub-re/Cargo.toml --bin pub-re

      - name: Run bounded native Publisher transaction
        shell: pwsh
        run: |
          & tools/pub-re/windows/Invoke-PubReNativeExperiment.ps1 `
            -ManifestPath $env:PUB_RE_NATIVE_MANIFEST `
            -OutputRoot $env:PUB_RE_NATIVE_OUTPUT

      - name: Join native output to CFB and OfficeArt provenance
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $private = Join-Path $env:PUB_RE_NATIVE_OUTPUT "private"
          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          $controlPath = Join-Path $private "control.json"
          $control = Get-Content -LiteralPath $controlPath -Raw | ConvertFrom-Json

          if ([bool]$control.has_diff) {
            $diffManifest = Join-Path $private "diff-manifest.json"
            $cfbReceipt = Join-Path $evidence "cfb-receipt.json"
            & tools/pub-re/target/release/pub-re.exe analyze `
              --manifest $diffManifest `
              --output $cfbReceipt

            if (-not [string]::IsNullOrWhiteSpace([string]$control.officeart_stream)) {
              & tools/pub-re/target/release/pub-re.exe attribute-officeart `
                --manifest $diffManifest `
                --stream ([string]$control.officeart_stream) `
                --output (Join-Path $evidence "officeart-receipt.json")
            }
          }

      - name: Enforce source-safe evidence boundary
        shell: pwsh
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          $files = @(Get-ChildItem -LiteralPath $evidence -Filter *.json -File)
          if ($files.Count -lt 1) {
            throw "native experiment emitted no JSON evidence"
          }

          foreach ($file in $files) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            if ($text -match '(?i)[A-Z]:\\' -or $text -match '\\\\[^"\s]+\\') {
              throw "source-safe evidence contains an absolute filesystem path"
            }
            if ($text -match '(?i)"raw_document_bytes_emitted"\s*:\s*true') {
              throw "source-safe evidence claims raw document bytes were emitted"
            }
            if ($text -match '(?i)"raw_stream_bytes_emitted"\s*:\s*true') {
              throw "source-safe evidence claims raw stream bytes were emitted"
            }
            [void](Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json)
          }

      - name: Upload source-safe receipts only
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-evidence
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\evidence\*.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove private native inputs and outputs
        if: always()
        shell: pwsh
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PUB_RE_NATIVE_OUTPUT) -and (Test-Path -LiteralPath $env:PUB_RE_NATIVE_OUTPUT)) {
            Remove-Item -LiteralPath $env:PUB_RE_NATIVE_OUTPUT -Recurse -Force
          }
