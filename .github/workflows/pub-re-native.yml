name: PUB RE native Publisher experiment

on:
  workflow_dispatch:
    inputs:
      manifest_name:
        description: "Manifest filename under PUB_RE_MANIFEST_ROOT on the dedicated Windows runner"
        required: true
        type: string
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  gate:
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          github.event.issue.number == 2193 &&
          github.actor == 'Lalalalendia' &&
          github.event.comment.user.login == 'Lalalalendia' &&
          github.event.comment.author_association == 'OWNER'
        )
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      command_mode: ${{ steps.command.outputs.command_mode }}
      manifest_name: ${{ steps.command.outputs.manifest_name }}
      fixture_alias: ${{ steps.command.outputs.fixture_alias }}
      page_id: ${{ steps.command.outputs.page_id }}
      shape_id: ${{ steps.command.outputs.shape_id }}
      delta_degrees: ${{ steps.command.outputs.delta_degrees }}
      research_id: ${{ steps.command.outputs.research_id }}
      target_run_id: ${{ steps.command.outputs.target_run_id }}
      native_timeout_minutes: ${{ steps.command.outputs.native_timeout_minutes }}
    steps:
      - name: Resolve trusted native command
        id: command
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MANIFEST_NAME: ${{ inputs.manifest_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python3 - <<'PY'
          import os
          import re

          manifest_re = re.compile(r"[A-Za-z0-9][A-Za-z0-9._-]{0,127}\.json")
          alias_re = re.compile(r"[a-z0-9][a-z0-9._-]{0,63}")
          event_name = os.environ["EVENT_NAME"]
          command_mode = ""
          manifest_name = ""
          fixture_alias = ""
          page_id = ""
          shape_id = ""
          delta_degrees = ""
          research_id = ""
          target_run_id = ""

          if event_name == "workflow_dispatch":
              manifest_name = os.environ.get("INPUT_MANIFEST_NAME", "")
              if manifest_re.fullmatch(manifest_name) is None:
                  raise SystemExit("manifest_name must be a simple .json filename")
              command_mode = "manifest"
          else:
              body = os.environ.get("COMMENT_BODY", "")
              manifest_match = re.fullmatch(
                  r"/pub-re-native ([A-Za-z0-9][A-Za-z0-9._-]{0,127}\.json)",
                  body,
              )
              snapshot_match = re.fullmatch(
                  r"/pub-re-native snapshot ([a-z0-9][a-z0-9._-]{0,63})",
                  body,
              )
              rotation_match = re.fullmatch(
                  r"/pub-re-native rotate ([a-z0-9][a-z0-9._-]{0,63}) ([1-9][0-9]{0,9}) ([1-9][0-9]{0,9}) (-?[0-9]+(?:[.][0-9]{1,6})?)",
                  body,
              )
              research_match = re.fullmatch(
                  r"/pub-re-native research (paragraph-line-spacing-0p75(?:-mixed)?)",
                  body,
              )
              cancel_match = re.fullmatch(
                  r"/pub-re-native cancel ([1-9][0-9]{0,18})",
                  body,
              )
              if manifest_match is not None:
                  command_mode = "manifest"
                  manifest_name = manifest_match.group(1)
              elif snapshot_match is not None:
                  command_mode = "snapshot_alias"
                  fixture_alias = snapshot_match.group(1)
              elif rotation_match is not None:
                  command_mode = "rotation_alias"
                  fixture_alias = rotation_match.group(1)
                  page_id = rotation_match.group(2)
                  shape_id = rotation_match.group(3)
                  delta_degrees = rotation_match.group(4)

                  page_value = int(page_id)
                  shape_value = int(shape_id)
                  delta_value = float(delta_degrees)
                  if page_value > 2147483647 or shape_value > 2147483647:
                      raise SystemExit("Publisher selector is outside signed 32-bit bounds")
                  if not 0.000001 <= abs(delta_value) <= 45.0:
                      raise SystemExit("rotation delta must be nonzero and within 45 degrees")
              elif research_match is not None:
                  command_mode = "research_0p75"
                  research_id = research_match.group(1)
              elif cancel_match is not None:
                  command_mode = "cancel_run"
                  target_run_id = cancel_match.group(1)
                  if int(target_run_id) > 9223372036854775807:
                      raise SystemExit("target run id is outside signed 64-bit bounds")
              else:
                  raise SystemExit("invalid PUB RE native control command")

          if command_mode in {"snapshot_alias", "rotation_alias"} and alias_re.fullmatch(fixture_alias) is None:
              raise SystemExit("fixture alias is invalid")

          native_timeout_minutes = "30" if command_mode == "research_0p75" else "5"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"command_mode={command_mode}\n")
              output.write(f"manifest_name={manifest_name}\n")
              output.write(f"fixture_alias={fixture_alias}\n")
              output.write(f"page_id={page_id}\n")
              output.write(f"shape_id={shape_id}\n")
              output.write(f"delta_degrees={delta_degrees}\n")
              output.write(f"research_id={research_id}\n")
              output.write(f"target_run_id={target_run_id}\n")
              output.write(f"native_timeout_minutes={native_timeout_minutes}\n")
          PY

  cancel:
    needs: gate
    if: ${{ needs.gate.result == 'success' && needs.gate.outputs.command_mode == 'cancel_run' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    steps:
      - name: Cancel trusted native workflow run
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TARGET_RUN_ID: ${{ needs.gate.outputs.target_run_id }}
          CURRENT_RUN_ID: ${{ github.run_id }}
          GITHUB_REPOSITORY_NAME: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          target = int(os.environ["TARGET_RUN_ID"])
          current = int(os.environ["CURRENT_RUN_ID"])
          repository = os.environ["GITHUB_REPOSITORY_NAME"]
          token = os.environ["GITHUB_TOKEN"]

          if target == current:
              raise SystemExit("refusing to cancel the control run itself")

          base = f"https://api.github.com/repos/{repository}/actions/runs/{target}"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "chaptera-pub-re-control",
          }

          with urllib.request.urlopen(urllib.request.Request(base, headers=headers)) as response:
              payload = json.load(response)

          if payload.get("path") != ".github/workflows/pub-re-native.yml":
              raise SystemExit("target run is not PUB RE native workflow")
          if payload.get("name") != "PUB RE native Publisher experiment":
              raise SystemExit("target run name does not match PUB RE native workflow")

          status = payload.get("status")
          if status == "completed":
              print(f"PUB_RE_CANCEL target={target} already_terminal conclusion={payload.get('conclusion')}")
              raise SystemExit(0)
          if status not in {"queued", "in_progress"}:
              raise SystemExit(f"target run has non-cancellable status: {status}")

          request = urllib.request.Request(
              base + "/cancel",
              data=b"",
              headers=headers,
              method="POST",
          )
          try:
              with urllib.request.urlopen(request) as response:
                  if response.status != 202:
                      raise SystemExit(f"unexpected cancel status: {response.status}")
          except urllib.error.HTTPError as error:
              raise SystemExit(f"cancel request failed: HTTP {error.code}") from error

          print(f"PUB_RE_CANCEL target={target} accepted")
          PY

  native:
    needs: gate
    if: ${{ needs.gate.result == 'success' && needs.gate.outputs.command_mode != 'cancel_run' }}
    runs-on: [self-hosted, Windows, X64, chaptera-publisher-oracle]
    timeout-minutes: ${{ fromJSON(needs.gate.outputs.native_timeout_minutes) }}
    concurrency:
      group: pub-re-native-publisher-oracle
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - name: Prefer Git Bash on the interactive Windows runner
        shell: powershell
        run: |
          $gitBashDir = "C:\Program Files\Git\bin"
          $gitBash = Join-Path $gitBashDir "bash.exe"
          if (-not (Test-Path -LiteralPath $gitBash -PathType Leaf)) {
            throw "Git Bash is required at $gitBash"
          }
          $gitBashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Resolve native input safely
        shell: powershell
        env:
          PUB_RE_COMMAND_MODE: ${{ needs.gate.outputs.command_mode }}
          PUB_RE_MANIFEST_NAME: ${{ needs.gate.outputs.manifest_name }}
          PUB_RE_FIXTURE_ALIAS: ${{ needs.gate.outputs.fixture_alias }}
          PUB_RE_PAGE_ID: ${{ needs.gate.outputs.page_id }}
          PUB_RE_SHAPE_ID: ${{ needs.gate.outputs.shape_id }}
          PUB_RE_DELTA_DEGREES: ${{ needs.gate.outputs.delta_degrees }}
          PUB_RE_RESEARCH_ID: ${{ needs.gate.outputs.research_id }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $output = Join-Path $env:RUNNER_TEMP ("pub-re-native-{0}-{1}" -f $env:GITHUB_RUN_ID, $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $output | Out-Null
          "PUB_RE_NATIVE_OUTPUT=$output" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          if ($env:PUB_RE_COMMAND_MODE -eq "research_0p75") {
            if ($env:PUB_RE_RESEARCH_ID -notin @("paragraph-line-spacing-0p75", "paragraph-line-spacing-0p75-mixed")) {
              throw "unsupported bounded research id"
            }
            $researchOutput = Join-Path $output "research-output"
            $researchZip = Join-Path $output "private-return.zip"
            "PUB_RE_RESEARCH_OUTPUT=$researchOutput" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "PUB_RE_RESEARCH_RETURN_ZIP=$researchZip" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }
          elseif ($env:PUB_RE_COMMAND_MODE -eq "manifest") {
            if ([string]::IsNullOrWhiteSpace($env:PUB_RE_MANIFEST_ROOT)) {
              throw "PUB_RE_MANIFEST_ROOT is not configured on the dedicated runner"
            }
            if ($env:PUB_RE_MANIFEST_NAME -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,127}\.json$') {
              throw "manifest_name must be a simple .json filename"
            }

            $manifest = Join-Path $env:PUB_RE_MANIFEST_ROOT $env:PUB_RE_MANIFEST_NAME
            if (-not (Test-Path -LiteralPath $manifest -PathType Leaf)) {
              throw "requested native experiment manifest is not present"
            }
          }
          elseif ($env:PUB_RE_COMMAND_MODE -eq "snapshot_alias" -or $env:PUB_RE_COMMAND_MODE -eq "rotation_alias") {
            if ($env:PUB_RE_FIXTURE_ALIAS -notmatch '^[a-z0-9][a-z0-9._-]{0,63}$') {
              throw "fixture alias is invalid"
            }

            $registryPath = Join-Path $env:GITHUB_WORKSPACE "tools\pub-re\native-fixtures.json"
            $registry = Get-Content -LiteralPath $registryPath -Raw | ConvertFrom-Json
            if ([string]$registry.schema -ne "chaptera.pub-re-native-fixture-registry.v1") {
              throw "native fixture registry schema is unsupported"
            }

            $matches = @($registry.fixtures | Where-Object { [string]$_.alias -eq $env:PUB_RE_FIXTURE_ALIAS })
            if ($matches.Count -ne 1) {
              throw "native fixture alias must resolve exactly once"
            }

            $entry = $matches[0]
            $expectedSha = ([string]$entry.expected_sha256).ToLowerInvariant()
            if ($expectedSha -notmatch '^[0-9a-f]{64}$') {
              throw "native fixture registry SHA-256 is invalid"
            }
            $expectedByteLen = [int64]$entry.expected_byte_len
            if ($expectedByteLen -lt 1 -or $expectedByteLen -gt 67108864) {
              throw "native fixture registry byte length is outside the bounded policy"
            }

            $uri = [Uri]([string]$entry.download_url)
            if ($uri.Scheme -ne "https" -or $uri.Host -ne "raw.githubusercontent.com") {
              throw "native fixture download URL is outside the public allowlist"
            }

            $download = Join-Path $output "source.pub"
            Invoke-WebRequest -Uri $uri.AbsoluteUri -OutFile $download -UseBasicParsing

            $item = Get-Item -LiteralPath $download
            $actualSha = (Get-FileHash -LiteralPath $download -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualSha -ne $expectedSha -or [int64]$item.Length -ne $expectedByteLen) {
              throw "downloaded native fixture does not match the pinned registry entry"
            }

            if ($env:PUB_RE_COMMAND_MODE -eq "snapshot_alias") {
              $experimentPrefix = "snapshot"
              $operation = [ordered]@{
                kind = "snapshot_only"
              }
            }
            else {
              if ($env:PUB_RE_PAGE_ID -notmatch '^[1-9][0-9]{0,9}$' -or
                  $env:PUB_RE_SHAPE_ID -notmatch '^[1-9][0-9]{0,9}$' -or
                  $env:PUB_RE_DELTA_DEGREES -notmatch '^-?[0-9]+([.][0-9]{1,6})?$') {
                throw "rotation selector or delta is invalid"
              }

              $pageId64 = [int64]$env:PUB_RE_PAGE_ID
              $shapeId64 = [int64]$env:PUB_RE_SHAPE_ID
              $delta = [double]::Parse(
                $env:PUB_RE_DELTA_DEGREES,
                [System.Globalization.CultureInfo]::InvariantCulture
              )
              if ($pageId64 -gt [int]::MaxValue -or $shapeId64 -gt [int]::MaxValue) {
                throw "Publisher selector is outside signed 32-bit bounds"
              }
              if ([math]::Abs($delta) -lt 0.000001 -or [math]::Abs($delta) -gt 45.0) {
                throw "rotation delta must be nonzero and within 45 degrees"
              }

              $experimentPrefix = "rotate"
              $operation = [ordered]@{
                kind = "shape_rotation_delta"
                selector = [ordered]@{
                  page_id = [int]$pageId64
                  shape_id = [int]$shapeId64
                }
                delta_degrees = $delta
              }
            }

            $generated = [ordered]@{
              schema = "chaptera.pub-re-native-experiment.v1"
              experiment_id = ("{0}-{1}-{2}" -f $experimentPrefix, $env:PUB_RE_FIXTURE_ALIAS, $env:GITHUB_RUN_ID)
              source = [ordered]@{
                path = $download
                expected_sha256 = $expectedSha
              }
              operation = $operation
              policy = [ordered]@{
                writer = "current"
                visible = $false
                process_exit_grace_seconds = 60
              }
            }

            $manifest = Join-Path $output "generated-manifest.json"
            $generated | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $manifest -Encoding utf8
          }
          else {
            throw "unsupported PUB RE native command mode"
          }

          if ($env:PUB_RE_COMMAND_MODE -ne "research_0p75") {
            "PUB_RE_NATIVE_MANIFEST=$manifest" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Build standalone PUB RE
        if: ${{ needs.gate.outputs.command_mode != 'research_0p75' }}
        shell: powershell
        run: cargo build --release --manifest-path tools/pub-re/Cargo.toml --bin pub-re

      - name: Run bounded native Publisher transaction
        if: ${{ needs.gate.outputs.command_mode != 'research_0p75' }}
        shell: powershell
        run: |
          & tools/pub-re/windows/Invoke-PubReNativeExperiment.ps1 `
            -ManifestPath $env:PUB_RE_NATIVE_MANIFEST `
            -OutputRoot $env:PUB_RE_NATIVE_OUTPUT

      - name: Validate failed native stage receipt
        if: ${{ failure() && needs.gate.outputs.command_mode != 'research_0p75' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $stage = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence\native-stage-receipt.json"
          if (-not (Test-Path -LiteralPath $stage -PathType Leaf)) {
            Write-Host "No native stage receipt was produced before failure."
            exit 0
          }

          $text = Get-Content -LiteralPath $stage -Raw
          if ($text -match '(?i)[A-Z]:\\' -or $text -match '\\\\[^"\s]+\\') {
            throw "native stage receipt contains an absolute filesystem path"
          }

          $receipt = $text | ConvertFrom-Json
          if ([string]$receipt.schema -ne "chaptera.pub-re-native-stage.v1") {
            throw "unexpected native stage receipt schema"
          }
          if ([string]::IsNullOrWhiteSpace([string]$receipt.experiment_id)) {
            throw "native stage receipt is missing experiment_id"
          }
          if ([string]::IsNullOrWhiteSpace([string]$receipt.stage)) {
            throw "native stage receipt is missing stage"
          }

      - name: Upload failed native stage receipt
        if: ${{ failure() && needs.gate.outputs.command_mode != 'research_0p75' }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-failure-stage
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\evidence\native-stage-receipt.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Join native output to CFB and OfficeArt provenance
        if: ${{ needs.gate.outputs.command_mode != 'research_0p75' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $private = Join-Path $env:PUB_RE_NATIVE_OUTPUT "private"
          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          $controlPath = Join-Path $private "control.json"
          $control = Get-Content -LiteralPath $controlPath -Raw | ConvertFrom-Json

          if ([bool]$control.has_diff) {
            $diffManifest = Join-Path $private "diff-manifest.json"
            $cfbReceipt = Join-Path $evidence "cfb-receipt.json"
            & tools/pub-re/target/release/pub-re.exe analyze `
              --manifest $diffManifest `
              --output $cfbReceipt

            if (-not [string]::IsNullOrWhiteSpace([string]$control.officeart_stream)) {
              & tools/pub-re/target/release/pub-re.exe attribute-officeart `
                --manifest $diffManifest `
                --stream ([string]$control.officeart_stream) `
                --output (Join-Path $evidence "officeart-receipt.json")
            }
          }

      - name: Enforce source-safe evidence boundary
        if: ${{ needs.gate.outputs.command_mode != 'research_0p75' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          $files = @(Get-ChildItem -LiteralPath $evidence -Filter *.json -File)
          if ($files.Count -lt 1) {
            throw "native experiment emitted no JSON evidence"
          }

          foreach ($file in $files) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            if ($text -match '(?i)[A-Z]:\\' -or $text -match '\\\\[^"\s]+\\') {
              throw "source-safe evidence contains an absolute filesystem path"
            }
            if ($text -match '(?i)"raw_document_bytes_emitted"\s*:\s*true') {
              throw "source-safe evidence claims raw document bytes were emitted"
            }
            if ($text -match '(?i)"raw_stream_bytes_emitted"\s*:\s*true') {
              throw "source-safe evidence claims raw stream bytes were emitted"
            }
            [void](Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json)
          }

      - name: Upload source-safe receipts only
        if: ${{ needs.gate.outputs.command_mode != 'research_0p75' }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-evidence
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\evidence\*.json
          if-no-files-found: error
          retention-days: 14

      - name: Run bounded 0.75 paragraph research
        if: ${{ needs.gate.outputs.command_mode == 'research_0p75' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $mixedArgs = @{}
          if ($env:PUB_RE_RESEARCH_ID -eq "paragraph-line-spacing-0p75-mixed") {
            $mixedArgs.MixedSize = $true
          }
          & tools/windows/run_paragraph_line_spacing_0p75_native_direct.ps1 `
            -OutputRoot $env:PUB_RE_RESEARCH_OUTPUT `
            -ReturnZip $env:PUB_RE_RESEARCH_RETURN_ZIP @mixedArgs
          if (-not $?) {
            throw "bounded 0.75 paragraph research failed"
          }

      - name: Stage partial source-safe 0.75 receipt after failure
        if: ${{ failure() && needs.gate.outputs.command_mode == 'research_0p75' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $analysis = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis"
          $candidates = @(
            (Join-Path $analysis "paragraph-line-spacing-0p75-native-01.json"),
            (Join-Path $analysis "paragraph-line-spacing-0p75-structural.json")
          )

          $copied = 0
          foreach ($path in $candidates) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              continue
            }

            $text = Get-Content -LiteralPath $path -Raw
            if ($text -match '(?i)[A-Z]:\\' -or $text -match '\\\\[^"\s]+\\') {
              throw "partial 0.75 receipt contains an absolute filesystem path"
            }
            [void]($text | ConvertFrom-Json)
            Copy-Item -LiteralPath $path -Destination $evidence -Force
            $copied += 1
          }

          Write-Host ("PUB_RE_0P75_PARTIAL_EVIDENCE copied={0}" -f $copied)

      - name: Upload partial source-safe 0.75 receipt after failure
        if: ${{ failure() && needs.gate.outputs.command_mode == 'research_0p75' }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-paragraph-line-spacing-0p75-partial-evidence
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\evidence\*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage source-safe 0.75 research receipts
        if: ${{ needs.gate.outputs.command_mode == 'research_0p75' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $native = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\paragraph-line-spacing-0p75-native-01.json"
          $structural = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\paragraph-line-spacing-0p75-structural.json"
          foreach ($path in @($native, $structural)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "required source-safe 0.75 receipt missing"
            }
            $text = Get-Content -LiteralPath $path -Raw
            if ($text -match '(?i)[A-Z]:\\' -or $text -match '\\\\[^"\s]+\\') {
              throw "source-safe 0.75 receipt contains an absolute filesystem path"
            }
            [void]($text | ConvertFrom-Json)
            Copy-Item -LiteralPath $path -Destination $evidence -Force
          }

          $receipt = Get-Content -LiteralPath $structural -Raw | ConvertFrom-Json
          if ($receipt.schema -ne "chaptera.paragraph-line-spacing-0p75-structural.v1") {
            throw "unexpected 0.75 structural receipt schema"
          }
          if ($receipt.experiment_id -ne "PARAGRAPH-LINE-SPACING-0P75-NATIVE-01") {
            throw "unexpected 0.75 structural experiment id"
          }
          if ($receipt.native_114300_authority_candidate -isnot [bool]) {
            throw "0.75 structural receipt must carry a boolean authority candidate"
          }

      - name: Upload source-safe 0.75 research receipts only
        if: ${{ needs.gate.outputs.command_mode == 'research_0p75' }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-paragraph-line-spacing-0p75-evidence
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\evidence\*.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove private native inputs and outputs
        if: always()
        shell: powershell
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PUB_RE_NATIVE_OUTPUT) -and (Test-Path -LiteralPath $env:PUB_RE_NATIVE_OUTPUT)) {
