      - name: Build matched rotation pair attribution
        if: ${{ needs.gate.outputs.command_mode == 'rotation_pair' }}
        shell: powershell
        env:
          PUB_RE_PAIR_PAGE_ID: ${{ needs.gate.outputs.page_id }}
          PUB_RE_PAIR_SHAPE_ID: ${{ needs.gate.outputs.shape_id }}
          PUB_RE_PAIR_DELTA: ${{ needs.gate.outputs.delta_degrees }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $private = Join-Path $env:PUB_RE_NATIVE_OUTPUT "pair-private"
          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          $pathsPath = Join-Path $private "pair-paths.json"
          if (-not (Test-Path -LiteralPath $pathsPath -PathType Leaf)) {
            throw "rotation_pair_private_paths_missing"
          }
          $paths = Get-Content -LiteralPath $pathsPath -Raw | ConvertFrom-Json

          $mutationReceiptPath = Join-Path $evidence "mutation-native-receipt.json"
          if (-not (Test-Path -LiteralPath $mutationReceiptPath -PathType Leaf)) {
            throw "rotation_pair_mutation_receipt_missing"
          }
          $mutationReceipt = Get-Content -LiteralPath $mutationReceiptPath -Raw | ConvertFrom-Json
          $producer = [ordered]@{
            publisher_version = [string]$mutationReceipt.publisher.version.value
            publisher_build = [string]$mutationReceipt.publisher.build.value
          }
          $blastEvidence = [ordered]@{
            operation = [ordered]@{
              kind = "shape_rotation_delta_in_place_save"
              selector = [ordered]@{
                page_id = [int]$env:PUB_RE_PAIR_PAGE_ID
                shape_id = [int]$env:PUB_RE_PAIR_SHAPE_ID
              }
              delta_degrees = [double]::Parse($env:PUB_RE_PAIR_DELTA, [System.Globalization.CultureInfo]::InvariantCulture)
            }
            producer = $producer
            requested_streams = @()
            expected_derived_streams = @()
            requested_records = @()
            expected_derived_records = @()
            requested_entities = @()
            expected_derived_entities = @()
            arms = [ordered]@{
              source = [ordered]@{}
              control = [ordered]@{}
              mutation = [ordered]@{}
            }
          }
          $blastEvidencePath = Join-Path $private "blast-evidence.json"
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::WriteAllText(
            $blastEvidencePath,
            ($blastEvidence | ConvertTo-Json -Depth 20),
            $utf8NoBom
          )

          python tools/operation_blast_radius_v1.py `
            --source ([string]$paths.source_path) `
            --control ([string]$paths.control_path) `
            --mutation ([string]$paths.mutation_path) `
            --evidence $blastEvidencePath `
            --out (Join-Path $evidence "rotation-pair-blast-radius.json")
          if (-not $?) { throw "rotation_pair_blast_radius_failed" }

          $pairDiff = [ordered]@{
            schema = "chaptera.pub-re-experiment.v1"
            experiment_id = "rotation-pair-control-to-mutation"
            question = "Which logical CFB ranges differ between matched no-op Save and +rotation Save?"
            before = [ordered]@{
              path = "pair-control/private/mutated.pub"
              expected_sha256 = [string]$paths.control_sha256
            }
            after = [ordered]@{
              path = "pair-mutation/private/mutated.pub"
              expected_sha256 = [string]$paths.mutation_sha256
            }
            policy = [ordered]@{
              max_stream_bytes = 67108864
              max_changed_ranges_per_stream = 256
            }
          }
          $pairManifest = Join-Path $env:PUB_RE_NATIVE_OUTPUT "rotation-pair-diff-manifest.json"
          $pairDiff | ConvertTo-Json -Depth 10 | Set-Content -LiteralPath $pairManifest -Encoding utf8

          $metadata = cargo metadata --no-deps --format-version 1 --manifest-path tools/pub-re/Cargo.toml | ConvertFrom-Json
          $pubRe = Join-Path ([string]$metadata.target_directory) "release\pub-re.exe"
          if (-not (Test-Path -LiteralPath $pubRe -PathType Leaf)) {
            throw "built pub-re.exe was not found in Cargo target directory"
          }

          & $pubRe analyze `
            --manifest $pairManifest `
            --output (Join-Path $evidence "rotation-pair-cfb-receipt.json")
          if (-not $?) { throw "rotation_pair_cfb_analysis_failed" }

          & $pubRe attribute-officeart `
            --manifest $pairManifest `
            --stream "/Escher/EscherStm" `
            --output (Join-Path $evidence "rotation-pair-officeart-receipt.json")
          if (-not $?) { throw "rotation_pair_officeart_attribution_failed" }

      - name: Validate failed native stage receipt
        if: ${{ failure() && needs.gate.outputs.command_mode != 'research_0p75' && needs.gate.outputs.command_mode != 'research_t352' && needs.gate.outputs.command_mode != 'research_quill_readonly' && needs.gate.outputs.command_mode != 'rotation_pair' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $stage = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence\native-stage-receipt.json"
          if (-not (Test-Path -LiteralPath $stage -PathType Leaf)) {
            Write-Host "No native stage receipt was produced before failure."
            exit 0
          }

          $text = Get-Content -LiteralPath $stage -Raw
          if ($text -match '(?i)[A-Z]:\\' -or $text -match '\\\\[^"\s]+\\') {
            throw "native stage receipt contains an absolute filesystem path"
          }

          $receipt = $text | ConvertFrom-Json
          if ([string]$receipt.schema -ne "chaptera.pub-re-native-stage.v1") {
            throw "unexpected native stage receipt schema"
          }
          if ([string]::IsNullOrWhiteSpace([string]$receipt.experiment_id)) {
            throw "native stage receipt is missing experiment_id"
          }
          if ([string]::IsNullOrWhiteSpace([string]$receipt.stage)) {
            throw "native stage receipt is missing stage"
          }

      - name: Upload failed native stage receipt
        if: ${{ failure() && needs.gate.outputs.command_mode != 'research_0p75' && needs.gate.outputs.command_mode != 'research_t352' && needs.gate.outputs.command_mode != 'research_quill_readonly' && needs.gate.outputs.command_mode != 'rotation_pair' }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-failure-stage
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\evidence\native-stage-receipt.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Join native output to CFB and OfficeArt provenance
        if: ${{ needs.gate.outputs.command_mode != 'research_0p75' && needs.gate.outputs.command_mode != 'research_t352' && needs.gate.outputs.command_mode != 'research_quill_readonly' && needs.gate.outputs.command_mode != 'rotation_pair' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $private = Join-Path $env:PUB_RE_NATIVE_OUTPUT "private"
          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          $controlPath = Join-Path $private "control.json"
          $control = Get-Content -LiteralPath $controlPath -Raw | ConvertFrom-Json

          if ([bool]$control.has_diff) {
            $metadata = cargo metadata --no-deps --format-version 1 --manifest-path tools/pub-re/Cargo.toml | ConvertFrom-Json
            $pubRe = Join-Path ([string]$metadata.target_directory) "release\pub-re.exe"
            if (-not (Test-Path -LiteralPath $pubRe -PathType Leaf)) {
              throw "built pub-re.exe was not found in Cargo target directory"
            }

            $diffManifest = Join-Path $private "diff-manifest.json"
            $cfbReceipt = Join-Path $evidence "cfb-receipt.json"
            & $pubRe analyze `
              --manifest $diffManifest `
              --output $cfbReceipt

            if (-not [string]::IsNullOrWhiteSpace([string]$control.officeart_stream)) {
              & $pubRe attribute-officeart `
                --manifest $diffManifest `
                --stream ([string]$control.officeart_stream) `
                --output (Join-Path $evidence "officeart-receipt.json")
            }
          }

      - name: Enforce source-safe evidence boundary
        if: ${{ needs.gate.outputs.command_mode != 'research_0p75' && needs.gate.outputs.command_mode != 'research_t352' && needs.gate.outputs.command_mode != 'research_quill_readonly' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          $files = @(Get-ChildItem -LiteralPath $evidence -Filter *.json -File)
          if ($files.Count -lt 1) {
            throw "native experiment emitted no JSON evidence"
          }

          foreach ($file in $files) {
            $text = Get-Content -LiteralPath $file.FullName -Raw
            if ($text -match '(?i)[A-Z]:\\' -or $text -match '\\\\[^"\s]+\\') {
              throw "source-safe evidence contains an absolute filesystem path"
            }
            if ($text -match '(?i)"raw_document_bytes_emitted"\s*:\s*true') {
              throw "source-safe evidence claims raw document bytes were emitted"
            }
            if ($text -match '(?i)"raw_stream_bytes_emitted"\s*:\s*true') {
              throw "source-safe evidence claims raw stream bytes were emitted"
            }
            [void](Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json)
          }

      - name: Upload source-safe receipts only
        if: ${{ needs.gate.outputs.command_mode != 'research_0p75' && needs.gate.outputs.command_mode != 'research_t352' && needs.gate.outputs.command_mode != 'research_quill_readonly' }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-evidence
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\evidence\*.json
          if-no-files-found: error
          retention-days: 14

      - name: Run bounded 0.75 paragraph research
        if: ${{ needs.gate.outputs.command_mode == 'research_0p75' }}
        shell: powershell
        env:
          PUB_RE_RESEARCH_ID: ${{ needs.gate.outputs.research_id }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          # Explicitly bind the switch in Windows PowerShell 5.1; splatting
          # a trailing hashtable previously produced a green uniform-12 run
          # for an owner-approved mixed command (run 37858450713).
          if ($env:PUB_RE_RESEARCH_ID -eq "paragraph-line-spacing-0p75-mixed") {
            & tools/windows/run_paragraph_line_spacing_0p75_native_direct.ps1 `
              -OutputRoot $env:PUB_RE_RESEARCH_OUTPUT `
              -ReturnZip $env:PUB_RE_RESEARCH_RETURN_ZIP `
              -MixedSize
            if (-not $?) { throw "bounded mixed 0.75 paragraph research failed" }
          }
          elseif ($env:PUB_RE_RESEARCH_ID -eq "paragraph-line-spacing-0p75") {
            & tools/windows/run_paragraph_line_spacing_0p75_native_direct.ps1 `
              -OutputRoot $env:PUB_RE_RESEARCH_OUTPUT `
              -ReturnZip $env:PUB_RE_RESEARCH_RETURN_ZIP
            if (-not $?) { throw "bounded uniform 0.75 paragraph research failed" }
          }
          else {
            throw "unsupported bounded paragraph research profile"
          }

          # Never accept a successful PowerShell invocation as proof the
          # requested profile ran. Check *both* source-safe receipts before
          # the workflow is allowed to mark the native job green.
          $nativePath = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\paragraph-line-spacing-0p75-native-01.json"
          $structuralPath = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\paragraph-line-spacing-0p75-structural.json"
          if (-not (Test-Path -LiteralPath $nativePath -PathType Leaf) -or
              -not (Test-Path -LiteralPath $structuralPath -PathType Leaf)) {
            throw "publisher research receipt missing for requested profile"
          }
          $nativeReceipt = Get-Content -LiteralPath $nativePath -Raw | ConvertFrom-Json
          $structuralReceipt = Get-Content -LiteralPath $structuralPath -Raw | ConvertFrom-Json
          $expectedProfile = if ($env:PUB_RE_RESEARCH_ID -eq "paragraph-line-spacing-0p75-mixed") { "mixed-12-18-12" } else { "uniform-12" }
          if ([string]$nativeReceipt.composition_profile -ne $expectedProfile -or
              [string]$structuralReceipt.composition_profile -ne $expectedProfile) {
            throw "Publisher research profile mismatch: expected $expectedProfile"
          }
          if ($expectedProfile -eq "mixed-12-18-12" -and
              ($null -eq $structuralReceipt.mixed_size_research -or
               [bool]$structuralReceipt.mixed_size_research.mixed_size_product_authority_granted)) {
            throw "native mixed-size witness missing or wrongly grants product authority"
          }

      - name: Stage partial source-safe 0.75 receipt after failure
        if: ${{ failure() && needs.gate.outputs.command_mode == 'research_0p75' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null

          $analysis = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis"
          $candidates = @(
            (Join-Path $analysis "paragraph-line-spacing-0p75-native-01.json"),
            (Join-Path $analysis "paragraph-line-spacing-0p75-structural.json")
          )

          $copied = 0
          foreach ($path in $candidates) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              continue
            }

            $text = Get-Content -LiteralPath $path -Raw
            if ($text -match '(?i)[A-Z]:\\' -or $text -match '\\\\[^"\s]+\\') {
              throw "partial 0.75 receipt contains an absolute filesystem path"
            }
            [void]($text | ConvertFrom-Json)
            Copy-Item -LiteralPath $path -Destination $evidence -Force
            $copied += 1
          }

          Write-Host ("PUB_RE_0P75_PARTIAL_EVIDENCE copied={0}" -f $copied)

      - name: Upload partial source-safe 0.75 receipt after failure
        if: ${{ failure() && needs.gate.outputs.command_mode == 'research_0p75' }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-paragraph-line-spacing-0p75-partial-evidence
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\evidence\*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Stage source-safe 0.75 research receipts
        if: ${{ needs.gate.outputs.command_mode == 'research_0p75' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"

          $evidence = Join-Path $env:PUB_RE_NATIVE_OUTPUT "evidence"
          New-Item -ItemType Directory -Force -Path $evidence | Out-Null
          $native = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\paragraph-line-spacing-0p75-native-01.json"
          $structural = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\paragraph-line-spacing-0p75-structural.json"
          foreach ($path in @($native, $structural)) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "required source-safe 0.75 receipt missing"
            }
            $text = Get-Content -LiteralPath $path -Raw
            if ($text -match '(?i)[A-Z]:\\' -or $text -match '\\\\[^"\s]+\\') {
              throw "source-safe 0.75 receipt contains an absolute filesystem path"
            }
            [void]($text | ConvertFrom-Json)
            Copy-Item -LiteralPath $path -Destination $evidence -Force
          }

          $receipt = Get-Content -LiteralPath $structural -Raw | ConvertFrom-Json
          if ($receipt.schema -ne "chaptera.paragraph-line-spacing-0p75-structural.v1") {
            throw "unexpected 0.75 structural receipt schema"
          }
          if ($receipt.experiment_id -ne "PARAGRAPH-LINE-SPACING-0P75-NATIVE-01") {
            throw "unexpected 0.75 structural experiment id"
          }
          if ($receipt.native_114300_authority_candidate -isnot [bool]) {
            throw "0.75 structural receipt must carry a boolean authority candidate"
          }

      - name: Upload source-safe 0.75 research receipts only
        if: ${{ needs.gate.outputs.command_mode == 'research_0p75' }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-paragraph-line-spacing-0p75-evidence
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\evidence\*.json
          if-no-files-found: error
          retention-days: 14



      # Reuse the existing byte-pinned direct launcher. It performs read-only
      # Publisher observations on four SHA-addressed witnesses and verifies
      # fixture immutability, without a new general PowerShell executor.
      - name: Run pinned Quill Story read-only oracle
        id: quill_readonly
        if: ${{ needs.gate.outputs.command_mode == 'research_quill_readonly' }}
        shell: powershell
        timeout-minutes: 20
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if (@(Get-Process -Name MSPUB -ErrorAction SilentlyContinue).Count -ne 0) {
            throw "quill_readonly_publisher_busy_before_start"
          }

          $launcher = Join-Path $env:GITHUB_WORKSPACE "tools\windows\run_quill_story_readonly_oracle_direct.ps1"
          $private = Join-Path $env:PUB_RE_NATIVE_OUTPUT "private"
          New-Item -ItemType Directory -Force -Path $private | Out-Null
          $stdout = Join-Path $private "quill-readonly.stdout.txt"
          $stderr = Join-Path $private "quill-readonly.stderr.txt"
          $startedUtc = [DateTime]::UtcNow
          $child = $null
          $childClean = $false
          try {
            $quotedLauncher = '"' + $launcher + '"'
            $quotedOutput = '"' + $env:PUB_RE_RESEARCH_OUTPUT + '"'
            $windowsPowerShell = Join-Path $env:SystemRoot "System32\WindowsPowerShell\v1.0\powershell.exe"
          if (-not (Test-Path -LiteralPath $windowsPowerShell -PathType Leaf)) {
            throw "quill_readonly_windows_powershell_unavailable"
          }
          $child = Start-Process -FilePath $windowsPowerShell -ArgumentList @("-NoProfile", "-ExecutionPolicy", "Bypass", "-File", $quotedLauncher, "-OutputRoot", $quotedOutput) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru

            if (-not $child.WaitForExit(1080000)) {
              throw "quill_readonly_watchdog_timeout_1080s"
            }
            $child.WaitForExit()
            $child.Refresh()
            if (-not $child.HasExited -or [int]$child.ExitCode -ne 0) {
              throw "quill_readonly_direct_launcher_failed"
            }
            Start-Sleep -Seconds 2
            if (@(Get-Process -Name MSPUB -ErrorAction SilentlyContinue).Count -ne 0) {
              throw "quill_readonly_publisher_did_not_exit"
            }
            $childClean = $true
          }
          finally {
            if ($null -ne $child -and -not $child.HasExited) {
              try {
                Stop-Process -Id $child.Id -Force -ErrorAction Stop
                [void]$child.WaitForExit(10000)
              }
              catch { throw "quill_readonly_child_cleanup_failed" }
            }
            if (-not $childClean) {
              $owned = @(Get-Process -Name MSPUB -ErrorAction SilentlyContinue | Where-Object {
                try { $_.StartTime.ToUniversalTime() -ge $startedUtc.AddSeconds(-2) }
                catch { $false }
              })
              if ($owned.Count -gt 1) {
                throw "quill_readonly_ambiguous_publisher_cleanup"
              }
              if ($owned.Count -eq 1) {
                try { Stop-Process -Id $owned[0].Id -Force -ErrorAction Stop }
                catch { throw "quill_readonly_publisher_cleanup_failed" }
              }
            }
          }

          $nativePath = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\quill-story-readonly-oracle.json"
          $resolutionPath = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\quill-story-readonly-oracle-resolution.json"
          $native = Get-Content -LiteralPath $nativePath -Raw | ConvertFrom-Json
          $resolution = Get-Content -LiteralPath $resolutionPath -Raw | ConvertFrom-Json

          if ($native.schema -ne "chaptera.quill-story-readonly-oracle.v1" -or
              [int]$native.witness_count -ne 4 -or
              @($native.witnesses).Count -ne 4 -or
              @($native.witnesses | Where-Object { $_.source_unchanged -ne $true }).Count -ne 0) {
            throw "quill_readonly_native_receipt_invalid"
          }
          if ($resolution.schema -ne "chaptera.quill-story-fdpp-oracle-resolution.v1" -or
              [int]$resolution.witness_count -ne 4 -or
              @($resolution.rows).Count -ne 4) {
            throw "quill_readonly_resolution_receipt_invalid"
          }

      - name: Stage source-safe Quill Story evidence
        if: ${{ always() && needs.gate.outputs.command_mode == 'research_quill_readonly' }}
        shell: powershell
        env:
          QUILL_NATIVE_OUTCOME: ${{ steps.quill_readonly.outcome }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $to = Join-Path $env:PUB_RE_NATIVE_OUTPUT "quill-evidence"
          New-Item -ItemType Directory -Force -Path $to | Out-Null
          $names = @(
            "analysis\quill-story-readonly-oracle.json",
            "analysis\quill-story-readonly-oracle-resolution.json",
            "analysis\quill-readonly-direct-stage.json",
            "analysis\quill-story-readonly-native-stage.json",
            "environment.json"
          )
          $count = 0
          foreach ($relative in $names) {
            $from = Join-Path $env:PUB_RE_RESEARCH_OUTPUT $relative
            if (-not (Test-Path -LiteralPath $from -PathType Leaf)) { continue }
            $body = Get-Content -LiteralPath $from -Raw
            if ($body -match '(?i)[A-Z]:\\' -or $body -match '\\\\[^"\s]+\\') {
              throw "quill_readonly_source_safe_path_violation"
            }
            [void]($body | ConvertFrom-Json)
            Copy-Item -LiteralPath $from -Destination $to -Force
            $count += 1
          }
          $directStagePath = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\quill-readonly-direct-stage.json"
          if (Test-Path -LiteralPath $directStagePath -PathType Leaf) {
            $directStage = Get-Content -LiteralPath $directStagePath -Raw | ConvertFrom-Json
            if ($directStage.schema -ne "chaptera.quill-readonly-direct-stage.v1" -or
                $directStage.phase -notin @("prepare", "native_observation", "finalize", "resolver_witness_acquisition", "resolver", "crosschecks", "complete") -or
                $directStage.status -notin @("running", "invalid", "complete")) {
              throw "quill_readonly_direct_stage_contract_invalid"
            }
            if ($env:QUILL_NATIVE_OUTCOME -eq "success" -and $directStage.status -ne "complete") {
              throw "quill_readonly_direct_stage_not_complete"
            }
          }
          $nativeStagePath = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\quill-story-readonly-native-stage.json"
          if (Test-Path -LiteralPath $nativeStagePath -PathType Leaf) {
            $nativeStage = Get-Content -LiteralPath $nativeStagePath -Raw | ConvertFrom-Json
            if ($nativeStage.schema -ne "chaptera.quill-readonly-native-stage.v1" -or
                $nativeStage.phase -notin @("fixture_acquisition", "publisher_identity", "application_create", "document_open", "stories_collection", "story_read", "source_integrity", "receipt_write", "complete") -or
                $nativeStage.status -notin @("running", "invalid", "complete") -or
                [int]$nativeStage.witness_index -lt 0 -or [int]$nativeStage.witness_index -gt 4) {
              throw "quill_readonly_native_stage_invalid"
            }
            if ($env:QUILL_NATIVE_OUTCOME -eq "success" -and $nativeStage.status -ne "complete") {
              throw "quill_readonly_native_stage_not_complete"
            }
          }
          $complete = $env:QUILL_NATIVE_OUTCOME -eq "success" -and $count -eq $names.Count
          $stage = [ordered]@{
            schema = "chaptera.pub-re-quill-m0-stage.v1"
            experiment_id = "QUILL-STORY-READONLY-ORACLE-02"
            status = if ($complete) { "complete" } else { "invalid_or_incomplete" }
            expected_source_safe_receipts = $names.Count
            staged_source_safe_receipts = $count
            publisher_native_step = [string]$env:QUILL_NATIVE_OUTCOME
          }
          $stage | ConvertTo-Json -Depth 3 |
            Set-Content -LiteralPath (Join-Path $to "quill-m0-stage.json") -Encoding utf8
          if ($env:QUILL_NATIVE_OUTCOME -eq "success" -and -not $complete) {
            throw "quill_readonly_success_missing_required_receipt"
          }

      - name: Upload source-safe Quill Story receipts
        if: ${{ always() && needs.gate.outputs.command_mode == 'research_quill_readonly' }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-quill-story-readonly-evidence
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\quill-evidence\*.json
          if-no-files-found: error
          retention-days: 14

      - name: Execute T352 Publisher geometry matrix
        if: ${{ needs.gate.outputs.command_mode == 'research_t352' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          if ($env:PUB_RE_RESEARCH_ID -eq "val-xproj-independent-01") {
            & tools/windows/run_t352_independent_native.ps1 -OutputRoot $env:PUB_RE_RESEARCH_OUTPUT
          } else {
            & tools/windows/run_t352_native.ps1 -OutputRoot $env:PUB_RE_RESEARCH_OUTPUT
          }
          if (-not $?) { throw "T352 native experiment failed" }
          $result = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis\t352-native-observations.json"
          if (-not (Test-Path -LiteralPath $result -PathType Leaf)) {
            throw "T352 is missing the required native evidence receipt"
          }
          $obj = Get-Content -LiteralPath $result -Raw | ConvertFrom-Json
          if ($obj.schema -ne "chaptera.t352-native-observations.v1" -or
              [int]$obj.observed_arm_count -ne 4) {
            throw "T352 native result is incomplete"
          }

      - name: Stage source-safe T352 evidence even on partial failure
        if: ${{ always() && needs.gate.outputs.command_mode == 'research_t352' }}
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $from = Join-Path $env:PUB_RE_RESEARCH_OUTPUT "analysis"
          $to = Join-Path $env:PUB_RE_NATIVE_OUTPUT "t352-evidence"
          New-Item -ItemType Directory -Force -Path $to | Out-Null
          if (-not (Test-Path -LiteralPath $from -PathType Container)) { exit 0 }
          foreach ($file in @(Get-ChildItem -LiteralPath $from -File -Filter "*.json")) {
            if ($file.Name -notmatch '^t352-[a-z0-9-]+\.json$' -and
                $file.Name -notmatch '^(control|both_consistent|contents_only|escher_only)-(before|after)-(cfb|projections)\.json$') {
              throw "T352 evidence filename violates the allowlist"
            }
            $text = Get-Content -LiteralPath $file.FullName -Raw
            if ($text -match '(?i)[A-Z]:\\' -or $text -match '\\\\[^"\s]+\\') {
              throw "T352 source-safe receipt contains an absolute path"
            }
            [void]($text | ConvertFrom-Json)
            Copy-Item -LiteralPath $file.FullName -Destination $to
          }

      - name: Upload source-safe T352 evidence
        if: ${{ always() && needs.gate.outputs.command_mode == 'research_t352' }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-t352-projection-evidence
          path: ${{ env.PUB_RE_NATIVE_OUTPUT }}\t352-evidence\*.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove private native inputs and outputs
        if: always()
        shell: powershell
        run: |
          if (-not [string]::IsNullOrWhiteSpace($env:PUB_RE_NATIVE_OUTPUT) -and (Test-Path -LiteralPath $env:PUB_RE_NATIVE_OUTPUT)) {
            Remove-Item -LiteralPath $env:PUB_RE_NATIVE_OUTPUT -Recurse -Force
          }

  text-width-m1:
    needs: gate
    if: ${{ needs.gate.result == 'success' && needs.gate.outputs.command_mode == 'research_width_m1' }}
    runs-on: [self-hosted, Windows, X64, chaptera-publisher-oracle]
    timeout-minutes: 30
    concurrency:
      group: pub-re-native-publisher-oracle
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      PUB_M1_OUTPUT: ${{ github.workspace }}\pub-m1-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Run bounded Publisher text width experiment
        id: m1_native
        shell: powershell
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:PUB_M1_OUTPUT | Out-Null
          & tools/research-runner/operations/text_width_breakpoint_m1_01.ps1 -PacketPath tools/research-runner/experiments/text-width-breakpoint-m1-01.packet.json -OutputRoot $env:PUB_M1_OUTPUT

      - name: Stage source-safe text width evidence and partial failures
        if: ${{ always() }}
        shell: powershell
        env:
          M1_NATIVE_OUTCOME: ${{ steps.m1_native.outcome }}
        run: |
          Set-StrictMode -Version Latest
          $ErrorActionPreference = "Stop"
          $safe = Join-Path $env:PUB_M1_OUTPUT "upload-safe"
          New-Item -ItemType Directory -Force -Path $safe | Out-Null
          $names = @(
            "text-width-breakpoint-m1-01.json",
            "text-width-m1-suite-stage.json",
            "text-width-m1-seed.json",
            "text-width-m1-seed-stage.json",
            "text-width-m1-control-before.json",
            "text-width-m1-control-before-stage.json",
            "text-width-m1-narrow.json",
            "text-width-m1-narrow-stage.json",
            "text-width-m1-wide.json",
            "text-width-m1-wide-stage.json",
            "text-width-m1-control-after.json",
            "text-width-m1-control-after-stage.json"
          )
          $copied = 0
          foreach ($name in $names) {
            $path = Join-Path $env:PUB_M1_OUTPUT ("analysis\" + $name)
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) { continue }
            $file = Get-Item -LiteralPath $path
            if ($file.Length -gt 131072) { throw "m1_source_safe_receipt_oversize" }
            $raw = Get-Content -LiteralPath $path -Raw
            if ($raw -match '(?i)[a-z]:\\' -or $raw -match '\\\\[^"\s]+\\') {
              throw "m1_source_safe_receipt_contains_local_path"
            }
            $parsed = $raw | ConvertFrom-Json
            if ([string]$parsed.schema -notmatch '^chaptera\.text-width-') {
              throw "m1_source_safe_schema_mismatch"
            }
            Copy-Item -LiteralPath $path -Destination (Join-Path $safe $name) -Force
            $copied++
          }
          if ($copied -eq 0) {
            @{schema="chaptera.text-width-m1-suite-stage.v1";state="invalid";phase="preflight";arm_id="none"} |
              ConvertTo-Json -Compress |
              Set-Content -LiteralPath (Join-Path $safe "text-width-m1-suite-stage.json") -Encoding UTF8
          }
          if ($env:M1_NATIVE_OUTCOME -eq "success" -and $copied -ne $names.Count) {
            throw "m1_success_incomplete_receipts"
          }

      - name: Upload M1 source-safe receipts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: pub-re-native-text-width-m1-evidence
          path: ${{ env.PUB_M1_OUTPUT }}\upload-safe\*.json
          if-no-files-found: error
          retention-days: 14

      - name: Clear private M1 Publisher sources and outputs
        if: ${{ always() }}
        shell: powershell
        run: |
          if (Test-Path -LiteralPath $env:PUB_M1_OUTPUT) {
            Remove-Item -LiteralPath $env:PUB_M1_OUTPUT -Recurse -Force
          }
