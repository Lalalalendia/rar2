name: VALIDATION current Reader portable parity runner

on:
  pull_request:
    paths:
      - ".github/workflows/validation-current-reader-portable-parity-runner.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: validation-current-reader-portable-parity-runner-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download already-built exact Reader runner
        uses: actions/download-artifact@v4
        with:
          name: current-reader-portable-parity-runner
          path: out/current-reader-portable-parity-runner
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 37395236029

      - name: Verify exact worker provenance
        run: |
          set -euo pipefail
          test -f out/current-reader-portable-parity-runner/RUNNER-METADATA.json
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("out/current-reader-portable-parity-runner/RUNNER-METADATA.json")
          d=json.loads(p.read_text())
          assert d["schema"] == "chaptera.current-reader-portable-parity-runner.v1"
          assert d["repository_commit_sha"] == "d8fda142f29de733562b719c54735916f415a94d"
          print(d)
          PY
          chmod +x out/current-reader-portable-parity-runner/target/debug/chaptera
          out/current-reader-portable-parity-runner/target/debug/chaptera --help >/dev/null

      - name: Install isolated Playwright Chromium
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          rm -rf out/current-reader-portable-parity-runner/ms-playwright
          cp -R "$HOME/.cache/ms-playwright" out/current-reader-portable-parity-runner/ms-playwright

      - name: Update portable metadata
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("out/current-reader-portable-parity-runner/RUNNER-METADATA.json")
          d=json.loads(p.read_text())
          d["packaging_commit_sha"] = "${{ github.sha }}"
          d["browser_bytes_included"] = True
          p.write_text(json.dumps(d, indent=2, sort_keys=True)+"\n")
          PY

      - name: Upload portable runner with isolated Chromium
        uses: actions/upload-artifact@v4
        with:
          name: current-reader-portable-parity-runner-with-browser
          path: out/current-reader-portable-parity-runner
          retention-days: 1
          if-no-files-found: error
