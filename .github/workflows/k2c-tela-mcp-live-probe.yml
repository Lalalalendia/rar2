name: K2C Tela MCP live probe

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: k2c-tela-mcp-live-probe
  cancel-in-progress: false

jobs:
  live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Require dedicated Tela write secret
        shell: bash
        env:
          TELA_K2C_WRITE_PAT: ${{ secrets.TELA_K2C_WRITE_PAT }}
        run: |
          test -n "$TELA_K2C_WRITE_PAT"

      - name: Run bounded Tela MCP live probe
        working-directory: services/pub-harness
        env:
          TELA_BASE_URL: https://telawiki.com
          TELA_K2C_WRITE_PAT: ${{ secrets.TELA_K2C_WRITE_PAT }}
        run: |
          python k2c_tela_live_probe.py \
            --source-head "$GITHUB_SHA" \
            --output ../../artifacts/k2c-tela-live-probe.json

      - name: Validate source-safe receipt
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("artifacts/k2c-tela-live-probe.json")
          v = json.loads(p.read_text(encoding="utf-8"))
          assert v["source_safe"] is True
          assert v["page_id"] == 5049
          assert v["space_id"] == 364
          assert v["retry_changed_cursor"] is False
          assert v["retry_apply"]["idempotent_manifest_replay"] is True
          text = p.read_text(encoding="utf-8")
          assert "TELA_K2C_WRITE_PAT" not in text
          assert "acceptance_probe =" not in text
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: k2c-tela-live-probe
          path: artifacts/k2c-tela-live-probe.json
          if-no-files-found: error
          retention-days: 14
