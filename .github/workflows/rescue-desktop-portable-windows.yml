name: Rescue Desktop Portable Windows V1

on:
  pull_request:
    paths:
      - 'apps/chaptera-rescue/src/batch_ui.rs'
      - 'tools/rescue_engine_entrypoint.py'
      - 'tools/test_rescue_engine_entrypoint.py'
      - 'tools/probe_rescue_portable_windows.py'
      - 'tools/probe_rescue_real_text_windows.py'
      - 'tools/probe_rescue_gui_window_windows.py'
      - 'tools/test_rescue_gui_window_probe.py'
      - '.github/workflows/rescue-desktop-portable-windows.yml'
      - 'tools/rescue_desktop_batch_v1.py'
      - 'tools/rescue_batch_text_v1.py'
      - 'tools/test_rescue_batch_text_v1.py'
      - 'tools/verify_rescue_text_evidence_v1.py'
      - 'tools/rescue_salvage_bundle_v1.py'
      - 'tools/rescue_windows_job_guard.py'
      - 'tools/test_rescue_windows_job_guard.py'
      - 'tools/rescue_cfb_stream_export.py'
      - 'tools/verify_rescue_cfb_stream_export.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable-windows:
    runs-on: windows-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'
          components: rustfmt
      - name: Offline entrypoint and existing batch/salvage tests
        shell: pwsh
        run: |
          python -m unittest tools.test_rescue_engine_entrypoint tools.test_rescue_desktop_batch_v1 tools.test_rescue_salvage_bundle_v1 tools.test_rescue_cfb_stream_identity tools.test_rescue_windows_job_guard tools.test_rescue_batch_text_v1 tools.test_verify_rescue_text_evidence_v1 -v
          python -m py_compile tools/rescue_engine_entrypoint.py tools/probe_rescue_portable_windows.py tools/probe_rescue_real_text_windows.py tools/rescue_windows_job_guard.py tools/test_rescue_windows_job_guard.py
      - name: Build frozen existing Python engine
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onedir --console --name rescue-engine --distpath dist --workpath build/pyinstaller --specpath build/pyinstaller --paths . --hidden-import tools.rescue_desktop_batch_v1 --hidden-import tools.rescue_salvage_bundle_v1 --hidden-import tools.rescue_windows_job_guard --hidden-import tools.rescue_batch_text_v1 --hidden-import tools.verify_rescue_text_evidence_v1 --hidden-import tools.rescue_cfb_stream_export --hidden-import tools.verify_rescue_cfb_stream_export --hidden-import tools.corpus.cfb_physical tools/rescue_engine_entrypoint.py
      - name: Build Rescue GUI and native image exporter
        shell: pwsh
        run: |
          cargo fmt --manifest-path apps/chaptera-rescue/Cargo.toml -- --check
          cargo test --manifest-path apps/chaptera-rescue/Cargo.toml
          cargo build --manifest-path apps/chaptera-rescue/Cargo.toml --release
          cargo build -p chaptera-pub-cli --release
          Copy-Item apps/chaptera-rescue/target/release/chaptera-rescue.exe dist/rescue-engine/chaptera-rescue.exe
          Copy-Item target/release/pub.exe dist/rescue-engine/pub.exe
      - name: Prove no installed Python is required for real frozen CFB replay
        shell: pwsh
        run: |
          python -m tools.probe_rescue_portable_windows --portable-dir dist/rescue-engine
      - name: Real pinned Publisher Story batch with no installed Python
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'SampleNewsletter.pub'
          Invoke-WebRequest -Uri 'https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub' -OutFile $fixture
          python -m tools.probe_rescue_real_text_windows --portable-dir dist/rescue-engine --fixture $fixture
      - name: Label unsigned preview and generate SHA-256 inventory
        shell: pwsh
        run: |
          $root = 'dist/rescue-engine'
          'Unsigned portable technical preview. No native PUB restoration or full-corpus acceptance claim. Extract the entire ZIP together. Private PUB source bytes remain local.' | Set-Content -Encoding utf8 "$root/UNSIGNED-PREVIEW.txt"
          @'
          Chaptera Rescue Desktop — portable Windows technical preview
          Run chaptera-rescue.exe in this folder. Its sibling rescue-engine.exe
          and _internal/ provide the frozen runtime; pub.exe extracts verified images and source-backed Story text.
          No separate Python installation or rar2 checkout is required.
          Bundle outputs must be in a dedicated folder outside source PUB directories.
          No network service or automatic upload is used during runtime.
          On Windows, worker children inherit the 1536 MiB batch-engine Job Object.
          The memory bound applies to job-wide committed bytes, not disk or CPU use.
          This archive is UNSIGNED and has NOT passed all real-corpus/security/release gates.
          '@ | Set-Content -Encoding utf8 "$root/README.txt"
          foreach ($name in @('chaptera-rescue.exe', 'rescue-engine.exe', 'pub.exe')) {
            if (-not (Test-Path (Join-Path $root $name))) { throw "Missing component: $name" }
          }
          $rootPath = [System.IO.Path]::GetFullPath($root)
          $checksums = @(
            Get-ChildItem $root -Recurse -File |
              Where-Object { $_.Name -ne 'portable-build.json' } |
              Sort-Object FullName |
              ForEach-Object {
                @{ file = [System.IO.Path]::GetRelativePath($rootPath, $_.FullName).Replace('\', '/');
                   sha256 = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant();
                   byte_len = $_.Length }
              }
          )
          $manifest = @{ schema_version = 'chaptera.rescue-portable-build.v1'; source_commit = '${{ github.sha }}'; target = 'windows-x64'; signing = 'unsigned_preview'; files = $checksums }
          $manifest | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "$root/portable-build.json"
          Compress-Archive -Path "$root/*" -DestinationPath dist/chaptera-rescue-portable-windows-x64.zip -CompressionLevel Optimal
          Copy-Item "$root/portable-build.json" dist/chaptera-rescue-portable-build.json
      - name: Real GUI window smoke from extracted ZIP (hosted Windows, not pointer acceptance)
        shell: pwsh
        run: |
          python -m unittest tools.test_rescue_gui_window_probe -v
          $destination = Join-Path $env:RUNNER_TEMP 'Rescue GUI acceptance unpack'
          Expand-Archive -LiteralPath 'dist/chaptera-rescue-portable-windows-x64.zip' -DestinationPath $destination -Force
          python -m tools.probe_rescue_gui_window_windows --portable-dir "$destination"
      - uses: actions/upload-artifact@v4
        with:
          name: chaptera-rescue-portable-windows-x64-unsigned
          path: |
            dist/chaptera-rescue-portable-windows-x64.zip
            dist/chaptera-rescue-portable-build.json
          if-no-files-found: error
