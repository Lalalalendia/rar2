name: Legacy22 cross-version pair mine

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/legacy22-xver-pair-mine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy22-xver-pair-mine-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target
  APACHE_POI_REF: 93b6a820f4aaefd7b062615f843799947872cb24

jobs:
  pair-mine:
    name: Mine Publisher 98/2000/2007 same-document pair
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact research head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout pinned Apache POI publisher fixtures
        uses: actions/checkout@v4
        with:
          repository: apache/poi
          ref: ${{ env.APACHE_POI_REF }}
          path: apache-poi
          sparse-checkout: |
            test-data/publisher/Sample98.pub
            test-data/publisher/Sample2000.pub
            test-data/publisher/Sample.pub
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Install bounded CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Build legacy OleData profiler
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --release \
            --bin legacy22_raw0022_companion_profile

      - name: Profile same-document legacy targets
        run: |
          set -euo pipefail
          mkdir -p out/xver-pair
          BIN="${CARGO_TARGET_DIR}/release/legacy22_raw0022_companion_profile"
          "$BIN" apache-poi/test-data/publisher/Sample98.pub out/xver-pair/Sample98.raw0022.json
          "$BIN" apache-poi/test-data/publisher/Sample2000.pub out/xver-pair/Sample2000.raw0022.json

      - name: Join legacy OleData candidates to mature CFB topology
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path
          import olefile

          root = Path("apache-poi/test-data/publisher")
          out = Path("out/xver-pair")

          def sha256(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          def cfb_profile(path):
              with olefile.OleFileIO(str(path)) as ole:
                  entries = ole.listdir(streams=True, storages=True)
                  object_roots = set()
                  object_features = {}
                  for entry in entries:
                      if len(entry) >= 2 and entry[0].casefold() == "objects":
                          m = re.fullmatch(r"Object\s*(\d+)", entry[1], flags=re.IGNORECASE)
                          if m:
                              n = int(m.group(1))
                              object_roots.add(n)
                              features = object_features.setdefault(n, set())
                              for component in entry[2:]:
                                  folded = component.casefold()
                                  normalized = folded.lstrip("\x00\x01\x02")
                                  if "olepres" in folded:
                                      features.add("olepres")
                                  if "ole10native" in folded:
                                      features.add("ole10native")
                                  if "compobj" in folded:
                                      features.add("compobj")
                                  if normalized == "ole":
                                      features.add("ole")
                                  if normalized == "contents":
                                      features.add("contents")

                  contents = ole.openstream("Contents").read(32)
                  escher_len = 0
                  try:
                      escher_len = len(ole.openstream(["Escher", "EscherStm"]).read())
                  except Exception:
                      pass

              return {
                  "sha256": sha256(path),
                  "size": path.stat().st_size,
                  "contents_magic_hex": contents[:4].hex(),
                  "contents_revision_u16": int.from_bytes(contents[12:14], "little") if len(contents) >= 14 else None,
                  "object_roots": sorted(object_roots),
                  "object_features": {
                      str(n): sorted(features)
                      for n, features in sorted(object_features.items())
                  },
                  "escher_stm_len": escher_len,
              }

          legacy = {}
          union_v = set()
          for name in ("Sample98", "Sample2000"):
              row = json.loads((out / f"{name}.raw0022.json").read_text())
              candidates = row.get("candidates") or []
              v_values = sorted({
                  int((item.get("child_u16_first64") or {})["0x0a"])
                  for item in candidates
                  if "0x0a" in (item.get("child_u16_first64") or {})
              })
              f_counts = {}
              for item in candidates:
                  values = item.get("child_u16_first64") or {}
                  if "0x0e" in values:
                      key = str(int(values["0x0e"]))
                      f_counts[key] = f_counts.get(key, 0) + 1
              union_v.update(v_values)
              legacy[name] = {
                  "source_sha256": row.get("source_sha256"),
                  "eligible_reader_open": row.get("eligible_reader_open"),
                  "candidate_count": int(row.get("candidate_count") or 0),
                  "v_values": v_values,
                  "f_counts": dict(sorted(f_counts.items(), key=lambda kv: int(kv[0]))),
              }

          profiles = {
              "Sample98": cfb_profile(root / "Sample98.pub"),
              "Sample2000": cfb_profile(root / "Sample2000.pub"),
              "Sample": cfb_profile(root / "Sample.pub"),
          }
          mature_roots = set(profiles["Sample"]["object_roots"])

          receipt = {
              "schema": "chaptera.legacy22-xver-pair-mine.v1",
              "apache_poi_ref": "93b6a820f4aaefd7b062615f843799947872cb24",
              "fixtures": profiles,
              "legacy_raw0022": legacy,
              "legacy_v_union": sorted(union_v),
              "mature_object_roots": sorted(mature_roots),
              "legacy_v_intersection_mature_object_roots": sorted(union_v & mature_roots),
              "legacy_v_only": sorted(union_v - mature_roots),
              "mature_object_root_only": sorted(mature_roots - union_v),
              "applicable_legacy_ole_found": any(
                  row["candidate_count"] > 0 for row in legacy.values()
              ),
              "evidence_boundary": (
                  "same-document public SaveAs fixture topology only; "
                  "no OLE activation and no semantic naming beyond previously closed OleData.V identity"
              ),
          }

          (out / "receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy22-xver-pair-${{ github.run_id }}
          path: out/xver-pair/**
          if-no-files-found: error
          retention-days: 30
