name: CLOUD-WORKSPACE-CONTEXT-01

on:
  pull_request:
    paths:
      - "apps/chaptera-server/migrations/0014_workspace_context.sql"
      - "apps/chaptera-server/src/workspace_context.rs"
      - "apps/chaptera-server/src/workspace_http.rs"
      - "apps/chaptera-server/src/schema_migration.rs"
      - "tools/run_cloud_migration_receipt.py"
      - ".github/workflows/cloud-workspace-context-v1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  workspace-context:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy
      - name: Check Rust formatting
        run: cargo fmt -p chaptera-server -- --check
      - name: Test workspace context
        run: cargo test -p chaptera-server workspace_context
      - name: Test authenticated workspace HTTP
        run: cargo test -p chaptera-server workspace_http::tests
      - name: Test migrations
        run: cargo test -p chaptera-server schema_migration
