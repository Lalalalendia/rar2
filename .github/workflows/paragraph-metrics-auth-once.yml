name: Paragraph metrics authority one-shot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/paragraph-metrics-auth-once.yml"
      - "tools/windows/run_paragraph_metrics_auth_direct.ps1"
      - "tools/research-runner/experiments/paragraph-metrics-auth-01.packet.json"
      - "tools/research-runner/operations/paragraph_metrics_auth_01.ps1"
      - "tools/research-runner/analysis/paragraph_metrics_auth_01_blast_radius.py"
      - "tools/research-runner/analysis/paragraph_metrics_auth_01_structural.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'publisher-2019' || github.ref }}
  cancel-in-progress: false

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      trusted_sha: ${{ steps.trust.outputs.trusted_sha }}
    steps:
      - name: Bind checkout
        id: trust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event_name }}" -eq "pull_request") {
            "trusted_sha=${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            "trusted_sha=${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.trust.outputs.trusted_sha }}
          persist-credentials: false

      - name: Validate packet and direct launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/research-runner/validate_packet.py `
            --packet tools/research-runner/experiments/paragraph-metrics-auth-01.packet.json `
            --expected-environment publisher-2019
          if ($LASTEXITCODE -ne 0) { throw "Paragraph metrics packet validation failed." }
          $path = "tools/windows/run_paragraph_metrics_auth_direct.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell parser rejected paragraph metrics direct launcher."
          }
          $text = Get-Content $path -Raw
          foreach ($required in @(
            "ExpectedStructuralMerge",
            "PUB_RESEARCH_FIXTURE_ROOT",
            "paragraph_metrics_auth_01_blast_radius.py",
            "paragraph_metrics_auth_01_structural.py",
            "paragraph_metric_semantics_granted",
            "effective_line_origins_and_heights",
            "evidence-manifest.json"
          )) {
            if (-not $text.Contains($required)) { throw "Missing direct launcher marker: $required" }
          }

  native:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    environment: pub-native-lab
    runs-on:
      - self-hosted
      - Windows
      - pub-research
      - publisher-2019
    timeout-minutes: 60
    env:
      OUTPUT_ROOT: ${{ github.workspace }}\out\pub-research\paragraph-metrics-auth-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.contract.outputs.trusted_sha }}
          clean: true
          persist-credentials: false

      - name: Verify exact trusted checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "${{ needs.contract.outputs.trusted_sha }}") { throw "Trusted checkout mismatch: $actual" }

      - name: Run complete paragraph metrics authority chain
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File tools/windows/run_paragraph_metrics_auth_direct.ps1 -OutputRoot "$env:OUTPUT_ROOT"

      - name: Publish paragraph metrics evidence boundary
        if: always()
        shell: pwsh
        run: |
          "## PARAGRAPH-METRICS-AUTH-01" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- trusted SHA: ${{ needs.contract.outputs.trusted_sha }}" >> $env:GITHUB_STEP_SUMMARY
          $structural = Join-Path $env:OUTPUT_ROOT "analysis\paragraph-metrics-auth-01-structural.json"
          if (Test-Path -LiteralPath $structural) {
            $doc = Get-Content -LiteralPath $structural -Raw | ConvertFrom-Json
            "- TEXT invariance all arms: $($doc.invariants.quill_text_byte_invariance_all_arms)" >> $env:GITHUB_STEP_SUMMARY
            "- FDPP framing known: $($doc.invariants.raw_fdpp_framing_known)" >> $env:GITHUB_STEP_SUMMARY
            "- semantics granted by structural receipt: $($doc.invariants.paragraph_metric_semantics_granted)" >> $env:GITHUB_STEP_SUMMARY
            "- remaining carrier authority: $($doc.remaining_authority.native_rule_to_persisted_carrier_law)" >> $env:GITHUB_STEP_SUMMARY
            "- remaining effective geometry authority: $($doc.remaining_authority.effective_line_origins_and_heights)" >> $env:GITHUB_STEP_SUMMARY
          } else {
            "- structural receipt missing" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload source-free paragraph metrics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paragraph-metrics-auth-${{ github.run_id }}
          path: |
            out/pub-research/paragraph-metrics-auth-${{ github.run_id }}/environment.json
            out/pub-research/paragraph-metrics-auth-${{ github.run_id }}/evidence-manifest.json
            out/pub-research/paragraph-metrics-auth-${{ github.run_id }}/analysis/**
            out/pub-research/paragraph-metrics-auth-${{ github.run_id }}/logs/**
          if-no-files-found: error
          retention-days: 30
