name: Text Format Overlay Rust V1

on:
  pull_request:
    paths:
      - "crates/chaptera-text-format-overlay/**"
      - ".github/workflows/text-format-overlay-rust-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - name: Format Rust overlay
        run: cargo fmt --manifest-path crates/chaptera-text-format-overlay/Cargo.toml -- --check
      - name: Check Rust overlay
        run: cargo check --manifest-path crates/chaptera-text-format-overlay/Cargo.toml --all-targets
      - name: Clippy Rust overlay
        run: cargo clippy --manifest-path crates/chaptera-text-format-overlay/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust overlay
        run: cargo test --manifest-path crates/chaptera-text-format-overlay/Cargo.toml --all-targets
