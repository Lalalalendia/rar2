name: Authoring AuthoredStack Lifecycle V1

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-editor/**"
      - "vendor/producer-a/crates/pub-editor-authoring-core/src/authored_stack_lifecycle_v1.rs"
      - "vendor/producer-a/crates/pub-editor-authoring-core/src/create_shape_runtime_v1.rs"
      - "vendor/producer-a/crates/pub-editor/src/lib.rs"
      - "vendor/producer-a/crates/pub-editor-authoring-core/tests/authored_stack_lifecycle_v1.rs"
      - "vendor/producer-a/crates/pub-editor/tests/create_shape_runtime_v1.rs"
      - "vendor/producer-a/crates/pub-editor/tests/delete_node_runtime_v1.rs"
      - "tools/ci/pub_editor_pr_fanout.py"
      - ".github/workflows/authoring-authored-stack-lifecycle-v1.yml"
  push:
    branches:
      - authoring-authored-stack-lifecycle-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pub-editor AuthoredStack Lifecycle scope
    runs-on: ubuntu-latest
    outputs:
      authored_stack_lifecycle: ${{ steps.scope.outputs.authored_stack_lifecycle }}
      reason: ${{ steps.scope.outputs.authored_stack_lifecycle_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      - id: base-authority
        name: Resolve base-branch classifier authority
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch PR head for classification
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Test base-authority pub-editor classifier
        run: python tools/ci/test_pub_editor_pr_fanout.py

      - id: scope
        name: Classify AuthoredStack Lifecycle ownership
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.base-authority.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p target/pub-editor-pr-fanout
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "authored_stack_lifecycle=true" >> "$GITHUB_OUTPUT"
            echo "authored_stack_lifecycle_reason=non_pr_event_fail_closed" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"schema":"chaptera.pub-editor-pr-fanout.v1","authored_stack_lifecycle":true,"authored_stack_lifecycle_reason":"non_pr_event_fail_closed"}' > target/pub-editor-pr-fanout/receipt.json
            exit 0
          fi
          python tools/ci/pub_editor_pr_fanout.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --receipt target/pub-editor-pr-fanout/receipt.json \
            --github-output "$GITHUB_OUTPUT"
          if ! grep -q '^authored_stack_lifecycle=' "$GITHUB_OUTPUT"; then
            echo "authored_stack_lifecycle=true" >> "$GITHUB_OUTPUT"
            echo "authored_stack_lifecycle_reason=base_classifier_missing_authored_stack_lifecycle_output" >> "$GITHUB_OUTPUT"
            python -c 'import json, pathlib; p=pathlib.Path("target/pub-editor-pr-fanout/receipt.json"); d=json.loads(p.read_text()); d["authored_stack_lifecycle"]=True; d["authored_stack_lifecycle_reason"]="base_classifier_missing_authored_stack_lifecycle_output"; p.write_text(json.dumps(d, indent=2, sort_keys=True) + "\n")'
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pub-editor-authored-stack-lifecycle-scope-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/pub-editor-pr-fanout/receipt.json
          if-no-files-found: warn

  lifecycle:
    needs: classify
    if: ${{ !cancelled() && always() && (needs.classify.result != 'success' || needs.classify.outputs.authored_stack_lifecycle == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Check pub-editor formatting
        run: cargo fmt --manifest-path vendor/producer-a/Cargo.toml -p pub-editor -- --check

      - name: Check pub-editor
        run: cargo check --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --all-targets

      - name: Lint pub-editor
        run: cargo clippy --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --all-targets -- -D warnings

      - name: Prove AuthoredStack lifecycle contract
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor-authoring-core --test authored_stack_lifecycle_v1

      - name: Re-run CreateShape and DeleteNode runtimes
        run: >-
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor
          --test create_shape_runtime_v1
          --test delete_node_runtime_v1
