name: Publisher visual golden Batch 01

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "apps/cloud-reader/**"
      - "apps/chaptera-server/src/reader_scene_v1.rs"
      - "apps/chaptera-server/src/guest_reader_worker.rs"
      - "crates/chaptera-viewer-render-plan/**"
      - "vendor/producer-a/crates/pub-viewer/**"
      - "vendor/producer-a/crates/pub-reader/**"
      - "vendor/producer-a/crates/pub-quill/**"
      - "tools/publisher_visual_perceptual_v1.py"
      - "tools/test_publisher_visual_perceptual_v1.py"
      - "tools/corpus/receipts/publisher-visual-golden-batch-01-pairs.csv"
      - "tools/corpus/receipts/publisher-visual-golden-batch-01-perceptual-v1.json"
      - "tools/corpus/receipts/publisher-visual-golden-batch-01-ci-admission.json"
      - ".github/workflows/publisher-visual-golden-batch01.yml"

permissions:
  contents: read
  actions: read

concurrency:
  group: publisher-visual-golden-batch01-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/publisher-visual-batch01

jobs:
  visual-golden:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact visual fingerprint dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir \
            "Pillow==11.3.0" "numpy==2.3.3" "olefile==0.47"

      - name: Validate source-free perceptual oracle tooling
        run: |
          set -euo pipefail
          python -m py_compile tools/publisher_visual_perceptual_v1.py
          PYTHONPATH=tools python tools/test_publisher_visual_perceptual_v1.py
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path("tools/corpus/receipts/publisher-visual-golden-batch-01-perceptual-v1.json")
          data=json.loads(p.read_text())
          assert data["schema"]=="chaptera.publisher-visual-perceptual-oracle.v1"
          assert data["pair_count"]==55
          assert data["reference_page_count"]==162
          assert data["claims"]["source_free"] is True
          admission_path=Path("tools/corpus/receipts/publisher-visual-golden-batch-01-ci-admission.json")
          admission=json.loads(admission_path.read_text())
          assert admission["schema"]=="chaptera.publisher-visual-golden-ci-admission.v1"
          assert admission["selected_pair_count"]==55
          assert admission["admitted_pair_count"]==53
          assert admission["admitted_reference_page_count"]==150
          assert {row["oracle_id"] for row in admission["excluded"]}=={"batch01-024","batch01-025"}
          print("reference_sha256", hashlib.sha256(p.read_bytes()).hexdigest())
          print("admission_sha256", hashlib.sha256(admission_path.read_bytes()).hexdigest())
          PY

      - name: Download pinned exact 1050 materialization
        id: pinned-1050
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Adopt pinned exact 1050 materialization
        if: steps.pinned-1050.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf out/materialized
          cp -a out/pinned1050/materialized out/materialized

      - name: Checkout 625-file donor for reconstruction fallback
        if: steps.pinned-1050.outcome != 'success'
        uses: actions/checkout@v5
        with:
          repository: Lalalalendia/lalamu
          ref: main
          path: corpus-donor
          sparse-checkout: |
            pub-corpus/corpus
          sparse-checkout-cone-mode: true

      - name: Install archive fallback tools
        if: steps.pinned-1050.outcome != 'success'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full

      - name: Restore exact historical 425-SHA tranche
        if: steps.pinned-1050.outcome != 'success'
        id: historical-425-cache
        uses: actions/cache/restore@v4
        with:
          path: out/container
          key: reader-historical-425-b844102681a9f4458aa9e723843d645e5aae6e6b8bd0b70d631e7ae0be9bc8ef-v1

      - name: Rehydrate exact historical 425-SHA tranche
        if: steps.pinned-1050.outcome != 'success' && steps.historical-425-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p out/container/pub
          python tools/corpus/pub_container_extract.py \
            --seed tools/corpus/materialization_container_first_wave.csv \
            --out out/container/manifest.json \
            --materialize-dir out/container/pub \
            --max-containers 3 \
            --max-container-bytes 200000000 \
            --max-member-bytes 104857600 \
            --max-total-expanded 1073741824 \
            --max-members 600 \
            --max-depth 2 \
            --timeout 45 \
            --command-timeout 90

      - name: Verify historical 425-SHA fallback
        if: steps.pinned-1050.outcome != 'success'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths=sorted(Path("out/container/pub").glob("*.pub"))
          shas=[p.stem.casefold() for p in paths]
          digest=hashlib.sha256("".join(x+"\n" for x in shas).encode("ascii")).hexdigest()
          summary=json.loads(Path("out/container/manifest.summary.json").read_text())
          assert summary["errors"]==0, summary
          assert len(shas)==425, len(shas)
          assert digest=="b844102681a9f4458aa9e723843d645e5aae6e6b8bd0b70d631e7ae0be9bc8ef", digest
          PY

      - name: Save historical fallback cache
        if: steps.pinned-1050.outcome != 'success' && steps.historical-425-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/container
          key: reader-historical-425-b844102681a9f4458aa9e723843d645e5aae6e6b8bd0b70d631e7ae0be9bc8ef-v1

      - name: Reconstruct exact 1050 corpus if pinned artifact expired
        if: steps.pinned-1050.outcome != 'success'
        run: |
          set -euo pipefail
          python tools/corpus/materialize_corpus_1000.py \
            --input lalamu_625=corpus-donor/pub-corpus/corpus \
            --input historical_container_first_wave=out/container/pub \
            --authority tools/corpus/receipts/current-rar-1556.sha256.txt \
            --out out/materialized \
            --min-count 1050

      - name: Verify exact 1050 identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          paths=sorted(Path("out/materialized/native").glob("*.pub"))
          shas=[p.stem.casefold() for p in paths]
          digest=hashlib.sha256("".join(x+"\n" for x in shas).encode("ascii")).hexdigest()
          assert len(shas)==1050, len(shas)
          assert len(set(shas))==1050
          assert digest=="21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43", digest
          PY

      - name: Build exact 53-fixture CI manifest from committed pair registry
        run: |
          set -euo pipefail
          mkdir -p out/publisher-visual-batch01
          python - <<'PY'
          import csv, hashlib, json
          from pathlib import Path

          pairs=Path("tools/corpus/receipts/publisher-visual-golden-batch-01-pairs.csv")
          rows=list(csv.DictReader(pairs.open(newline="", encoding="utf-8-sig")))
          assert len(rows)==55, len(rows)
          admission=json.loads(Path("tools/corpus/receipts/publisher-visual-golden-batch-01-ci-admission.json").read_text())
          excluded={row["oracle_id"] for row in admission["excluded"]}
          assert excluded=={"batch01-024","batch01-025"}, excluded
          fixtures=[]
          for row in rows:
              if row["oracle_id"] in excluded:
                  continue
              sha=row["pub_sha256"].strip().lower()
              path=Path("out/materialized/native") / f"{sha}.pub"
              assert path.is_file(), (row["oracle_id"], path)
              assert path.stat().st_size==int(row["pub_bytes"]), (row["oracle_id"], path.stat().st_size)
              h=hashlib.sha256(path.read_bytes()).hexdigest()
              assert h==sha, (row["oracle_id"], h, sha)
              fixtures.append({
                  "name": row["basename"],
                  "sha256": sha,
                  "bytes": int(row["pub_bytes"]),
                  "require_render": False,
                  "require_shared_text": False,
                  "source_path": str(path.resolve()),
              })
          assert len(fixtures)==53, len(fixtures)
          assert sum(int(row["pdf_pages"]) for row in rows if row["oracle_id"] not in excluded)==150
          manifest={"schema":"chaptera.cloud-reader-real-fixtures.v1","fixtures":fixtures}
          Path("out/publisher-visual-batch01/fixtures.json").write_text(json.dumps(manifest,indent=2,sort_keys=True)+"\n")
          print("fixtures", len(fixtures))
          PY

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Build Cloud reference Cargo cache key
        id: cargo-key
        shell: bash
        env:
          MANIFEST_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'apps/chaptera-server/Cargo.toml', 'crates/**/Cargo.toml', 'vendor/producer-a/Cargo.toml', 'vendor/producer-a/Cargo.lock', 'vendor/producer-a/crates/**/Cargo.toml') }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST_HASH"
          echo "key=publisher-visual-batch01-v1-${RUNNER_OS}-rust-1.94.1-${MANIFEST_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore/save Cloud build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/publisher-visual-batch01
          key: ${{ steps.cargo-key.outputs.key }}

      - name: Build canonical guest Scene producer
        run: cargo build -p chaptera-server --bin chaptera --jobs 2

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore/save pinned Chromium cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: publisher-visual-batch01-playwright-v1-${{ runner.os }}-1.55.0-chromium

      - name: Install pinned browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render 53 admitted Publisher-oracle PUBs through Cloud Reader
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.sha }}
          READER_WORKER_BINARY: ${{ github.workspace }}/target/publisher-visual-batch01/debug/chaptera
          READER_REAL_MANIFEST: ${{ github.workspace }}/out/publisher-visual-batch01/fixtures.json
          READER_REAL_OUTPUT: ${{ github.workspace }}/out/publisher-visual-batch01/render
          READER_REFERENCE_RASTER_DPI: "144"
        run: node apps/cloud-reader/real-browser.test.mjs

      - name: Compare all rendered pages with source-free Publisher oracle
        run: |
          set -euo pipefail
          python tools/publisher_visual_perceptual_v1.py \
            out/publisher-visual-batch01/render/receipt.json \
            tools/corpus/receipts/publisher-visual-golden-batch-01-perceptual-v1.json \
            out/publisher-visual-batch01/comparison.json \
            --admission tools/corpus/receipts/publisher-visual-golden-batch-01-ci-admission.json

      - name: Publish compact visual summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("out/publisher-visual-batch01/comparison.json").read_text())
          summary={
              "schema":"chaptera.publisher-visual-golden-batch01-summary.v1",
              "repository_commit_sha":r["repository_commit_sha"],
              "pair_count":r["pair_count"],
              "admitted_pair_count":r["admitted_pair_count"],
              "excluded_pair_count":r["excluded_pair_count"],
              "reference_page_count":r["reference_page_count"],
              "admitted_reference_page_count":r["admitted_reference_page_count"],
              "compared_page_count":r["compared_page_count"],
              "unsupported_pair_count":r["unsupported_pair_count"],
              "page_count_mismatch_pair_count":r["page_count_mismatch_pair_count"],
              "physical_size_mismatch_page_count":r["physical_size_mismatch_page_count"],
              "mean_score":r["mean_score"],
              "max_score":r["max_score"],
              "top20":r["ranking"][:20],
              "claims":r["claims"],
          }
          Path("out/publisher-visual-batch01/summary.json").write_text(json.dumps(summary,indent=2,sort_keys=True)+"\n")
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - name: Upload source-free Batch 01 visual receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-visual-golden-batch01-${{ github.run_id }}
          path: |
            out/publisher-visual-batch01/comparison.json
            out/publisher-visual-batch01/summary.json
            out/publisher-visual-batch01/fixtures.json
            out/publisher-visual-batch01/render/receipt.json
          if-no-files-found: error
          retention-days: 90

      - name: Upload short-lived candidate rasters
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-visual-golden-batch01-rasters-${{ github.run_id }}
          path: out/publisher-visual-batch01/render/*-page-*.png
          if-no-files-found: warn
          retention-days: 1
          compression-level: 0
