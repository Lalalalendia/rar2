name: Publisher visual golden Batch 01

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publisher-visual-golden-batch01.yml"
      - "tools/cloud_reader_visual_fingerprint_v1.py"
      - "tools/cloud_reader_page_membership_gate_v1.py"
      - "tools/corpus/receipts/publisher-visual-page-membership-authority-v1.json"
      - "tools/corpus/receipts/publisher-visual-golden-batch-01-fingerprint-v1.json"
      - "tools/corpus/receipts/publisher-visual-golden-batch-01-pairs.csv"
      - "tools/corpus/receipts/publisher-visual-golden-batch-01-borderart-v1.json"
      - "apps/cloud-reader/**"
      - "apps/chaptera-server/src/reader_scene_v1.rs"
      - "apps/chaptera-server/src/guest_reader_worker.rs"
      - "crates/chaptera-viewer-render-plan/**"
      - "vendor/producer-a/crates/pub-viewer/**"
      - "vendor/producer-a/crates/pub-reader/src/lib.rs"
      - "vendor/producer-a/crates/pub-reader/src/page_projection.rs"
      - "vendor/producer-a/crates/pub-reader/src/source_paint_order.rs"
      - "vendor/producer-a/crates/pub-reader/src/story_materialization.rs"
      - "vendor/producer-a/crates/pub-reader/src/quill_admission.rs"
      - "vendor/producer-a/crates/pub-reader/src/publication_document.rs"
      - "vendor/producer-a/crates/pub-reader/src/node_materialization.rs"

permissions:
  contents: read
  actions: read

concurrency:
  group: publisher-visual-golden-batch01-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/publisher-visual-batch01-rust

jobs:
  visual-fingerprint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact rar2 candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      # Warm-cache measurement control: Cargo manifests intentionally unchanged.
      - name: Build Batch01 Cargo cache key
        id: batch01-cargo-cache-key
        shell: bash
        env:
          MANIFEST_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'apps/chaptera-server/Cargo.toml', 'crates/**/Cargo.toml', 'vendor/producer-a/Cargo.toml', 'vendor/producer-a/Cargo.lock', 'vendor/producer-a/crates/**/Cargo.toml') }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST_HASH"
          echo "key=publisher-visual-batch01-rust-v1-${RUNNER_OS}-rust-1.94.1-${MANIFEST_HASH}" >> "$GITHUB_OUTPUT"

      # PRs restore trusted-main Cargo artifacts; no implicit post-job save.
      - name: Restore Batch01 Cargo build cache
        id: batch01-cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/publisher-visual-batch01-rust
          key: ${{ steps.batch01-cargo-cache-key.outputs.key }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download pinned exact 1050 materialization
        id: pinned-1050
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Verify pinned exact 1050 materialization
        if: steps.pinned-1050.outcome == 'success'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = sorted(Path("out/pinned1050/materialized/native").glob("*.pub"))
          shas = [path.stem.casefold() for path in paths]
          digest = hashlib.sha256("".join(sha + "\n" for sha in shas).encode("ascii")).hexdigest()
          assert len(shas) == 1050, len(shas)
          assert digest == "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43", digest
          print("pinned 1050 verified:", digest)
          PY

      - name: Checkout pinned natural corpus donor
        if: steps.pinned-1050.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: f78cc6f455f4dc222868f9cc035511a6ca7a91ea
          path: corpus-donor
          sparse-checkout: |
            pub-corpus/corpus
          sparse-checkout-cone-mode: true

      - name: Restore exact historical 425-SHA tranche
        if: steps.pinned-1050.outcome != 'success'
        id: historical-425-cache
        uses: actions/cache/restore@v4
        with:
          path: out/container
          key: reader-historical-425-b844102681a9f4458aa9e723843d645e5aae6e6b8bd0b70d631e7ae0be9bc8ef-v1

      - name: Install historical reconstruction tools on cache miss
        if: steps.pinned-1050.outcome != 'success' && steps.historical-425-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full
          python -m pip install --disable-pip-version-check olefile==0.47

      - name: Rehydrate exact historical 425-SHA tranche on cache miss
        if: steps.pinned-1050.outcome != 'success' && steps.historical-425-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p out/container/pub
          python tools/corpus/pub_container_extract.py \
            --seed tools/corpus/materialization_container_first_wave.csv \
            --out out/container/manifest.json \
            --materialize-dir out/container/pub \
            --max-containers 3 \
            --max-container-bytes 200000000 \
            --max-member-bytes 104857600 \
            --max-total-expanded 1073741824 \
            --max-members 600 \
            --max-depth 2 \
            --timeout 45 \
            --command-timeout 90

      - name: Verify exact historical 425-SHA tranche
        if: steps.pinned-1050.outcome != 'success'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          expected_count = 425
          expected_digest = "b844102681a9f4458aa9e723843d645e5aae6e6b8bd0b70d631e7ae0be9bc8ef"
          paths = sorted(Path("out/container/pub").glob("*.pub"))
          shas = [path.stem.casefold() for path in paths]
          digest = hashlib.sha256("".join(sha + "\n" for sha in shas).encode("ascii")).hexdigest()
          assert len(shas) == expected_count, len(shas)
          assert digest == expected_digest, (digest, expected_digest)
          print(f"historical-425 verified: {digest}")
          PY

      - name: Save exact historical 425-SHA tranche
        if: steps.pinned-1050.outcome != 'success' && steps.historical-425-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/container
          key: reader-historical-425-b844102681a9f4458aa9e723843d645e5aae6e6b8bd0b70d631e7ae0be9bc8ef-v1

      - name: Install visual fingerprint dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "Pillow==12.3.0"
          python -m py_compile tools/cloud_reader_visual_fingerprint_v1.py
          python -m py_compile tools/cloud_reader_page_membership_gate_v1.py
          python tools/cloud_reader_page_membership_gate_v1.py --self-test
          python - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path("tools/corpus/receipts/publisher-visual-golden-batch-01-fingerprint-v1.json")
          digest = hashlib.sha256(p.read_bytes()).hexdigest()
          assert digest == "c522ebdc72d0b62ef68be3747494c2f5178ff69a70b83f14b3fd6a9bf8128404", digest
          print("reference fingerprint:", digest)
          PY

      - name: Prepare exact 55 source PUB fixtures
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/publisher-visual-batch01"
          mkdir -p "$RUNNER_TEMP/publisher-visual-batch01"
          if [ "${{ steps.pinned-1050.outcome }}" = "success" ]; then
            natural_root="out/pinned1050/materialized/native"
            historical_root="$RUNNER_TEMP/no-second-source-root"
          else
            natural_root="corpus-donor/pub-corpus/corpus"
            historical_root="out/container/pub"
          fi
          python tools/cloud_reader_visual_fingerprint_v1.py prepare \
            tools/corpus/receipts/publisher-visual-golden-batch-01-pairs.csv \
            "$natural_root" \
            "$historical_root" \
            "$RUNNER_TEMP/publisher-visual-batch01/fixtures" \
            "$RUNNER_TEMP/publisher-visual-batch01/manifest.json"

      - name: Build canonical Cloud Reader worker
        env:
          BATCH01_CARGO_CACHE_HIT: ${{ steps.batch01-cargo-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo build -p chaptera-server --bin chaptera --jobs 2
          elapsed="$(($(date +%s) - start))"
          echo "batch01_cargo_cache_hit=${BATCH01_CARGO_CACHE_HIT:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "batch01_cargo_build_seconds=$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore pinned Playwright Chromium cache
        id: playwright-chromium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: publisher-visual-batch01-${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install pinned browser acceptance runtime
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-chromium-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node -e 'const { chromium } = require("playwright"); (async()=>{const b=await chromium.launch({headless:true}); const p=await b.newPage(); await p.setContent("<title>chaptera-playwright-smoke</title>"); if((await p.title())!=="chaptera-playwright-smoke") throw new Error("smoke title mismatch"); await b.close();})().catch(e=>{console.error(e);process.exit(1)})'
          elapsed="$(($(date +%s) - start))"
          echo "playwright_cache_hit=${PLAYWRIGHT_CACHE_HIT:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "playwright_setup_seconds=$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Render exact Batch 01 PUB set through current Cloud Reader
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.sha }}
          READER_WORKER_BINARY: ${{ github.workspace }}/target/publisher-visual-batch01-rust/debug/chaptera
          READER_REAL_MANIFEST: ${{ runner.temp }}/publisher-visual-batch01/manifest.json
          READER_REAL_OUTPUT: ${{ runner.temp }}/publisher-visual-batch01/browser
          READER_REFERENCE_RASTER_DPI: "144"
          READER_CONTINUE_WORKER_FAILURES: "1"
          READER_WORKER_TIMEOUT_SECONDS: "120"
          READER_WORKER_CPU_SECONDS: "90"
          READER_WORKER_ADDRESS_SPACE_MB: "768"
        run: node apps/cloud-reader/real-browser.test.mjs

      - name: Compare 55 pairs against source-free Publisher fingerprints
        run: |
          set -euo pipefail
          mkdir -p target/publisher-visual-batch01
          python tools/cloud_reader_visual_fingerprint_v1.py compare \
            "$RUNNER_TEMP/publisher-visual-batch01/browser/receipt.json" \
            tools/corpus/receipts/publisher-visual-golden-batch-01-fingerprint-v1.json \
            target/publisher-visual-batch01/summary.json

      - name: Build real-PUB BorderArt visual subset receipt
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          overlap_path = Path("tools/corpus/receipts/publisher-visual-golden-batch-01-borderart-v1.json")
          summary_path = Path("target/publisher-visual-batch01/summary.json")
          overlap = json.loads(overlap_path.read_text())
          summary = json.loads(summary_path.read_text())

          assert overlap["schema"] == "chaptera.publisher-visual-golden-borderart-overlap.v1"
          assert overlap["borderart_pair_count"] == 6
          assert len(overlap["pairs"]) == 6
          assert sum(row["nonstretch_marker_count"] > 0 for row in overlap["pairs"]) == 2
          assert sum(row["default_stretch_use_count"] > 0 for row in overlap["pairs"]) == 5

          current_by_fixture = {row["fixture"]: row for row in summary["pairs"]}
          rows = []
          historically_rendered = 0
          still_rendered = 0
          for authority in overlap["pairs"]:
              fixture = authority["fixture"]
              assert fixture in current_by_fixture, fixture
              current = current_by_fixture[fixture]
              if authority["baseline"]["rendered"]:
                  historically_rendered += 1
                  assert current["rendered"], f"previously renderable BorderArt pair regressed to unsupported: {fixture}"
                  still_rendered += 1
              rows.append({
                  "oracle_id": authority["oracle_id"],
                  "fixture": fixture,
                  "pub_sha256": authority["pub_sha256"],
                  "stretch_modes_present": authority["stretch_modes_present"],
                  "fbid_use_count": authority["fbid_use_count"],
                  "nonstretch_marker_count": authority["nonstretch_marker_count"],
                  "baseline": authority["baseline"],
                  "current": current,
                  "mean_changed_cell_fraction_delta": (
                      None
                      if authority["baseline"]["mean_changed_cell_fraction"] is None
                      or current["mean_changed_cell_fraction"] is None
                      else current["mean_changed_cell_fraction"]
                          - authority["baseline"]["mean_changed_cell_fraction"]
                  ),
              })

          assert historically_rendered == 4
          assert still_rendered == 4
          receipt = {
              "schema": "chaptera.publisher-visual-golden-borderart-subset.v1",
              "repository_commit_sha": summary["repository_commit_sha"],
              "publisher_reference_pair_count": len(rows),
              "historically_rendered_pair_count": historically_rendered,
              "current_rendered_pair_count": sum(row["current"]["rendered"] for row in rows),
              "repeat_nonstretch_reference_pair_count": sum(
                  "repeat_nonstretch" in row["stretch_modes_present"] for row in rows
              ),
              "stretch_default_reference_pair_count": sum(
                  "stretch_default" in row["stretch_modes_present"] for row in rows
              ),
              "pairs": rows,
          }
          out = Path("target/publisher-visual-batch01/borderart-subset.json")
          out.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps({
              "publisher_reference_pair_count": receipt["publisher_reference_pair_count"],
              "current_rendered_pair_count": receipt["current_rendered_pair_count"],
              "repeat_nonstretch_reference_pair_count": receipt["repeat_nonstretch_reference_pair_count"],
              "stretch_default_reference_pair_count": receipt["stretch_default_reference_pair_count"],
              "pairs": [
                  {
                      "fixture": row["fixture"],
                      "stretch_modes_present": row["stretch_modes_present"],
                      "rendered": row["current"]["rendered"],
                      "mean_changed_cell_fraction": row["current"]["mean_changed_cell_fraction"],
                      "delta": row["mean_changed_cell_fraction_delta"],
                  }
                  for row in rows
              ],
          }, indent=2, sort_keys=True))
          PY

      - name: Compare with previous successful main baseline
        id: baseline-delta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/publisher-visual-baseline"
          baseline_run="$(
            gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/publisher-visual-golden-batch01.yml/runs?branch=main&status=success&per_page=20" \
              --jq '.workflow_runs | map(select(.id != ('"${GITHUB_RUN_ID}"' | tonumber))) | .[0].id // empty'
          )"
          if [ -z "$baseline_run" ]; then
            echo "No previous successful main Batch 01 run; current receipt becomes the first baseline."
            echo "baseline_found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Downloading baseline run $baseline_run"
          gh run download "$baseline_run" \
            -n publisher-visual-golden-batch01-receipt \
            -D "$RUNNER_TEMP/publisher-visual-baseline"
          test -f "$RUNNER_TEMP/publisher-visual-baseline/summary.json"
          python tools/cloud_reader_visual_fingerprint_v1.py delta \
            target/publisher-visual-batch01/summary.json \
            "$RUNNER_TEMP/publisher-visual-baseline/summary.json" \
            target/publisher-visual-batch01/delta.json
          echo "baseline_found=true" >> "$GITHUB_OUTPUT"
          echo "baseline_run_id=$baseline_run" >> "$GITHUB_OUTPUT"

      - name: Enforce stage-aware exact PAGE membership authority
        if: steps.baseline-delta.outputs.baseline_found == 'true'
        run: |
          set -euo pipefail
          python tools/cloud_reader_page_membership_gate_v1.py \
            --current target/publisher-visual-batch01/summary.json \
            --baseline "$RUNNER_TEMP/publisher-visual-baseline/summary.json" \
            --authority tools/corpus/receipts/publisher-visual-page-membership-authority-v1.json \
            --out target/publisher-visual-batch01/membership-gate.json

      - name: Print top residuals
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("target/publisher-visual-batch01/summary.json").read_text())
          print(json.dumps({
              "pair_count": data["pair_count"],
              "reference_page_count": data["reference_page_count"],
              "compared_page_count": data["compared_page_count"],
              "unsupported_pair_count": data["unsupported_pair_count"],
              "page_count_mismatch_pair_count": data["page_count_mismatch_pair_count"],
              "reference_surface_stage_counts": data["reference_surface_stage_counts"],
              "corpus_mean_changed_cell_fraction": data["corpus_mean_changed_cell_fraction"],
              "worst_pages": data["worst_pages"][:10],
          }, indent=2, sort_keys=True))
          delta_path = Path("target/publisher-visual-batch01/delta.json")
          if delta_path.is_file():
              delta = json.loads(delta_path.read_text())
              print("DELTA")
              print(json.dumps({
                  "baseline_repository_commit_sha": delta["baseline_repository_commit_sha"],
                  "stable_identity_page_count": delta["stable_identity_page_count"],
                  "remapped_page_count": delta["remapped_page_count"],
                  "identity_unknown_page_count": delta["identity_unknown_page_count"],
                  "page_identity_remaps": delta["page_identity_remaps"][:10],
                  "reference_surface_stage_counts": delta["reference_surface_stage_counts"],
                  "improved_page_count": delta["improved_page_count"],
                  "regressed_page_count": delta["regressed_page_count"],
                  "unchanged_page_count": delta["unchanged_page_count"],
                  "mean_delta": delta["corpus_mean_changed_cell_fraction"]["delta"],
                  "largest_regressions": delta["largest_regressions"][:10],
                  "largest_improvements": delta["largest_improvements"][:10],
              }, indent=2, sort_keys=True))
          PY

      # Seed a reusable cache only from a passing trusted-main visual run.
      # The PR path has no Cargo save action, independent of cache-mode reporting.
      - name: Save trusted main Batch01 Cargo cache
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.batch01-cargo-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/publisher-visual-batch01-rust
          key: ${{ steps.batch01-cargo-cache-key.outputs.key }}

      - name: Upload source-free Batch 01 visual receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-visual-golden-batch01-receipt
          path: |
            target/publisher-visual-batch01/summary.json
            target/publisher-visual-batch01/delta.json
            target/publisher-visual-batch01/membership-gate.json
            target/publisher-visual-batch01/borderart-subset.json
          if-no-files-found: warn
          retention-days: 90
