name: Text Format Property Base Validation

on:
  pull_request:
    paths:
      - ".github/workflows/text-format-property-base-validation.yml"

permissions:
  contents: read

jobs:
  property-base:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Check pub-editor formatting
        run: cargo fmt --manifest-path vendor/producer-a/Cargo.toml -p pub-editor -- --check

      - name: Execute property-scoped text-format unit tests
        run: >-
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor
          text_format_property_base_v1 --lib -- --nocapture
