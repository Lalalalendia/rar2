name: Quill exact FDPP Story acceptance

on:
  pull_request:
    paths:
      - ".github/workflows/quill-story-fdpp-exact.yml"
      - "vendor/producer-a/crates/pub-quill/src/**"
      - "vendor/producer-a/crates/pub-reader/src/**"
      - "!vendor/producer-a/crates/pub-reader/src/bin/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quill-story-fdpp-exact-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target

jobs:
  exact-three:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact seven hash-addressed witnesses only
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: f78cc6f455f4dc222868f9cc035511a6ca7a91ea
          path: _witness/lalamu
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            pub-corpus/corpus/native/unclassified/211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157.pub
            pub-corpus/corpus/native/unclassified/6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a.pub
            pub-corpus/corpus/native/unclassified/9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569.pub
            pub-corpus/corpus/native/unclassified/9d6a7f3638c49e043795416545e7f2305498dcfecd064cfa9ada03e27167e966.pub
            pub-corpus/corpus/native/unclassified/b171668d889a4e30cc8c7838a88f406017d67c722bf059965b1dfcfb9876d055.pub
            pub-corpus/corpus/native/unclassified/bc28f3ced90b0c9452bda1bd5bdaf2d841feb1d44bd7e84749a13ff2072e20f2.pub
            pub-corpus/corpus/native/unclassified/ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff.pub

      - name: Verify exact witness identities
        shell: bash
        run: |
          set -euo pipefail
          root="_witness/lalamu/pub-corpus/corpus/native/unclassified"
          test "$(find "$root" -maxdepth 1 -type f -name '*.pub' | wc -l)" -eq 7
          for path in "$root"/*.pub; do
            sha="$(basename "$path" .pub)"
            echo "${sha}  ${path}" | sha256sum -c -
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Restore Reader Cargo build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rar2-target
          key: reader-fdpp-exact-v1-${{ runner.os }}-rust-1.94.1-${{ hashFiles('vendor/producer-a/Cargo.toml', 'vendor/producer-a/Cargo.lock', 'vendor/producer-a/crates/**/Cargo.toml') }}
          restore-keys: |
            reader-tier-a-v2-${{ runner.os }}-rust-1.94.1-
            reader-1050-release-v1-${{ runner.os }}-rust-1.94.1-

      - name: Build exact FDPP acceptance receipt
        run: |
          set -euo pipefail
          cargo build             --manifest-path vendor/producer-a/Cargo.toml             -p pub-reader             --bin fdpp_exact_story_receipt

      - name: Run exact-gate positive and superset-negative Reader acceptance
        shell: bash
        run: |
          set -euo pipefail
          root="_witness/lalamu/pub-corpus/corpus/native/unclassified"
          bin="${CARGO_TARGET_DIR}/debug/fdpp_exact_story_receipt"
          "$bin" "$root/9d6a7f3638c49e043795416545e7f2305498dcfecd064cfa9ada03e27167e966.pub" 6
          "$bin" "$root/b171668d889a4e30cc8c7838a88f406017d67c722bf059965b1dfcfb9876d055.pub" 10
          "$bin" "$root/bc28f3ced90b0c9452bda1bd5bdaf2d841feb1d44bd7e84749a13ff2072e20f2.pub" 4
          "$bin" "$root/211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157.pub" --reject
          "$bin" "$root/6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a.pub" --reject
          "$bin" "$root/9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569.pub" --reject
          "$bin" "$root/ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff.pub" --reject
