name: Reader 1050 hosted frontier

on:
  pull_request:
    paths:
      - ".github/workflows/reader1050-hosted-frontier.yml"
      - "tools/research-runner/reader1050_frontier.py"
      - "tools/research-runner/reader1050_offline_discriminator.py"
      - "vendor/producer-a/crates/pub-reader/data/reader-evidence-registry.json"
      - "vendor/producer-a/crates/pub-reader/src/salvage.rs"
      - "vendor/producer-a/crates/pub-reader/src/salvage_authority.rs"
      - "vendor/producer-a/crates/pub-viewer/src/bin/corpus-reader-salvage-acceptance.rs"
      - "tools/research-runner/reader1050-research-ledger.json"
      - "tools/research-runner/tests/test_reader1050_frontier.py"
      - "tools/research-runner/tests/test_reader1050_offline_discriminator.py"
      - "tools/corpus/cfb_physical.py"
      - "tools/corpus/cfb_physical_diff.py"
  workflow_run:
    workflows:
      - Reader 1050 corpus baseline
    types:
      - completed
  workflow_dispatch:
    inputs:
      reader_run_id:
        description: Successful Reader-1050 workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: reader-1050-hosted-frontier-${{ github.event.pull_request.number || github.event.workflow_run.id || inputs.reader_run_id || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Install pinned discriminator dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir olefile==0.47

      - name: Validate bounded frontier and discriminator
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/research-runner/reader1050_frontier.py \
            tools/research-runner/reader1050_offline_discriminator.py
          python -m unittest \
            tools/research-runner/tests/test_reader1050_frontier.py \
            tools/research-runner/tests/test_reader1050_offline_discriminator.py

      - name: Validate Reader salvage authority product seam
        run: |
          set -euo pipefail
          cargo test \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --lib \
            salvage_authority::tests
          cargo test \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --lib \
            salvage::tests
          cargo test \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-viewer \
            --bin corpus-reader-salvage-acceptance

  frontier:
    needs: validate
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      READER_RUN_ID: ${{ github.event.workflow_run.id || inputs.reader_run_id }}
      READER_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned discriminator dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir olefile==0.47

      - name: Download exact Reader-1050 receipt
        uses: actions/download-artifact@v4
        with:
          name: reader-1050-corpus-baseline-${{ env.READER_RUN_ID }}
          path: input/reader
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: ${{ env.READER_RUN_ID }}

      - name: Download pinned exact 1050 corpus materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: input/corpus
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Select one bounded unsupported frontier
        run: |
          set -euo pipefail
          python tools/research-runner/reader1050_frontier.py \
            --reader-root input/reader \
            --corpus-root input/corpus \
            --out out/reader1050-frontier \
            --source-run-id "$READER_RUN_ID" \
            --source-sha "$READER_SOURCE_SHA" \
            --evidence-registry vendor/producer-a/crates/pub-reader/data/reader-evidence-registry.json \
            --research-ledger tools/research-runner/reader1050-research-ledger.json

          cat out/reader1050-frontier/frontier.md >> "$GITHUB_STEP_SUMMARY"

      - name: Execute one bounded offline discriminator
        run: |
          set -euo pipefail
          python tools/research-runner/reader1050_offline_discriminator.py \
            --reader-root input/reader \
            --frontier out/reader1050-frontier/frontier.json \
            --corpus-root input/corpus \
            --out out/reader1050-discriminator

          cat out/reader1050-discriminator/decision.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guard source-free artifact boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          cfb_signature = b"\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1"
          for path in list(Path("out/reader1050-frontier").rglob("*")) + list(Path("out/reader1050-discriminator").rglob("*")):
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if cfb_signature in data:
                  raise SystemExit(
                      f"raw CFB signature leaked into source-free frontier artifact: {path}"
                  )
              if path.suffix.lower() == ".pub":
                  raise SystemExit(
                      f"PUB bytes leaked into source-free frontier artifact: {path}"
                  )
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: reader1050-hosted-frontier-${{ env.READER_RUN_ID }}
          path: out/reader1050-frontier/**
          if-no-files-found: error
          retention-days: 30

      - uses: actions/upload-artifact@v4
        with:
          name: reader1050-offline-discriminator-${{ env.READER_RUN_ID }}
          path: out/reader1050-discriminator/**
          if-no-files-found: error
          retention-days: 30
