name: Reader 1050 hosted frontier

on:
  workflow_run:
    workflows:
      - Reader 1050 corpus baseline
    types:
      - completed
  workflow_dispatch:
    inputs:
      reader_run_id:
        description: Successful Reader-1050 workflow run ID
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: reader-1050-hosted-frontier-${{ github.event.workflow_run.id || inputs.reader_run_id || github.run_id }}
  cancel-in-progress: false

jobs:
  frontier:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.head_branch == 'main'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      READER_RUN_ID: ${{ github.event.workflow_run.id || inputs.reader_run_id }}
      READER_SOURCE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate frontier tooling
        run: |
          set -euo pipefail
          python -m py_compile tools/research-runner/reader1050_frontier.py
          python -m unittest tools/research-runner/tests/test_reader1050_frontier.py

      - name: Download exact Reader-1050 receipt
        uses: actions/download-artifact@v4
        with:
          name: reader-1050-corpus-baseline-${{ env.READER_RUN_ID }}
          path: input/reader
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: ${{ env.READER_RUN_ID }}

      - name: Download pinned exact 1050 corpus materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: input/corpus
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Select one bounded unsupported frontier
        run: |
          set -euo pipefail
          python tools/research-runner/reader1050_frontier.py \
            --reader-root input/reader \
            --corpus-root input/corpus \
            --out out/reader1050-frontier \
            --source-run-id "$READER_RUN_ID" \
            --source-sha "$READER_SOURCE_SHA"

          cat out/reader1050-frontier/frontier.md >> "$GITHUB_STEP_SUMMARY"

      - name: Guard source-free artifact boundary
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          forbidden = (b"\xd0\xcf\x11\xe0\xa1\xb1\x1a\xe1",)
          for path in Path("out/reader1050-frontier").rglob("*"):
              if not path.is_file():
                  continue
              data = path.read_bytes()
              if any(sig in data for sig in forbidden):
                  raise SystemExit(f"raw CFB signature leaked into source-free frontier artifact: {path}")
              if path.suffix.lower() == ".pub":
                  raise SystemExit(f"PUB bytes leaked into source-free frontier artifact: {path}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: reader1050-hosted-frontier-${{ env.READER_RUN_ID }}
          path: out/reader1050-frontier/**
          if-no-files-found: error
          retention-days: 30
