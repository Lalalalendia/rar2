name: PDF alpha soft-mask donor

on:
  pull_request:
    paths:
      - "tools/yab259_alpha_smask_donor.py"
      - "tools/test_yab259_alpha_smask_donor.py"
      - "tools/yab259_order_preserving_donor.py"
      - "tools/run_yab259_fixed_pdf_closure.py"
      - ".github/workflows/pdf-alpha-soft-mask-donor.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pdf-alpha-soft-mask-donor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Source-level alpha boundary tests
        run: python tools/test_yab259_alpha_smask_donor.py -v

      - name: Materialize exact public donor
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/HeisLuka/yab.git /tmp/source
          git -C /tmp/source cat-file -e 4f5d8a57abc089d1ed8eb1326cf9bed602281f7e^{commit}

      - name: Apply alpha SMask repair and compile pub-pdf
        run: |
          python - <<'PY'
          import pathlib
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "tools"))
          from yab259_alpha_smask_donor import (
              bind_yab_repository,
              prepare_alpha_smask_pdf_donor,
          )

          source = bind_yab_repository(pathlib.Path("/tmp/source"))
          donor = pathlib.Path("/tmp/alpha-smask-donor")
          base_digest, ordered_digest, alpha_digest = prepare_alpha_smask_pdf_donor(
              source,
              donor,
          )
          subprocess.run(
              [
                  "cargo",
                  "test",
                  "--manifest-path",
                  str(donor / "Cargo.toml"),
                  "-p",
                  "pub-pdf",
              ],
              cwd=donor,
              check=True,
          )
          print(f"base_repair_sha256={base_digest}")
          print(f"ordered_repair_sha256={ordered_digest}")
          print(f"alpha_repair_sha256={alpha_digest}")
          PY