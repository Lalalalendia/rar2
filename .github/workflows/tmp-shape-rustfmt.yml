name: Temporary Shape Rustfmt

on:
  push:
    branches:
      - conversion/editor-created-shape-editable-export-01
    paths:
      - "vendor/producer-a/crates/pub-export/**"
      - "vendor/producer-a/crates/pub-editor/**"
      - "vendor/producer-a/crates/pub-idml/**"
      - "vendor/producer-a/crates/pub-odg/**"
      - ".github/workflows/tmp-shape-rustfmt.yml"

permissions:
  contents: write

concurrency:
  group: tmp-shape-rustfmt
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: conversion/editor-created-shape-editable-export-01
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - name: Format changed crates
        run: |
          cargo fmt --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-export -p pub-editor -p pub-idml -p pub-odg
      - name: Commit formatting only
        run: |
          set -euo pipefail
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            vendor/producer-a/crates/pub-export \
            vendor/producer-a/crates/pub-editor \
            vendor/producer-a/crates/pub-idml \
            vendor/producer-a/crates/pub-odg
          git commit -m "Style: apply rustfmt to authored shape export"
          git push origin HEAD:conversion/editor-created-shape-editable-export-01
