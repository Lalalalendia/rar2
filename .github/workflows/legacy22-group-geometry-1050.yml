name: Legacy22 group geometry 1050 research

on:
  push:
    branches:
      - research/legacy22-group-geometry-1050-01
    paths:
      - '.github/workflows/legacy22-group-geometry-1050.yml'
      - 'vendor/producer-a/crates/pub-reader/src/bin/legacy22_group_geometry_profile.rs'
      - 'vendor/producer-a/crates/pub-reader/**'
      - 'vendor/producer-a/crates/pub-contents/**'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: legacy22-group-geometry-1050-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download exact 1050 corpus
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'

      - name: Build group geometry profiler
        run: |
          set -euo pipefail
          rustfmt --check --edition 2021 vendor/producer-a/crates/pub-reader/src/bin/legacy22_group_geometry_profile.rs
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --bin legacy22_group_geometry_profile
          cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --release --bin legacy22_group_geometry_profile

      - name: Verify exact corpus identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = sorted(Path("out/pinned1050/materialized/native").glob("*.pub"))
          assert len(paths) == 1050, len(paths)
          shas = [p.stem.casefold() for p in paths]
          digest = hashlib.sha256("".join(x + "\n" for x in shas).encode("ascii")).hexdigest()
          assert digest == "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43", digest
          PY

      - name: Run raw0x000F GROUP geometry census
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          corpus = Path("out/pinned1050/materialized/native")
          paths = sorted(corpus.glob("*.pub"))
          exe = Path(os.environ["CARGO_TARGET_DIR"]) / "release" / "legacy22_group_geometry_profile"

          def profile(path, out_dir):
              target = out_dir / f"{path.stem}.json"
              cp = subprocess.run(
                  [str(exe), str(path), str(target)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  timeout=45,
                  check=False,
              )
              if cp.returncode != 0:
                  raise RuntimeError(f"{path.name}: rc={cp.returncode}: {cp.stderr[-2000:]}")
              return json.loads(target.read_text())

          rows = []
          with tempfile.TemporaryDirectory(prefix="legacy22-group-geometry-1050-") as td:
              out_dir = Path(td)
              with ThreadPoolExecutor(max_workers=16) as pool:
                  futures = {pool.submit(profile, p, out_dir): p for p in paths}
                  for future in as_completed(futures):
                      rows.append(future.result())

          eligible = [r for r in rows if r.get("eligible_reader_open") is True]
          instances = [
              {"source_sha256": r["source_sha256"], **item}
              for r in eligible
              for item in (r.get("instances") or [])
          ]
          active = [i for i in instances if i.get("active_reachable") is True]
          invalid = [
              i for i in active
              if (i.get("geometry_current") or {}).get("positive_rect") is not True
          ]

          def sign(v):
              return "negative" if v < 0 else "positive" if v > 0 else "zero"

          signs = Counter()
          points = axis = reversed_delta = nondegenerate = missing = 0
          for item in invalid:
              g = item.get("geometry_current") or {}
              if g.get("carrier_present") is not True:
                  missing += 1
                  signs["missing"] += 1
                  continue
              w = int(g["width"])
              h = int(g["height"])
              signs[f"{sign(w)}:{sign(h)}"] += 1
              if w == 0 and h == 0:
                  points += 1
              else:
                  nondegenerate += 1
              if (w == 0) != (h == 0):
                  axis += 1
              if w < 0 or h < 0:
                  reversed_delta += 1

          summary = {
              "schema": "chaptera.legacy22-group-geometry-1050.v1",
              "corpus_file_count": len(paths),
              "eligible_noquill_reader_file_count": len(eligible),
              "raw000f_instance_count": len(instances),
              "active_group_count": len(active),
              "active_current_invalid_geometry_count": len(invalid),
              "active_invalid_current_carrier_missing_count": missing,
              "active_invalid_current_point_count": points,
              "active_invalid_current_axis_aligned_count": axis,
              "active_invalid_current_reversed_delta_count": reversed_delta,
              "active_invalid_current_nondegenerate_count": nondegenerate,
              "active_invalid_current_delta_sign_counts": dict(signs.most_common()),
              "active_invalid_chunk_length_counts": dict(Counter(str(i["chunk_len"]) for i in invalid).most_common()),
              "active_invalid_service_word_counts": dict(Counter(str(i["service_word"]) for i in invalid).most_common()),
              "active_invalid_parent_raw_type_counts": dict(Counter(str(i.get("parent_raw_type") or "none") for i in invalid).most_common()),
              "active_invalid_child_count_counts": dict(Counter(str(i["child_count"]) for i in invalid).most_common()),
              "active_invalid_positive_at_0x04": sum((i.get("geometry_start_0x04") or {}).get("positive_rect") is True for i in invalid),
              "active_invalid_positive_at_0x08": sum((i.get("geometry_start_0x08") or {}).get("positive_rect") is True for i in invalid),
              "evidence_boundary": "research-only GROUP geometry census; no Reader admission change",
          }
          Path("out").mkdir(exist_ok=True)
          Path("out/legacy22-group-geometry-1050.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: legacy22-group-geometry-1050-${{ github.run_id }}
          path: out/legacy22-group-geometry-1050.json
          retention-days: 90
