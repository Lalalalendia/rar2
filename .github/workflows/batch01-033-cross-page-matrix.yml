name: Batch01 033 cross-page matrix

on:
  pull_request:
    paths:
      - ".github/workflows/batch01-033-cross-page-matrix.yml"
      - "tools/research_batch01_cross_page_matrix_v1.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: batch01-033-cross-page-matrix-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/batch01-033-cross-page

jobs:
  matrix:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Verify pinned exact 1050 materialization
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = sorted(Path("out/pinned1050/materialized/native").glob("*.pub"))
          shas = [path.stem.casefold() for path in paths]
          digest = hashlib.sha256("".join(sha + "\n" for sha in shas).encode("ascii")).hexdigest()
          assert len(shas) == 1050, len(shas)
          assert digest == "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43", digest
          print("pinned 1050 verified", digest)
          PY

      - name: Install visual dependencies
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "Pillow==12.3.0"
          python -m py_compile tools/cloud_reader_visual_fingerprint_v1.py
          python -m py_compile tools/research_batch01_cross_page_matrix_v1.py

      - name: Materialize exact 033 fixture only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/batch01-033"
          mkdir -p "$RUNNER_TEMP/batch01-033"
          python tools/cloud_reader_visual_fingerprint_v1.py prepare             tools/corpus/receipts/publisher-visual-golden-batch-01-pairs.csv             out/pinned1050/materialized/native             "$RUNNER_TEMP/no-second-source-root"             "$RUNNER_TEMP/batch01-033/fixtures"             "$RUNNER_TEMP/batch01-033/manifest-all.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "batch01-033"
          src = json.loads((root / "manifest-all.json").read_text())
          rows = [row for row in src["fixtures"] if row["name"] == "033_4029d4a1bf5be89d"]
          assert len(rows) == 1, len(rows)
          assert rows[0]["sha256"] == "4029d4a1bf5be89d745c079b9c06ab33e5bdceb997a4761c5e11238110d879c9"
          out = {"schema": src["schema"], "fixtures": rows}
          (root / "manifest.json").write_text(json.dumps(out, indent=2, sort_keys=True) + "\n")
          print("fixture", rows[0]["name"], rows[0]["sha256"])
          PY

      - name: Build canonical Cloud Reader worker
        run: cargo build -p chaptera-server --bin chaptera --jobs 2

      - name: Restore pinned Playwright Chromium cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: publisher-visual-batch01-${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install pinned browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Render fail-open exact 033 through current Cloud Reader
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.sha }}
          READER_WORKER_BINARY: ${{ github.workspace }}/target/batch01-033-cross-page/debug/chaptera
          READER_REAL_MANIFEST: ${{ runner.temp }}/batch01-033/manifest.json
          READER_REAL_OUTPUT: ${{ runner.temp }}/batch01-033/browser
          READER_REFERENCE_RASTER_DPI: "144"
          READER_CONTINUE_WORKER_FAILURES: "0"
          READER_WORKER_TIMEOUT_SECONDS: "120"
          READER_WORKER_CPU_SECONDS: "90"
          READER_WORKER_ADDRESS_SPACE_MB: "768"
        run: node apps/cloud-reader/real-browser.test.mjs

      - name: Compute 12x4 source-free cross-page matrix
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/batch01-033-cross-page
          python tools/research_batch01_cross_page_matrix_v1.py             "$RUNNER_TEMP/batch01-033/browser/receipt.json"             tools/corpus/receipts/publisher-visual-golden-batch-01-fingerprint-v1.json             033_4029d4a1bf5be89d             target/batch01-033-cross-page/summary.json

      - name: Assert measurement fences
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("target/batch01-033-cross-page/summary.json").read_text())
          assert data["schema"] == "chaptera.batch01-cross-page-matrix.v2"
          assert data["candidate_page_count"] == 12
          assert data["reference_page_count"] == 4
          assert data["claims"]["viewer_page_selection_changed"] is False
          assert data["claims"]["fingerprint_used_as_semantic_authority"] is False
          assert data["claims"]["foreground_metric_used_as_semantic_authority"] is False
          print("cross-page measurement fences verified")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: batch01-033-cross-page-matrix
          path: target/batch01-033-cross-page/summary.json
          if-no-files-found: error
          retention-days: 30
