name: Chaptera PUB Check worker

on:
  workflow_dispatch:
    inputs:
      check_id:
        description: "Opaque Chaptera PUB check id"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pub-check-${{ inputs.check_id }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHECK_ID: ${{ inputs.check_id }}
      PUB_CHECK_ORIGIN: ${{ secrets.PUB_CHECK_ORIGIN }}
      CHECKER_ADMIN_TOKEN: ${{ secrets.CHECKER_ADMIN_TOKEN }}
      CHAPTERA_CHECKER_VERSION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Validate bounded job identity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, re, sys
          check_id = os.environ["CHECK_ID"]
          origin = os.environ.get("PUB_CHECK_ORIGIN", "")
          if not re.fullmatch(r"[0-9a-fA-F-]{36}", check_id):
              sys.exit("invalid check id")
          if not origin.startswith("https://") or any(c.isspace() for c in origin):
              sys.exit("PUB_CHECK_ORIGIN must be one HTTPS origin")
          if not os.environ.get("CHECKER_ADMIN_TOKEN"):
              sys.exit("CHECKER_ADMIN_TOKEN is not configured")
          PY

      - name: Download admitted private PUB
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="${PUB_CHECK_ORIGIN%/}"
          SOURCE_URL="${ORIGIN}/api/internal/source/${CHECK_ID}"
          curl --fail --silent --show-error --max-redirs 0 \
            --header "Authorization: Bearer ${CHECKER_ADMIN_TOKEN}" \
            --output "${RUNNER_TEMP}/source.pub" \
            "${SOURCE_URL}"
          python3 - <<'PY'
          import os, pathlib, sys
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "source.pub"
          size = path.stat().st_size
          if size <= 0 or size > 64 * 1024 * 1024:
              sys.exit(f"unexpected admitted source size: {size}")
          PY

      - name: Run canonical Cloud Reader guest-session bridge
        shell: bash
        env:
          PUB_CHECK_CLOUD_READER_ORIGIN: https://reader.chaptera.online
        run: |
          set -euo pipefail
          # A rejected/failed Cloud session produces only a bounded transport
          # failure receipt. It may never be reclassified as unsupported PUB.
          python3 tools/pub-check-cloud-bridge/worker.py \
            "${RUNNER_TEMP}/source.pub" "${RUNNER_TEMP}/result.json" || true

      - name: Validate source-safe canonical or transport failure receipt
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          path = pathlib.Path(os.environ["RUNNER_TEMP"]) / "result.json"
          failure = {
              "compatibility": "failed",
              "summary": "The checker could not complete this request reliably.",
              "diagnosticsCode": "pub_check.worker_failure",
          }
          try:
              raw = path.read_bytes()
              if not raw or len(raw) > 64 * 1024:
                  raise ValueError("missing or oversized receipt")
              data = json.loads(raw)
              if not isinstance(data, dict):
                  raise ValueError("receipt must be object")
              if data.get("protocol_version") == "chaptera.reader-compatibility-report.v1":
                  required = ("source_sha256", "state", "engine_classification",
                              "output_routes", "limitations", "recommended_next_step")
                  if not all(field in data for field in required):
                      raise ValueError("canonical receipt missing required fields")
              elif not (data.get("compatibility") == "failed"
                        and data.get("diagnosticsCode") == "pub_check.worker_failure"):
                  raise ValueError("only canonical report or transport failure allowed")
          except Exception:
              data = failure
          path.write_text(json.dumps(data, separators=(",", ":")), encoding="utf-8")
          PY

      - name: Return bounded result
        shell: bash
        run: |
          set -euo pipefail
          ORIGIN="${PUB_CHECK_ORIGIN%/}"
          RESULT_URL="${ORIGIN}/api/internal/result/${CHECK_ID}"
          curl --fail --silent --show-error \
            --request POST \
            --header "Authorization: Bearer ${CHECKER_ADMIN_TOKEN}" \
            --header "Content-Type: application/json" \
            --data-binary "@${RUNNER_TEMP}/result.json" \
            "${RESULT_URL}"

      - name: Remove local source bytes
        if: always()
        shell: bash
        run: |
          rm -f "${RUNNER_TEMP}/source.pub" "${RUNNER_TEMP}/result.json"
