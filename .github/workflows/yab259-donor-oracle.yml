name: Yab 259 donor oracle

on:
  push:
    branches:
      - research/yab259-donor-oracle
    paths:
      - ".github/workflows/yab259-donor-oracle.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yab259-donor-oracle
  cancel-in-progress: true

jobs:
  validate-yab259:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout current rar2 research branch
        uses: actions/checkout@v4

      - name: Checkout exact Yab donor
        uses: actions/checkout@v4
        with:
          repository: HeisLuka/yab
          ref: 4f5d8a57abc089d1ed8eb1326cf9bed602281f7e
          path: donor
          persist-credentials: false

      - name: Install workspace Rust toolchain
        uses: dtolnay/rust-toolchain@1.85.0

      - name: Install receipt validator dependency
        run: python -m pip install "jsonschema==4.23.0"

      - name: Verify exact donor identity
        working-directory: donor
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "4f5d8a57abc089d1ed8eb1326cf9bed602281f7e"
          test -z "$(git status --short)"
          grep -q 'name = "pub-pdf"' crates/pub-pdf/Cargo.toml
          grep -q 'const FIXED_FLOW_RECEIPT_VERSION: &str = "chaptera.fixed-pdf-shaped-flow-receipt.v1";' crates/pub-cli/src/fixed_pdf.rs

      - name: Normalize bounded donor formatting drift
        working-directory: donor
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "crates/pub-viewer/src/lib.rs"
          git diff --check
          git diff -- crates/pub-viewer/src/lib.rs > "$RUNNER_TEMP/yab259-rustfmt-only.patch"

      - name: Apply bounded Yab 259 compile repair
        working-directory: donor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/pub-layout/src/shaped_flow.rs")
          text = path.read_text(encoding="utf-8")
          replacements = [
              (
                  """        let evaluated = evaluate_candidate(
                      &scalars,
                      &full.glyphs,
                      0,
                      true,
                      &candidate,
                      &runtime.shaping,
                  )""",
                  """        let evaluated = evaluate_candidate(
                      &scalars,
                      &full.glyphs,
                      full.units_per_em,
                      0,
                      true,
                      &candidate,
                      &runtime.shaping,
                  )""",
              ),
              (
                  """        let evaluated = evaluate_candidate(
                      &scalars,
                      &full.glyphs,
                      4,
                      false,
                      &candidate,
                      &runtime.shaping,
                  )""",
                  """        let evaluated = evaluate_candidate(
                      &scalars,
                      &full.glyphs,
                      full.units_per_em,
                      4,
                      false,
                      &candidate,
                      &runtime.shaping,
                  )""",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit("bounded compile-repair anchor mismatch")
              text = text.replace(old, new, 1)
          path.write_text(text, encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check
          git diff -- crates/pub-layout/src/shaped_flow.rs > "$RUNNER_TEMP/yab259-compile-repair.patch"

      - name: Apply bounded Yab 259 sha2 repair
        working-directory: donor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/pub-cli/src/fixed_pdf.rs")
          text = path.read_text(encoding="utf-8")
          old = '''fn sha256_json_id(value: &Value) -> Result<String> {
              let bytes = serde_json::to_vec(value).context("serialize fixed-flow hash payload")?;
              Ok(format!("sha256:{:x}", Sha256::digest(bytes)))
          }'''
          new = '''fn sha256_json_id(value: &Value) -> Result<String> {
              let bytes = serde_json::to_vec(value).context("serialize fixed-flow hash payload")?;
              let digest = Sha256::digest(bytes);
              const HEX: &[u8; 16] = b"0123456789abcdef";

              let mut out = String::with_capacity("sha256:".len() + 64);
              out.push_str("sha256:");
              for byte in digest {
                  out.push(HEX[usize::from(byte >> 4)] as char);
                  out.push(HEX[usize::from(byte & 0x0f)] as char);
              }
              Ok(out)
          }'''
          if text.count(old) != 1:
              raise SystemExit("bounded sha2-repair anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check
          git diff -- \
            crates/pub-layout/src/shaped_flow.rs \
            crates/pub-cli/src/fixed_pdf.rs \
            > "$RUNNER_TEMP/yab259-compile-repair.patch"

      - name: Check owning packages
        working-directory: donor
        run: cargo check -p pub-layout -p pub-pdf -p pub-viewer -p pub-cli --all-targets

      - name: Apply bounded Yab 259 clippy repair
        working-directory: donor
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("crates/pub-pdf/src/text.rs")
          text = path.read_text(encoding="utf-8")
          old = '''fn prepare_run_glyphs(
              run: &FixedTextRun,
          ) -> Result<Option<(Vec<PreparedGlyph>, BTreeMap<u16, String>)>, PdfTextPreparationError> {'''
          new = '''type PreparedRunGlyphs = (Vec<PreparedGlyph>, BTreeMap<u16, String>);

          fn prepare_run_glyphs(
              run: &FixedTextRun,
          ) -> Result<Option<PreparedRunGlyphs>, PdfTextPreparationError> {'''
          if text.count(old) != 1:
              raise SystemExit("bounded clippy-repair anchor mismatch")
          path.write_text(text.replace(old, new, 1), encoding="utf-8")
          PY
          cargo fmt --all
          git diff --check
          git diff -- \
            crates/pub-layout/src/shaped_flow.rs \
            crates/pub-cli/src/fixed_pdf.rs \
            crates/pub-pdf/src/text.rs \
            > "$RUNNER_TEMP/yab259-compile-repair.patch"

      - name: Clippy owning packages
        working-directory: donor
        run: cargo clippy -p pub-layout -p pub-pdf -p pub-viewer -p pub-cli --all-targets -- -D warnings

      - name: Test shaped-flow layout
        working-directory: donor
        run: cargo test -p pub-layout

      - name: Test deterministic PDF backend
        working-directory: donor
        run: cargo test -p pub-pdf

      - name: Test viewer projection handoff
        working-directory: donor
        run: cargo test -p pub-viewer

      - name: Test real SampleNewsletter shaped-flow PDF witness
        working-directory: donor
        run: cargo test -p pub-cli sample_newsletter_pdf_is_deterministic_with_explicit_fallback_and_losses -- --nocapture

      - name: Materialize exact Chaptera fallback font
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p crates/chaptera-desktop-fallback-font-resource/src/bin
          cat > crates/chaptera-desktop-fallback-font-resource/src/bin/yab259_oracle_font.rs <<'RS'
          use chaptera_desktop_fallback_font_resource as resource;
          use std::{env, fs, path::PathBuf};

          fn main() {
              let output = PathBuf::from(env::args_os().nth(1).expect("output path"));
              resource::validate().expect("pinned fallback font must validate");
              fs::write(output, resource::bytes()).expect("write pinned fallback font");
          }
          RS
          rustup toolchain install 1.94.1 --profile minimal
          cargo +1.94.1 run -q -p chaptera-desktop-fallback-font-resource --bin yab259_oracle_font -- "$RUNNER_TEMP/Ubuntu-Light.ttf"
          test "$(wc -c < "$RUNNER_TEMP/Ubuntu-Light.ttf")" -eq 361676
          echo "80307b8da7649aa4ee4d484b232140e3ce1ec0ca093073d3c53c8f5a5ced7a70  $RUNNER_TEMP/Ubuntu-Light.ttf" | sha256sum -c -

      - name: Build exact Yab donor CLI
        working-directory: donor
        shell: bash
        run: |
          set -euo pipefail
          cargo build -p pub-cli
          test -x target/debug/pub

      - name: Materialize exact Apache POI SampleNewsletter fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .web-v0
          curl -fsSL \
            -H "Accept: application/vnd.github.raw+json" \
            "https://api.github.com/repos/apache/poi/git/blobs/94900925af5832c493784f3cb51563f838a64df8" \
            -o .web-v0/SampleNewsletter.pub
          test "$(wc -c < .web-v0/SampleNewsletter.pub)" -eq 291840
          echo "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf  .web-v0/SampleNewsletter.pub" | sha256sum -c -

      - name: Produce exact rar2 shaped-flow receipt through Yab donor
        shell: bash
        run: |
          set -euo pipefail
          python tools/run_local_fixed_pdf_shaped_flow.py \
            --fixture .web-v0/SampleNewsletter.pub \
            --fallback-font "$RUNNER_TEMP/Ubuntu-Light.ttf" \
            --pdf-output "$RUNNER_TEMP/SampleNewsletter.shaped-flow.pdf" \
            --receipt-output "$RUNNER_TEMP/fixed-pdf-shaped-flow.real.json" \
            -- "$GITHUB_WORKSPACE/donor/target/debug/pub" convert {fixture} --to pdf --output {pdf} --fallback-font {font} --json

      - name: Independently validate sanitized receipt
        run: python tools/validate_fixed_pdf_shaped_flow_receipt.py "$RUNNER_TEMP/fixed-pdf-shaped-flow.real.json"

      - name: Validate PDF structure
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y qpdf poppler-utils
          qpdf --check "$RUNNER_TEMP/SampleNewsletter.shaped-flow.pdf"
          pdfinfo "$RUNNER_TEMP/SampleNewsletter.shaped-flow.pdf" > "$RUNNER_TEMP/SampleNewsletter.pdfinfo.txt"
          pdftotext "$RUNNER_TEMP/SampleNewsletter.shaped-flow.pdf" "$RUNNER_TEMP/SampleNewsletter.txt"

      - name: Retain exact donor evidence
        uses: actions/upload-artifact@v4
        with:
          name: yab259-fixed-pdf-oracle-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/yab259-rustfmt-only.patch
            ${{ runner.temp }}/yab259-compile-repair.patch
            ${{ runner.temp }}/SampleNewsletter.shaped-flow.pdf
            ${{ runner.temp }}/fixed-pdf-shaped-flow.real.json
            ${{ runner.temp }}/SampleNewsletter.pdfinfo.txt
            ${{ runner.temp }}/SampleNewsletter.txt
          if-no-files-found: error
          retention-days: 14

