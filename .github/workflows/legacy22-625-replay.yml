name: Legacy22 625 corpus replay

on:
  push:
    branches:
      - work/legacy22-noquill-port-20260929
    paths:
      - "vendor/producer-a/crates/pub-contents/**"
      - "vendor/producer-a/crates/pub-reader/**"
      - "vendor/producer-a/crates/pub-viewer/**"
      - "apps/chaptera-desktop/**"
      - ".github/workflows/legacy22-625-replay.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy22-625-replay-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target

jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout rar2 candidate
        uses: actions/checkout@v4

      - name: Checkout 625-file working corpus
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: main
          path: corpus-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Install pinned CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Build rar2 Reader receipt
        run: |
          set -euo pipefail
          cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer --release --bin corpus-reader-receipt

      - name: Replay full 625-file corpus
        run: |
          set -euo pipefail
          rm -rf out/legacy625
          python corpus-src/pub-corpus/scripts/deep_profile.py \
            --corpus-root corpus-src/pub-corpus \
            --rar-tools tools/corpus \
            --reader-receipt-exe "${CARGO_TARGET_DIR}/release/corpus-reader-receipt" \
            --rar-ref "rar2:${GITHUB_SHA}" \
            --out out/legacy625 \
            --workers 4

      - name: Guard legacy product depth
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('out/legacy625/summary.json').read_text())
          r=s['reader']
          assert s['corpus_file_count'] == 625, s['corpus_file_count']
          assert r['opened_by_family'].get('0x2c') == 379, r['opened_by_family']
          assert r['opened_by_family'].get('0x22', 0) >= 165, r['opened_by_family']
          print(json.dumps({
            'corpus': s['corpus_file_count'],
            'opened': r['opened_count'],
            'failed': r['failed_count'],
            'opened_by_family': r['opened_by_family'],
            'failed_by_family': r['failed_by_family'],
            'diagnostics': r['diagnostic_code_counts'],
          }, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: legacy22-625-replay-${{ github.run_id }}
          path: out/legacy625/**
          if-no-files-found: error
          retention-days: 30
