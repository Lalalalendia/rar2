name: Reader shared PR selective fanout

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/chaptera-desktop/src/render_backend.rs"
      - "apps/chaptera-desktop/src/main.rs"
      - "crates/chaptera-viewer-render-plan/**"
      - "vendor/producer-a/Cargo.toml"
      - "vendor/producer-a/Cargo.lock"
      - "vendor/producer-a/crates/pub-core/**"
      - "vendor/producer-a/crates/pub-cfb/**"
      - "vendor/producer-a/crates/pub-contents/**"
      - "vendor/producer-a/crates/pub-escher/**"
      - "vendor/producer-a/crates/pub-model/**"
      - "vendor/producer-a/crates/pub-quill/**"
      - "vendor/producer-a/crates/pub-reader/**"
      - "vendor/producer-a/crates/pub-layout/**"
      - "vendor/producer-a/crates/pub-viewer/**"
      - "tools/ci/reader_consumer_preflight.py"
      - "tools/ci/test_reader_consumer_preflight.py"
      - ".github/workflows/reader-shared-pr.yml"
      - ".github/workflows/reader-consumer-preflight.yml"
      - ".github/workflows/chaptera-reader-windows.yml"
      - ".github/workflows/chaptera-desktop-windows.yml"
      - ".github/workflows/carlton-reader-visual-oracle.yml"
      - ".github/workflows/reader-typography-golden.yml"
      - ".github/workflows/reader-corpus-truth-v1.yml"
      - ".github/workflows/mobile-reader-android-render.yml"
      - ".github/workflows/web-acceptance-real-chromium.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      reader_windows: ${{ steps.scope.outputs.reader_windows }}
      editor_windows: ${{ steps.scope.outputs.editor_windows }}
      visual_oracle: ${{ steps.scope.outputs.visual_oracle }}
      typography: ${{ steps.scope.outputs.typography }}
      corpus: ${{ steps.scope.outputs.corpus }}
      android_render: ${{ steps.scope.outputs.android_render }}
      web_acceptance: ${{ steps.scope.outputs.web_acceptance }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: scope
        name: Classify changed Reader surfaces
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          mapfile -t paths < <(git diff --name-only "$base...$HEAD_SHA")
          printf '%s\n' "${paths[@]}"

          has() {
            local pattern
            for pattern in "$@"; do
              for path in "${paths[@]}"; do
                if [[ "$path" == $pattern ]]; then
                  return 0
                fi
              done
            done
            return 1
          }

          reader_windows=false
          editor_windows=false
          visual_oracle=false
          typography=false
          corpus=false
          android_render=false
          web_acceptance=false

          if has             "Cargo.toml" "Cargo.lock"             "apps/chaptera-desktop/src/render_backend.rs"             "apps/chaptera-desktop/src/main.rs"             "crates/chaptera-viewer-render-plan/"*             "vendor/producer-a/Cargo.toml" "vendor/producer-a/Cargo.lock"             "vendor/producer-a/crates/pub-core/"*             "vendor/producer-a/crates/pub-cfb/"*             "vendor/producer-a/crates/pub-contents/"*             "vendor/producer-a/crates/pub-escher/"*             "vendor/producer-a/crates/pub-model/"*             "vendor/producer-a/crates/pub-quill/"*             "vendor/producer-a/crates/pub-reader/"*             "vendor/producer-a/crates/pub-layout/"*             "vendor/producer-a/crates/pub-viewer/"*; then
            reader_windows=true
          fi

          if has             "apps/chaptera-desktop/src/render_backend.rs"             "apps/chaptera-desktop/src/main.rs"             "crates/chaptera-viewer-render-plan/"*; then
            editor_windows=true
          fi

          if has             "apps/chaptera-desktop/src/render_backend.rs"             "apps/chaptera-desktop/src/main.rs"             "crates/chaptera-viewer-render-plan/"*             "vendor/producer-a/crates/pub-reader/"*             "vendor/producer-a/crates/pub-viewer/"*; then
            visual_oracle=true
            corpus=true
          fi

          if has             "apps/chaptera-desktop/src/render_backend.rs"             "apps/chaptera-desktop/src/main.rs"             "crates/chaptera-viewer-render-plan/"*             "vendor/producer-a/crates/pub-quill/"*             "vendor/producer-a/crates/pub-reader/"*             "vendor/producer-a/crates/pub-viewer/"*; then
            typography=true
          fi

          if has "crates/chaptera-viewer-render-plan/"*; then
            android_render=true
          fi

          if has             "vendor/producer-a/crates/pub-reader/"*             "vendor/producer-a/crates/pub-viewer/"*; then
            web_acceptance=true
          fi

          {
            echo "reader_windows=$reader_windows"
            echo "editor_windows=$editor_windows"
            echo "visual_oracle=$visual_oracle"
            echo "typography=$typography"
            echo "corpus=$corpus"
            echo "android_render=$android_render"
            echo "web_acceptance=$web_acceptance"
          } | tee -a "$GITHUB_OUTPUT"

  tier-a:
    needs: classify
    uses: ./.github/workflows/reader-consumer-preflight.yml

  reader-windows:
    needs: [classify, tier-a]
    if: needs.classify.outputs.reader_windows == 'true'
    uses: ./.github/workflows/chaptera-reader-windows.yml

  editor-windows:
    needs: [classify, tier-a]
    if: needs.classify.outputs.editor_windows == 'true'
    uses: ./.github/workflows/chaptera-desktop-windows.yml

  visual-oracle:
    needs: [classify, tier-a]
    if: needs.classify.outputs.visual_oracle == 'true'
    uses: ./.github/workflows/carlton-reader-visual-oracle.yml

  typography:
    needs: [classify, tier-a]
    if: needs.classify.outputs.typography == 'true'
    uses: ./.github/workflows/reader-typography-golden.yml

  corpus:
    needs: [classify, tier-a]
    if: needs.classify.outputs.corpus == 'true'
    uses: ./.github/workflows/reader-corpus-truth-v1.yml

  android-render:
    needs: [classify, tier-a]
    if: needs.classify.outputs.android_render == 'true'
    uses: ./.github/workflows/mobile-reader-android-render.yml

  web-acceptance:
    needs: [classify, tier-a]
    if: needs.classify.outputs.web_acceptance == 'true'
    uses: ./.github/workflows/web-acceptance-real-chromium.yml
