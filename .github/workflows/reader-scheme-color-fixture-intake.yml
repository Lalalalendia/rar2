name: Reader scheme-color fixture intake

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-reader/tests/fixtures/color1-0f85b2b6.pub.gz.b64"
      - "vendor/producer-a/crates/pub-reader/tests/fixtures/color1-0f85b2b6.fixture.json"
      - "vendor/producer-a/crates/pub-reader/src/bin/scheme_color_oracle_receipt.rs"
      - "vendor/producer-a/crates/pub-viewer/src/bin/corpus-reader-receipt.rs"
      - "vendor/producer-a/crates/pub-viewer/src/bin/paint_bridge_parity.rs"
      - ".github/workflows/reader-scheme-color-fixture-intake.yml"
  push:
    branches:
      - main
    paths:
      - "vendor/producer-a/crates/pub-reader/tests/fixtures/color1-0f85b2b6.pub.gz.b64"
      - "vendor/producer-a/crates/pub-reader/tests/fixtures/color1-0f85b2b6.fixture.json"
      - "vendor/producer-a/crates/pub-reader/src/bin/scheme_color_oracle_receipt.rs"
      - "vendor/producer-a/crates/pub-viewer/src/bin/corpus-reader-receipt.rs"
      - "vendor/producer-a/crates/pub-viewer/src/bin/paint_bridge_parity.rs"
      - ".github/workflows/reader-scheme-color-fixture-intake.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  fixture-intake:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Restore exact color1 PUB bytes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/scheme-color-fixture
          python - <<'PY'
          import base64, gzip, hashlib, json
          from pathlib import Path

          fixture = Path("vendor/producer-a/crates/pub-reader/tests/fixtures/color1-0f85b2b6.pub.gz.b64")
          manifest = json.loads(Path("vendor/producer-a/crates/pub-reader/tests/fixtures/color1-0f85b2b6.fixture.json").read_text())
          packed = base64.b64decode(fixture.read_text().strip(), validate=True)
          assert hashlib.sha256(packed).hexdigest() == manifest["gzip_sha256"]
          assert len(packed) == manifest["gzip_byte_len"]
          data = gzip.decompress(packed)
          assert hashlib.sha256(data).hexdigest() == manifest["source_sha256"]
          assert len(data) == manifest["source_byte_len"]
          Path("target/scheme-color-fixture/color1.pub").write_bytes(data)
          PY

      - name: Emit raw scheme-color receipt
        run: |
          cargo run --quiet \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin scheme_color_oracle_receipt \
            -- target/scheme-color-fixture/color1.pub \
               target/scheme-color-fixture/raw-receipt.json

      - name: Validate pinned scheme grammar
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("vendor/producer-a/crates/pub-reader/tests/fixtures")
          manifest = json.loads((root / "color1-0f85b2b6.fixture.json").read_text())
          receipt = json.loads(Path("target/scheme-color-fixture/raw-receipt.json").read_text())
          expected = manifest["expected_scheme"]
          assert receipt["source_sha256"] == manifest["source_sha256"]
          assert receipt["byte_len"] == manifest["source_byte_len"]
          assert receipt["oplsccm"]["name"] == expected["name"]
          assert receipt["oplsccm"]["declared_count"] == expected["declared_count"]
          slots = receipt["oplsccm"]["slots"]
          assert [slot["ordinal"] for slot in slots] == expected["ordinals"]
          assert [slot["rgb"] for slot in slots] == expected["raw_slot_rgb"]
          fills = receipt["officeart"]["scheme_fills"]
          assert len(fills) == 8, fills
          assert [fill["scheme_ordinal"] for fill in fills] == expected["ordinals"], fills
          # DUMMY slot 0 has bounded effective-black semantics.
          assert expected["raw_slot_rgb"][0] == expected["effective_slot_0_rgb"]
          assert [fill["resolved_rgb"] for fill in fills] == expected["raw_slot_rgb"], fills
          PY

      - name: Exercise real Reader Viewer open path
        run: |
          cargo run --quiet \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-viewer \
            --bin corpus-reader-receipt \
            -- target/scheme-color-fixture/color1.pub \
               target/scheme-color-fixture/reader-receipt.json

      - name: Capture canonical paint parity
        shell: bash
        run: |
          set -uo pipefail
          set +e
          cargo run --quiet \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-viewer \
            --bin paint_bridge_parity \
            -- target/scheme-color-fixture/color1.pub \
            2>&1 | tee target/scheme-color-fixture/paint-parity.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > target/scheme-color-fixture/paint-parity.exit

      - name: Validate current Reader product expectation
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path("vendor/producer-a/crates/pub-reader/tests/fixtures/color1-0f85b2b6.fixture.json").read_text())
          reader = json.loads(Path("target/scheme-color-fixture/reader-receipt.json").read_text())
          expected = manifest["current_reader_expectation"]
          parity_status = int(Path("target/scheme-color-fixture/paint-parity.exit").read_text().strip())
          parity_log = Path("target/scheme-color-fixture/paint-parity.log").read_text()
          assert reader["source_sha256"] == manifest["source_sha256"]
          assert reader["opened"] is expected["opened"], reader
          if expected["opened"]:
              assert parity_status == 0, parity_log
              assert reader["paint_node_count"] >= expected["minimum_paint_node_count"], reader
              assert reader["solid_fill_count"] >= expected["minimum_solid_fill_count"], reader
              parity_lines = [line for line in parity_log.splitlines() if line.startswith("PAINT_BRIDGE_PARITY\t")]
              assert len(parity_lines) == 1, parity_log
              fields = dict(part.split("=", 1) for part in parity_lines[0].split("\t")[1:])
              counts = {name: int(fields[name]) for name in ("compared", "mismatches", "unexpected")}
              assert counts == {"compared": 8, "mismatches": 0, "unexpected": 0}, counts
          else:
              assert reader["open_error_kind"] == expected["open_error_kind"], reader
              assert reader["open_error_signature_sha256"] == expected["open_error_signature_sha256"], reader
              assert parity_status != 0, parity_log
              for fragment in expected["diagnostic_fragments"]:
                  assert fragment in parity_log, (fragment, parity_log)
          PY

      - name: Reject unsupported scheme COLORREF and slot cases
        shell: bash
        run: |
          set -euo pipefail
          # Filtered tests must execute exactly once, not silently match zero cases.
          manifest="vendor/producer-a/Cargo.toml"
          run_one() {
            local package="$1" test_filter="$2" output
            output="$(cargo test --manifest-path "$manifest" -p "$package" --lib "$test_filter" -- --nocapture 2>&1)"
            printf '%s\n' "$output"
            grep -Eq 'test result: ok\. 1 passed; 0 failed;' <<< "$output"
          }
          run_one pub-reader direct_officeart_rgb_accepts_only_unflagged_colorref
          run_one pub-reader officeart_scheme_index_resolves_only_in_range_non_dummy_slots
          run_one pub-reader quill_scheme_text_color_resolves_only_through_publication_scheme
          run_one pub-contents parses_ordered_scheme_slots_and_resolves_dummy_as_implicit_black
          run_one pub-contents rejects_declared_count_that_would_shift_slot_identity

      - name: Print receipts
        if: always()
        run: |
          cat target/scheme-color-fixture/raw-receipt.json || true
          cat target/scheme-color-fixture/reader-receipt.json || true
          cat target/scheme-color-fixture/paint-parity.log || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-scheme-color-fixture-${{ github.sha }}
          path: |
            target/scheme-color-fixture/raw-receipt.json
            target/scheme-color-fixture/reader-receipt.json
            target/scheme-color-fixture/paint-parity.log
            target/scheme-color-fixture/paint-parity.exit
          if-no-files-found: warn
