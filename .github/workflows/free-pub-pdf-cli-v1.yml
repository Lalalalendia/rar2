name: Free PUB PDF CLI V1

on:
  pull_request:
    paths:
      - ".github/workflows/free-pub-pdf-cli-v1.yml"
      - "vendor/producer-a/Cargo.toml"
      - "vendor/producer-a/crates/pub-cli/**"
      - "vendor/producer-a/crates/pub-pdf/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt

      - name: Format and compile owned slice
        run: |
          rustfmt --edition 2024 --check \
            vendor/producer-a/crates/pub-cli/src/main.rs \
            vendor/producer-a/crates/pub-cli/src/fixed_pdf.rs \
            vendor/producer-a/crates/pub-pdf/src/lib.rs \
            vendor/producer-a/crates/pub-pdf/src/text.rs \
            vendor/producer-a/crates/pub-output/src/lib.rs \
            vendor/producer-a/crates/pub-viewer/src/lib.rs
          cargo check --manifest-path vendor/producer-a/Cargo.toml -p pub-cli -p pub-pdf -p pub-output -p pub-viewer --all-targets

      - name: Run focused fixed-output tests
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-output reads_opentype_embedding_flags_without_licensing_guesswork
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-output restricted_font_is_explicit_block_by_default
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-pdf
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-cli report_label_ --bin pub
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-cli resource_scene_ --bin pub

      - name: Build public CLI
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-cli --bin pub

      - name: Acquire pinned Apache POI SampleNewsletter
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/SampleNewsletter.pub"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" \
            --output "$fixture"
          actual_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          actual_size="$(wc -c < "$fixture" | tr -d ' ')"
          test "$actual_sha" = "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          test "$actual_size" = "291840"
          echo "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" >> "$GITHUB_ENV"

      - name: Convert editable targets twice
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/free-pub-editable-cli-v1"
          mkdir -p "$out"
          cli="vendor/producer-a/target/debug/pub"

          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to idml --output "$out/a.idml" --json > "$out/idml-cli.json"
          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to idml --output "$out/b.idml" > "$out/idml-human.txt"
          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to odg --output "$out/a.odg" --json > "$out/odg-cli.json"
          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to odg --output "$out/b.odg" > "$out/odg-human.txt"

          cmp "$out/a.idml" "$out/b.idml"
          cmp "$out/a.odg" "$out/b.odg"
          cmp "$out/a.idml.loss.json" "$out/b.idml.loss.json"
          cmp "$out/a.odg.loss.json" "$out/b.odg.loss.json"
          unzip -t "$out/a.idml" >/dev/null
          unzip -t "$out/a.odg" >/dev/null
          test -s "$out/a.idml.loss.json"
          test -s "$out/a.idml.loss.txt"
          test -s "$out/a.odg.loss.json"
          test -s "$out/a.odg.loss.txt"
          echo "CHAPTERA_EDITABLE_CLI_OUT=$out" >> "$GITHUB_ENV"

      - name: Validate editable conversion receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["CHAPTERA_EDITABLE_CLI_OUT"])
          expected = "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"

          def load(name):
              return json.loads((out / name).read_text(encoding="utf-8"))

          idml_cli = load("idml-cli.json")
          odg_cli = load("odg-cli.json")
          idml_report = load("a.idml.loss.json")
          odg_report = load("a.odg.loss.json")

          for cli, report, target in [
              (idml_cli, idml_report, "idml"),
              (odg_cli, odg_report, "odg"),
          ]:
              assert cli["schema"] == "chaptera.pub-convert-cli.v1"
              assert cli["source_sha256"] == expected
              assert cli["target"] == target
              assert report["source"]["source_hash"] == expected
              assert report["can_serialize"] is True
              assert report["counts"]["blocking"] == 0

          def digest(name):
              return hashlib.sha256((out / name).read_bytes()).hexdigest()

          receipt = {
              "schema": "chaptera.free-pub-editable-cli-acceptance.v1",
              "source_sha256": expected,
              "idml_sha256": digest("a.idml"),
              "odg_sha256": digest("a.odg"),
              "idml_loss_sha256": digest("a.idml.loss.json"),
              "odg_loss_sha256": digest("a.odg.loss.json"),
              "idml_blocking": idml_report["counts"]["blocking"],
              "odg_blocking": odg_report["counts"]["blocking"],
              "invariants": {
                  "runtime_source_hash": True,
                  "deterministic_target_bytes": True,
                  "deterministic_loss_report": True,
                  "canonical_json_sidecar": True,
                  "human_loss_sidecar": True,
              },
          }
          (out / "acceptance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: free-pub-editable-cli-v1
          path: ${{ env.CHAPTERA_EDITABLE_CLI_OUT }}/acceptance.json
          if-no-files-found: error
          retention-days: 30

      - name: Materialize pinned fallback font
        shell: bash
        run: |
          set -euo pipefail
          font="$RUNNER_TEMP/chaptera-fallback.ttf"
          cargo run -q -p chaptera-desktop-fallback-font-resource --bin materialize-fallback-font -- "$font"
          test -s "$font"
          echo "CHAPTERA_FIXED_OUTPUT_FONT=$font" >> "$GITHUB_ENV"

      - name: Convert real PUB twice
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/free-pub-pdf-cli-v1"
          mkdir -p "$out"
          cli="vendor/producer-a/target/debug/pub"

          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to pdf --output "$out/a.pdf" --fallback-font "$CHAPTERA_FIXED_OUTPUT_FONT" --json > "$out/a.cli.json"
          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to pdf --output "$out/b.pdf" --fallback-font "$CHAPTERA_FIXED_OUTPUT_FONT" > "$out/b.cli.txt"

          cmp "$out/a.pdf" "$out/b.pdf"
          cmp "$out/a.pdf.loss.json" "$out/b.pdf.loss.json"
          cmp "$out/a.pdf.loss.txt" "$out/b.pdf.loss.txt"
          test "$(head -c 8 "$out/a.pdf")" = "%PDF-1.7"
          test -s "$out/a.pdf.loss.json"
          test -s "$out/a.pdf.loss.txt"
          echo "CHAPTERA_CLI_OUT=$out" >> "$GITHUB_ENV"

      - name: Validate source-safe acceptance receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["CHAPTERA_CLI_OUT"])
          expected_source = "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          report = json.loads((out / "a.pdf.loss.json").read_text(encoding="utf-8"))
          cli_report = json.loads((out / "a.cli.json").read_text(encoding="utf-8"))

          assert report == cli_report
          assert report["schema_version"] == "free-pub-pdf-v0.1"
          assert "resource_projection" not in report
          assert report["source"]["label"] == "SampleNewsletter.pub"
          assert report["typography"]["fallback_font"]["label"] == "chaptera-fallback.ttf"
          assert "/" not in report["source"]["label"] and "\\" not in report["source"]["label"]
          assert "/" not in report["typography"]["fallback_font"]["label"] and "\\" not in report["typography"]["fallback_font"]["label"]
          assert report["conversion_profile"]["source"]["source_sha256"] == expected_source
          assert report["target"]["format"] == "pdf"
          assert report["typography"]["disposition"] == "explicit_user_fallback_not_source_font"
          assert len(report["typography"]["fallback_font"]["fingerprint_sha256"]) == 64
          assert report["typography"]["shaped_flow"]["output_adapter_reshaping_calls"] == 0
          assert report["typography"]["fixed_flow_receipt"]["invariants"]["reshaping_calls"] == 0
          assert report["typography"]["fixed_flow_receipt"]["invariants"]["raw_text_emitted"] is False
          assert report["typography"]["fixed_flow_receipt"]["invariants"]["line_order_preserved"] is True
          assert report["pdf"]["capabilities"]["resolved_text"] is True
          assert report["pdf"]["capabilities"]["images"] is True
          assert report["typography"]["materialized_runs"]

          deprecated = {
              "pdf.text.multi_frame_unsupported",
              "pdf.text.multiline_unsupported",
              "pdf.text.non_ascii_unsupported",
              "pdf.text.single_line_overflow",
          }
          assert all(item.get("code") not in deprecated for item in report["typography"]["skipped"])

          def digest(name):
              return hashlib.sha256((out / name).read_bytes()).hexdigest()

          canonical = {
              "pdf_sha256": digest("a.pdf"),
              "loss_json_sha256": digest("a.pdf.loss.json"),
              "loss_text_sha256": digest("a.pdf.loss.txt"),
          }
          print("alpha_candidate_hashes=" + json.dumps(canonical, sort_keys=True))
          diagnostic_codes = {
              item.get("code") for item in report["pdf"].get("diagnostics", [])
          }
          assert "pdf.image.alpha_unsupported" not in diagnostic_codes
          assert "pdf.image.preview_alpha_unsupported" in diagnostic_codes
          assert any(
              item.get("code") == "pdf.node.painted_exact_image"
              for item in report["pdf"].get("nodes", [])
          )

          # Canonical exact-head baseline after preview-alpha provenance fencing.
          # SampleNewsletter carries alpha through a derived Viewer preview, not
          # an exact embedded image resource, so it must not inherit /SMask.
          assert canonical["pdf_sha256"] == "52ec92919a4d10e5175ab66fa6bf6eac5c171ed2ba5c257d0a5449b4c7d2d062"
          assert canonical["loss_json_sha256"] == "adf460569d47730812cee86581d916ace0f78efb8ceb550346f4aab1a613c1fd"
          assert canonical["loss_text_sha256"] == "802b475b0a759b99c0af26498b2a67df46034c5577e0a974ba037b022afcd062"

          receipt = {
              "schema": "chaptera.free-pub-pdf-cli-acceptance.v1",
              "source_sha256": expected_source,
              "pdf_sha256": digest("a.pdf"),
              "loss_json_sha256": digest("a.pdf.loss.json"),
              "loss_text_sha256": digest("a.pdf.loss.txt"),
              "fallback_font_sha256": report["typography"]["fallback_font"]["fingerprint_sha256"],
              "visible_line_count": report["typography"]["shaped_flow"]["visible_line_count"],
              "materialized_run_count": len(report["typography"]["materialized_runs"]),
              "skipped_run_count": len(report["typography"]["skipped"]),
              "pdf_diagnostic_count": len(report["pdf"].get("diagnostics", [])),
              "invariants": {
                  "exact_source_identity": True,
                  "deterministic_pdf_bytes": True,
                  "deterministic_loss_report": True,
                  "portable_report_labels": True,
                  "explicit_fallback_font": True,
                  "opentype_embedding_flags_parsed": True,
                  "output_adapter_reshaping_calls": 0,
                  "raw_source_bytes_emitted": False,
                  "raw_document_text_emitted": False,
              },
          }
          (out / "acceptance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: free-pub-pdf-cli-v1
          path: ${{ env.CHAPTERA_CLI_OUT }}/acceptance.json
          if-no-files-found: error
          retention-days: 30
