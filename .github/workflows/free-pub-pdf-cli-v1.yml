name: Free PUB PDF CLI V1

on:
  pull_request:
    paths:
      - ".github/workflows/free-pub-pdf-cli-v1.yml"
      - "vendor/producer-a/Cargo.toml"
      - "vendor/producer-a/crates/pub-cli/**"
      - "vendor/producer-a/crates/pub-pdf/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  bounded-pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt

      - name: Format and compile owned slice
        run: |
          rustfmt --edition 2024 --check \
            vendor/producer-a/crates/pub-cli/src/main.rs \
            vendor/producer-a/crates/pub-cli/src/fixed_pdf.rs \
            vendor/producer-a/crates/pub-pdf/src/lib.rs \
            vendor/producer-a/crates/pub-pdf/src/text.rs \
            vendor/producer-a/crates/pub-output/src/lib.rs \
            vendor/producer-a/crates/pub-viewer/src/lib.rs
          cargo check --manifest-path vendor/producer-a/Cargo.toml -p pub-cli -p pub-pdf -p pub-output -p pub-viewer --all-targets

      - name: Run focused fixed-output tests
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-output reads_opentype_embedding_flags_without_licensing_guesswork
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-output restricted_font_is_explicit_block_by_default
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-pdf
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-cli report_label_ --bin pub
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-cli resource_scene_ --bin pub

      - name: Build public CLI
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-cli --bin pub

      - name: Acquire pinned Apache POI SampleNewsletter
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/SampleNewsletter.pub"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" \
            --output "$fixture"
          actual_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          actual_size="$(wc -c < "$fixture" | tr -d ' ')"
          test "$actual_sha" = "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          test "$actual_size" = "291840"
          echo "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" >> "$GITHUB_ENV"

      - name: Materialize pinned fallback font
        shell: bash
        run: |
          set -euo pipefail
          font="$RUNNER_TEMP/chaptera-fallback.ttf"
          cargo run -q -p chaptera-desktop-fallback-font-resource --bin materialize-fallback-font -- "$font"
          test -s "$font"
          echo "CHAPTERA_FIXED_OUTPUT_FONT=$font" >> "$GITHUB_ENV"

      - name: Convert real PUB twice
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/free-pub-pdf-cli-v1"
          mkdir -p "$out"
          cli="vendor/producer-a/target/debug/pub"

          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to pdf --output "$out/a.pdf" --fallback-font "$CHAPTERA_FIXED_OUTPUT_FONT" --json > "$out/a.cli.json"
          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to pdf --output "$out/b.pdf" --fallback-font "$CHAPTERA_FIXED_OUTPUT_FONT" > "$out/b.cli.txt"

          cmp "$out/a.pdf" "$out/b.pdf"
          cmp "$out/a.pdf.loss.json" "$out/b.pdf.loss.json"
          cmp "$out/a.pdf.loss.txt" "$out/b.pdf.loss.txt"
          test "$(head -c 8 "$out/a.pdf")" = "%PDF-1.7"
          test -s "$out/a.pdf.loss.json"
          test -s "$out/a.pdf.loss.txt"
          echo "CHAPTERA_CLI_OUT=$out" >> "$GITHUB_ENV"

      - name: Validate source-safe acceptance receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          out = Path(os.environ["CHAPTERA_CLI_OUT"])
          expected_source = "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          report = json.loads((out / "a.pdf.loss.json").read_text(encoding="utf-8"))
          cli_report = json.loads((out / "a.cli.json").read_text(encoding="utf-8"))

          assert report == cli_report
          assert report["schema_version"] == "free-pub-pdf-v0.1"
          assert "resource_projection" not in report
          assert report["source"]["label"] == "SampleNewsletter.pub"
          assert report["typography"]["fallback_font"]["label"] == "chaptera-fallback.ttf"
          assert "/" not in report["source"]["label"] and "\\" not in report["source"]["label"]
          assert "/" not in report["typography"]["fallback_font"]["label"] and "\\" not in report["typography"]["fallback_font"]["label"]
          assert report["conversion_profile"]["source"]["source_sha256"] == expected_source
          assert report["target"]["format"] == "pdf"
          assert report["typography"]["disposition"] == "explicit_user_fallback_not_source_font"
          assert len(report["typography"]["fallback_font"]["fingerprint_sha256"]) == 64
          assert report["typography"]["shaped_flow"]["output_adapter_reshaping_calls"] == 0
          assert report["typography"]["fixed_flow_receipt"]["invariants"]["reshaping_calls"] == 0
          assert report["typography"]["fixed_flow_receipt"]["invariants"]["raw_text_emitted"] is False
          assert report["typography"]["fixed_flow_receipt"]["invariants"]["line_order_preserved"] is True
          assert report["pdf"]["capabilities"]["resolved_text"] is True
          assert report["pdf"]["capabilities"]["images"] is True
          assert report["typography"]["materialized_runs"]

          deprecated = {
              "pdf.text.multi_frame_unsupported",
              "pdf.text.multiline_unsupported",
              "pdf.text.non_ascii_unsupported",
              "pdf.text.single_line_overflow",
          }
          assert all(item.get("code") not in deprecated for item in report["typography"]["skipped"])

          def digest(name):
              return hashlib.sha256((out / name).read_bytes()).hexdigest()

          current_digests = {
              "pdf": digest("a.pdf"),
              "loss_json": digest("a.pdf.loss.json"),
              "loss_text": digest("a.pdf.loss.txt"),
          }
          print("CURRENT_FIXED_PDF_DIGESTS", json.dumps(current_digests, sort_keys=True))
          assert report["typography"]["layout_authority"] == "viewer_shared_resolved"
          assert report["typography"]["shaped_flow"]["layout_authority"] == "viewer_shared_resolved"

          receipt = {
              "schema": "chaptera.free-pub-pdf-cli-acceptance.v1",
              "source_sha256": expected_source,
              "pdf_sha256": digest("a.pdf"),
              "loss_json_sha256": digest("a.pdf.loss.json"),
              "loss_text_sha256": digest("a.pdf.loss.txt"),
              "fallback_font_sha256": report["typography"]["fallback_font"]["fingerprint_sha256"],
              "visible_line_count": report["typography"]["shaped_flow"]["visible_line_count"],
              "materialized_run_count": len(report["typography"]["materialized_runs"]),
              "skipped_run_count": len(report["typography"]["skipped"]),
              "pdf_diagnostic_count": len(report["pdf"]["diagnostics"]),
              "invariants": {
                  "exact_source_identity": True,
                  "deterministic_pdf_bytes": True,
                  "deterministic_loss_report": True,
                  "portable_report_labels": True,
                  "explicit_fallback_font": True,
                  "opentype_embedding_flags_parsed": True,
                  "output_adapter_reshaping_calls": 0,
                  "raw_source_bytes_emitted": False,
                  "raw_document_text_emitted": False,
              },
          }
          (out / "acceptance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Measure Publisher-reference causal witnesses without new CI fanout
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "PyMuPDF==1.26.7" "Pillow==12.3.0"
          out="$RUNNER_TEMP/free-pub-pdf-causal"
          mkdir -p "$out"
          donor="https://raw.githubusercontent.com/Lalalalendia/lalamu/f78cc6f455f4dc222868f9cc035511a6ca7a91ea/pub-corpus/corpus/native/unclassified"

          while IFS='|' read -r name sha bytes; do
            curl --fail --location --silent --show-error "$donor/$sha.pub" --output "$out/$name.pub"
            test "$(sha256sum "$out/$name.pub" | awk '{print $1}')" = "$sha"
            test "$(wc -c < "$out/$name.pub" | tr -d ' ')" = "$bytes"
            vendor/producer-a/target/debug/pub convert "$out/$name.pub"               --to pdf               --output "$out/$name.pdf"               --fallback-font "$CHAPTERA_FIXED_OUTPUT_FONT"
          done <<'EOF'
          027_ffa9e40e03bb37df|ffa9e40e03bb37df27fae0e1766b95db36f64fc8bda84758ad6cc6147e269bb0|3851264
          099_00092479c94bf5ac|00092479c94bf5ac1bb107173d60fb788b91e2c148453468456f98d0bb300597|603136
          096_712e1db9cefd0af6|712e1db9cefd0af613b12fb776720ac5d67ebe772468f2e47cb26a1f2e6ce28a|97280
          087_990cf478aed51a6e|990cf478aed51a6e7fdd63556bf7402699d6a3eb1fdabaf8b18a621353878a46|95744
          EOF

          CHAPTERA_CAUSAL_OUT="$out" python - <<'PY'
          from collections import Counter
          import json
          import os
          import sys
          from pathlib import Path

          import fitz
          from PIL import Image

          sys.path.insert(0, "tools")
          from cloud_reader_visual_fingerprint_v1 import GRID_H, GRID_W, compare_grid, reference_grid

          root = Path(os.environ["CHAPTERA_CAUSAL_OUT"])
          refs = []
          for path in (
              Path("tools/corpus/receipts/publisher-visual-golden-batch-01-fingerprint-v1.json"),
              Path("tools/corpus/receipts/publisher-visual-golden-supplemental-reference-available-2026-10-06-fingerprint-v1.json"),
          ):
              refs.extend(json.loads(path.read_text())["pairs"])
          by_name = {row["basename"]: row for row in refs}

          old_cli = {
              "027_ffa9e40e03bb37df": 0.307958984375,
              "099_00092479c94bf5ac": 0.25390625,
              "096_712e1db9cefd0af6": 0.001953125,
              "087_990cf478aed51a6e": 0.098388671875,
          }

          results = []
          for name, baseline in old_cli.items():
              pair = by_name[name]
              pdf = fitz.open(root / f"{name}.pdf")
              assert pdf.page_count == pair["reference_pages"], (name, pdf.page_count, pair["reference_pages"])
              pages = []
              for index, reference_page in enumerate(pair["pages"]):
                  pix = pdf[index].get_pixmap(dpi=144, colorspace=fitz.csRGB, alpha=False)
                  image = Image.frombytes("RGB", (pix.width, pix.height), pix.samples)
                  grid = image.resize((GRID_W, GRID_H), Image.Resampling.BOX).tobytes()
                  pages.append({"page": index + 1, **compare_grid(grid, reference_grid(reference_page))})
              mean = sum(row["changed_cell_fraction"] for row in pages) / len(pages)

              loss = json.loads((root / f"{name}.pdf.loss.json").read_text())
              runs = loss["typography"]["fixed_flow_receipt"]["runs"]
              materialized = loss["typography"]["materialized_runs"]
              skipped = loss["typography"]["skipped"]
              safe = {
                  "materialized_run_count": len(materialized),
                  "skipped_run_count": len(skipped),
                  "skipped_code_counts": dict(sorted(Counter(str(x.get("code", "unknown")) for x in skipped).items())),
                  "layout_fallback_counts": loss["typography"]["shaped_flow"].get("layout_fallback_counts", {}),
                  "nonzero_baseline_x_count": sum(int(x.get("baseline_x", 0) != 0) for x in runs),
                  "nonblack_fill_count": sum(int(x.get("fill_rgb") not in (None, [0, 0, 0])) for x in materialized),
                  "source_kind_counts": dict(sorted(Counter(str(x.get("source_kind", "unknown")) for x in materialized).items())),
              }
              results.append({
                  "fixture": name,
                  "reference_pages": pair["reference_pages"],
                  "old_cli_mean_changed_cell_fraction": baseline,
                  "current_mean_changed_cell_fraction": mean,
                  "delta_from_old_cli": mean - baseline,
                  "safe_text_receipt": safe,
                  "pages": pages,
              })

          receipt = {
              "schema": "chaptera.pub-pdf-cli-viewer-text-causal-set.v1",
              "fixtures": results,
              "claims": {
                  "same_registered_publisher_references": True,
                  "raw_pub_pdf_font_or_text_emitted": False,
                  "screening_grid_not_full_pixel_parity": True,
              },
          }
          target = Path("target/free-pub-pdf-cli-v1/causal.json")
          target.parent.mkdir(parents=True, exist_ok=True)
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))

          current = {row["fixture"]: row["current_mean_changed_cell_fraction"] for row in results}
          assert current["027_ffa9e40e03bb37df"] < old_cli["027_ffa9e40e03bb37df"]
          assert current["096_712e1db9cefd0af6"] <= 0.01
          assert current["087_990cf478aed51a6e"] <= 0.11
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: free-pub-pdf-cli-v1
          path: |
            ${{ env.CHAPTERA_CLI_OUT }}/acceptance.json
            target/free-pub-pdf-cli-v1/causal.json
          if-no-files-found: error
          retention-days: 30
