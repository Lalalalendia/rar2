name: Mature 029 direct classification contract

on:
  pull_request:
    paths:
      - "tools/windows/run_mature_029_native_page_spread_direct.ps1"
      - ".github/workflows/mature-029-direct-classification-contract.yml"

permissions:
  contents: read

concurrency:
  group: mature-029-direct-classification-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Parse direct launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "tools/windows/run_mature_029_native_page_spread_direct.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
            throw "PowerShell parser rejected 029 direct launcher"
          }

      - name: Enforce native classification fence
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $text = Get-Content "tools/windows/run_mature_029_native_page_spread_direct.ps1" -Raw
          foreach ($required in @(
            "ExpectedClassifierMerge",
            "ExpectedClassifierBlob",
            "OutputRoot is not empty",
            "mature-029-reference-surface-classification.json",
            "classification_uses_native_publisher_state",
            "raster_similarity_used",
            "pdf_page_count_used_as_pub_semantics",
            "unknown_is_fail_closed",
            "production_sheet",
            "booklet_intent"
          )) {
            if (-not $text.Contains($required)) {
              throw "Missing 029 direct-classification marker: $required"
            }
          }
          foreach ($forbidden in @(
            "Invoke-WebRequest",
            "Start-BitsTransfer",
            "curl.exe",
            "config.cmd",
            "registration token"
          )) {
            if ($text.Contains($forbidden)) {
              throw "Forbidden 029 direct capability: $forbidden"
            }
          }
