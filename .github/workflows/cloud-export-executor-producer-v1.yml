name: CLOUD-EXPORT-EXECUTOR-01 edited producer proof

on:
  pull_request:
    paths:
      - "apps/chaptera-server/Cargo.toml"
      - "apps/chaptera-server/src/export_*.rs"
      - "apps/chaptera-server/src/job_*.rs"
      - "apps/chaptera-server/src/quota_*.rs"
      - "apps/chaptera-server/src/revision_materializer.rs"
      - "apps/chaptera-server/src/schema_migration.rs"
      - "apps/chaptera-server/src/authz_runtime.rs"
      - "apps/chaptera-server/src/blob_store.rs"
      - "apps/chaptera-server/tests/export_*.rs"
      - "apps/chaptera-server/migrations/0008_quota_reservations.sql"
      - "apps/chaptera-server/migrations/0010_export_publications.sql"
      - "tools/run_cloud_migration_receipt.py"
      - "tools/ci/scribus_idml_consumer.py"
      - "vendor/producer-a/crates/pub-editor/**"
      - "!vendor/producer-a/crates/pub-editor/tests/delete_node_runtime_v1.rs"
      - "!vendor/producer-a/crates/pub-editor/src/session_geometry.rs"
      - "!vendor/producer-a/crates/pub-editor/src/session_table.rs"
      - "!vendor/producer-a/crates/pub-editor/src/session_image.rs"
      - "!vendor/producer-a/crates/pub-editor/tests/story_text_session_v1.rs"
      - ".github/workflows/cloud-export-executor-producer-v1.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  edited-export-producer:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.94.1
        with:
          components: rustfmt, clippy

      - name: Install independent editable-output consumers
        run: |
          set -euo pipefail
          sudo timeout 600s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          # Hosted Ubuntu mirrors can exceed the former 600s cap; keep the install bounded within the 45-minute job.
          sudo timeout 1500s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends scribus libreoffice-draw xvfb

      - name: Fetch pinned real Publisher fixture
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/SampleNewsletter.pub"
          curl --fail --location --silent --show-error             "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub"             --output "$fixture"
          actual="$(sha256sum "$fixture" | awk '{print $1}')"
          test "$actual" = "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          echo "CHAPTERA_EXPORT_FIXTURE=$fixture" >> "$GITHUB_ENV"

      - name: Prove exact edited real-PUB IDML + ODG producers
        env:
          CHAPTERA_EXPORT_EVIDENCE_DIR: ${{ runner.temp }}/chaptera-export-consumer
        run: cargo test -p chaptera-server --test export_executor_producer -- --ignored --nocapture

      - name: Prove IDML survives independent Scribus consumer
        env:
          CHAPTERA_EXPORT_EVIDENCE_DIR: ${{ runner.temp }}/chaptera-export-consumer
        run: |
          set -euo pipefail
          test -s "$CHAPTERA_EXPORT_EVIDENCE_DIR/edited.idml"
          xvfb-run -a scribus --version
          CHAPTERA_SCRIBUS_SLA_OUT="$CHAPTERA_EXPORT_EVIDENCE_DIR/edited.sla" \
            xvfb-run -a scribus -g -ns -py tools/ci/scribus_idml_consumer.py -- \
            "$CHAPTERA_EXPORT_EVIDENCE_DIR/edited.idml"
          test -s "$CHAPTERA_EXPORT_EVIDENCE_DIR/edited.sla"
          grep -aF "Chaptera export proof" "$CHAPTERA_EXPORT_EVIDENCE_DIR/edited.sla"

      - name: Prove ODG survives independent LibreOffice Draw consumer
        env:
          CHAPTERA_EXPORT_EVIDENCE_DIR: ${{ runner.temp }}/chaptera-export-consumer
        run: |
          set -euo pipefail
          test -s "$CHAPTERA_EXPORT_EVIDENCE_DIR/edited.odg"
          libreoffice --version
          mkdir -p "$CHAPTERA_EXPORT_EVIDENCE_DIR/libreoffice"
          libreoffice --headless             --convert-to fodg             --outdir "$CHAPTERA_EXPORT_EVIDENCE_DIR/libreoffice"             "$CHAPTERA_EXPORT_EVIDENCE_DIR/edited.odg"
          test -s "$CHAPTERA_EXPORT_EVIDENCE_DIR/libreoffice/edited.fodg"
          grep -aF "Chaptera export proof" "$CHAPTERA_EXPORT_EVIDENCE_DIR/libreoffice/edited.fodg"

      - name: Record source-safe editable-target receipt
        env:
          CHAPTERA_EXPORT_EVIDENCE_DIR: ${{ runner.temp }}/chaptera-export-consumer
        run: |
          set -euo pipefail
          {
            echo "head_sha=$GITHUB_SHA"
            echo "source_sha256=6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
            echo "idml_sha256=$(sha256sum "$CHAPTERA_EXPORT_EVIDENCE_DIR/edited.idml" | awk '{print $1}')"
            echo "odg_sha256=$(sha256sum "$CHAPTERA_EXPORT_EVIDENCE_DIR/edited.odg" | awk '{print $1}')"
            echo "scribus=$(xvfb-run -a scribus --version 2>&1 | tr '\n' ' ')"
            echo "libreoffice=$(libreoffice --version 2>&1 | tr '\n' ' ')"
          } > "$CHAPTERA_EXPORT_EVIDENCE_DIR/consumer-receipt.txt"

      - name: Prove durable export publication authority
        run: 'cargo test -p chaptera-server export_publication::'

      - name: Prove published export JobExecutor
        run: 'cargo test -p chaptera-server export_executor::'

      - name: Prove real queue quota executor artifact terminal vertical
        run: cargo test -p chaptera-server --test export_publication_vertical -- --ignored --nocapture

      - name: Build chaptera server for migration receipt
        run: cargo build -p chaptera-server

      - name: Verify schema migration v10
        run: |
          python tools/run_cloud_migration_receipt.py \
            --binary target/debug/chaptera \
            --out target/cloud-export-publication/migration

      - uses: actions/upload-artifact@v4
        with:
          name: cloud-export-publication-v1
          if-no-files-found: error
          retention-days: 90
          path: |
            target/cloud-export-publication/
            ${{ runner.temp }}/chaptera-export-consumer/
