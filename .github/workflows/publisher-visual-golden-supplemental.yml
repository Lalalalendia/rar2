name: Publisher visual golden supplemental current Reader

on:
  pull_request:
    paths:
      - ".github/workflows/publisher-visual-golden-supplemental.yml"
      - "tools/cloud_reader_visual_supplemental_v1.py"
      - "tools/corpus/receipts/publisher-visual-golden-supplemental-2026-10-06-pairs.csv"
      - "tools/corpus/receipts/publisher-visual-golden-supplemental-reference-available-2026-10-06-fingerprint-v1.json"
      - "apps/cloud-reader/**"
      - "apps/chaptera-server/src/reader_scene_v1.rs"
      - "apps/chaptera-server/src/guest_reader_worker.rs"
      - "crates/chaptera-viewer-render-plan/**"
      - "!crates/chaptera-viewer-render-plan/src/shared_layout_diagnostics.rs"
      - "vendor/producer-a/crates/pub-viewer/Cargo.toml"
      - "vendor/producer-a/crates/pub-viewer/src/**"
      - "!vendor/producer-a/crates/pub-viewer/src/authoring_projection.rs"
      - "vendor/producer-a/crates/pub-reader/src/lib.rs"
      - "vendor/producer-a/crates/pub-reader/src/page_projection.rs"
      - "vendor/producer-a/crates/pub-reader/src/paint_projection.rs"
      - "vendor/producer-a/crates/pub-reader/src/source_paint_order.rs"
      - "vendor/producer-a/crates/pub-reader/src/typography_projection.rs"
      - "vendor/producer-a/crates/pub-reader/src/direct_transform.rs"
      - "vendor/producer-a/crates/pub-reader/src/grouped_projection.rs"
      - "vendor/producer-a/crates/pub-reader/src/anchor_geometry.rs"
      - "vendor/producer-a/crates/pub-reader/src/story_materialization.rs"
      - "vendor/producer-a/crates/pub-reader/src/quill_admission.rs"
      - "vendor/producer-a/crates/pub-reader/src/publication_document.rs"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publisher-visual-golden-supplemental.yml"
      - "tools/cloud_reader_visual_supplemental_v1.py"
      - "tools/corpus/receipts/publisher-visual-golden-supplemental-2026-10-06-pairs.csv"
      - "tools/corpus/receipts/publisher-visual-golden-supplemental-reference-available-2026-10-06-fingerprint-v1.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: publisher-visual-golden-supplemental-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/publisher-visual-supplemental-rust

jobs:
  current-reader:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Build supplemental Cargo cache key
        id: supplemental-cargo-cache-key
        shell: bash
        env:
          MANIFEST_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'apps/chaptera-server/Cargo.toml', 'crates/**/Cargo.toml', 'vendor/producer-a/Cargo.toml', 'vendor/producer-a/Cargo.lock', 'vendor/producer-a/crates/**/Cargo.toml') }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST_HASH"
          echo "key=publisher-visual-supplemental-rust-v1-${RUNNER_OS}-rust-1.94.1-${MANIFEST_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore/save supplemental Cargo build cache
        id: supplemental-cargo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/publisher-visual-supplemental-rust
          key: ${{ steps.supplemental-cargo-cache-key.outputs.key }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Verify pinned 1050 and supplemental contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = sorted(Path("out/pinned1050/materialized/native").glob("*.pub"))
          shas = [path.stem.casefold() for path in paths]
          digest = hashlib.sha256("".join(sha + "\n" for sha in shas).encode("ascii")).hexdigest()
          assert len(shas) == 1050, len(shas)
          assert digest == "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43", digest
          print("pinned 1050 verified", digest)
          PY
          python -m pip install --disable-pip-version-check --no-cache-dir "Pillow==12.3.0"
          python -m py_compile tools/cloud_reader_visual_fingerprint_v1.py
          python -m py_compile tools/cloud_reader_visual_supplemental_v1.py
          python - <<'PY'
          import hashlib
          from pathlib import Path
          path = Path("tools/corpus/receipts/publisher-visual-golden-supplemental-reference-available-2026-10-06-fingerprint-v1.json")
          digest = hashlib.sha256(path.read_bytes()).hexdigest()
          assert digest == "fb9768bc5f00cd470e3e8a379e9fd3548fb893aa5334abdde769110aaf372565", digest
          print("supplemental reference fingerprint:", digest)
          PY

      - name: Prepare 24 new hosted supplemental PUB fixtures
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/publisher-visual-supplemental"
          mkdir -p "$RUNNER_TEMP/publisher-visual-supplemental"
          python tools/cloud_reader_visual_supplemental_v1.py prepare             tools/corpus/receipts/publisher-visual-golden-supplemental-2026-10-06-pairs.csv             out/pinned1050/materialized/native             "$RUNNER_TEMP/publisher-visual-supplemental/fixtures"             "$RUNNER_TEMP/publisher-visual-supplemental/manifest.json"

      - name: Emit exact 100 picture placement profile
        env:
          READER_CORPUS_DIAGNOSTIC: "1"
        run: |
          set -euo pipefail
          cargo run --quiet --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader --bin source_image_export_probe -- \
            "$RUNNER_TEMP/publisher-visual-supplemental/fixtures/100_b1faaba988e88b41.pub"

      - name: Build canonical Cloud Reader worker
        env:
          SUPPLEMENTAL_CARGO_CACHE_HIT: ${{ steps.supplemental-cargo-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          cargo build -p chaptera-server --bin chaptera --jobs 2
          elapsed="$(($(date +%s) - start))"
          echo "supplemental_cargo_cache_hit=${SUPPLEMENTAL_CARGO_CACHE_HIT:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "supplemental_cargo_build_seconds=$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Restore pinned Playwright Chromium cache
        id: playwright-chromium-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: publisher-visual-supplemental-${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install pinned browser acceptance runtime
        env:
          PLAYWRIGHT_CACHE_HIT: ${{ steps.playwright-chromium-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          start="$(date +%s)"
          npm install --no-save playwright@1.55.0
          npx playwright install chromium
          node -e 'const { chromium } = require("playwright"); (async()=>{const b=await chromium.launch({headless:true}); const p=await b.newPage(); await p.setContent("<title>chaptera-playwright-smoke</title>"); if((await p.title())!=="chaptera-playwright-smoke") throw new Error("smoke title mismatch"); await b.close();})().catch(e=>{console.error(e);process.exit(1)})'
          elapsed="$(($(date +%s) - start))"
          echo "playwright_cache_hit=${PLAYWRIGHT_CACHE_HIT:-unknown}" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "playwright_setup_seconds=$elapsed" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Render new hosted supplemental set through current Reader
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          READER_CORPUS_DIAGNOSTIC: "1"
          READER_WORKER_BINARY: ${{ github.workspace }}/target/publisher-visual-supplemental-rust/debug/chaptera
          READER_REAL_MANIFEST: ${{ runner.temp }}/publisher-visual-supplemental/manifest.json
          READER_REAL_OUTPUT: ${{ runner.temp }}/publisher-visual-supplemental/browser
          READER_REFERENCE_RASTER_DPI: "144"
          READER_CONTINUE_WORKER_FAILURES: "1"
          READER_WORKER_TIMEOUT_SECONDS: "120"
          READER_WORKER_CPU_SECONDS: "90"
          READER_WORKER_ADDRESS_SPACE_MB: "768"
        run: node apps/cloud-reader/real-browser.test.mjs

      - name: Build current-Reader supplemental execution receipt
        run: |
          set -euo pipefail
          mkdir -p target/publisher-visual-supplemental
          python tools/cloud_reader_visual_supplemental_v1.py summarize \
            tools/corpus/receipts/publisher-visual-golden-supplemental-2026-10-06-pairs.csv \
            "$RUNNER_TEMP/publisher-visual-supplemental/browser/receipt.json" \
            tools/corpus/receipts/publisher-visual-golden-supplemental-reference-available-2026-10-06-fingerprint-v1.json \
            target/publisher-visual-supplemental/summary.json

      - name: Enforce Reader execution acceptance and report surface-count differences
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("target/publisher-visual-supplemental/summary.json").read_text())
          print(json.dumps({
              "hosted_pair_count": data["hosted_pair_count"],
              "hosted_reference_page_count": data["hosted_reference_page_count"],
              "rendered_pair_count": data["rendered_pair_count"],
              "unsupported_pair_count": data["unsupported_pair_count"],
              "page_count_mismatch_pair_count": data["page_count_mismatch_pair_count"],
              "visual_degeneracy_pair_count": data["visual_degeneracy_pair_count"],
              "visual_degeneracy_count": data["visual_degeneracy_count"],
              "visual_reference_fingerprint_state": data["visual_reference_fingerprint_state"],
              "visual_compared_pair_count": data["visual"]["compared_pair_count"],
              "visual_compared_page_count": data["visual"]["compared_page_count"],
              "visual_mean_changed_cell_fraction": data["visual"]["corpus_mean_changed_cell_fraction"],
              "visual_worst_pages": data["visual"]["worst_pages"][:10],
              "missing_hosted_reference_pair_count": data["missing_hosted_reference_pair_count"],
              "missing_hosted_reference_pairs": data["missing_hosted_reference_pairs"],
              "unsupported_pairs": [
                  row["basename"] for row in data["unsupported_pairs"]
              ],
              "page_count_mismatches": [
                  {
                      "basename": row["basename"],
                      "candidate_pages": row["candidate_pages"],
                      "reference_pages": row["reference_pages"],
                  }
                  for row in data["page_count_mismatches"]
              ],
              "visual_degeneracy_pairs": [
                  {
                      "basename": row["basename"],
                      "count": row["visual_degeneracy_count"],
                      "details": row["visual_degeneracies"],
                  }
                  for row in data["visual_degeneracy_pairs"]
              ],
          }, indent=2, sort_keys=True))
          assert data["hosted_pair_count"] == 24
          assert data["hosted_reference_page_count"] == 52
          assert data["rendered_pair_count"] == 24, "not all new hosted corpus pairs render"
          assert data["unsupported_pair_count"] == 0, "new hosted corpus has unsupported Reader pairs"
          # Publisher PDF page count is an output-surface observation, not logical PAGE
          # membership authority. Mismatches remain explicit in the receipt and route to
          # the stage classifier instead of forcing Reader logical-page mutation.
          assert data["claims"]["publisher_pdf_page_count_is_not_logical_page_membership_authority"] is True
          assert data["visual_degeneracy_count"] == 0, "new hosted corpus has page-space collapsed shared-text geometry"
          assert data["missing_hosted_reference_pair_count"] == 0, "all 24 hosted Publisher reference fingerprints must be present"
          assert data["visual_reference_fingerprint_state"] == "COMPLETE_FOR_24_HOSTED_PAIRS_SURFACE_BLOCKED_3"
          assert data["visual"]["compared_pair_count"] == 21, "expected 21 hosted pairs to compare after surface-stage fail-closed exclusions"
          assert data["visual"]["compared_page_count"] == 47, "expected 47 hosted pages to compare after surface-stage fail-closed exclusions"
          assert data["visual"]["unavailable_pair_count"] == 3, "expected only the three known surface-stage mismatches to remain unavailable"
          assert {row["fixture"] for row in data["visual"]["unavailable_pairs"]} == {
              "083_5eb5055bc75918ca",
              "086_248596cea8019134",
              "095_1e7f38b3ce1d0d95",
          }, data["visual"]["unavailable_pairs"]
          PY

      - name: Upload source-free supplemental receipt
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publisher-visual-golden-supplemental-receipt
          path: target/publisher-visual-supplemental/summary.json
          if-no-files-found: error
          retention-days: 90
