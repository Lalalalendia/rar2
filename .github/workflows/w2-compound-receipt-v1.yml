name: W2 compound receipt contract

on:
  pull_request:
    paths:
      - ".github/workflows/w2-compound-receipt-v1.yml"
      - "packages/protocol/w2-compound/**"
      - "tools/build_w2_compound_receipt.py"
      - "tools/test_build_w2_compound_receipt.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: w2-compound-receipt-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test same-document compound receipt contract
        run: |
          python -m pip install "jsonschema==4.23.0"
          python tools/test_build_w2_compound_receipt.py -v
