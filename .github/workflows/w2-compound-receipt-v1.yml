name: W2 compound receipt V1

on:
  pull_request:
    paths:
      - ".github/workflows/w2-compound-receipt-v1.yml"
      - "packages/protocol/w2-compound/**"
      - "packages/protocol/authoring-overset/**"
      - "packages/protocol/project-fork/**"
      - "tools/build_w2_compound_receipt.py"
      - "tools/test_build_w2_compound_receipt.py"
      - "tools/build_authoring_overset_receipt.py"
      - "tools/validate_authoring_overset_receipt.py"
      - "tools/validate_project_fork_receipt.py"
      - "tools/run_editor_desktop_continuity_v2.py"
      - "tools/validate_editor_desktop_continuity_v2_receipt.py"
      - "apps/chaptera-desktop/src/acceptance_v2.rs"
      - "vendor/producer-a/crates/pub-editor/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: w2-compound-receipt-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semantic-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install receipt validators
        run: python -m pip install "jsonschema==4.23.0"
      - name: Test compound builder fail-closed contract
        run: python tools/test_build_w2_compound_receipt.py -v
      - name: Build bounded producer
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p chaptera-producer-a
      - name: Build and validate real overset receipt
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/w2-compound/semantic
          python tools/build_authoring_overset_receipt.py \
            --source-hash aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            --document-id 30000000-0000-4000-8000-000000000001 \
            --output target/w2-compound/semantic/overset.json \
            --implementation chaptera-producer-a \
            --commit-or-build "$GITHUB_SHA" \
            -- vendor/producer-a/target/debug/chaptera-producer-a authoring-overset
          python tools/validate_authoring_overset_receipt.py target/w2-compound/semantic/overset.json
      - name: Build and validate project fork receipt
        shell: bash
        run: |
          set -euo pipefail
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --test project_fork_v1
          cargo run --quiet --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --bin project_fork_receipt_v1 > target/w2-compound/semantic/fork.json
          python tools/validate_project_fork_receipt.py target/w2-compound/semantic/fork.json
      - uses: actions/upload-artifact@v4
        with:
          name: w2-compound-semantic-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/w2-compound/semantic
          if-no-files-found: error

  newsletter-evidence:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install continuity validator
        run: python -m pip install "jsonschema==4.23.0"
      - name: Acquire pinned SampleNewsletter
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          $url = "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub"
          Invoke-WebRequest -Uri $url -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $fixture).Length
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") { throw "SampleNewsletter SHA mismatch: $hash" }
          if ($bytes -ne 291840) { throw "SampleNewsletter byte length mismatch: $bytes" }
          "CHAPTERA_W2_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Generate deterministic replacement PNG
        shell: pwsh
        run: |
          $replacement = Join-Path $env:RUNNER_TEMP "w2-compound-replacement.png"
          $env:CHAPTERA_W2_REPLACEMENT = $replacement
          @'
          import binascii, os, pathlib, struct, zlib
          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", binascii.crc32(body) & 0xffffffff)
          ihdr = struct.pack(">IIBBBBB", 2, 2, 8, 6, 0, 0, 0)
          row0 = b"\x00" + bytes([0x18,0x62,0xA0,0xFF,0xF2,0xC1,0x4E,0xFF])
          row1 = b"\x00" + bytes([0x51,0xA8,0x54,0xFF,0xD9,0x50,0x50,0xFF])
          png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(row0 + row1, 9)) + chunk(b"IEND", b"")
          pathlib.Path(os.environ["CHAPTERA_W2_REPLACEMENT"]).write_bytes(png)
          '@ | python -
          "CHAPTERA_W2_REPLACEMENT=$replacement" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Build current Chaptera Editor
        run: cargo build -p chaptera-desktop --release --bin chaptera-editor
      - name: Reproduce bounded newsletter receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $out = Join-Path $env:RUNNER_TEMP "w2-compound-newsletter"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $project = Join-Path $out "newsletter.project.json"
          $export = Join-Path $out "newsletter.edited.odg"
          $receipt = Join-Path $out "newsletter.json"
          python tools/run_editor_desktop_continuity_v2.py `
            --fixture "$env:CHAPTERA_W2_NEWSLETTER" `
            --replacement "$env:CHAPTERA_W2_REPLACEMENT" `
            --project-output "$project" `
            --export-output "$export" `
            --receipt-output "$receipt" `
            --newsletter-two-object-mode `
            -- target/release/chaptera-editor.exe --desktop-acceptance-v2 "{fixture}" "{replacement}" "{project}" "{export}"
          python tools/validate_editor_desktop_continuity_v2_receipt.py "$receipt"
          New-Item -ItemType Directory -Force -Path "target/w2-compound/newsletter" | Out-Null
          Copy-Item $receipt "target/w2-compound/newsletter/newsletter.json"
      - uses: actions/upload-artifact@v4
        with:
          name: w2-compound-newsletter-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/w2-compound/newsletter/newsletter.json
          if-no-files-found: error

  compose:
    needs: [semantic-evidence, newsletter-evidence]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install compound validator
        run: python -m pip install "jsonschema==4.23.0"
      - uses: actions/download-artifact@v4
        with:
          pattern: w2-compound-*-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/w2-compound/evidence
          merge-multiple: true
      - name: Verify merged Stage 0.2 fixed-output gate live
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/Lalalalendia/rar2/actions/runs/37474235340" \
            -o target/w2-compound/pdf-run.json
      - name: Build split-evidence W2 receipt
        shell: bash
        run: |
          set -euo pipefail
          python tools/build_w2_compound_receipt.py \
            --newsletter target/w2-compound/evidence/newsletter.json \
            --overset target/w2-compound/evidence/overset.json \
            --fork target/w2-compound/evidence/fork.json \
            --pdf-run target/w2-compound/pdf-run.json \
            --output target/w2-compound/w2-compound.json
          cat target/w2-compound/w2-compound.json
      - uses: actions/upload-artifact@v4
        with:
          name: w2-compound-receipt-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/w2-compound/w2-compound.json
          if-no-files-found: error
