name: Legacy22 PERLOST discriminator

on:
  push:
    branches:
      - research/legacy22-perlost-discriminator-restack
    paths:
      - ".github/workflows/legacy22-perlost-discriminator.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target
  LALAMU_CORPUS_REF: f78cc6f455f4dc222868f9cc035511a6ca7a91ea
  PERLOST_SHA: d72a4c79a378f93299be53220d7809a433235f74103adcffc714748068007e6f

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: ${{ env.LALAMU_CORPUS_REF }}
          path: corpus-src

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install generic CFB comparator
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Verify exact fixture
        shell: bash
        run: |
          set -euo pipefail
          p="corpus-src/pub-corpus/corpus/native/unclassified/${PERLOST_SHA}.pub"
          test -f "$p"
          echo "${PERLOST_SHA}  $p" | sha256sum -c -

      - name: Create transient structural probe
        shell: bash
        run: |
          set -euo pipefail
          cat > vendor/producer-a/crates/pub-viewer/src/bin/perlost-structural-probe.rs <<'RS'
          use anyhow::{Context, Result};
          use pub_reader::classify_pub_family;
          use pub_viewer::{open_pub_geometry, viewer_geometry_environment_v0_1};
          use serde_json::json;
          use sha2::{Digest, Sha256};
          use std::{env, fs};

          fn sha256_hex(bytes: &[u8]) -> String {
              Sha256::digest(bytes).iter().map(|b| format!("{b:02x}")).collect()
          }

          fn main() -> Result<()> {
              let path = env::args().nth(1).context("fixture path")?;
              let bytes = fs::read(&path).context("read fixture")?;
              let family = classify_pub_family(&bytes);
              let open = match open_pub_geometry(&bytes, viewer_geometry_environment_v0_1()) {
                  Ok(visual) => json!({
                      "opened": true,
                      "viewer_page_count": visual.document.pages.len(),
                      "scene_node_count": visual.scene.nodes.len(),
                      "story_count": visual.document.stories.len(),
                      "diagnostic_codes": visual.document.diagnostics.iter().map(|d| d.code.clone()).collect::<Vec<_>>(),
                  }),
                  Err(error) => json!({
                      "opened": false,
                      "error_chain": format!("{error:#}"),
                      "error_signature_sha256": sha256_hex(format!("{error:#}").as_bytes()),
                  }),
              };
              println!("{}", serde_json::to_string_pretty(&json!({
                  "schema": "chaptera.legacy22-perlost-discriminator.v1",
                  "source_sha256": sha256_hex(&bytes),
                  "byte_len": bytes.len(),
                  "family": family,
                  "open": open,
              }))?);
              Ok(())
          }
          RS

      - name: Build and run exact structural probe
        shell: bash
        run: |
          set -euo pipefail
          p="corpus-src/pub-corpus/corpus/native/unclassified/${PERLOST_SHA}.pub"
          cargo run             --manifest-path vendor/producer-a/Cargo.toml             -p pub-viewer             --release             --bin perlost-structural-probe             -- "$p" | tee /tmp/perlost-report.json

      - name: Create transient CFB probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p vendor/producer-a/crates/pub-cfb/src/bin
          cat > vendor/producer-a/crates/pub-cfb/src/bin/perlost-cfb-probe.rs <<'RS'
          use std::{env, fs, io::Cursor};

          fn main() {
              let path = env::args().nth(1).expect("fixture path");
              let bytes = fs::read(path).expect("read fixture");
              match pub_cfb::inspect_reader(Cursor::new(bytes)) {
                  Ok(inv) => println!("PUB_CFB_OK entries={}", inv.entries.len()),
                  Err(err) => println!("PUB_CFB_ERROR={err:#}"),
              }
          }
          RS

      - name: Run CFB comparators
        shell: bash
        run: |
          set -euo pipefail
          p="corpus-src/pub-corpus/corpus/native/unclassified/${PERLOST_SHA}.pub"
          cargo run \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-cfb \
            --release \
            --bin perlost-cfb-probe \
            -- "$p" | tee /tmp/perlost-cfb.txt

          python - <<'PY' | tee /tmp/perlost-olefile.json
          import json
          import olefile
          from pathlib import Path

          p=Path("corpus-src/pub-corpus/corpus/native/unclassified/d72a4c79a378f93299be53220d7809a433235f74103adcffc714748068007e6f.pub")
          with olefile.OleFileIO(str(p)) as ole:
              paths=["/"+"/".join(parts) for parts in ole.listdir(streams=True,storages=False)]
              out={
                  "stream_count":len(paths),
                  "paths":sorted(paths),
                  "parsing_issues":[
                      {"type":type(exc).__name__,"message":str(exc)}
                      for exc in getattr(ole,"parsing_issues",[])
                  ],
              }
              print(json.dumps(out,indent=2,sort_keys=True))
          PY

      - name: Prove MiniFAT validity within declared stream lengths
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/perlost-minifat-reachability.json
          import json
          import olefile
          from pathlib import Path

          p=Path("corpus-src/pub-corpus/corpus/native/unclassified/d72a4c79a378f93299be53220d7809a433235f74103adcffc714748068007e6f.pub")
          with olefile.OleFileIO(str(p)) as ole:
              ole.loadminifat()
              mf=list(ole.minifat)
              mini_sector_size=int(getattr(ole,"minisectorsize",64))
              max_regular=0xFFFFFFFA
              terminal={0xFFFFFFFF,0xFFFFFFFE,0xFFFFFFFD,0xFFFFFFFC}
              invalid={
                  i:v for i,v in enumerate(mf)
                  if v not in terminal and (v > max_regular or v >= len(mf))
              }

              required_sectors=set()
              transition_errors=[]
              tail_anomalies=[]
              checked_small_streams=0

              for idx,entry in enumerate(ole.direntries):
                  if entry is None or entry.entry_type != olefile.STGTY_STREAM:
                      continue
                  size=int(entry.size)
                  if size <= 0 or size >= ole.minisectorcutoff:
                      continue
                  checked_small_streams += 1
                  needed=(size + mini_sector_size - 1)//mini_sector_size
                  cur=int(entry.isectStart)
                  seen=set()
                  chain=[]
                  for ordinal in range(needed):
                      if cur in terminal:
                          transition_errors.append({
                              "direntry":idx,
                              "reason":"premature_terminal",
                              "ordinal":ordinal,
                              "needed":needed,
                              "size":size,
                          })
                          break
                      if not (0 <= cur < len(mf)):
                          transition_errors.append({
                              "direntry":idx,
                              "reason":"sector_out_of_range",
                              "ordinal":ordinal,
                              "at":cur,
                              "needed":needed,
                              "size":size,
                          })
                          break
                      if cur in seen:
                          transition_errors.append({
                              "direntry":idx,
                              "reason":"cycle_before_declared_len",
                              "ordinal":ordinal,
                              "at":cur,
                              "needed":needed,
                              "size":size,
                          })
                          break
                      seen.add(cur)
                      required_sectors.add(cur)
                      chain.append(cur)
                      nxt=int(mf[cur])
                      if ordinal + 1 < needed:
                          if nxt in terminal:
                              transition_errors.append({
                                  "direntry":idx,
                                  "reason":"terminal_before_declared_len",
                                  "ordinal":ordinal,
                                  "at":cur,
                                  "needed":needed,
                                  "size":size,
                              })
                              break
                          if nxt > max_regular or nxt >= len(mf):
                              transition_errors.append({
                                  "direntry":idx,
                                  "reason":"invalid_next_before_declared_len",
                                  "ordinal":ordinal,
                                  "at":cur,
                                  "next":nxt,
                                  "needed":needed,
                                  "size":size,
                              })
                              break
                          cur=nxt
                      elif nxt not in terminal:
                          tail_anomalies.append({
                              "direntry":idx,
                              "size":size,
                              "needed":needed,
                              "last_required_sector":cur,
                              "tail_next":nxt,
                              "tail_next_in_range":0 <= nxt < len(mf),
                          })

              logical_stream_read_count=0
              logical_stream_read_failures=0
              logical_stream_length_mismatches=0
              for parts in ole.listdir(streams=True,storages=False):
                  logical_stream_read_count += 1
                  try:
                      expected=int(ole.get_size(parts))
                      actual=len(ole.openstream(parts).read())
                      if actual != expected:
                          logical_stream_length_mismatches += 1
                  except Exception:
                      logical_stream_read_failures += 1

              tail_by_sector={row["last_required_sector"]:row for row in tail_anomalies}
              print(json.dumps({
                  "minifat_entry_count":len(mf),
                  "mini_sector_size":mini_sector_size,
                  "invalid_entry_count":len(invalid),
                  "invalid_entries":invalid,
                  "checked_small_stream_count":checked_small_streams,
                  "required_mini_sector_count":len(required_sectors),
                  "required_transition_error_count":len(transition_errors),
                  "required_transition_errors":transition_errors,
                  "tail_anomaly_count":len(tail_anomalies),
                  "tail_anomalies":tail_anomalies,
                  "mini_sector_384_required":384 in required_sectors,
                  "mini_sector_384_tail_anomaly":tail_by_sector.get(384),
                  "logical_stream_read_count":logical_stream_read_count,
                  "logical_stream_read_failure_count":logical_stream_read_failures,
                  "logical_stream_length_mismatch_count":logical_stream_length_mismatches,
              },indent=2,sort_keys=True))
          PY

      - name: Guard source-safe report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("/tmp/perlost-report.json")
          d=json.loads(p.read_text())
          assert d["source_sha256"] == "d72a4c79a378f93299be53220d7809a433235f74103adcffc714748068007e6f", d
          assert d["family"]["profile"] == "not_structured_publisher", d["family"]
          assert d["family"]["route"] == "unsupported", d["family"]
          assert "cfb_parse_failed" in d["family"]["reasons"], d["family"]
          cfb=Path("/tmp/perlost-cfb.txt").read_text()
          assert "PUB_CFB_ERROR=" in cfb, cfb
          ole=json.loads(Path("/tmp/perlost-olefile.json").read_text())
          reach=json.loads(Path("/tmp/perlost-minifat-reachability.json").read_text())
          assert "/Contents" in ole["paths"], ole
          assert reach["invalid_entries"].get("384") == 1431327565, reach
          assert reach["mini_sector_384_required"] is True, reach
          assert reach["mini_sector_384_tail_anomaly"]["tail_next"] == 1431327565, reach
          assert reach["required_transition_error_count"] == 0, reach
          assert reach["logical_stream_read_failure_count"] == 0, reach
          assert reach["logical_stream_length_mismatch_count"] == 0, reach
          assert reach["tail_anomaly_count"] >= 1, reach
          # Report may retain only structural metadata/error text, never source bytes or recovered story text.
          forbidden=["PERLOST.PUB", "PageWiz/", "recovered_text", "story_text"]
          raw=p.read_text()
          for token in forbidden:
              assert token not in raw, token
          print(json.dumps({"reader":d,"pub_cfb":cfb.strip(),"olefile":ole,"minifat_reachability":reach}, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: legacy22-perlost-discriminator-${{ github.run_id }}
          path: |
            /tmp/perlost-report.json
            /tmp/perlost-cfb.txt
            /tmp/perlost-olefile.json
            /tmp/perlost-minifat-reachability.json
          if-no-files-found: error
          retention-days: 30
