name: Web Temporary Editor Canonical Current V0

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/guest_reader_http.rs"
      - "apps/chaptera-server/src/guest_reader_runtime.rs"
      - "apps/chaptera-server/src/product_replay_worker.rs"
      - "apps/chaptera-server/migrations/0021_temporary_editor_revision_ttl.sql"
      - "tools/run_temporary_editor_current_acceptance.py"
      - ".github/workflows/web-temporary-editor-current-v0.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  temporary-current-real-pub:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FIXTURE_SHA256: 6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf
      FIXTURE_URL: https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Confirm Python and isolation runtime
        run: |
          python -m py_compile tools/run_temporary_editor_current_acceptance.py tools/run_cloud_reader_live_acceptance.py
          python - <<'PY'
          import ctypes.util
          assert ctypes.util.find_library("seccomp")
          PY
      - name: Fetch pinned real PUB and Caddy
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/temp-current"
          curl --fail --location --retry 4 --retry-delay 2 "$FIXTURE_URL" -o "$RUNNER_TEMP/temp-current/source.pub"
          printf '%s  %s\n' "$FIXTURE_SHA256" "$RUNNER_TEMP/temp-current/source.pub" | sha256sum -c -
          test "$(stat -c '%s' "$RUNNER_TEMP/temp-current/source.pub")" = "291840"
          curl --fail --location --retry 3 https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz -o "$RUNNER_TEMP/temp-current/caddy.tar.gz"
          echo "5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd  $RUNNER_TEMP/temp-current/caddy.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/temp-current/caddy.tar.gz" -C "$RUNNER_TEMP/temp-current" caddy
      - name: Build isolated Chaptera server/worker
        run: cargo build -p chaptera-server --bin chaptera --jobs 2
      - name: Exercise real no-login temporary EditorSession current
        run: |
          python tools/run_temporary_editor_current_acceptance.py \
            --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
            --caddy "$RUNNER_TEMP/temp-current/caddy" \
            --fixture "$RUNNER_TEMP/temp-current/source.pub" \
            --fixture-sha256 "$FIXTURE_SHA256" \
            --out "$GITHUB_WORKSPACE/target/temporary-editor-current"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: temporary-editor-current-v0
          path: |
            target/temporary-editor-current/receipt.json
            target/temporary-editor-current/chaptera.log
            target/temporary-editor-current/caddy.log
          if-no-files-found: warn
          retention-days: 30
