name: Temporary text format rustfmt

on:
  push:
    branches:
      - editor-text-format-history-01
    paths:
      - .github/workflows/_tmp_text_format_rustfmt.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          ref: editor-text-format-history-01
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.1
          components: rustfmt
      - name: Apply exact formatter
        run: rustfmt --edition 2024 vendor/producer-a/crates/pub-editor/src/lib.rs
      - name: Commit formatter result and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "chaptera-ci"
          git config user.email "chaptera-ci@users.noreply.github.com"
          git add vendor/producer-a/crates/pub-editor/src/lib.rs
          git rm .github/workflows/_tmp_text_format_rustfmt.yml
          git commit -m "Editor: apply rustfmt to text format history"
          git push origin HEAD:editor-text-format-history-01
