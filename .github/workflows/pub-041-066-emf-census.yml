name: PUB 041 066 EMF record census (source-safe)

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Download immutable 1050-source artifact
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820
      - name: Verify source corpus and pinned exact witnesses
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("out/pinned1050/materialized/native")
          paths = sorted(root.glob("*.pub"))
          assert len(paths) == 1050, len(paths)
          digest = hashlib.sha256("".join(p.stem.casefold() + "\n" for p in paths).encode("ascii")).hexdigest()
          assert digest == "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43", digest
          for sha in (
              "155f8fd8c191851e4380ab1557638aeabb34b2257fa12a7748ab00b09edb74ba",
              "d8ac6507d86e35c0f43e293760627a01b00a29586a76f8bf05b5fae702a19d13",
          ):
              path = root / (sha + ".pub")
              assert path.is_file(), sha
              assert hashlib.sha256(path.read_bytes()).hexdigest() == sha
          print("verified 1050 and exact 041/066")
          PY
      - name: Run bounded EMF record-family census
        run: |
          set -euo pipefail
          cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --bin emf_record_census_probe
          for sha in \
            155f8fd8c191851e4380ab1557638aeabb34b2257fa12a7748ab00b09edb74ba \
            d8ac6507d86e35c0f43e293760627a01b00a29586a76f8bf05b5fae702a19d13
          do
            vendor/producer-a/target/debug/emf_record_census_probe "out/pinned1050/materialized/native/${sha}.pub"
          done
