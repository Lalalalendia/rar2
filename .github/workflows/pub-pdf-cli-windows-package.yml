name: Chaptera PUB PDF CLI Windows preview package

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/workflows/pub-pdf-cli-windows-package.yml"
      - "vendor/producer-a/crates/pub-cli/src/fixed_pdf.rs"
      - "tools/ci/package_pub_pdf_cli_windows.ps1"
      - "tools/ci/test_pub_pdf_cli_windows_package.py"
      - "tools/ci/package_pub_pdf_cli_windows.ps1"
      - "tools/ci/test_pub_pdf_cli_windows_package.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pub-pdf-cli-windows-package.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pub-pdf-cli-windows-package-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  package-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Reject untrusted packaging ref
        if: github.event_name != 'pull_request'
        shell: bash
        run: test "$GITHUB_REF" = "refs/heads/main"

      - name: Assert bounded packaging and publication contract
        run: python tools/ci/test_pub_pdf_cli_windows_package.py

      - name: Parse packaging PowerShell without running build
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          $path = "tools/ci/package_pub_pdf_cli_windows.ps1"
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { throw "PowerShell parse failed: $($errors -join '; ')" }

  windows-package:
    needs: package-contract
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: windows-2022
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Compile actual Windows x64 release CLI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-cli --bin pub --release --jobs 2
          if ($LASTEXITCODE -ne 0) { throw "pub-cli release build failed" }

      - name: Stage ZIP and smoke extracted shipped executable
        shell: pwsh
        env:
          EXPECTED_CANDIDATE_SHA: ${{ github.sha }}
        run: |
          ./tools/ci/package_pub_pdf_cli_windows.ps1 -CandidateSha $env:EXPECTED_CANDIDATE_SHA

      - uses: actions/upload-artifact@v4
        with:
          name: chaptera-pub-pdf-cli-windows-x64-${{ github.sha }}
          path: ${{ runner.temp }}/pub-pdf-cli-package-output/
          if-no-files-found: error
          retention-days: 7
