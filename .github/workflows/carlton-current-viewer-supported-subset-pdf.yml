name: Carlton current Viewer Yab supported-subset PDF

on:
  pull_request:
    paths:
      - "tools/yab259_current_viewer_supported_subset_request.rs"
      - "tools/run_yab259_current_viewer_supported_subset_pdf.py"
      - "tools/test_yab259_current_viewer_supported_subset.py"
      - "tools/yab259_order_preserving_donor.py"
      - "tools/yab259_fixed_pdf_packet_renderer.rs"
      - "tools/run_yab259_fixed_pdf_closure.py"
      - "crates/chaptera-desktop-shaped-flow-runtime/**"
      - "crates/chaptera-viewer-render-plan/**"
      - "apps/chaptera-desktop/src/acceptance.rs"
      - "tools/acquire_carlton_march_pair.py"
      - "tools/pdf_reference_diff_v1.py"
      - "crates/chaptera-desktop-fallback-font-resource/**"
      - ".github/workflows/carlton-current-viewer-supported-subset-pdf.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: carlton-current-viewer-supported-subset-pdf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Source-level boundary tests
        run: python tools/test_yab259_current_viewer_supported_subset.py -v

      - name: Materialize exact public Yab donor
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/HeisLuka/yab.git /tmp/yab-source
          git -C /tmp/yab-source cat-file -e 4f5d8a57abc089d1ed8eb1326cf9bed602281f7e^{commit}

      - name: Compile mapper and existing packet renderer on ordered donor
        run: |
          python - <<'PY'
          import pathlib
          import shutil
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "tools"))
          from yab259_order_preserving_donor import (
              bind_yab_repository,
              prepare_order_preserving_pdf_donor,
          )

          source = bind_yab_repository(pathlib.Path("/tmp/yab-source"))
          donor = pathlib.Path("/tmp/yab-current-viewer-supported-donor")
          base_digest, ordered_digest = prepare_order_preserving_pdf_donor(source, donor)
          bin_dir = donor / "crates" / "pub-cli" / "src" / "bin"
          bin_dir.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(
              root / "tools" / "yab259_current_viewer_supported_subset_request.rs",
              bin_dir / "current-viewer-supported-request.rs",
          )
          shutil.copyfile(
              root / "tools" / "yab259_fixed_pdf_packet_renderer.rs",
              bin_dir / "fixed-pdf-packet.rs",
          )
          for binary in ("current-viewer-supported-request", "fixed-pdf-packet"):
              subprocess.run(
                  [
                      "cargo",
                      "check",
                      "--manifest-path",
                      str(donor / "Cargo.toml"),
                      "-p",
                      "pub-cli",
                      "--bin",
                      binary,
                  ],
                  cwd=donor,
                  check=True,
              )
          print(f"base_repair_sha256={base_digest}")
          print(f"ordered_repair_sha256={ordered_digest}")
          PY

  carlton-real-pdf:
    needs: validate
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact acquisition and raster dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5" "PyMuPDF==1.26.4"

      - name: Acquire exact public Carlton March pair
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "carlton-current-viewer-supported-pdf"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          python tools/acquire_carlton_march_pair.py $root
          if ($LASTEXITCODE -ne 0) { throw "Carlton acquisition failed" }
          $pub = Join-Path $root "March-2026.pub"
          $reference = Join-Path $root "March-2026-reference.pdf"
          if ((Get-FileHash $pub -Algorithm SHA256).Hash.ToLowerInvariant() -ne "bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3") {
            throw "Carlton PUB identity drift"
          }
          if ((Get-FileHash $reference -Algorithm SHA256).Hash.ToLowerInvariant() -ne "c1288571ee8da91afa27ca5c49191aacefe82123df294c11f58ca047d0ced769") {
            throw "Carlton reference PDF identity drift"
          }
          "CHAPTERA_CARLTON_SUPPORTED_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_CARLTON_PUB=$pub" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_CARLTON_REFERENCE=$reference" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build current Editor and Viewer packet producer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build -p chaptera-desktop --release --bin chaptera-editor
          cargo build --manifest-path crates/chaptera-desktop-shaped-flow-runtime/Cargo.toml --release --bin current_viewer_fixed_pdf_input --target-dir target

      - name: Reproduce exact customer-visible Story plus Move project
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $project = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "carlton-march.project.json"
          $export = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "carlton-march.edited.odg"
          $observation = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "carlton-march-editor-observation.json"
          $before = (Get-FileHash $env:CHAPTERA_CARLTON_PUB -Algorithm SHA256).Hash.ToLowerInvariant()

          $env:CHAPTERA_DESKTOP_ACCEPTANCE_V1 = "1"
          $env:CHAPTERA_DESKTOP_ACCEPTANCE_VISIBLE_STORY = "1"
          $env:CHAPTERA_RAR_COMMIT = "${{ github.sha }}"
          $env:CHAPTERA_SOURCE_HASH = "bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3"
          $env:CHAPTERA_CARLTON_OBSERVATION = $observation

          @'
          import os
          import pathlib
          import subprocess
          import sys

          command = [
              "target/release/chaptera-editor.exe",
              "--desktop-acceptance-v1",
              os.environ["CHAPTERA_CARLTON_PUB"],
              os.path.join(os.environ["CHAPTERA_CARLTON_SUPPORTED_ROOT"], "carlton-march.project.json"),
              os.path.join(os.environ["CHAPTERA_CARLTON_SUPPORTED_ROOT"], "carlton-march.edited.odg"),
          ]
          completed = subprocess.run(
              command,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              encoding="utf-8",
              errors="replace",
              check=False,
          )
          if completed.stdout:
              pathlib.Path(os.environ["CHAPTERA_CARLTON_OBSERVATION"]).write_text(
                  completed.stdout,
                  encoding="utf-8",
              )
          if completed.returncode != 0:
              sys.stderr.write(completed.stderr or completed.stdout or "Carlton Editor acceptance failed without diagnostic\n")
              raise SystemExit(completed.returncode)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "Carlton Story+Move Editor acceptance failed" }

          $after = (Get-FileHash $env:CHAPTERA_CARLTON_PUB -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($after -ne $before) { throw "Carlton source PUB changed during Editor acceptance" }
          "CHAPTERA_CARLTON_PROJECT=$project" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Materialize pinned fixed-output font and current Viewer packet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $font = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "chaptera-fixed-output-font.ttf"
          cargo run --quiet -p chaptera-desktop-fallback-font-resource --bin materialize-fallback-font -- "$font"
          if (-not (Test-Path $font)) { throw "pinned fixed-output font was not materialized" }

          $packet = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "current-viewer-fixed-pdf-input.private.json"
          target/release/current_viewer_fixed_pdf_input.exe "$env:CHAPTERA_CARLTON_PUB" "$env:CHAPTERA_CARLTON_PROJECT" "$font" "$packet"
          if (-not (Test-Path $packet)) { throw "current Viewer packet was not written" }
          "CHAPTERA_CURRENT_VIEWER_PACKET=$packet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Acquire exact public Yab 259 donor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $yab = Join-Path $env:RUNNER_TEMP "yab259-carlton-supported"
          git clone --quiet https://github.com/HeisLuka/yab "$yab"
          git -C "$yab" cat-file -e "4f5d8a57abc089d1ed8eb1326cf9bed602281f7e^{commit}"
          "CHAPTERA_YAB259_CHECKOUT=$yab" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Map supported subset and render ordered real PDF
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $request = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "supported-render-request.private.json"
          $mapping = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "supported-mapping.json"
          $renderer = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "supported-renderer.json"
          $pdf = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "carlton-current-edited-supported-subset.pdf"

          python tools/run_yab259_current_viewer_supported_subset_pdf.py --yab-checkout "$env:CHAPTERA_YAB259_CHECKOUT" --input "$env:CHAPTERA_CURRENT_VIEWER_PACKET" --request-output "$request" --mapping-output "$mapping" --pdf-output "$pdf" --renderer-result-output "$renderer"
          if ($LASTEXITCODE -ne 0) { throw "supported-subset Yab render failed" }
          if (-not (Test-Path $pdf)) { throw "supported-subset PDF was not written" }

          "CHAPTERA_SUPPORTED_REQUEST=$request" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_SUPPORTED_MAPPING=$mapping" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_SUPPORTED_RENDERER=$renderer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_SUPPORTED_PDF=$pdf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove request preserves current product order
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import json
          import os
          from pathlib import Path

          packet = json.loads(Path(os.environ["CHAPTERA_CURRENT_VIEWER_PACKET"]).read_text(encoding="utf-8"))
          request = json.loads(Path(os.environ["CHAPTERA_SUPPORTED_REQUEST"]).read_text(encoding="utf-8"))

          packet_pages = [page["page_id"] for page in packet["pages"]]
          request_pages = [page["origin"] for page in request["scene"]["surfaces"]]
          if packet_pages != request_pages:
              raise SystemExit(f"product page order changed before renderer: {packet_pages!r} != {request_pages!r}")

          packet_nodes = [node["node_id"] for page in packet["pages"] for node in page["nodes"]]
          request_nodes = [node["origin"] for node in request["scene"]["nodes"]]
          origin_mapping = request["scene"].get("origin_mapping", [])
          mapped_authoring_nodes = [entry["authoring_origin"] for entry in origin_mapping]
          mapped_resolved_nodes = [entry["resolved_node_origin"] for entry in origin_mapping]

          if packet_nodes != mapped_authoring_nodes:
              raise SystemExit("product authoring-node paint order changed before renderer")
          if request_nodes != mapped_resolved_nodes:
              raise SystemExit("resolved output node order differs from scene origin mapping")
          if len(request_nodes) != len(set(request_nodes)):
              raise SystemExit("resolved output NodeIds must remain unique")
          if len(request_nodes) != len(packet_nodes):
              raise SystemExit("node cardinality changed before renderer")

          binding_pages = packet["binding"].get("page_ids")
          if binding_pages != packet_pages:
              raise SystemExit("packet binding page order differs from PageRenderPlan order")
          '@ | python -

      - name: Compare supported-subset PDF with published reference
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $diff = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "supported-reference-diff.json"
          $env:CHAPTERA_SUPPORTED_DIFF = $diff
          @'
          import json
          import os
          import pathlib
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "tools"))
          from pdf_reference_diff_v1 import compare_pdfs

          result = compare_pdfs(
              os.environ["CHAPTERA_SUPPORTED_PDF"],
              os.environ["CHAPTERA_CARLTON_REFERENCE"],
          )
          pathlib.Path(os.environ["CHAPTERA_SUPPORTED_DIFF"]).write_text(
              json.dumps(result, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          fractions = [page["diff"]["significant_fraction"] for page in result["pages"]]
          print("supported_subset_significant_fractions=" + json.dumps(fractions))
          if result["page_count"]["match"] is not True:
              raise SystemExit("supported-subset PDF page count differs from Carlton reference")
          '@ | python -
          "CHAPTERA_SUPPORTED_DIFF=$diff" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build source-safe measurement receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $receipt = Join-Path $env:CHAPTERA_CARLTON_SUPPORTED_ROOT "carlton-supported-subset.receipt.json"
          $env:CHAPTERA_SUPPORTED_RECEIPT = $receipt
          @'
          import hashlib
          import json
          import os
          from pathlib import Path

          def sha(path):
              return hashlib.sha256(Path(path).read_bytes()).hexdigest()

          mapping_receipt = json.loads(Path(os.environ["CHAPTERA_SUPPORTED_MAPPING"]).read_text(encoding="utf-8"))
          renderer_receipt = json.loads(Path(os.environ["CHAPTERA_SUPPORTED_RENDERER"]).read_text(encoding="utf-8"))
          diff = json.loads(Path(os.environ["CHAPTERA_SUPPORTED_DIFF"]).read_text(encoding="utf-8"))
          mapping = mapping_receipt["mapping"]

          expected_fallback = {
              "shared_layout_incomplete": 12,
              "story_extent_mismatch": 7,
          }
          if mapping["backend_fallback_reason_counts"] != expected_fallback:
              raise SystemExit(f"BackendFallback residual drift: {mapping['backend_fallback_reason_counts']!r}")
          if mapping["cropped_image_use_count"] != 2:
              raise SystemExit("cropped-image residual drift")
          if mapping["table_node_count"] != 1:
              raise SystemExit("table residual drift")
          if mapping["input_page_count"] != 3 or mapping["input_node_count"] != 108:
              raise SystemExit("Carlton supported-subset input census drift")
          if mapping.get("semantic_duplicate_node_id_count") != 2:
              raise SystemExit("Carlton semantic duplicate-node census drift")

          summary = renderer_receipt["renderer_result"]["summary"]
          if summary["page_count"] != 3:
              raise SystemExit("Yab renderer did not produce three customer pages")

          source_after = sha(os.environ["CHAPTERA_CARLTON_PUB"])
          expected_source = "bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3"
          if source_after != expected_source:
              raise SystemExit("immutable Carlton source changed during supported-subset render")

          receipt = {
              "schema": "chaptera.carlton-current-viewer-supported-subset.v1",
              "source_pub_sha256": expected_source,
              "reference_pdf_sha256": "c1288571ee8da91afa27ca5c49191aacefe82123df294c11f58ca047d0ced769",
              "project_sha256": sha(os.environ["CHAPTERA_CARLTON_PROJECT"]),
              "packet_sha256": sha(os.environ["CHAPTERA_CURRENT_VIEWER_PACKET"]),
              "pdf_sha256": sha(os.environ["CHAPTERA_SUPPORTED_PDF"]),
              "pdf_bytes": Path(os.environ["CHAPTERA_SUPPORTED_PDF"]).stat().st_size,
              "mapping": mapping,
              "renderer_summary": summary,
              "page_significant_fractions": [page["diff"]["significant_fraction"] for page in diff["pages"]],
              "page_order_preserved": True,
              "node_order_preserved": True,
              "reference_is_pre_edit_published_pdf": True,
              "reference_diff_includes_intentional_story_move_delta": True,
              "private_packet_retained": False,
              "private_render_request_retained": False,
              "native_pub_write_used": False,
          }
          Path(os.environ["CHAPTERA_SUPPORTED_RECEIPT"]).write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, sort_keys=True))
          '@ | python -
          "CHAPTERA_SUPPORTED_RECEIPT=$receipt" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $receiptText = Get-Content "$receipt" -Raw
          if ($receiptText.Contains((Resolve-Path $env:CHAPTERA_CARLTON_PUB).Path)) {
            throw "supported-subset receipt leaked local source path"
          }

      - name: Stage retained measurement artifacts
        shell: pwsh
        run: |
          $out = "target/carlton-supported-subset"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item "$env:CHAPTERA_SUPPORTED_PDF" "$out/carlton-current-edited-supported-subset.pdf"
          Copy-Item "$env:CHAPTERA_SUPPORTED_MAPPING" "$out/supported-mapping.json"
          Copy-Item "$env:CHAPTERA_SUPPORTED_RENDERER" "$out/supported-renderer.json"
          Copy-Item "$env:CHAPTERA_SUPPORTED_DIFF" "$out/supported-reference-diff.json"
          Copy-Item "$env:CHAPTERA_SUPPORTED_RECEIPT" "$out/carlton-supported-subset.receipt.json"

      - uses: actions/upload-artifact@v4
        with:
          name: carlton-current-viewer-supported-subset
          path: target/carlton-supported-subset
          if-no-files-found: error
