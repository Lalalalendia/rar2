name: Mature 033 PAGE object ownership

on:
  pull_request:
    paths:
      - ".github/workflows/mature-033-page-object-ownership.yml"
      - "vendor/producer-a/crates/pub-viewer/src/bin/page-object-ownership-receipt.rs"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mature-033-page-object-ownership-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/mature-033-page-object-ownership

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Verify exact 033 input
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("out/pinned1050/materialized/native")
          paths = sorted(root.glob("*.pub"))
          shas = [p.stem.casefold() for p in paths]
          corpus_digest = hashlib.sha256("".join(sha + "\n" for sha in shas).encode("ascii")).hexdigest()
          assert len(shas) == 1050
          assert corpus_digest == "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43"
          sha = "4029d4a1bf5be89d745c079b9c06ab33e5bdceb997a4761c5e11238110d879c9"
          path = root / f"{sha}.pub"
          assert path.exists(), path
          assert hashlib.sha256(path.read_bytes()).hexdigest() == sha
          print("exact 033 verified", sha)
          PY

      - name: Build source-safe PAGE ownership receipt
        run: |
          set -euo pipefail
          cargo build --manifest-path vendor/producer-a/Cargo.toml             -p pub-viewer --bin page-object-ownership-receipt --jobs 2

      - name: Census exact 033 PAGE object ownership
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/mature-033-page-object-ownership
          sha=4029d4a1bf5be89d745c079b9c06ab33e5bdceb997a4761c5e11238110d879c9
          "$CARGO_TARGET_DIR/debug/page-object-ownership-receipt"             "out/pinned1050/materialized/native/$sha.pub"             target/mature-033-page-object-ownership/summary.json

      - name: Assert source-only boundary and print finite census
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("target/mature-033-page-object-ownership/summary.json")
          data = json.loads(p.read_text())
          assert data["schema"] == "chaptera.mature-033-page-object-ownership.v1"
          assert data["source_sha256"] == "4029d4a1bf5be89d745c079b9c06ab33e5bdceb997a4761c5e11238110d879c9"
          assert data["document_page_count"] == 12, data["document_page_count"]
          assert data["viewer_page_count"] == 12, data["viewer_page_count"]
          assert data["source_page_role_observation_count"] == 12, data["source_page_role_observation_count"]
          assert len(data["pages"]) == 12
          claims = data["claims"]
          for key in (
              "measurement_only",
              "page_identity_fingerprint_emitted",
          ):
              assert claims[key] is True
          for key in (
              "raw_page_identity_emitted",
              "raw_node_identity_emitted",
              "raw_contents_seq_num_emitted",
              "story_text_emitted",
              "source_coordinates_emitted",
              "publisher_or_pdf_reference_used",
              "raster_reference_used",
              "source_graph_mutated",
              "viewer_semantics_changed",
          ):
              assert claims[key] is False
          for row in data["pages"]:
              print(json.dumps({
                  "ord": row["document_ordinal"],
                  "selected": row["selected_by_viewer"],
                  "direct": row["direct_node_count"],
                  "desc": row["descendant_node_count"],
                  "scene": row["scene_node_count"],
                  "paint": row["paint_node_count"],
                  "story": [row["story_frame_count"], row["viewer_story_frame_count"], row["viewer_text_fragment_count"]],
                  "table": [row["table_node_count"], row["viewer_table_count"]],
                  "image": [row["image_bound_node_count"], row["viewer_image_node_count"]],
                  "paint_order": [
                      row["source_paint_order_node_count"],
                      row["source_paint_order_scene_covered_count"],
                      row["source_paint_order_paint_covered_count"],
                  ],
                  "raw_children": row["direct_child_raw_type_histogram"],
                  "kinds": row["node_kind_histogram"],
              }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mature-033-page-object-ownership
          path: target/mature-033-page-object-ownership/summary.json
          if-no-files-found: error
          retention-days: 30
