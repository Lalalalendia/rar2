name: Mature 029 native receipt classifier

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/classify_mature_029_native_page_spread_v1.py"
      - ".github/workflows/mature-029-native-receipt-classifier.yml"

permissions:
  contents: read

concurrency:
  group: mature-029-native-receipt-classifier-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile classifier
        run: python -m py_compile tools/classify_mature_029_native_page_spread_v1.py
      - name: Run classifier self-test
        run: python tools/classify_mature_029_native_page_spread_v1.py --self-test
