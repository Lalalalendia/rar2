name: Virginia restored-fill equality probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-reader/tests/restored_fill_stack_probe.rs"
      - "vendor/producer-a/crates/pub-viewer/tests/virginia_p24_image_materialization_probe.rs"
      - "vendor/producer-a/crates/pub-viewer/tests/virginia_p24_occluder_viewer_probe.rs"
      - "vendor/producer-a/crates/pub-viewer/tests/virginia_p24_occlusion_probe.rs"
      - "tools/acquire_virginia_pub_pdf_pairs.py"
      - ".github/workflows/virginia-restored-fill-probe.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acquisition dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - name: Reacquire exact Virginia pair
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/virginia-pairs"
          python tools/acquire_virginia_pub_pdf_pairs.py "$RUNNER_TEMP/virginia-pairs"
          test -f "$RUNNER_TEMP/virginia-pairs/virginia-remplacante-modifiable.pub"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Measure restored-fill main vs extended intent
        env:
          CHAPTERA_VIRGINIA_RESTORED_FILL_FIXTURE: ${{ runner.temp }}/virginia-pairs/virginia-remplacante-modifiable.pub
          CHAPTERA_VIRGINIA_RESTORED_FILL_SHA256: 88f57d800aeec808798ea487b9d4ab85dc85c02cd190b987a332709b81018506
          CHAPTERA_VIRGINIA_RESTORED_FILL_OUT: ${{ github.workspace }}/target/virginia-restored-fill/receipt.json
        run: |
          set -euo pipefail
          mkdir -p target/virginia-restored-fill
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --test restored_fill_stack_probe -- --ignored --nocapture

      - name: Trace p24 later image through Viewer
        env:
          CHAPTERA_VIRGINIA_RESTORED_FILL_FIXTURE: ${{ runner.temp }}/virginia-pairs/virginia-remplacante-modifiable.pub
          CHAPTERA_VIRGINIA_RESTORED_FILL_SHA256: 88f57d800aeec808798ea487b9d4ab85dc85c02cd190b987a332709b81018506
          CHAPTERA_VIRGINIA_OCCLUSION_VIEWER_OUT: ${{ github.workspace }}/target/virginia-restored-fill/viewer-occlusion.json
        run: |
          set -euo pipefail
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer --test virginia_p24_occluder_viewer_probe -- --ignored --nocapture

      - name: Measure exact Stage-L p24 occluder product boundary
        env:
          CHAPTERA_VIRGINIA_OCCLUSION_FIXTURE: ${{ runner.temp }}/virginia-pairs/virginia-remplacante-modifiable.pub
          CHAPTERA_VIRGINIA_OCCLUSION_SHA256: 88f57d800aeec808798ea487b9d4ab85dc85c02cd190b987a332709b81018506
          CHAPTERA_VIRGINIA_OCCLUSION_OUT: ${{ github.workspace }}/target/virginia-restored-fill/p24-occlusion.json
        run: |
          set -euo pipefail
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer --test virginia_p24_occlusion_probe -- --ignored --nocapture

      - name: Measure p24 IMAGE materialization
        env:
          CHAPTERA_VIRGINIA_P24_IMAGE_FIXTURE: ${{ runner.temp }}/virginia-pairs/virginia-remplacante-modifiable.pub
          CHAPTERA_VIRGINIA_P24_IMAGE_OUT: ${{ github.workspace }}/target/virginia-restored-fill/p24-image.json
        run: |
          set -euo pipefail
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer --test virginia_p24_image_materialization_probe -- --ignored --nocapture

      - name: Measure p24 later-image Viewer survival
        env:
          CHAPTERA_VIRGINIA_OCCLUSION_FIXTURE: ${{ runner.temp }}/virginia-pairs/virginia-remplacante-modifiable.pub
          CHAPTERA_VIRGINIA_OCCLUSION_SHA256: 88f57d800aeec808798ea487b9d4ab85dc85c02cd190b987a332709b81018506
          CHAPTERA_VIRGINIA_OCCLUSION_OUT: ${{ github.workspace }}/target/virginia-restored-fill/occlusion-viewer.json
        run: |
          set -euo pipefail
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer --test virginia_p24_occlusion_probe -- --ignored --nocapture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virginia-restored-fill-equality-receipt
          path: target/virginia-restored-fill/
          if-no-files-found: warn
          retention-days: 30
