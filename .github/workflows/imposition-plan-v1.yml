name: Imposition Plan V1

on:
  pull_request:
    paths:
      - "services/editor-api/imposition_plan_v1.py"
      - "services/editor-api/test_imposition_plan_v1.py"
      - "services/editor-api/print_composer_nup_v1.py"
      - "services/editor-api/test_print_composer_nup_v1.py"
      - "services/editor-api/print_composer_nup_pdf_v1.py"
      - "services/editor-api/test_print_composer_nup_pdf_v1.py"
      - ".github/workflows/imposition-plan-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated vector PDF composition dependency
        run: python -m pip install --disable-pip-version-check --only-binary=:all: PyMuPDF==1.26.7
      - name: Check canonical imposition, exact A4 PDF, current-edit replay and preview
        working-directory: services/editor-api
        run: |
          python -m compileall -q imposition_plan_v1.py print_composer_nup_v1.py print_composer_nup_pdf_v1.py test_imposition_plan_v1.py test_print_composer_nup_v1.py test_print_composer_nup_pdf_v1.py
          python -m unittest -v test_imposition_plan_v1 test_print_composer_nup_v1 test_print_composer_nup_pdf_v1
