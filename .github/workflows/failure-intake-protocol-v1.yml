name: Failure Intake Protocol V1

on:
  pull_request:
    paths:
      - "crates/chaptera-failure-intake-protocol/**"
      - ".github/workflows/failure-intake-protocol-v1.yml"
  workflow_dispatch:

concurrency:
  group: failure-intake-protocol-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: dtolnay/rust-toolchain@9376cdc5a5e25b16da71af47712785cf06b0d6d4
        with:
          toolchain: 1.94.1
          components: rustfmt, clippy
      - name: Check protocol formatting
        run: cargo fmt -p chaptera-failure-intake-protocol -- --check
      - name: Lint protocol authority
        run: cargo clippy -p chaptera-failure-intake-protocol --all-targets -- -D warnings
      - name: Test fail-closed intake contract
        run: cargo test -p chaptera-failure-intake-protocol
