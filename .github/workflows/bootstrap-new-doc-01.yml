name: bootstrap-new-doc-01

on:
  pull_request:
    paths:
      - vendor/producer-a/crates/pub-writer/**
      - .github/workflows/bootstrap-new-doc-01.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Test bootstrap fail-closed contract
        working-directory: vendor/producer-a
        run: cargo test -p pub-writer bootstrap_new_doc -- --nocapture
      - name: Compile bootstrap CLI
        working-directory: vendor/producer-a
        run: cargo check -p pub-writer --bin pub-bootstrap-new-doc
      - name: Rustfmt bootstrap slice
        run: rustfmt --edition 2024 --check vendor/producer-a/crates/pub-writer/src/lib.rs vendor/producer-a/crates/pub-writer/src/bootstrap_new_doc.rs vendor/producer-a/crates/pub-writer/src/bin/pub-bootstrap-new-doc.rs

  windows-cli:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
      - name: Build bootstrap CLI
        working-directory: vendor/producer-a
        run: cargo build -p pub-writer --bin pub-bootstrap-new-doc --release
      - uses: actions/upload-artifact@v4
        with:
          name: pub-bootstrap-new-doc-win-x64
          path: vendor/producer-a/target/release/pub-bootstrap-new-doc.exe
          if-no-files-found: error
