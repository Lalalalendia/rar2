          assert census["significant_pixels_total"] == pair["full_page_significant_pixel_count"]
          assert sum(zone["significant_pixels"] for zone in census["zones_exclusive"].values()) == pair["full_page_significant_pixel_count"]
          assert sum(zone["area_pixels"] for zone in census["zones_exclusive"].values()) == pair["page_pixels"][0] * pair["page_pixels"][1]
