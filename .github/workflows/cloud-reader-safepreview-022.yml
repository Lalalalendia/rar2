      - name: Verify exact SBDC034 edited Chromium versus own R1 PDF raster
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "PyMuPDF==1.26.4"
          node --check tools/run_temporary_editor_sbdc034_r1_browser.mjs
          python -m py_compile tools/run_temporary_editor_current_acceptance.py tools/sbdc_r1_raster_disagreement_census.py tools/test_sbdc_r1_raster_disagreement_census.py tools/sbdc_r1_text_metrics_census.py tools/test_sbdc_r1_text_metrics_census.py
          python tools/test_sbdc_r1_raster_disagreement_census.py
          python tools/test_sbdc_r1_text_metrics_census.py
          python tools/run_temporary_editor_current_acceptance.py \
            --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
            --caddy "/tmp/chaptera-safe-preview-022/caddy" \
            --fixture "out/pinned1050/materialized/native/0d2278960a0101ced0a1ba6d5922f5a26ea37b76b3ab00ef21e21873359d4a5a.pub" \
            --fixture-sha256 "0d2278960a0101ced0a1ba6d5922f5a26ea37b76b3ab00ef21e21873359d4a5a" \
            --sbdc-cmyk-picture-proof \
            --sbdc-browser-pdf-visual \
            --out "/tmp/chaptera-safe-preview-022/sbdc034-current-edited"
          python - <<'PY'
          import json
          from pathlib import Path
          full = json.loads(Path("/tmp/chaptera-safe-preview-022/sbdc034-current-edited/receipt.json").read_text())
          proof = full["sbdc_picture_proof"]
