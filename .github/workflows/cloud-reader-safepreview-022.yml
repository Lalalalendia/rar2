          print('SBDC034_EDITED_PDF_IMAGE_PAINT ' + json.dumps(proof, sort_keys=True))
          pair = full["sbdc_browser_own_pdf_r1"]
          assert pair["schema"] == "chaptera.sbdc034-r1-browser-ownpdf-raster.v1"
          assert pair["four_star_red_pixels_in_both_rasters"] is True
          assert len(pair["star_roi_metrics"]) == 4
          assert pair["private_scene_pdf_png_uploaded"] is False
          census = pair["disagreement_census"]
