name: FIDELITY-REFERENCE-PDF-01 external PDF oracle

on:
  pull_request:
    paths:
      - "tools/pdf_reference_diff_v1.py"
      - "tools/test_pdf_reference_diff_v1.py"
      - "tools/pdf_paint_trace_roi_join_v1.py"
      - "tools/test_pdf_paint_trace_roi_join_v1.py"
      - "tools/run_pdf_reference_diff_contract.py"
      - "docs/pdf-reference-diff-v1.md"
      - "docs/pdf-paint-trace-roi-v1.md"
      - ".github/workflows/pdf-reference-diff-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pdf-reference-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned MuPDF binding
        run: python -m pip install --disable-pip-version-check --no-cache-dir PyMuPDF==1.24.14
      - name: Test reference PDF comparator
        run: python tools/test_pdf_reference_diff_v1.py
      - name: Test source-neutral PDF paint trace to raster ROI join
        run: python tools/test_pdf_paint_trace_roi_join_v1.py
      - name: Produce comparison receipt
        run: python tools/run_pdf_reference_diff_contract.py
      - uses: actions/upload-artifact@v4
        with:
          name: fidelity-reference-pdf-v1-contract
          path: target/pdf-reference-diff-v1/receipt.json
          if-no-files-found: error
