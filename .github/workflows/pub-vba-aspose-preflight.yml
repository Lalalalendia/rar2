name: Publisher VBA Aspose preflight

on:
  pull_request:
    paths:
      - ".github/workflows/pub-vba-aspose-preflight.yml"
  workflow_dispatch:

concurrency:
  group: pub-vba-aspose-preflight-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

# Temporary measurement workflow; do not merge into main.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scanner contract
        run: |
          set -euo pipefail
          python -m py_compile tools/pub_vba_cfb.py tools/pub_vba_estate_scan.py
          python tools/test_pub_vba_estate_scan.py

      - name: Materialize exact MIT-licensed Aspose Publisher fixtures
        env:
          DOTNET_REF: beee619f9a4b7e2c8908e0fa132f4f4650b08975
          C_REF: cad609c01b8a6201392391244df18a7b2caa215d
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/aspose-pub"
          python - <<'PY'
          import json
          from pathlib import Path

          rows = [
              {
                  "repo": "aspose-pub/Aspose.PUB-for-.NET",
                  "ref": "beee619f9a4b7e2c8908e0fa132f4f4650b08975",
                  "path": "Examples/Data/christmas.pub",
                  "git_blob_sha": "1937aff3a70588c8fde65184301c2b48d6c521c3",
              },
              {
                  "repo": "aspose-pub/Aspose.PUB-for-.NET",
                  "ref": "beee619f9a4b7e2c8908e0fa132f4f4650b08975",
                  "path": "Examples/Data/computer-classes-flyer.pub",
                  "git_blob_sha": "1cfc2eec25c83da8a16de876551f68dae3053801",
              },
              {
                  "repo": "aspose-pub/Aspose.PUB-for-.NET",
                  "ref": "beee619f9a4b7e2c8908e0fa132f4f4650b08975",
                  "path": "Examples/Data/easter-egg-hunt-flyer.pub",
                  "git_blob_sha": "64398ae3652926d2a02dd68b142e267e363ca2bd",
              },
              {
                  "repo": "aspose-pub/Aspose.PUB-for-.NET",
                  "ref": "beee619f9a4b7e2c8908e0fa132f4f4650b08975",
                  "path": "Examples/Data/florist-flyer.pub",
                  "git_blob_sha": "3ed00dde59acd0930ba1d75b3df28328ddc79e4e",
              },
              {
                  "repo": "aspose-pub/Aspose.PUB-for-.NET",
                  "ref": "beee619f9a4b7e2c8908e0fa132f4f4650b08975",
                  "path": "Examples/Data/halloween-flyer.pub",
                  "git_blob_sha": "6610c53ff345d4e11e03b7fffd1cd128b3ae4052",
              },
              {
                  "repo": "aspose-pub/Aspose.PUB-for-C",
                  "ref": "cad609c01b8a6201392391244df18a7b2caa215d",
                  "path": "Examples/Data/1.pub",
                  "git_blob_sha": "fdb6e7a69fef4cb0edef8c072db103de3b568d7e",
              },
              {
                  "repo": "aspose-pub/Aspose.PUB-for-C",
                  "ref": "cad609c01b8a6201392391244df18a7b2caa215d",
                  "path": "Examples/Data/christmasBottom.pub",
                  "git_blob_sha": "d71554e0ecd75c4e709a9374972cd17d2896999c",
              },
          ]
          Path("/tmp/aspose-expected.json").write_text(
              json.dumps(rows, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          PY

          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          rows = json.loads(Path("/tmp/aspose-expected.json").read_text())
          root = Path(os.environ["RUNNER_TEMP"]) / "aspose-pub"
          receipt = []
          for idx, row in enumerate(rows, 1):
              url = f"https://raw.githubusercontent.com/{row['repo']}/{row['ref']}/{row['path']}"
              data = urllib.request.urlopen(url, timeout=120).read()
              dst = root / f"{idx:02d}__{Path(row['path']).name}"
              dst.write_bytes(data)
              actual_blob = subprocess.check_output(
                  ["git", "hash-object", str(dst)], text=True
              ).strip()
              if actual_blob != row["git_blob_sha"]:
                  raise SystemExit(
                      f"git blob mismatch for {row['repo']}:{row['path']}: "
                      f"{actual_blob} != {row['git_blob_sha']}"
                  )
              receipt.append({
                  **row,
                  "source_url": url,
                  "materialized_name": dst.name,
                  "byte_len": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "license": "MIT",
              })

          assert len(receipt) == 7
          assert len({x["sha256"] for x in receipt}) == 7, "expected 7 hash-unique fixtures"
          out = Path("target/pub-vba-aspose")
          out.mkdir(parents=True, exist_ok=True)
          (out / "materialization.json").write_text(
              json.dumps({
                  "schema": "chaptera.pub-vba-aspose-preflight-materialization.v1",
                  "purpose": "preflight_only_not_T899_admission_before_PUB_T_898",
                  "claims": {
                      "macro_execution_invoked": False,
                      "publisher_com_used": False,
                      "fixture_bytes_modified": False,
                  },
                  "files": receipt,
              }, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps([
              {
                  "name": x["materialized_name"],
                  "sha256": x["sha256"],
                  "byte_len": x["byte_len"],
                  "git_blob_sha": x["git_blob_sha"],
              }
              for x in receipt
          ], indent=2, sort_keys=True))
          PY

      - name: Inert scan
        run: |
          set -euo pipefail
          python tools/pub_vba_estate_scan.py scan             --input "$RUNNER_TEMP/aspose-pub"             --recursive             --output target/pub-vba-aspose/scan.json
          python - <<'PY'
          import json
          from pathlib import Path
          scan = json.loads(Path("target/pub-vba-aspose/scan.json").read_text())
          assert scan["totals"]["file_count"] == 7, scan["totals"]
          assert scan["totals"]["read_failed"] == 0, scan["totals"]
          assert scan["claims"]["vba_executed"] is False
          assert scan["claims"]["ole_com_activated"] is False
          assert scan["claims"]["source_text_emitted"] is False
          print(json.dumps(scan["totals"], indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pub-vba-aspose-preflight
          path: |
            target/pub-vba-aspose/materialization.json
            target/pub-vba-aspose/scan.json
          if-no-files-found: error
          retention-days: 30
