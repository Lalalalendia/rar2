name: Migration editable corpus V2

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-editor/**"
      - "vendor/producer-a/crates/pub-export/**"
      - "vendor/producer-a/crates/pub-idml/**"
      - "vendor/producer-a/crates/pub-odg/**"
      - "vendor/producer-a/crates/pub-reader/**"
      - "tools/migration_editable_corpus_v2.py"
      - "tools/test_migration_editable_corpus_v2.py"
      - "tools/reader_corpus_manifest_v1.json"
      - "tools/corpus/receipts/lalamu-materialized-35-input-2026-09-29.json"
      - "tools/corpus/receipts/version-labelled-training-29-input-2026-09-25.json"
      - "tools/ci/scribus_idml_consumer.py"
      - ".github/workflows/migration-editable-corpus-v2.yml"
  workflow_dispatch:

concurrency:
  group: migration-editable-corpus-v2-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PROFILE: core65
  EXPECTED_COUNT: "65"
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/migration-corpus-rust

jobs:
  manifest-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove deterministic corpus composition
        run: python tools/test_migration_editable_corpus_v2.py

  corpus-shard:
    needs: manifest-contract
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Rust formatting
        run: cargo fmt --manifest-path vendor/producer-a/Cargo.toml -p pub-editor -- --check

      - name: Build exact-source migration probe
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --bin migration_editable_route_probe

      - name: Install independent editable-output consumers
        run: |
          set -euo pipefail
          sudo timeout 600s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo timeout 600s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 install -y --no-install-recommends scribus libreoffice-draw xvfb jq

      - name: Materialize exact pinned corpus shard
        run: |
          set -euo pipefail
          materialized="$RUNNER_TEMP/migration-corpus-input"
          python tools/migration_editable_corpus_v2.py materialize \
            --repo-root . \
            --profile "$PROFILE" \
            --out "$materialized" \
            --shard-index ${{ matrix.shard }} \
            --shard-count 4

      - name: Probe, serialize, and consumer-open shard
        run: |
          set -euo pipefail
          evidence="$GITHUB_WORKSPACE/target/migration-corpus-evidence"
          materialized="$RUNNER_TEMP/migration-corpus-input"
          mkdir -p "$evidence"

          jq -r '.entries[] | [.path, .sha256, .name, .stratum] | @tsv' "$materialized/manifest.json" |
          while IFS=$'\t' read -r pub sha label stratum; do
            out="$evidence/$sha"
            mkdir -p "$out"

            "$CARGO_TARGET_DIR/debug/migration_editable_route_probe" \
              "$pub" \
              --label "$label" \
              --materialize-dir "$out" \
              > "$out/route.json"

            python -c 'import json,pathlib,sys; p=pathlib.Path(sys.argv[1]); d=json.loads(p.read_text()); d["corpus_stratum"]=sys.argv[2]; p.write_text(json.dumps(d,indent=2,sort_keys=True)+"\\n")' \
              "$out/route.json" "$stratum"

            if test -s "$out/output.idml"; then
              rm -f "$out/consumer.sla"
              CHAPTERA_SCRIBUS_SLA_OUT="$out/consumer.sla" \
                xvfb-run -a scribus -g -ns -py tools/ci/scribus_idml_consumer.py -- "$out/output.idml"
              test -s "$out/consumer.sla"
              touch "$out/idml.consumer.ok"
            fi

            if test -s "$out/output.odg"; then
              lo_out="$out/libreoffice"
              lo_profile="$RUNNER_TEMP/lo-$sha"
              mkdir -p "$lo_out" "$lo_profile"
              libreoffice --headless \
                "-env:UserInstallation=file://$lo_profile" \
                --convert-to fodg \
                --outdir "$lo_out" \
                "$out/output.odg"
              test -s "$lo_out/output.fodg"
              touch "$out/odg.consumer.ok"
            fi

            rm -f "$out/output.idml" "$out/output.odg" "$out/consumer.sla"
            rm -rf "$out/libreoffice"
          done

          cp "$materialized/manifest.json" "$evidence/materialization-shard-${{ matrix.shard }}.json"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: migration-corpus-core65-shard-${{ matrix.shard }}
          path: target/migration-corpus-evidence/
          if-no-files-found: error
          retention-days: 30

  summarize:
    needs: corpus-shard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: migration-corpus-core65-shard-*
          path: target/migration-corpus-shards
          merge-multiple: false
      - name: Build aggregate migration corpus receipt
        run: |
          set -euo pipefail
          python tools/migration_editable_corpus_v2.py summarize \
            --input target/migration-corpus-shards \
            --output target/migration-corpus-summary.json \
            --expected-count "$EXPECTED_COUNT"
          cat target/migration-corpus-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: migration-corpus-core65-summary
          path: target/migration-corpus-summary.json
          if-no-files-found: error
          retention-days: 90
