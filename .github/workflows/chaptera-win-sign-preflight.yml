name: CHAPTERA-WIN-SIGN-PREFLIGHT-01 test-sign mechanics

on:
  pull_request:
    paths:
      - "installer/windows/chaptera-reader.iss"
      - "tools/windows/test_authenticode_sign.ps1"
      - ".github/workflows/chaptera-win-sign-preflight.yml"
      - "tools/ci/check_chaptera_ci_trust.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  INNO_SETUP_VERSION: 6.7.1
  CHAPTERA_VERSION: 0.1.0-preview

jobs:
  test-sign-preflight:
    name: Test-only Authenticode + Inno signed surfaces
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          toolchain: "1.94.1"

      - name: Build and stage current Reader
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build -p chaptera-desktop --release --features reader-only
          $built = "target/release/chaptera-editor.exe"
          if (-not (Test-Path $built)) { throw "reader-only shared desktop binary missing" }
          Remove-Item -Recurse -Force stage,dist,target/sign-preflight -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path "stage/chaptera-reader","dist","target/sign-preflight" | Out-Null
          Copy-Item $built "stage/chaptera-reader/Chaptera-Reader.exe"
          Set-Content -Encoding utf8 -Path "stage/chaptera-reader/README.md" -Value "# Chaptera PUB Reader - Technical Preview"

      - name: Install pinned Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          choco install innosetup --version=$env:INNO_SETUP_VERSION --yes --no-progress --limit-output
          $candidate = Join-Path ${env:ProgramFiles(x86)} "Inno Setup 6\ISCC.exe"
          if (Test-Path $candidate) { $iscc = $candidate } else {
            $cmd = Get-Command iscc.exe -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "ISCC.exe not found" }
            $iscc = $cmd.Source
          }
          "ISCC_PATH=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Create ephemeral TEST-ONLY code-signing identity
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $subject = "CN=Chaptera TEST ONLY CI"
          $cert = New-SelfSignedCertificate -Type CodeSigningCert -Subject $subject -CertStoreLocation "Cert:\CurrentUser\My" -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 -NotAfter (Get-Date).AddDays(1)
          $cer = Join-Path $env:RUNNER_TEMP "chaptera-test-signing.cer"
          Export-Certificate -Cert $cert -FilePath $cer | Out-Null
          "CHAPTERA_TEST_SIGN_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_TEST_CERT_SUBJECT=$subject" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_TEST_CERT_FILE=$cer" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Trust ephemeral TEST-ONLY certificate
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # Trust the self-signed end-entity certificate directly as a test peer.
          # Avoid the Root store: Windows can surface an interactive root-trust
          # confirmation that deadlocks unattended GitHub-hosted runners.
          $trusted = Import-Certificate -FilePath $env:CHAPTERA_TEST_CERT_FILE -CertStoreLocation "Cert:\CurrentUser\TrustedPeople"
          if (-not $trusted -or $trusted.Thumbprint -ne $env:CHAPTERA_TEST_SIGN_THUMBPRINT) { throw "CurrentUser TrustedPeople import failed or returned unexpected certificate" }

      - name: Locate Windows SDK SignTool
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sdkBin = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtoolPath = Get-ChildItem -LiteralPath $sdkBin -Directory -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\signtool.exe" } |
            Where-Object { Test-Path -LiteralPath $_ } |
            Select-Object -First 1
          if (-not $signtoolPath) {
            $cmd = Get-Command signtool.exe -ErrorAction SilentlyContinue
            if (-not $cmd) { throw "signtool.exe not found on runner" }
            $signtoolPath = $cmd.Source
          }
          "CHAPTERA_SIGNTOOL_PATH=$signtoolPath" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Compile canonical Inno installer through one SignTool contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $sourceDir = (Resolve-Path "stage/chaptera-reader").Path
          $outputDir = (Resolve-Path "dist").Path
          $signScript = (Resolve-Path "tools/windows/test_authenticode_sign.ps1").Path
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($signScript, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -ne 0) { throw "signing helper has PowerShell parse errors: $($parseErrors -join '; ')" }
          $signCommand = "powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `$q$signScript`$q `$f"
          & $env:ISCC_PATH "/DMyAppVersion=$env:CHAPTERA_VERSION" "/DSourceDir=$sourceDir" "/DOutputDir=$outputDir" "/DChapteraTestSigning=1" "-schapteratest=$signCommand" "installer/windows/chaptera-reader.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with code $LASTEXITCODE" }
          $setup = Join-Path $outputDir "Chaptera-Reader-Setup-$env:CHAPTERA_VERSION.exe"
          if (-not (Test-Path $setup)) { throw "signed installer missing: $setup" }
          "CHAPTERA_TEST_SIGNED_SETUP=$setup" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Verify signed surfaces, tamper rejection, install and uninstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          function Assert-TestSignature([string]$Path) {
            $sig = Get-AuthenticodeSignature -LiteralPath $Path
            if ($sig.Status -ne "Valid") { throw "signature is not valid for ${Path}: $($sig.Status) $($sig.StatusMessage)" }
            if (-not $sig.SignerCertificate) { throw "missing signer certificate for $Path" }
            if ($sig.SignerCertificate.Thumbprint -ne $env:CHAPTERA_TEST_SIGN_THUMBPRINT) { throw "unexpected signer for $Path" }
            return [ordered]@{ path = $Path; status = [string]$sig.Status; thumbprint = $sig.SignerCertificate.Thumbprint }
          }

          $stagedReader = (Resolve-Path "stage/chaptera-reader/Chaptera-Reader.exe").Path
          $setup = (Resolve-Path $env:CHAPTERA_TEST_SIGNED_SETUP).Path
          $stagedReceipt = Assert-TestSignature $stagedReader
          $setupReceipt = Assert-TestSignature $setup

          $tampered = Join-Path $env:RUNNER_TEMP "Chaptera-Reader-Setup-tampered.exe"
          Copy-Item -LiteralPath $setup -Destination $tampered -Force
          $stream = [System.IO.File]::Open($tampered, [System.IO.FileMode]::Append, [System.IO.FileAccess]::Write, [System.IO.FileShare]::None)
          try { $stream.WriteByte(0) } finally { $stream.Dispose() }
          $tamperedSig = Get-AuthenticodeSignature -LiteralPath $tampered
          if ($tamperedSig.Status -eq "Valid") { throw "post-sign mutation unexpectedly retained a valid signature" }

          $installRoot = Join-Path $env:LOCALAPPDATA "Programs\Chaptera PUB Reader"
          Remove-Item -LiteralPath $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          $install = Start-Process -FilePath $setup -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-") -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "signed installer failed: $($install.ExitCode)" }
          $installedReader = Join-Path $installRoot "current\chaptera-reader.exe"
          if (-not (Test-Path $installedReader)) { throw "installed Reader missing" }
          $uninstallers = @(Get-ChildItem -LiteralPath $installRoot -Filter "unins*.exe" -File)
          if ($uninstallers.Count -ne 1) { throw "expected one generated uninstaller, got $($uninstallers.Count)" }
          $installedReceipt = Assert-TestSignature $installedReader
          $uninstallerReceipt = Assert-TestSignature $uninstallers[0].FullName

          $setupItem = Get-Item -LiteralPath $setup
          $setupHash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          $target = [ordered]@{
            path = $setupItem.Name
            length = [int64]$setupItem.Length
            hashes = [ordered]@{ sha256 = $setupHash }
            custom = [ordered]@{
              product_id = "chaptera.reader"
              version = $env:CHAPTERA_VERSION
              authenticode = "test_only"
              public_trust_claim = $false
              source_commit = "${{ github.sha }}"
            }
          }
          $target | ConvertTo-Json -Depth 6 | Set-Content -Encoding utf8 "target/sign-preflight/tuf-shaped-target.json"
          [ordered]@{
            schema_version = "chaptera.win-sign-preflight.v1"
            trust_class = "test_only"
            public_trust_claim = $false
            certificate_subject = $env:CHAPTERA_TEST_CERT_SUBJECT
            certificate_thumbprint = $env:CHAPTERA_TEST_SIGN_THUMBPRINT
            staged_reader = $stagedReceipt
            setup = $setupReceipt
            installed_reader = $installedReceipt
            generated_uninstaller = $uninstallerReceipt
            post_sign_mutation_status = [string]$tamperedSig.Status
            post_sign_mutation_rejected = $true
            tuf_target = $target
          } | ConvertTo-Json -Depth 8 | Set-Content -Encoding utf8 "target/sign-preflight/receipt.json"

          $uninstall = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList @("/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART") -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "signed uninstaller failed: $($uninstall.ExitCode)" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chaptera-win-sign-preflight-${{ github.sha }}
          path: |
            target/sign-preflight/receipt.json
            target/sign-preflight/tuf-shaped-target.json
          if-no-files-found: error

      - name: Remove ephemeral TEST-ONLY certificate
        if: always()
        shell: pwsh
        run: |
          $thumbprint = $env:CHAPTERA_TEST_SIGN_THUMBPRINT
          if (-not $thumbprint) { exit 0 }
          foreach ($store in @("Cert:\CurrentUser\My","Cert:\CurrentUser\TrustedPeople")) {
            Get-ChildItem -Path $store -ErrorAction SilentlyContinue |
              Where-Object { $_.Thumbprint -eq $thumbprint } |
              Remove-Item -Force -ErrorAction SilentlyContinue
          }
