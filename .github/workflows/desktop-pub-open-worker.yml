name: Desktop PUB headless open worker V1

on:
  pull_request:
    paths:
      - "apps/chaptera-desktop-open-worker/**"
      - "crates/chaptera-desktop-open-protocol/**"
      - "vendor/producer-a/crates/pub-viewer/Cargo.toml"
      - "vendor/producer-a/crates/pub-viewer/src/**"
      - ".github/workflows/desktop-pub-open-worker.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --manifest-path apps/chaptera-desktop-open-worker/Cargo.toml -- --check

      - name: Check
        run: cargo check --manifest-path apps/chaptera-desktop-open-worker/Cargo.toml

      - name: Clippy
        run: cargo clippy --manifest-path apps/chaptera-desktop-open-worker/Cargo.toml --all-targets -- -D warnings

      - name: Test typed protocol failures
        run: cargo test --manifest-path apps/chaptera-desktop-open-worker/Cargo.toml -- --nocapture

      - name: Acquire exact Apache POI SampleNewsletter
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/SampleNewsletter.pub"
          curl --fail --location --silent --show-error             "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub"             --output "$fixture"
          actual="$(sha256sum "$fixture" | awk '{print $1}')"
          test "$actual" = "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          test "$(stat -c %s "$fixture")" = "291840"
          echo "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" >> "$GITHUB_ENV"

      - name: Prove source-path-free real-PUB worker roundtrip
        run: cargo test --manifest-path apps/chaptera-desktop-open-worker/Cargo.toml --test real_pub_worker -- --ignored --nocapture
