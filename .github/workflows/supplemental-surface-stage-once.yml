name: Supplemental 083 086 095 surface stage one-shot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/supplemental-surface-stage-once.yml"
      - "tools/windows/run_supplemental_surface_stage_oracle.ps1"

permissions:
  contents: read
  actions: read

concurrency:
  group: supplemental-surface-stage-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  contract:
    runs-on: windows-latest
    outputs:
      trusted_sha: ${{ steps.trust.outputs.trusted_sha }}
    steps:
      - name: Bind exact candidate
        id: trust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event_name }}" -eq "pull_request") {
            "trusted_sha=${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            "trusted_sha=${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.trust.outputs.trusted_sha }}
          persist-credentials: false

      - name: Parse read-only supplemental probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "tools/windows/run_supplemental_surface_stage_oracle.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path).Path,[ref]$tokens,[ref]$errors)
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell parser rejected supplemental surface-stage probe."
          }

      - name: Enforce read-only and exact-source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $text = Get-Content "tools/windows/run_supplemental_surface_stage_oracle.ps1" -Raw
          foreach ($forbidden in @(".Save(", ".SaveAs(", ".ExportAsFixedFormat(", ".PrintOut(", ".Run(")) {
            if ($text.Contains($forbidden)) { throw "Forbidden mutation/output token in read-only probe: $forbidden" }
          }
          foreach ($sha in @(
            "5eb5055bc75918ca8dbc7093fa267a3365f25129fd2c3dc88c7be3540f44e4cd",
            "248596cea801913454aa40073d5ce113a931b11a7283c9efc4533caa86a46125",
            "1e7f38b3ce1d0d956815992b15d361c405fc4bbdced5cdabb3c4581327cc183e"
          )) {
            if (-not $text.Contains($sha)) { throw "Missing exact supplemental source identity: $sha" }
          }
          if ($text -notmatch [regex]::Escape('$doc = $app.Open($resolved, $true, $false)')) {
            throw "Probe must open exact source read-only."
          }

  native:
    needs: contract
    if: github.event_name == 'workflow_dispatch'
    environment: pub-native-lab
    runs-on:
      - self-hosted
      - Windows
      - pub-research
      - publisher-2019
    timeout-minutes: 30
    env:
      OUTPUT_ROOT: ${{ github.workspace }}\out\pub-research\supplemental-surface-stage-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.contract.outputs.trusted_sha }}
          clean: true
          persist-credentials: false

      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Run one sequential read-only Publisher probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File tools/windows/run_supplemental_surface_stage_oracle.ps1 `
            -SourceRoot "${{ github.workspace }}\out\pinned1050\materialized\native" `
            -OutputRoot "$env:OUTPUT_ROOT"
          if ($LASTEXITCODE -ne 0) { throw "Supplemental surface-stage probe failed with exit code $LASTEXITCODE" }

      - name: Publish source-free verdict
        if: always()
        shell: pwsh
        run: |
          $receipt = Join-Path $env:OUTPUT_ROOT "supplemental-surface-stage-oracle-083-086-095.json"
          "## SUPPLEMENTAL-SURFACE-STAGE-083-086-095-01" >> $env:GITHUB_STEP_SUMMARY
          if (-not (Test-Path -LiteralPath $receipt)) {
            "- receipt missing" >> $env:GITHUB_STEP_SUMMARY
            exit 0
          }
          $doc = Get-Content -LiteralPath $receipt -Raw | ConvertFrom-Json
          foreach ($target in @($doc.targets)) {
            "- $($target.id): logical Pages.Count=$($target.document.pages_count.value), PDF pages=$($target.publisher_pdf_page_count), PrintStyle=$($target.document.print_style.value), ViewTwoPageSpread=$($target.document.view_two_page_spread.value), PublicationLayout=$($target.document.page_setup.publication_layout.value)" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload source-free native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supplemental-surface-stage-${{ github.run_id }}
          path: out/pub-research/supplemental-surface-stage-${{ github.run_id }}/supplemental-surface-stage-oracle-083-086-095.json
          if-no-files-found: error
          retention-days: 30
