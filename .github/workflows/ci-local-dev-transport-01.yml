name: CI-LOCAL-DEV-TRANSPORT-01 Windows trusted main fast feedback

on:
  workflow_dispatch:
  schedule:
    - cron: "17 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/ci-local-dev-transport-01.yml"
      - "tools/ci/local_dev_transport.py"

permissions:
  contents: read

concurrency:
  group: ci-local-dev-transport-01-windows
  cancel-in-progress: false

jobs:
  # Admission and security checks stay hosted; code from a PR is never sent to the PC.
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Run transport negative controls
        run: python -m unittest discover -s tools/ci -p test_local_dev_transport.py

  local-dev:
    needs: contract
    if: github.repository == 'Lalalalendia/rar2' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || github.actor == 'Lalalalendia')
    runs-on: [self-hosted, Windows, X64, chaptera-dev-unprivileged]
    timeout-minutes: 22
    env:
      CHAPTERA_LOCAL_DEV_STATE: ${{ runner.tool_cache }}\chaptera-dev-state
      CHAPTERA_LOCAL_DEV_RECEIPT: ${{ runner.temp }}\chaptera-dev-receipt.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          clean: true
      - name: Verify exact SHA and run bounded local fast loop
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = "python"
          $args = @(
            "tools/ci/local_dev_transport.py",
            "--repo", "$env:GITHUB_WORKSPACE",
            "--state-root", "$env:CHAPTERA_LOCAL_DEV_STATE",
            "--receipt", "$env:CHAPTERA_LOCAL_DEV_RECEIPT",
            "--sha", "$env:GITHUB_SHA",
            "--run-id", "$env:GITHUB_RUN_ID",
            "--profile", "edit"
          )
          & $python @args
          exit $LASTEXITCODE
      - name: Upload public-safe receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chaptera-local-dev-${{ github.run_id }}
          path: ${{ runner.temp }}\chaptera-dev-receipt.json
          if-no-files-found: warn
          retention-days: 14
