name: EDITOR-GUIDE-PROJECTION-01

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-model/src/guides.rs"
      - "vendor/producer-a/crates/pub-model/src/lib.rs"
      - "vendor/producer-a/crates/pub-reader/src/guide_bridge.rs"
      - "vendor/producer-a/crates/pub-reader/tests/guide_bridge.rs"
      - "vendor/producer-a/crates/pub-layout/src/lib.rs"
      - "vendor/producer-a/crates/pub-editor/src/ruler_guide_v1.rs"
      - "vendor/producer-a/crates/pub-editor/tests/ruler_guide_v1.rs"
      - ".github/workflows/editor-guide-projection-v1.yml"
  push:
    branches:
      - editor-guide-projection-01

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guide-projection:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test grounded guide bridge and projection
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-model -p pub-layout
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --test guide_bridge
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --test ruler_guide_v1
          cargo test --manifest-path crates/chaptera-desktop-shaped-flow-runtime/Cargo.toml fixed_pdf_page_projection_consumes_current_authored_ruler_guides
      - name: Check task-owned crates
        run: |
          cargo check --manifest-path vendor/producer-a/Cargo.toml -p pub-reader -p pub-layout
