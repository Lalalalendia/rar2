name: Quill final-two Wayback parent-link probe

on:
  push:
    branches:
      - research/quill-story-wayback-donors-v2
    paths:
      - ".github/workflows/quill-story-wayback-parent-links-v1.yml"
      - "tools/research/quill_story_wayback_parent_links_v1.py"

permissions:
  contents: read

concurrency:
  group: quill-story-wayback-parent-links-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-two:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Check bounded Wayback link probe
        run: python -m py_compile tools/research/quill_story_wayback_parent_links_v1.py

      - name: Recover archived parent-page PUB routes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          python tools/research/quill_story_wayback_parent_links_v1.py

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quill-story-wayback-parent-links-v1-${{ github.run_id }}
          path: out/quill-story-wayback-parent-links.json
          if-no-files-found: error
          retention-days: 30
