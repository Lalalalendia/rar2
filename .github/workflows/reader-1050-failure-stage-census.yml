name: Reader 1050 failure stage census

on:
  workflow_dispatch:
  push:
    branches:
      - reader/failure-stage-census-1050
    paths:
      - '.github/workflows/reader-1050-failure-stage-census.yml'
      - 'vendor/producer-a/crates/pub-viewer/src/bin/corpus-reader-failure-stage-census.rs'
      - 'vendor/producer-a/crates/pub-viewer/**'
      - 'vendor/producer-a/crates/pub-reader/**'
      - 'vendor/producer-a/crates/pub-quill/**'

permissions:
  contents: read
  actions: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'

      - name: Restore Reader Cargo build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rar2-target
          key: reader-1050-release-v1-${{ runner.os }}-rust-1.94.1-${{ hashFiles('vendor/producer-a/Cargo.toml', 'vendor/producer-a/Cargo.lock', 'vendor/producer-a/crates/**/Cargo.toml') }}

      - name: Build source-free failure-stage census
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-viewer \
            --release \
            --bin corpus-reader-failure-stage-census

      - name: Run stage census across exact 1050 corpus
        run: |
          set -euo pipefail
          test "$(find out/pinned1050/materialized/native -maxdepth 1 -type f -name '*.pub' | wc -l)" -eq 1050
          "${CARGO_TARGET_DIR}/release/corpus-reader-failure-stage-census" \
            out/pinned1050/materialized/native \
            out/failure-stage-census.json
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          report=json.loads(Path("out/failure-stage-census.json").read_text())
          assert report["corpus_file_count"] == 1050, report["corpus_file_count"]
          assert report["opened_count"] == 1030, report["opened_count"]
          assert report["failed_count"] == 20, report["failed_count"]

          failed=[r for r in report["rows"] if not r["opened"]]
          stage_counts=Counter(r["stage"] for r in failed)
          cluster=Counter(
              (r["stage"], r.get("open_error_signature_sha256") or "")
              for r in failed
          )
          summary={
              "failed_stage_counts": dict(stage_counts),
              "failure_stage_signature_clusters": [
                  {"stage": stage, "signature": sig, "count": count}
                  for (stage,sig),count in cluster.most_common()
              ],
          }
          Path("out/failure-stage-summary.json").write_text(
              json.dumps(summary,indent=2,sort_keys=True)+"\n"
          )
          print(json.dumps(summary,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: reader-1050-failure-stage-census-${{ github.run_id }}
          path: |
            out/failure-stage-census.json
            out/failure-stage-summary.json
          if-no-files-found: error
          retention-days: 90
