name: Migration expanded corpus

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-editor/**"
      - "vendor/producer-a/crates/pub-export/**"
      - "vendor/producer-a/crates/pub-idml/**"
      - "vendor/producer-a/crates/pub-odg/**"
      - "vendor/producer-a/crates/pub-reader/**"
      - "tools/run_migration_editable_route_corpus_v2.py"
      - "tools/ci/scribus_idml_consumer.py"
      - ".github/workflows/migration-expanded-corpus.yml"
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/migration-corpus-rust
  CORPUS_DIR: ${{ github.workspace }}/out/materialized/native
  EVIDENCE_DIR: ${{ github.workspace }}/target/migration-expanded-corpus

jobs:
  corpus:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Resolve corpus depth
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "MIGRATION_SAMPLE_COUNT=64" >> "$GITHUB_ENV"
            echo "MIGRATION_MATERIALIZE_COUNT=32" >> "$GITHUB_ENV"
          else
            echo "MIGRATION_SAMPLE_COUNT=1050" >> "$GITHUB_ENV"
            echo "MIGRATION_MATERIALIZE_COUNT=96" >> "$GITHUB_ENV"
          fi

      - name: Download pinned exact 1050 PUB materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Adopt and verify exact 1050 corpus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf out/materialized
          cp -a out/pinned1050/materialized out/materialized
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("out/materialized/native")
          paths = sorted(root.glob("*.pub"))
          shas = [p.stem.casefold() for p in paths]
          digest = hashlib.sha256(
              "".join(sha + "\n" for sha in shas).encode("ascii")
          ).hexdigest()
          expected = "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43"
          assert len(paths) == 1050, len(paths)
          assert len(set(shas)) == 1050, len(set(shas))
          assert digest == expected, (digest, expected)
          summary = json.loads(Path("out/materialized/summary.json").read_text())
          assert summary["unique_publisher_cfb"] == 1050, summary
          print(json.dumps({
              "publisher_unique_sha256": len(paths),
              "sha_list_digest": "sha256:" + digest,
          }, indent=2))
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt

      - name: Check probe formatting
        run: cargo fmt --manifest-path vendor/producer-a/Cargo.toml -p pub-editor -- --check

      - name: Build exact-source migration corpus probe
        run: |
          set -euo pipefail
          cargo build             --manifest-path vendor/producer-a/Cargo.toml             -p pub-editor             --release             --bin migration_corpus_probe

      - name: Run expanded exact-source migration corpus
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$EVIDENCE_DIR"
          python tools/run_migration_editable_route_corpus_v2.py             --corpus-dir "$CORPUS_DIR"             --probe "$CARGO_TARGET_DIR/release/migration_corpus_probe"             --out "$EVIDENCE_DIR"             --sample-count "$MIGRATION_SAMPLE_COUNT"             --materialize-count "$MIGRATION_MATERIALIZE_COUNT"             --workers 8             --timeout-seconds 40

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          summary = json.loads(
              (Path(os.environ["EVIDENCE_DIR"]) / "summary.json").read_text()
          )
          expected = int(os.environ["MIGRATION_SAMPLE_COUNT"])
          assert summary["corpus_file_count"] == 1050, summary
          assert summary["selected_file_count"] == expected, summary
          assert summary["hard_violation_count"] == 0, summary
          print(json.dumps({
              "selected_file_count": summary["selected_file_count"],
              "open_state_counts": summary["open_state_counts"],
              "idml_state_counts": summary["idml_state_counts"],
              "odg_state_counts": summary["odg_state_counts"],
              "materialization": summary["materialization"],
          }, indent=2, sort_keys=True))
          PY

      - name: Install independent editable-output consumers
        run: |
          set -euo pipefail
          sudo timeout 600s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 update
          sudo timeout 600s apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30             install -y --no-install-recommends scribus libreoffice-draw xvfb

      - name: Validate every materialized IDML through Scribus
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for idml in "$EVIDENCE_DIR"/per-file/*/output.idml; do
            dir="$(dirname "$idml")"
            out="$dir/consumer.sla"
            rm -f "$out"
            CHAPTERA_SCRIBUS_SLA_OUT="$out"               timeout 90s xvfb-run -a scribus -g -ns               -py tools/ci/scribus_idml_consumer.py -- "$idml"
            test -s "$out"
            sha256sum "$idml" > "$dir/idml.artifact.sha256"
            count=$((count + 1))
          done
          echo "IDML_CONSUMER_COUNT=$count" >> "$GITHUB_ENV"

      - name: Validate every materialized ODG through LibreOffice Draw
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          count=0
          for odg in "$EVIDENCE_DIR"/per-file/*/output.odg; do
            dir="$(dirname "$odg")"
            outdir="$dir/libreoffice"
            rm -rf "$outdir"
            mkdir -p "$outdir"
            timeout 90s libreoffice --headless               --convert-to fodg               --outdir "$outdir"               "$odg"
            test -s "$outdir/output.fodg"
            sha256sum "$odg" > "$dir/odg.artifact.sha256"
            count=$((count + 1))
          done
          echo "ODG_CONSUMER_COUNT=$count" >> "$GITHUB_ENV"

      - name: Seal consumer-validation receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          summary = json.loads((root / "summary.json").read_text())
          idml_expected = summary["materialization"]["idml_materialized_count"]
          odg_expected = summary["materialization"]["odg_materialized_count"]
          idml_actual = int(os.environ["IDML_CONSUMER_COUNT"])
          odg_actual = int(os.environ["ODG_CONSUMER_COUNT"])
          assert idml_actual == idml_expected, (idml_actual, idml_expected)
          assert odg_actual == odg_expected, (odg_actual, odg_expected)

          receipt = {
              "schema": "chaptera.migration-expanded-consumer-receipt.v1",
              "repository_commit_sha": os.environ.get("GITHUB_SHA"),
              "corpus_file_count": 1050,
              "selected_file_count": summary["selected_file_count"],
              "idml_consumer_opened": idml_actual,
              "odg_consumer_opened": odg_actual,
              "consumer_failures": 0,
              "scribus_required": True,
              "libreoffice_draw_required": True,
              "claims": {
                  "consumer_open_is_not_full_semantic_equivalence": True,
                  "universal_pub_editable_export": False,
              },
          }
          (root / "consumer-summary.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Remove large generated target bytes after validation
        if: always()
        shell: bash
        run: |
          find "$EVIDENCE_DIR" -type f \(             -name 'output.idml' -o             -name 'output.odg' -o             -name 'consumer.sla' -o             -name 'output.fodg'           \) -delete 2>/dev/null || true

      - name: Upload source-safe migration corpus receipts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: migration-expanded-corpus-${{ github.run_id }}
          path: |
            target/migration-expanded-corpus/summary.json
            target/migration-expanded-corpus/consumer-summary.json
            target/migration-expanded-corpus/per-file/**/route.json
            target/migration-expanded-corpus/per-file/**/*.report.json
            target/migration-expanded-corpus/per-file/**/*.report.txt
            target/migration-expanded-corpus/per-file/**/*.artifact.sha256
          if-no-files-found: warn
          retention-days: 30
