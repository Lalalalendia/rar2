name: Authoring TextFrame Break Link V1

on:
  pull_request:
    paths:
      - "vendor/producer-a/producer/tests/break_link_layout_v1.rs"
      - ".github/workflows/authoring-textframe-break-link-v1.yml"
concurrency:
  group: authoring-textframe-break-link-v1-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  break-link:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Test bounded BreakTextFrameForwardLink contract
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --test break_text_frame_forward_link_v1
      - name: Prove layout recomputes upstream overset after split
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml \
            -p chaptera-producer-a \
            --test break_link_layout_v1
