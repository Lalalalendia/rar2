name: Rust performance contracts

on:
  pull_request:
    paths:
      - "**/*.rs"
      - "**/Cargo.toml"
      - "tools/perf/**"
      - ".github/workflows/rust-performance-contracts.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      selected: ${{ steps.route.outputs.selected }}
      changed_json: ${{ steps.route.outputs.changed_json }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test performance contract router
        run: python -m unittest tools/perf/test_rust_perf_contract_router.py

      - name: Select contracts from exact PR diff
        id: route
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git diff --name-only "$BASE_SHA"..."$HEAD_SHA" > "$RUNNER_TEMP/changed.txt"
          else
            printf '%s\n'               'vendor/producer-a/crates/pub-layout/src/lib.rs'               > "$RUNNER_TEMP/changed.txt"
          fi

          python tools/perf/rust_perf_contract_router.py             --changed-files-from "$RUNNER_TEMP/changed.txt"             > "$RUNNER_TEMP/route.json"

          cat "$RUNNER_TEMP/route.json"
          selected="$(python -c 'import json,sys; print(",".join(json.load(open(sys.argv[1]))["selected_contracts"]))' "$RUNNER_TEMP/route.json")"
          changed_json="$(python -c 'import json,sys; print(json.dumps(json.load(open(sys.argv[1]))["changed_files"], separators=(",",":")))' "$RUNNER_TEMP/route.json")"
          echo "selected=$selected" >> "$GITHUB_OUTPUT"
          echo "changed_json=$changed_json" >> "$GITHUB_OUTPUT"

  layout-projection-work:
    needs: route
    if: contains(format(',{0},', needs.route.outputs.selected), ',layout-projection-work,')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/producer-a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Enforce deterministic projection work bound
        working-directory: .
        run: |
          python tools/perf/rust_perf_contract_router.py \
            --changed-file vendor/producer-a/crates/pub-layout/src/lib.rs \
            --require-selection \
            --run
      - uses: actions/upload-artifact@v4
        with:
          name: rust-perf-layout-projection-work-${{ github.run_id }}
          path: vendor/producer-a/target/layout-projection-index/benchmark.json
          if-no-files-found: error
