name: Reader PR selective CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/chaptera-desktop/**"
      - "apps/chaptera-mobile-android/**"
      - "apps/chaptera-rescue/**"
      - "apps/chaptera-server/**"
      - "apps/web/**"
      - "crates/chaptera-mobile-reader-core/**"
      - "crates/chaptera-mobile-reader-jni/**"
      - "crates/chaptera-scene-instance/**"
      - "crates/chaptera-suite-handoff/**"
      - "crates/chaptera-update-engine/**"
      - "crates/chaptera-update-handoff/**"
      - "crates/chaptera-update-orchestrator/**"
      - "crates/chaptera-update-trust/**"
      - "crates/chaptera-viewer-render-plan/**"
      - "crates/pub-presentation-profile/**"
      - "crates/pub-model/**"
      - "vendor/producer-a/Cargo.toml"
      - "vendor/producer-a/Cargo.lock"
      - "vendor/producer-a/crates/pub-core/**"
      - "vendor/producer-a/crates/pub-cfb/**"
      - "vendor/producer-a/crates/pub-contents/**"
      - "vendor/producer-a/crates/pub-escher/**"
      - "vendor/producer-a/crates/pub-model/**"
      - "vendor/producer-a/crates/pub-quill/**"
      - "vendor/producer-a/crates/pub-reader/**"
      - "vendor/producer-a/crates/pub-layout/**"
      - "vendor/producer-a/crates/pub-viewer/**"
      - "vendor/producer-a/crates/pub-editor/**"
      - "packages/product/reader-portable/**"
      - "packages/product/editor-live-trial/**"
      - "packages/product/desktop-suite/**"
      - "packages/product/local-portable/**"
      - "packages/protocol/editor-agent-control/**"
      - "packages/protocol/revision/v1/**"
      - "installer/windows/chaptera-reader.iss"
      - "services/editor-api/**"
      - "deploy/config/chaptera.prod.example.toml"
      - "Start-Chaptera-Local.cmd"
      - "tools/ci/reader_consumer_preflight.py"
      - "tools/ci/test_reader_consumer_preflight.py"
      - "tools/ci/reader_pr_fanout.py"
      - "tools/ci/test_reader_pr_fanout.py"
      - "tools/reader_active_content_guard.py"
      - "tools/reader_page_role_observation.py"
      - "tools/package_reader_portable.py"
      - "tools/test_package_reader_portable.py"
      - "tools/package_editor_live_trial.py"
      - "tools/build_editor_live_trial_package_receipt.py"
      - "tools/validate_editor_live_trial_package_receipt.py"
      - "tools/run_editor_live_trial_package_smoke.py"
      - "tools/validate_editor_desktop_ux_snapshots.py"
      - "tools/run_local_editor_desktop_vertical.py"
      - "tools/validate_chaptera_desktop_suite_manifest.py"
      - "tools/acquire_carlton_march_pair.py"
      - "tools/pdf_reference_diff_v1.py"
      - "tools/reader_reference_pdf_raster_v1.py"
      - "tools/run_web_editor_real_acceptance.mjs"
      - "tools/sample_newsletter_move_producer.py"
      - "tools/resolved_graph_scene_bridge_v1.py"
      - "tools/adapt_viewer_scene_v1.py"
      - "tools/validate_browser_acceptance_receipt.py"
      - "tools/validate_web_acceptance_preflight.py"
      - "tools/verify_editable_export_geometry.py"
      - "tools/run_local_full_stack.py"
      - "tools/run_local_real_editor.py"
      - "tools/run_cloud_config_receipt.py"
      - "tools/package_local_portable.py"
      - "tools/scene_v1.py"
      - "tools/validate_export_preview.py"
      - ".github/workflows/reader-pr-ci.yml"
      - ".github/workflows/reader-consumer-preflight.yml"
      - ".github/workflows/chaptera-reader-windows.yml"
      - ".github/workflows/chaptera-reader-windows-smoke.yml"
      - ".github/workflows/chaptera-desktop-windows.yml"
      - ".github/workflows/chaptera-local-portable-windows.yml"
      - ".github/workflows/carlton-reader-visual-oracle.yml"
      - ".github/workflows/mobile-reader-android-core-portability.yml"
      - ".github/workflows/mobile-reader-android-local-open.yml"
      - ".github/workflows/mobile-reader-android-render.yml"
      - ".github/workflows/reader-typography-golden.yml"
      - ".github/workflows/web-acceptance-real-chromium.yml"
      - ".github/workflows/chaptera-reader-installer.yml"
      - ".github/workflows/chaptera-win-path-identity.yml"
      - ".github/workflows/chaptera-win-update-accept.yml"
      - ".github/workstream-scopes/chaptera-win-update-accept-01.md"
  workflow_dispatch:

concurrency:
  group: reader-pr-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  classify:
    name: Classify PR CI scope
    runs-on: ubuntu-latest
    outputs:
      tier_a: ${{ steps.scope.outputs.tier_a }}
      reader_windows_smoke: ${{ steps.scope.outputs.reader_windows_smoke }}
      reader_windows: ${{ steps.scope.outputs.reader_windows }}
      editor_windows: ${{ steps.scope.outputs.editor_windows }}
      visual_oracle: ${{ steps.scope.outputs.visual_oracle }}
      typography_golden: ${{ steps.scope.outputs.typography_golden }}
      android_core: ${{ steps.scope.outputs.android_core }}
      android: ${{ steps.scope.outputs.android }}
      web: ${{ steps.scope.outputs.web }}
      local_portable: ${{ steps.scope.outputs.local_portable }}
      installer: ${{ steps.scope.outputs.installer }}
      path_identity: ${{ steps.scope.outputs.path_identity }}
      update_accept: ${{ steps.scope.outputs.update_accept }}
    steps:
      - uses: actions/checkout@v5
        with:
          # CI control-plane authority comes from the base branch so already-open
          # PR heads do not need to contain newly introduced classifier scripts.
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0

      - name: Fetch PR head for diff classification
        if: ${{ github.event.pull_request.head.sha != '' }}
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Test base-authority PR fanout classifier
        run: python tools/ci/test_reader_pr_fanout.py

      - name: Test PR-head fanout classifier in isolation
        if: ${{ github.event.pull_request.head.sha != '' }}
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          changed="$(git diff --name-only "$BASE_SHA...$HEAD_SHA")"
          if ! grep -Eq '^(tools/ci/reader_pr_fanout.py|tools/ci/test_reader_pr_fanout.py)$' <<<"$changed"; then
            echo "::notice::PR does not change the fanout classifier; base-authority tests are sufficient."
            exit 0
          fi

          tmp="$(mktemp -d)"
          git show "$HEAD_SHA:tools/ci/reader_pr_fanout.py" > "$tmp/reader_pr_fanout.py"
          git show "$HEAD_SHA:tools/ci/test_reader_pr_fanout.py" > "$tmp/test_reader_pr_fanout.py"
          python "$tmp/test_reader_pr_fanout.py"

      - id: scope
        name: Classify changed paths once
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          python tools/ci/reader_pr_fanout.py \
            --base "$base" \
            --head "$HEAD_SHA" \
            --receipt target/reader-pr-ci/fanout.json \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: reader-pr-fanout-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/reader-pr-ci/fanout.json
          if-no-files-found: error

  tier-a:
    name: Reader consumer Tier A
    needs: classify
    if: needs.classify.outputs.tier_a == 'true'
    uses: ./.github/workflows/reader-consumer-preflight.yml

  reader-windows-smoke:
    name: Reader Windows shared-core smoke
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.reader_windows_smoke == 'true' && needs.classify.outputs.visual_oracle != 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/chaptera-reader-windows-smoke.yml

  reader-windows:
    name: Reader Windows product
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.reader_windows == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/chaptera-reader-windows.yml

  editor-windows:
    name: Editor Windows product
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.editor_windows == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/chaptera-desktop-windows.yml

  visual-oracle:
    name: Reader visual oracle
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.visual_oracle == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/carlton-reader-visual-oracle.yml
    with:
      run_typography_golden: ${{ needs.classify.outputs.typography_golden == 'true' }}
      run_windows_shared_core_smoke: ${{ needs.classify.outputs.reader_windows_smoke == 'true' }}

  typography-golden:
    name: Reader typography golden
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.typography_golden == 'true' && needs.classify.outputs.visual_oracle != 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/reader-typography-golden.yml

  android-core:
    name: Android core portability
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.android_core == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/mobile-reader-android-core-portability.yml

  android-local-open:
    name: Android local open
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.android == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/mobile-reader-android-local-open.yml

  android-render:
    name: Android render
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.android == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/mobile-reader-android-render.yml

  web:
    name: Web real Chromium
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.web == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/web-acceptance-real-chromium.yml

  local-portable:
    name: Local portable Windows
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.local_portable == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/chaptera-local-portable-windows.yml

  installer:
    name: Reader installer
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.installer == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/chaptera-reader-installer.yml

  path-identity:
    name: Windows path identity
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.path_identity == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/chaptera-win-path-identity.yml

  update-accept:
    name: Windows update acceptance
    needs: [classify, tier-a]
    if: ${{ always() && needs.classify.outputs.update_accept == 'true' && (needs.tier-a.result == 'success' || needs.tier-a.result == 'skipped') }}
    uses: ./.github/workflows/chaptera-win-update-accept.yml


  sentinel-ffffffff:
    name: Exact seven Quill FFFFFFFF discriminator
    if: ${{ github.head_ref == 'research/quill-story-sentinel-ffffffff-01' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Prepare exact seven sentinel witnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/sentinel7
          cat > /tmp/sentinel-sha.txt <<'EOF'
          211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157
          6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a
          9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569
          9d6a7f3638c49e043795416545e7f2305498dcfecd064cfa9ada03e27167e966
          b171668d889a4e30cc8c7838a88f406017d67c722bf059965b1dfcfb9876d055
          bc28f3ced90b0c9452bda1bd5bdaf2d841feb1d44bd7e84749a13ff2072e20f2
          ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff
          EOF
          while read -r sha; do
            src="out/pinned1050/materialized/native/${sha}.pub"
            test -f "$src"
            echo "${sha}  $src" | sha256sum -c -
            cp "$src" "out/sentinel7/${sha}.pub"
          done < /tmp/sentinel-sha.txt
          test "$(find out/sentinel7 -maxdepth 1 -type f -name '*.pub' | wc -l)" -eq 7

      - name: Build targeted source-safe sentinel probe
        run: |
          set -euo pipefail
          cargo build             --manifest-path vendor/producer-a/Cargo.toml             -p pub-viewer             --release             --bin quill-story-sentinel-probe

      - name: Run exact seven-witness discriminator
        run: |
          set -euo pipefail
          "${CARGO_TARGET_DIR:-$GITHUB_WORKSPACE/rar2-target}/release/quill-story-sentinel-probe"             out/sentinel7             out/quill-story-sentinel-report.json

      - name: Guard sentinel cohort and summarize grounded demand
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          expected = {
              "211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157",
              "6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a",
              "9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569",
              "9d6a7f3638c49e043795416545e7f2305498dcfecd064cfa9ada03e27167e966",
              "b171668d889a4e30cc8c7838a88f406017d67c722bf059965b1dfcfb9876d055",
              "bc28f3ced90b0c9452bda1bd5bdaf2d841feb1d44bd7e84749a13ff2072e20f2",
              "ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff",
          }
          report = json.loads(Path("out/quill-story-sentinel-report.json").read_text())
          rows = report["rows"]
          assert report["witness_count"] == 7
          assert {row["source_sha256"] for row in rows} == expected
          for row in rows:
              assert row["quill_error_kind"] == "too_short", row
              assert row["quill_failure_stage"] == "syid_id_array", row
              e = row["quill_failure_evidence"]
              assert e["kind"] == "syid_id_array", e
              assert e["declared_count"] == 0xFFFFFFFF, e
              assert e["strs_declared_count"] == 0xFFFFFFFF, e
              assert e["strs_count_matches"] is True, e
              assert e["next_boundary_is_descriptor"] is True, e
              assert e["required_fits_before_next_boundary"] is False, e
              assert row["contents_story_demand"] is not None, row

          story_counts = Counter(
              "none" if row["contents_story_count"] is None else str(row["contents_story_count"])
              for row in rows
          )
          demand = Counter(
              (
                  row["contents_story_demand"]["live_shape_field_27_occurrence_count"],
                  row["contents_story_demand"]["live_table_field_27_occurrence_count"],
                  row["contents_story_demand"]["live_distinct_field_27_value_count"],
              )
              for row in rows
          )
          summary = {
              "schema": "chaptera.quill-story-sentinel-ffffffff.summary.v1",
              "witness_count": 7,
              "contents_story_count_clusters": dict(sorted(story_counts.items())),
              "story_demand_clusters": [
                  {
                      "shape_field27_occurrences": k[0],
                      "table_field27_occurrences": k[1],
                      "distinct_field27_values": k[2],
                      "count": v,
                  }
                  for k, v in sorted(demand.items())
              ],
          }
          Path("out/quill-story-sentinel-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: quill-story-sentinel-ffffffff-${{ github.run_id }}
          path: |
            out/quill-story-sentinel-report.json
            out/quill-story-sentinel-summary.json
          if-no-files-found: error
          retention-days: 90
