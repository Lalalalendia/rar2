name: PDF-PUB-EXTRACT V1

on:
  pull_request:
    paths:
      - tools/pdf_pub_extract_v1.py
      - tools/test_pdf_pub_extract_v1.py
      - tools/pdf_pub_extract_v1.md
      - .github/workflows/pdf-pub-extract-v1-ci.yml
  push:
    branches:
      - main
    paths:
      - tools/pdf_pub_extract_v1.py
      - tools/test_pdf_pub_extract_v1.py
      - tools/pdf_pub_extract_v1.md
      - .github/workflows/pdf-pub-extract-v1-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  synthetic-pdf-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Install Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install isolated research dependency
        run: "python -m pip install --disable-pip-version-check --only-binary=:all: PyMuPDF==1.26.7"
      - name: Compile and run synthetic source-free regression
        run: |
          python -m compileall -q tools/pdf_pub_extract_v1.py tools/test_pdf_pub_extract_v1.py
          python -m unittest discover -s tools -p test_pdf_pub_extract_v1.py -v
