name: Truncated Contents semantic census (one-shot)

on:
  push:
    branches:
      - research/partial-root-contents-census-linux-once

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build truncated Contents research binary
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --bin truncated-contents-semantics-once --release
      - name: Upload binary only
        uses: actions/upload-artifact@v4
        with:
          name: truncated-contents-semantics-once-linux
          path: vendor/producer-a/target/release/truncated-contents-semantics-once
          if-no-files-found: error
          retention-days: 1
