name: Carlton heading alignment native one-shot

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/carlton-heading-alignment-native-once.yml"
      - "tools/research-runner/experiments/carlton-heading-alignment-readonly-01.packet.json"
      - "tools/research-runner/operations/carlton_heading_alignment_readonly_01.ps1"

permissions:
  contents: read
  actions: read

concurrency:
  group: carlton-heading-alignment-publisher-2019-v2
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    outputs:
      trusted_sha: ${{ steps.trust.outputs.trusted_sha }}
      packet_sha256: ${{ steps.packet.outputs.packet_sha256 }}
    steps:
      - name: Bind checkout
        id: trust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event_name }}" -eq "pull_request") {
            "trusted_sha=${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            "trusted_sha=${{ github.sha }}" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.trust.outputs.trusted_sha }}
          persist-credentials: false

      - name: Parse read-only probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "tools/research-runner/operations/carlton_heading_alignment_readonly_01.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell parser rejected Carlton read-only probe."
          }

      - name: Enforce exact read-only contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "tools/research-runner/operations/carlton_heading_alignment_readonly_01.ps1"
          $text = Get-Content -LiteralPath $path -Raw
          foreach ($forbidden in @(
            ".Save(",
            ".SaveAs(",
            ".ExportAsFixedFormat(",
            ".PrintOut("
          )) {
            if ($text.Contains($forbidden)) {
              throw "Forbidden mutation/output token in Carlton read-only probe: $forbidden"
            }
          }
          if ($text -notmatch [regex]::Escape('$doc = $app.Open($env:PUB_RESEARCH_FIXTURE, $true, $false)')) {
            throw "Carlton probe must open the exact source read-only."
          }
          if ($text -notmatch "bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3") {
            throw "Carlton probe must bind the exact source SHA."
          }
          if ($text -notmatch "fixtureHashAfter") {
            throw "Carlton probe must verify the source hash after COM observation."
          }

      - name: Bind validated packet hash
        id: packet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packet = "tools/research-runner/experiments/carlton-heading-alignment-readonly-01.packet.json"
          $sha = (Get-FileHash -LiteralPath $packet -Algorithm SHA256).Hash.ToLowerInvariant()
          "packet_sha256=$sha" >> $env:GITHUB_OUTPUT
