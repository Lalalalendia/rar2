name: Quill Story read-only oracle v2

on:
  pull_request:
    paths:
      - ".github/workflows/quill-story-readonly-oracle-v2.yml"
      - "tools/research-runner/experiments/quill-story-readonly-oracle-02.packet.json"
      - "tools/research-runner/operations/quill_story_readonly_oracle_02.ps1"
      - "vendor/producer-a/crates/pub-reader/src/bin/quill-story-readonly-oracle-resolver.rs"
  push:
    branches: [main]
    paths:
      - ".github/workflows/quill-story-readonly-oracle-v2.yml"
      - "tools/research-runner/experiments/quill-story-readonly-oracle-02.packet.json"
      - "tools/research-runner/operations/quill_story_readonly_oracle_02.ps1"
      - "vendor/producer-a/crates/pub-reader/src/bin/quill-story-readonly-oracle-resolver.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quill-story-readonly-oracle-v2-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target
  PACKET: tools/research-runner/experiments/quill-story-readonly-oracle-02.packet.json

jobs:
  static-and-resolver:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      packet_sha256: ${{ steps.packet.outputs.packet_sha256 }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Validate packet
        id: packet
        shell: bash
        run: |
          set -euo pipefail
          python tools/research-runner/validate_packet.py \
            --packet "$PACKET" \
            --expected-environment publisher-2019 > packet-validation.json
          cat packet-validation.json
          echo "packet_sha256=$(python -c 'import json; print(json.load(open("packet-validation.json"))["packet_sha256"])')" >> "$GITHUB_OUTPUT"

      - name: Parse PowerShell operation
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path "tools/research-runner/operations/quill_story_readonly_oracle_02.ps1"),
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Rustfmt resolver
        run: |
          rustfmt --edition 2024 --check \
            vendor/producer-a/crates/pub-reader/src/bin/quill-story-readonly-oracle-resolver.rs

      - name: Test resolver
        run: |
          cargo test \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin quill-story-readonly-oracle-resolver

      - name: Clippy resolver
        run: |
          cargo clippy \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin quill-story-readonly-oracle-resolver \
            -- -D warnings

  native-oracle:
    needs: static-and-resolver
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    environment: pub-native-lab
    runs-on:
      - self-hosted
      - Windows
      - pub-research
      - publisher-2019
    timeout-minutes: 35
    env:
      PUB_RESEARCH_PACKET: tools/research-runner/experiments/quill-story-readonly-oracle-02.packet.json
      PUB_RESEARCH_ENVIRONMENT: publisher-2019
      PUB_RESEARCH_PACKET_SHA256: ${{ needs.static-and-resolver.outputs.packet_sha256 }}
      PUB_RESEARCH_OUTPUT: ${{ github.workspace }}\out\pub-research\${{ github.run_id }}
      PUB_RESEARCH_PROFILE_ID: publisher-2019
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          clean: true
          persist-credentials: false

      - name: Verify packet and native environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/research-runner/validate_packet.py `
            --packet "$env:PUB_RESEARCH_PACKET" `
            --expected-environment "$env:PUB_RESEARCH_ENVIRONMENT" | Out-Null
          pwsh -NoProfile -File tools/research-runner/prepare_native_run.ps1 `
            -PacketPath "$env:PUB_RESEARCH_PACKET" `
            -OutputRoot "$env:PUB_RESEARCH_OUTPUT"

      - name: Run read-only Publisher oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File tools/research-runner/operations/quill_story_readonly_oracle_02.ps1 `
            -PacketPath "$env:PUB_RESEARCH_PACKET" `
            -OutputRoot "$env:PUB_RESEARCH_OUTPUT"

      - name: Finalize source-safe evidence
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File tools/research-runner/finalize_native_run.ps1 `
            -PacketPath "$env:PUB_RESEARCH_PACKET" `
            -OutputRoot "$env:PUB_RESEARCH_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quill-story-readonly-oracle-native-${{ github.run_id }}
          path: |
            out/pub-research/${{ github.run_id }}/environment.json
            out/pub-research/${{ github.run_id }}/evidence-manifest.json
            out/pub-research/${{ github.run_id }}/logs/**
            out/pub-research/${{ github.run_id }}/analysis/**
          if-no-files-found: error
          retention-days: 30

  resolve:
    needs: native-oracle
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Checkout exact four source witnesses only
        uses: actions/checkout@v5
        with:
          repository: Lalalalendia/lalamu
          ref: f78cc6f455f4dc222868f9cc035511a6ca7a91ea
          path: _witness/lalamu
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            pub-corpus/corpus/native/unclassified/211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157.pub
            pub-corpus/corpus/native/unclassified/6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a.pub
            pub-corpus/corpus/native/unclassified/9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569.pub
            pub-corpus/corpus/native/unclassified/ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff.pub

      - uses: actions/download-artifact@v4
        with:
          name: quill-story-readonly-oracle-native-${{ github.run_id }}
          path: out/native

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Resolve COM observations against source TEXT and FDPP
        run: |
          set -euo pipefail
          cargo run \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin quill-story-readonly-oracle-resolver \
            -- \
            _witness/lalamu/pub-corpus/corpus/native/unclassified \
            out/native/analysis/quill-story-readonly-oracle.json \
            out/quill-story-readonly-oracle-resolution.json

      - name: Enforce evidence boundary and donor cross-check
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("out/quill-story-readonly-oracle-resolution.json")
          report = json.loads(path.read_text())
          assert report["witness_count"] == 4
          rows = {row["source_sha256"]: row for row in report["rows"]}
          expected = {
              "211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157",
              "6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a",
              "9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569",
              "ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff",
          }
          assert set(rows) == expected

          donor = rows["6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a"]
          if donor["unique_hash_partition"]:
              assert donor["terminal_fdpp_ordinals_zero_based"] == [11, 12, 13, 25], donor

          forbidden = ("document_text", "raw_bytes", "source_path", "filename")
          lowered = path.read_text().lower()
          assert all(token not in lowered for token in forbidden)
          print(json.dumps({
              "uniquely_resolved_count": report["uniquely_resolved_count"],
              "donor_cross_check": "matched" if donor["unique_hash_partition"] else "not_uniquely_resolved",
          }, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: quill-story-readonly-oracle-resolution-${{ github.run_id }}
          path: out/quill-story-readonly-oracle-resolution.json
          if-no-files-found: error
          retention-days: 30
