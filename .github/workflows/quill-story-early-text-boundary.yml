name: Quill early Story text-boundary probe

on:
  push:
    branches:
      - research/quill-story-early-text-boundary-01
    paths:
      - ".github/workflows/quill-story-early-text-boundary.yml"
      - "vendor/producer-a/crates/pub-reader/src/bin/quill-story-early-text-boundary-probe.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target

jobs:
  exact-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact seven hash-addressed witnesses only
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: f78cc6f455f4dc222868f9cc035511a6ca7a91ea
          path: _witness/lalamu
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            pub-corpus/corpus/native/unclassified/211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157.pub
            pub-corpus/corpus/native/unclassified/6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a.pub
            pub-corpus/corpus/native/unclassified/9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569.pub
            pub-corpus/corpus/native/unclassified/9d6a7f3638c49e043795416545e7f2305498dcfecd064cfa9ada03e27167e966.pub
            pub-corpus/corpus/native/unclassified/b171668d889a4e30cc8c7838a88f406017d67c722bf059965b1dfcfb9876d055.pub
            pub-corpus/corpus/native/unclassified/bc28f3ced90b0c9452bda1bd5bdaf2d841feb1d44bd7e84749a13ff2072e20f2.pub
            pub-corpus/corpus/native/unclassified/ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff.pub

      - name: Verify exact witness identities
        shell: bash
        run: |
          set -euo pipefail
          root="_witness/lalamu/pub-corpus/corpus/native/unclassified"
          test "$(find "$root" -maxdepth 1 -type f -name '*.pub' | wc -l)" -eq 7
          for path in "$root"/*.pub; do
            sha="$(basename "$path" .pub)"
            echo "${sha}  ${path}" | sha256sum -c -
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Restore Reader Cargo build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rar2-target
          key: reader-early-quill-boundary-v1-${{ runner.os }}-rust-1.94.1-${{ hashFiles('vendor/producer-a/Cargo.toml', 'vendor/producer-a/Cargo.lock', 'vendor/producer-a/crates/**/Cargo.toml') }}
          restore-keys: |
            reader-1050-release-v1-${{ runner.os }}-rust-1.94.1-
            reader-tier-a-${{ runner.os }}-

      - name: Build targeted boundary probe
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin quill-story-early-text-boundary-probe

      - name: Run exact-seven boundary discriminator
        run: |
          set -euo pipefail
          "${CARGO_TARGET_DIR}/debug/quill-story-early-text-boundary-probe" \
            "_witness/lalamu/pub-corpus/corpus/native/unclassified" \
            "out/quill-story-early-text-boundary.json"

      - name: Guard known identity facts and summarize candidates
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("out/quill-story-early-text-boundary.json").read_text())
          assert report["witness_count"] == 7, report["witness_count"]
          rows = report["rows"]

          # Facts already proved by #315; the early SYID/STRS payloads are filler,
          # not Story identity/length carriers.
          assert all(row["syid_length_matches_grounded_count"] for row in rows), rows
          assert all(row["strs_length_matches_observed_22_plus_8n"] for row in rows), rows
          assert all(row["syid_chunk_all_ff"] for row in rows), rows
          assert all(row["strs_chunk_all_ff"] for row in rows), rows
          assert all(row["strs_direct_generic_plc_candidate_count"] == 0 for row in rows), rows

          summary = {
              "schema": "chaptera.quill-story-early-text-boundary.summary.v2",
              "witness_count": 7,
              "rows": [
                  {
                      "source_sha256": row["source_sha256"],
                      "revision": row["contents_serialization_revision"],
                      "story_count": row["grounded_story_count"],
                      "text_utf16_units": row["text_utf16_units"],
                      "syid_all_ff": row["syid_chunk_all_ff"],
                      "strs_all_ff": row["strs_chunk_all_ff"],
                      "btep_descriptor_length": row["btep_descriptor_length"],
                      "btec_descriptor_length": row["btec_descriptor_length"],
                      "fdpp_descriptor_length": row["fdpp_descriptor_length"],
                      "fdpc_descriptor_length": row["fdpc_descriptor_length"],
                      "btep_candidates": row["btep_candidates"],
                      "btec_candidates": row["btec_candidates"],
                  }
                  for row in rows
              ],
              "evidence_boundary": (
                  "seven exact SHA-addressed donor blobs only; no 1050 artifact; "
                  "source-safe structural values only"
              ),
          }
          Path("out/quill-story-early-text-boundary-summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: quill-story-early-text-boundary-${{ github.run_id }}
          path: |
            out/quill-story-early-text-boundary.json
            out/quill-story-early-text-boundary-summary.json
          if-no-files-found: error
          retention-days: 30
