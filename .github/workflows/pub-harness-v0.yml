name: PUB harness v0

on:
  pull_request:
    paths:
      - "services/pub-harness/**"
      - "docs/pub-harness-v0.md"
      - ".github/workflows/pub-harness-v0.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: SQLite capabilities
        run: |
          python - <<'PY'
          import sqlite3
          c = sqlite3.connect(":memory:")
          c.execute("create virtual table x using fts5(body)")
          print("sqlite", sqlite3.sqlite_version, "fts5=ok")
          PY
      - name: Test PUB harness
        working-directory: services/pub-harness
        run: python -m unittest -v

      - name: Emit source-safe K2C health receipt
        working-directory: services/pub-harness
        env:
          SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python k2c_ci_receipt.py \
            --source-head "$SOURCE_HEAD" \
            --output ../../target/k2c-health-receipt.json

      - name: Upload K2C health receipt
        uses: actions/upload-artifact@v4
        with:
          name: k2c-health-receipt-${{ github.run_id }}
          path: target/k2c-health-receipt.json
          if-no-files-found: error
          retention-days: 30
