name: Mature 029 native page spread one-shot

on:
  pull_request:
    paths:
      - ".github/workflows/mature-029-native-page-spread-once.yml"
      - "tools/research-runner/operations/mature_029_native_page_spread_oracle_01.ps1"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/mature-029-native-page-spread-once.yml"
      - "tools/research-runner/operations/mature_029_native_page_spread_oracle_01.ps1"

permissions:
  contents: read
  actions: read

concurrency:
  group: mature-029-native-page-spread-publisher-2019
  cancel-in-progress: false

jobs:
  contract:
    runs-on: windows-latest
    outputs:
      trusted_sha: ${{ steps.trust.outputs.trusted_sha }}
    steps:
      - name: Bind checkout
        id: trust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.event_name }}" -eq "push") {
            if ("${{ github.ref }}" -ne "refs/heads/main") {
              throw "Native one-shot push must be refs/heads/main."
            }
            "trusted_sha=${{ github.sha }}" >> $env:GITHUB_OUTPUT
          } else {
            "trusted_sha=${{ github.event.pull_request.head.sha }}" >> $env:GITHUB_OUTPUT
          }

      - uses: actions/checkout@v5
        with:
          ref: ${{ steps.trust.outputs.trusted_sha }}
          persist-credentials: false

      - name: Parse read-only probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "tools/research-runner/operations/mature_029_native_page_spread_oracle_01.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            throw "PowerShell parser rejected native 029 probe."
          }

      - name: Enforce read-only source contract
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $text = Get-Content "tools/research-runner/operations/mature_029_native_page_spread_oracle_01.ps1" -Raw
          foreach ($forbidden in @(
            ".Save(",
            ".SaveAs(",
            ".ExportAsFixedFormat(",
            ".PrintOut(",
            ".Run("
          )) {
            if ($text.Contains($forbidden)) {
              throw "Forbidden mutation/output token in read-only native probe: $forbidden"
            }
          }
          if ($text -notmatch [regex]::Escape('$app.Open($resolvedInput, $true, $false)')) {
            throw "Probe must open exact source read-only and avoid recent-files mutation."
          }
          if ($text -notmatch "ExpectedSha256") {
            throw "Probe must bind the exact 029 SHA."
          }

  native:
    needs: contract
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: pub-native-lab
    runs-on:
      - self-hosted
      - Windows
      - pub-research
      - publisher-2019
    timeout-minutes: 45
    env:
      TARGET_SHA256: c0688f73b9bf8fc7677a1eecaadd30fa00fc1813f6b12dc39b8aa5eac973f81e
      OUTPUT_ROOT: ${{ github.workspace }}\out\pub-research\mature-029-native-page-spread-${{ github.run_id }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.contract.outputs.trusted_sha }}
          clean: true
          persist-credentials: false

      - name: Verify exact trusted checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne "${{ needs.contract.outputs.trusted_sha }}") {
            throw "Trusted checkout mismatch: $actual"
          }

      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Bind exact 029 fixture
        id: fixture
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = Join-Path "${{ github.workspace }}" "out\pinned1050\materialized\native\$env:TARGET_SHA256.pub"
          if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
            throw "Exact 029 source is missing from pinned 1050 materialization."
          }
          $actual = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $env:TARGET_SHA256) {
            throw "029 fixture SHA mismatch: $actual"
          }
          "path=$path" >> $env:GITHUB_OUTPUT

      - name: Run read-only Publisher page/spread oracle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:OUTPUT_ROOT | Out-Null
          pwsh -NoProfile -File tools/research-runner/operations/mature_029_native_page_spread_oracle_01.ps1 -InputPath "${{ steps.fixture.outputs.path }}" -OutputRoot "$env:OUTPUT_ROOT"

      - name: Publish native verdict
        if: always()
        shell: pwsh
        run: |
          "## MATURE-029-NATIVE-PAGE-SPREAD-ORACLE-01" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- trusted SHA: ${{ needs.contract.outputs.trusted_sha }}" >> $env:GITHUB_STEP_SUMMARY
          "- source SHA: $env:TARGET_SHA256" >> $env:GITHUB_STEP_SUMMARY
          $analysis = Join-Path $env:OUTPUT_ROOT "analysis\mature-029-native-page-spread-oracle-01.json"
          if (Test-Path -LiteralPath $analysis) {
            $doc = Get-Content -LiteralPath $analysis -Raw | ConvertFrom-Json
            "- native Pages.Count: $($doc.document.pages_count.value)" >> $env:GITHUB_STEP_SUMMARY
            "- PageSetup width: $($doc.document.page_setup.page_width.value) pt" >> $env:GITHUB_STEP_SUMMARY
            "- PageSetup height: $($doc.document.page_setup.page_height.value) pt" >> $env:GITHUB_STEP_SUMMARY
            "- PublicationLayout: $($doc.document.page_setup.publication_layout.value)" >> $env:GITHUB_STEP_SUMMARY
            "- ViewTwoPageSpread: $($doc.document.view_two_page_spread.value)" >> $env:GITHUB_STEP_SUMMARY
            "" >> $env:GITHUB_STEP_SUMMARY
            foreach ($page in @($doc.pages)) {
              $spreadCount = if ($page.reader_spread.page_count.state -eq "value") { $page.reader_spread.page_count.value } else { "error" }
              "- page $($page.collection_index): id=$($page.page_id.value), width=$($page.width.value), height=$($page.height.value), leading=$($page.is_leading.value), trailing=$($page.is_trailing.value), xoff=$($page.x_offset_within_reader_spread.value), spread_count=$spreadCount" >> $env:GITHUB_STEP_SUMMARY
            }
          } else {
            "- analysis receipt missing" >> $env:GITHUB_STEP_SUMMARY
          }

      - name: Upload source-free native evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mature-029-native-page-spread-${{ github.run_id }}
          path: |
            out/pub-research/mature-029-native-page-spread-${{ github.run_id }}/environment.json
            out/pub-research/mature-029-native-page-spread-${{ github.run_id }}/analysis/**
            out/pub-research/mature-029-native-page-spread-${{ github.run_id }}/logs/**
          if-no-files-found: error
          retention-days: 30
