name: LOCAL-WEB-EDITOR-01

on:
  pull_request:
    paths:
      - "apps/web/local-editor.html"
      - "apps/web/editor-service-client-v1.mjs"
      - "apps/web/editor-service-client-font.test.mjs"
      - "apps/web/font-environment-v1.mjs"
      - "services/editor-api/web_real_acceptance_service.py"
      - "services/editor-api/font_authoring_admission_v1.py"
      - "services/editor-api/test_font_authoring_admission_v1.py"
      - "services/editor-api/pinned_opentype_resource_v1.py"
      - "services/editor-api/test_pinned_opentype_resource_v1.py"
      - "services/editor-api/live_font_delivery_v1.py"
      - "services/editor-api/test_live_font_delivery_v1.py"
      - "tools/verify_live_font_ui_browser.mjs"
      - "tools/native-pub-candidate-cli/tests/real_pinned_font_resource_v1.rs"
      - "tools/native-pub-candidate-cli/Cargo.toml"
      - "assets/fonts/ofl/abel/**"
      - "tools/run_local_real_editor.py"
      - "tools/run_local_full_stack.py"
      - "apps/chaptera-server/assets/local-dashboard.html"
      - ".github/workflows/local-web-editor-v0.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  real-local-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@1.94.1
      - name: Check Python syntax
        run: |
          python -m py_compile tools/run_local_real_editor.py
          python -m py_compile tools/run_local_full_stack.py
          python -m py_compile services/editor-api/web_real_acceptance_service.py
          python -m py_compile services/editor-api/font_authoring_admission_v1.py
          python -m py_compile services/editor-api/test_font_authoring_admission_v1.py
          python -m py_compile services/editor-api/pinned_opentype_resource_v1.py
          python -m py_compile services/editor-api/test_pinned_opentype_resource_v1.py
          python -m py_compile services/editor-api/live_font_delivery_v1.py
          python -m py_compile services/editor-api/test_live_font_delivery_v1.py
      - name: Install pinned HTTP schema validation dependency
        run: python -m pip install "jsonschema==4.23.0"
      - name: Validate trusted font authoring catalog and HTTP authority
        working-directory: services/editor-api
        run: python -m unittest -v test_font_authoring_admission_v1.py test_pinned_opentype_resource_v1.py test_live_font_delivery_v1.py
      - name: Prove physical byte client and existing picker negatives
        run: node --test apps/web/editor-service-client-font.test.mjs apps/web/font-environment-v1.test.mjs
      - name: Install real Chromium for local Editor reachability
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Prove real PUB font delivery, stale denial, MoveNode and Chromium UI
        run: python tools/run_local_real_editor.py --smoke --pinned-abel-demo --browser-smoke
      - name: Prove actual Publisher Story uses canonical Rust full-font mutation and fresh re-admission
        env:
          CHAPTERA_REAL_PUB_FONT_FIXTURE: ${{ github.workspace }}/.chaptera-local/editor/SampleNewsletter.pub
        run: |
          set -o pipefail
          cargo test --manifest-path tools/native-pub-candidate-cli/Cargo.toml \
            --test real_pinned_font_resource_v1 -- --nocapture \
            | tee /tmp/chaptera-real-pub-font-history.log
          grep -q 'REAL_PUB_FONT_HISTORY_OK' /tmp/chaptera-real-pub-font-history.log
      - uses: actions/upload-artifact@v4
        with:
          name: local-editor-pinned-font-chromium
          if-no-files-found: error
          retention-days: 30
          path: |
            target/local-font-ui/chromium.json
            target/local-font-ui/chromium.png
