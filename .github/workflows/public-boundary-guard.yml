name: Rar public boundary guard

on:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  frozen-repo-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run public-boundary unit tests
        run: python -m unittest tools.test_public_boundary_guard

      - name: Check changed paths and research/tooling content
        env:
          PUBLIC_BOUNDARY_BASE: origin/${{ github.base_ref }}
          PUBLIC_BOUNDARY_HEAD: HEAD
        run: python tools/check_public_boundary.py

      - name: Test source fanout budget laws
        run: python tools/ci/test_source_fanout_budget.py

      - name: Enforce source fanout and monolith ratchets
        env:
          SOURCE_FANOUT_BASE: ${{ github.event.pull_request.base.sha }}
          SOURCE_FANOUT_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          python tools/ci/source_fanout_budget.py \
            --base "$SOURCE_FANOUT_BASE" \
            --head "$SOURCE_FANOUT_HEAD"
