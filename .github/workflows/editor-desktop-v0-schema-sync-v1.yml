name: Editor Desktop V0 Schema Sync V1

on:
  pull_request:
    paths:
      - "tools/run_local_editor_desktop_vertical.py"
      - "tools/test_editor_desktop_vertical_schema_versions.py"
      - "packages/product/editor-desktop-vertical/v1/acceptance-receipt.schema.json"
      - ".github/workflows/editor-desktop-v0-schema-sync-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  schema-sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install validator dependency
        run: python -m pip install jsonschema

      - name: Compile Desktop V0 verifier scripts
        run: >-
          python -m py_compile
          tools/run_local_editor_desktop_vertical.py
          tools/validate_editor_desktop_vertical_receipt.py
          tools/test_editor_desktop_vertical_schema_versions.py

      - name: Prove EditorProject schema sync
        run: python tools/test_editor_desktop_vertical_schema_versions.py
