name: Publisher VBA estate scanner

on:
  pull_request:
    paths:
      - "tools/pub_vba_cfb.py"
      - "tools/pub_vba_estate_scan.py"
      - "tools/test_pub_vba_estate_scan.py"
      - "tools/pub_vba_estate_scan.md"
      - "tools/pub_vba_migration_plan.py"
      - "tools/test_pub_vba_migration_plan.py"
      - "tools/pub_vba_migration_plan.md"
      - "tools/materialize_reader_corpus_v1.py"
      - "tools/reader_corpus_manifest_v1.json"
      - ".github/workflows/pub-vba-estate-scan.yml"
  workflow_dispatch:

concurrency:
  group: pub-vba-estate-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  corpus22:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit and syntax contracts
        run: |
          set -euo pipefail
          python -m py_compile tools/pub_vba_cfb.py tools/pub_vba_estate_scan.py tools/test_pub_vba_estate_scan.py tools/pub_vba_migration_plan.py tools/test_pub_vba_migration_plan.py tools/materialize_reader_corpus_v1.py
          python tools/test_pub_vba_estate_scan.py
          python tools/test_pub_vba_migration_plan.py
      - name: Materialize exact SHA-pinned 22-file PUB corpus
        run: |
          set -euo pipefail
          python tools/materialize_reader_corpus_v1.py \
            --manifest tools/reader_corpus_manifest_v1.json \
            --out "$RUNNER_TEMP/pub-vba-corpus22"
      - name: Scan corpus without executing active content
        run: |
          set -euo pipefail
          mkdir -p target/pub-vba-estate
          python tools/pub_vba_estate_scan.py scan \
            --input "$RUNNER_TEMP/pub-vba-corpus22/native" \
            --recursive \
            --output target/pub-vba-estate/receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("target/pub-vba-estate/receipt.json").read_text())
          assert data["totals"]["file_count"] == 22, data["totals"]
          assert data["totals"]["read_failed"] == 0, data["totals"]
          assert data["claims"]["vba_executed"] is False
          assert data["claims"]["ole_com_activated"] is False
          assert data["claims"]["source_text_emitted"] is False
          print(json.dumps(data["totals"], indent=2, sort_keys=True))
          PY
          python tools/pub_vba_migration_plan.py \
            --scan target/pub-vba-estate/receipt.json \
            --output target/pub-vba-estate/migration-plan.json
          python - <<'PY'
          import json
          from pathlib import Path
          plan = json.loads(Path("target/pub-vba-estate/migration-plan.json").read_text())
          assert plan["schema"] == "chaptera.pub-vba-migration-plan.v1"
          assert plan["claims"]["migration_plan_executes_code"] is False
          assert plan["summary"]["file_count"] == 22
          assert plan["summary"]["call_bearing_files"] == 0
          print(json.dumps(plan["summary"], indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pub-vba-estate-corpus22
          path: |
            target/pub-vba-estate/receipt.json
            target/pub-vba-estate/migration-plan.json
          if-no-files-found: error
          retention-days: 90
