name: Public PUB canonical compatibility bridge

on:
  pull_request:
    paths:
      - "apps/pub-check-web/**"
      - "tools/pub-check-cloud-bridge/**"
      - ".github/workflows/pub-check-worker.yml"
      - ".github/workflows/pub-check-canonical-bridge.yml"
  push:
    branches:
      - product/pub-compat-web-current-20261008
    paths:
      - "apps/pub-check-web/**"
      - "tools/pub-check-cloud-bridge/**"
      - ".github/workflows/pub-check-worker.yml"
      - ".github/workflows/pub-check-canonical-bridge.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-safe-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Python guest protocol and source-safety tests
        run: python3 -m unittest discover -s tools/pub-check-cloud-bridge -p "test_*.py" -v
      - name: Install public check dependencies (isolated)
        working-directory: apps/pub-check-web
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Typecheck public check app
        working-directory: apps/pub-check-web
        run: npm run typecheck
      - name: Verify canonical report boundary
        working-directory: apps/pub-check-web
        run: node --experimental-strip-types --test tests/*.test.mjs
