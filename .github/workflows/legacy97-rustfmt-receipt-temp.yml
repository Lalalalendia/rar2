name: LEGACY97-RUSTFMT-RECEIPT-TEMP
on:
  pull_request:
    paths:
      - ".github/workflows/legacy97-rustfmt-receipt-temp.yml"
permissions:
  contents: read
jobs:
  exact_format_receipt:
    if: github.event.pull_request.number == 2833
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - name: Emit machine-verifiable format-only diffs
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import difflib
          import hashlib
          import json
          paths = ["vendor/producer-a/crates/pub-reader/src/diagnostics.rs","vendor/producer-a/crates/pub-reader/src/family_classifier.rs","vendor/producer-a/crates/pub-reader/src/legacy22_graph.rs","vendor/producer-a/crates/pub-reader/src/legacy22_noquill_graph.rs","vendor/producer-a/crates/pub-reader/src/legacy_character_style.rs","vendor/producer-a/crates/pub-reader/src/lib.rs","vendor/producer-a/crates/pub-reader/src/source_graph_model.rs","vendor/producer-a/crates/pub-viewer/src/bridge_diagnostics.rs","vendor/producer-a/crates/pub-viewer/src/legacy_character_style.rs","vendor/producer-a/crates/pub-viewer/src/lib.rs"]
          for path in paths:
              p = Path(path)
              original = p.read_text(encoding="utf-8")
              subprocess.run(["rustfmt", "--edition", "2024", "--config", "skip_children=true", str(p)], check=True)
              formatted = p.read_text(encoding="utf-8")
              if original == formatted:
                  print("LEGACY97_CLEAN " + path, flush=True)
                  continue
              patch = "".join(difflib.unified_diff(original.splitlines(keepends=True), formatted.splitlines(keepends=True), fromfile=path+" (before)", tofile=path+" (rustfmt)"))
              report = {"path": path, "before_sha256": hashlib.sha256(original.encode()).hexdigest(), "after_sha256": hashlib.sha256(formatted.encode()).hexdigest(), "patch": patch}
              print("LEGACY97_PATCH_JSON " + json.dumps(report, ensure_ascii=True, separators=(",", ":")), flush=True)
          PY
