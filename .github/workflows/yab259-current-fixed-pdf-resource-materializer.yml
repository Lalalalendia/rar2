name: Yab 259 current fixed-PDF resource materializer

on:
  pull_request:
    paths:
      - "tools/yab259_current_fixed_pdf_resource_request.rs"
      - "tools/run_yab259_current_fixed_pdf_resource_request.py"
      - "tools/test_yab259_current_fixed_pdf_resource_request.py"
      - "tools/run_yab259_fixed_pdf_closure.py"
      - ".github/workflows/yab259-current-fixed-pdf-resource-materializer.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: yab259-current-fixed-pdf-resource-materializer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - name: Fence materializer from PUB reparse and reshaping
        run: python tools/test_yab259_current_fixed_pdf_resource_request.py -v
      - name: Materialize exact Yab donor repository
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/HeisLuka/yab.git /tmp/yab-source
          git -C /tmp/yab-source cat-file -e 4f5d8a57abc089d1ed8eb1326cf9bed602281f7e^{commit}
      - name: Prepare repaired donor and compile resource materializer
        run: |
          python - <<'PY'
          import pathlib
          import shutil
          import subprocess
          import sys

          root = pathlib.Path.cwd()
          sys.path.insert(0, str(root / "tools"))
          from run_yab259_fixed_pdf_closure import bind_yab_repository, prepare_repaired_donor

          source = bind_yab_repository(pathlib.Path("/tmp/yab-source"))
          donor = pathlib.Path("/tmp/yab-current-resources-donor")
          digest = prepare_repaired_donor(source, donor)
          bin_dir = donor / "crates" / "pub-cli" / "src" / "bin"
          bin_dir.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(
              root / "tools" / "yab259_current_fixed_pdf_resource_request.rs",
              bin_dir / "current-fixed-pdf-request.rs",
          )
          subprocess.run(
              [
                  "cargo",
                  "fmt",
                  "--manifest-path",
                  str(donor / "Cargo.toml"),
                  "--all",
                  "--",
                  "--check",
              ],
              cwd=donor,
              check=True,
          )
          subprocess.run(
              [
                  "cargo",
                  "check",
                  "--manifest-path",
                  str(donor / "Cargo.toml"),
                  "-p",
                  "pub-cli",
                  "--bin",
                  "current-fixed-pdf-request",
              ],
              cwd=donor,
              check=True,
          )
          print(f"repair_sha256={digest}")
          PY
