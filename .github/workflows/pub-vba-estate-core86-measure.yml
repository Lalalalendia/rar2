name: Publisher VBA estate core86 measurement

on:
  pull_request:
    paths:
      - "tools/pub_vba_cfb.py"
      - "tools/pub_vba_estate_scan.py"
      - "tools/test_pub_vba_estate_scan.py"
      - "tools/migration_editable_corpus_v2.py"
      - "tools/reader_corpus_manifest_v1.json"
      - "tools/corpus/receipts/lalamu-materialized-35-input-2026-09-29.json"
      - "tools/corpus/receipts/version-labelled-training-29-input-2026-09-25.json"
      - ".github/workflows/pub-vba-estate-core86-measure.yml"
  workflow_dispatch:

concurrency:
  group: pub-vba-estate-core86-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

env:
  PINNED_CORPUS_RUN_ID: "36573574820"
  PINNED_CORPUS_ARTIFACT: "pub-corpus-1000-36573574820"
  EXPECTED_1050_COUNT: "1050"
  EXPECTED_1050_SHA_LIST_DIGEST: "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43"

jobs:
  scan:
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: core65
            expected: 65
          - profile: extended86
            expected: 86
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Scanner source-free unit contract
        run: |
          set -euo pipefail
          python -m py_compile tools/pub_vba_cfb.py tools/pub_vba_estate_scan.py tools/test_pub_vba_estate_scan.py tools/migration_editable_corpus_v2.py
          python tools/test_pub_vba_estate_scan.py

      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PINNED_CORPUS_ARTIFACT }}
          path: ${{ runner.temp }}/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: ${{ env.PINNED_CORPUS_RUN_ID }}

      - name: Materialize exact profile by corpus stratum
        env:
          PROFILE: ${{ matrix.profile }}
          EXPECTED_PROFILE_COUNT: ${{ matrix.expected }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import importlib.util
          import io
          import json
          import os
          import zipfile
          from collections import Counter
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "pinned1050" / "materialized" / "native"
          paths = sorted(root.glob("*.pub"), key=lambda p: p.stem.casefold())
          shas = [p.stem.casefold() for p in paths]
          digest = hashlib.sha256("".join(sha + "\n" for sha in shas).encode("ascii")).hexdigest()
          assert len(paths) == int(os.environ["EXPECTED_1050_COUNT"]), len(paths)
          assert len(set(shas)) == len(shas), "duplicate SHA-named corpus entries"
          assert digest == os.environ["EXPECTED_1050_SHA_LIST_DIGEST"], (
              digest,
              os.environ["EXPECTED_1050_SHA_LIST_DIGEST"],
          )

          module_path = Path("tools/migration_editable_corpus_v2.py")
          spec = importlib.util.spec_from_file_location("migration_editable_corpus_v2", module_path)
          module = importlib.util.module_from_spec(spec)
          assert spec.loader is not None
          spec.loader.exec_module(module)

          profile = os.environ["PROFILE"]
          expected = int(os.environ["EXPECTED_PROFILE_COUNT"])
          entries = module.build_entries(Path("."), profile)
          assert len(entries) == expected, (profile, len(entries), expected)

          out = Path(os.environ["RUNNER_TEMP"]) / f"pub-vba-{profile}"
          native = out / "native"
          native.mkdir(parents=True, exist_ok=True)
          rows = []
          zip_cache = {}

          for entry in entries:
              sha = entry["sha256"].casefold()
              retained = root / f"{sha}.pub"

              if retained.is_file():
                  data = retained.read_bytes()
                  transport = "pinned1050_retained"
              elif entry["stratum"] == "apache_poi":
                  # The POI URL is commit-pinned by reader_corpus_manifest_v1.json.
                  data = module.fetch_bytes(entry["url"])
                  transport = "apache_poi_commit_pinned"
              elif entry["stratum"].startswith("microsoft_press_"):
                  # Raw PUB bytes were deliberately not retained in the public evidence
                  # artifacts. Rehydrate the official package, then fail closed unless
                  # the exact admitted member SHA-256 and byte length still match.
                  archive = zip_cache.get(entry["url"])
                  if archive is None:
                      archive = module.fetch_bytes(entry["url"], timeout=180)
                      zip_cache[entry["url"]] = archive
                  with zipfile.ZipFile(io.BytesIO(archive)) as zf:
                      data = zf.read(entry["member"])
                  transport = "microsoft_press_rehydrated_sha_verified"
              else:
                  raise RuntimeError(
                      "no exact-byte transport for corpus member "
                      f"{sha} stratum={entry['stratum']}; "
                      "mutable Lalamu URLs must not be re-fetched"
                  )

              actual = hashlib.sha256(data).hexdigest()
              assert actual == sha, (entry["name"], actual, sha, transport)
              assert len(data) == entry["byte_len"], (
                  entry["name"],
                  len(data),
                  entry["byte_len"],
                  transport,
              )
              (native / f"{sha}.pub").write_bytes(data)
              rows.append({
                  "sha256": sha,
                  "byte_len": len(data),
                  "stratum": entry["stratum"],
                  "family": entry["family"],
                  "transport": transport,
              })

          assert len(rows) == expected
          transport_counts = Counter(row["transport"] for row in rows)
          expected_retained = 14 if profile == "core65" else 35
          assert transport_counts == Counter({
              "pinned1050_retained": expected_retained,
              "apache_poi_commit_pinned": 22,
              "microsoft_press_rehydrated_sha_verified": 29,
          }), dict(transport_counts)

          receipt = {
              "schema": "chaptera.pub-vba-profile-exact-transport.v2",
              "profile": profile,
              "profile_count": len(rows),
              "pinned_1050_count": len(paths),
              "pinned_1050_sha_list_digest": "sha256:" + digest,
              "stratum_counts": dict(sorted(Counter(row["stratum"] for row in rows).items())),
              "transport_counts": dict(sorted(transport_counts.items())),
              "claims": {
                  "lalamu_live_urls_refetched": False,
                  "apache_poi_commit_pinned": True,
                  "microsoft_press_raw_pub_retained": False,
                  "microsoft_press_rehydration_requires_exact_sha_and_size": True,
              },
              "entries": sorted(rows, key=lambda row: row["sha256"]),
          }
          (out / "materialization.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps({
              "profile": profile,
              "profile_count": len(rows),
              "pinned_1050_count": len(paths),
              "pinned_1050_sha_list_digest": "sha256:" + digest,
              "stratum_counts": receipt["stratum_counts"],
              "transport_counts": receipt["transport_counts"],
          }, indent=2, sort_keys=True))
          PY

      - name: Inert VBA estate scan
        run: |
          set -euo pipefail
          mkdir -p "target/pub-vba-${{ matrix.profile }}"
          cp "$RUNNER_TEMP/pub-vba-${{ matrix.profile }}/materialization.json" "target/pub-vba-${{ matrix.profile }}/materialization.json"
          python tools/pub_vba_estate_scan.py scan \
            --input "$RUNNER_TEMP/pub-vba-${{ matrix.profile }}/native" \
            --recursive \
            --output "target/pub-vba-${{ matrix.profile }}/receipt.json"
          python - <<'PY'
          import json
          from pathlib import Path
          profile = "${{ matrix.profile }}"
          expected = int("${{ matrix.expected }}")
          path = Path(f"target/pub-vba-{profile}/receipt.json")
          data = json.loads(path.read_text())
          assert data["totals"]["file_count"] == expected, data["totals"]
          assert data["totals"]["read_failed"] == 0, data["totals"]
          assert data["claims"]["vba_executed"] is False
          assert data["claims"]["ole_com_activated"] is False
          assert data["claims"]["source_text_emitted"] is False
          summary = {
              "profile": profile,
              "expected": expected,
              "totals": data["totals"],
          }
          Path(f"target/pub-vba-{profile}/summary.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pub-vba-estate-${{ matrix.profile }}
          path: target/pub-vba-${{ matrix.profile }}/
          if-no-files-found: error
          retention-days: 90
