name: TEMP WMF084 explicit text gap acceptance

on:
  push:
    branches:
      - feat/wmf084-graphic-preview-explicit-text-gap-v1
    paths:
      - ".github/workflows/temporary-wmf084-text-gap-acceptance.yml"
      - "vendor/producer-a/crates/pub-reader/src/wmf_preview.rs"
      - "vendor/producer-a/crates/pub-reader/src/lib.rs"
      - "vendor/producer-a/crates/pub-viewer/src/mature_wmf_preview.rs"
      - "vendor/producer-a/crates/pub-viewer/tests/wmf084_text_gap_partial_v1.rs"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: wmf084-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pinned:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt,clippy
      - name: Download pinned Publisher source corpus
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820
      - name: Verify registered 084/040/085 source hashes
        run: |
          python - <<'PY'
          from pathlib import Path
          import hashlib
          root = Path("out/pinned1050/materialized/native")
          assert len(list(root.glob("*.pub"))) == 1050
          for sha in (
              "6e50032567c85a83cacc4f07520a2966411950c73a739029862417dec369908d",
              "b384bf6461c77c3d0fa227c148e1e3092cf69c98b0ad568a7b3e32fb139b6282",
              "40453fa60fbd9176f85e3b4d29f5074139b4e4a882d555d2801ec4a1a6c5fb62",
          ):
              path = root / f"{sha}.pub"
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == sha
          print("PINNED_WMF_084_040_085_SHA_VERIFIED")
          PY
      - name: Format temporary checkout only
        run: |
          rustfmt --edition 2024 vendor/producer-a/crates/pub-reader/src/wmf_preview.rs
          rustfmt --edition 2024 vendor/producer-a/crates/pub-viewer/src/mature_wmf_preview.rs
          rustfmt --edition 2024 vendor/producer-a/crates/pub-viewer/tests/wmf084_text_gap_partial_v1.rs
      - name: Source-free bounded WMF partial omission acceptance
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --lib explicit_text_gap
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --lib reject_unsupported_exttextout
      - name: Exact real 084 and text-free controls in Viewer
        env:
          CHAPTERA_PINNED_SOURCE_ROOT: ${{ github.workspace }}/out/pinned1050/materialized/native
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer --test wmf084_text_gap_partial_v1 -- --nocapture
      - name: Rust Clippy as error on changed crates
        run: |
          cargo clippy --manifest-path vendor/producer-a/Cargo.toml -p pub-reader -p pub-viewer --all-targets -- -D warnings
