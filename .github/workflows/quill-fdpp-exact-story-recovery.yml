name: Quill FDPP exact Story recovery

on:
  push:
    branches:
      - reader/quill-fdpp-exact-story-recovery-01
    paths:
      - ".github/workflows/quill-fdpp-exact-story-recovery.yml"
      - "vendor/producer-a/crates/pub-quill/src/lib.rs"
      - "vendor/producer-a/crates/pub-quill/src/story.rs"
      - "vendor/producer-a/crates/pub-reader/src/lib.rs"
      - "vendor/producer-a/crates/pub-reader/src/bin/quill-fdpp-story-recovery-receipt.rs"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target

jobs:
  exact-seven:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Checkout exact seven witnesses
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: f78cc6f455f4dc222868f9cc035511a6ca7a91ea
          path: _witness/lalamu
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            pub-corpus/corpus/native/unclassified/211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157.pub
            pub-corpus/corpus/native/unclassified/6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a.pub
            pub-corpus/corpus/native/unclassified/9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569.pub
            pub-corpus/corpus/native/unclassified/9d6a7f3638c49e043795416545e7f2305498dcfecd064cfa9ada03e27167e966.pub
            pub-corpus/corpus/native/unclassified/b171668d889a4e30cc8c7838a88f406017d67c722bf059965b1dfcfb9876d055.pub
            pub-corpus/corpus/native/unclassified/bc28f3ced90b0c9452bda1bd5bdaf2d841feb1d44bd7e84749a13ff2072e20f2.pub
            pub-corpus/corpus/native/unclassified/ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff.pub

      - name: Verify exact witness identities
        shell: bash
        run: |
          set -euo pipefail
          root="_witness/lalamu/pub-corpus/corpus/native/unclassified"
          test "$(find "$root" -maxdepth 1 -type f -name '*.pub' | wc -l)" -eq 7
          for path in "$root"/*.pub; do
            sha="$(basename "$path" .pub)"
            echo "${sha}  ${path}" | sha256sum -c -
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Restore Reader Cargo build cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: rar2-target
          key: reader-fdpp-story-v1-${{ runner.os }}-rust-1.94.1-${{ hashFiles('vendor/producer-a/Cargo.toml', 'vendor/producer-a/Cargo.lock', 'vendor/producer-a/crates/**/Cargo.toml') }}
          restore-keys: |
            reader-tier-a-v2-${{ runner.os }}-rust-1.94.1-
            reader-1050-release-v1-${{ runner.os }}-rust-1.94.1-

      - name: Build targeted recovery receipt
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin quill-fdpp-story-recovery-receipt

      - name: Run targeted recovery receipt
        run: |
          set -euo pipefail
          "${CARGO_TARGET_DIR}/debug/quill-fdpp-story-recovery-receipt" \
            "_witness/lalamu/pub-corpus/corpus/native/unclassified" \
            "out/quill-fdpp-story-recovery.json"

      - name: Guard three recovered and four fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("out/quill-fdpp-story-recovery.json").read_text())
          assert report["schema"] == "chaptera.quill-fdpp-story-recovery.v1"
          assert report["witness_count"] == 7
          assert report["success_count"] == 3
          assert report["failure_count"] == 4

          positives = {
              "9d6a7f3638c49e043795416545e7f2305498dcfecd064cfa9ada03e27167e966": 6,
              "b171668d889a4e30cc8c7838a88f406017d67c722bf059965b1dfcfb9876d055": 10,
              "bc28f3ced90b0c9452bda1bd5bdaf2d841feb1d44bd7e84749a13ff2072e20f2": 4,
          }
          negatives = {
              "211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157",
              "6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a",
              "9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569",
              "ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff",
          }

          rows = {row["source_sha256"]: row for row in report["rows"]}
          assert set(rows) == set(positives) | negatives

          for sha, count in positives.items():
              row = rows[sha]
              assert row["success"] is True, (sha, row)
              assert row["story_count"] == count, (sha, row)
              assert row["fdpp_recovered_story_count"] == count, (sha, row)

          for sha in negatives:
              row = rows[sha]
              assert row["success"] is False, (sha, row)
              assert row["story_count"] is None, (sha, row)
              assert row["fdpp_recovered_story_count"] is None, (sha, row)

          print(json.dumps({
              "schema": "chaptera.quill-fdpp-story-recovery.acceptance.v1",
              "witness_count": 7,
              "recovered_count": 3,
              "fail_closed_count": 4,
              "recovered_story_counts": sorted(positives.values()),
          }, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: quill-fdpp-story-recovery-${{ github.run_id }}
          path: out/quill-fdpp-story-recovery.json
          if-no-files-found: error
          retention-days: 30
