name: Public page-role witness census

on:
  pull_request:
    paths:
      - ".github/workflows/public-page-role-witness-census.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Acquire immutable public witnesses
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/page-role-public" target/page-role-public
          python - <<'PY'
          import hashlib, json, os, urllib.request
          from pathlib import Path

          commit = "942d95d85b15d0dfdb3bc9ba1b4f273f277757c8"
          names = ["51318", "60685"]
          base = f"https://raw.githubusercontent.com/apache/poi/{commit}/test-data/publisher"
          root = Path(os.environ["RUNNER_TEMP"]) / "page-role-public"
          receipt = {"source_commit": commit, "fixtures": []}
          for name in names:
              data = urllib.request.urlopen(f"{base}/{name}.pub", timeout=30).read()
              path = root / f"{name}.pub"
              path.write_bytes(data)
              receipt["fixtures"].append({
                  "fixture": name,
                  "bytes": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              })
          Path("target/page-role-public/acquisition.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - name: Build page-role analyzer
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --bin page-role-receipt

      - name: Emit exact source-safe page-role receipts
        shell: bash
        run: |
          set -euo pipefail
          for name in 51318 60685; do
            cargo run --quiet --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --bin page-role-receipt -- \
              "$RUNNER_TEMP/page-role-public/$name.pub" \
              "target/page-role-public/$name.page-role.json"
          done

      - name: Summarize discriminators
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("target/page-role-public")
          out = {"schema": "chaptera.public-page-role-witness-summary.v1", "fixtures": []}
          for name in ["51318", "60685"]:
              r = json.loads((root / f"{name}.page-role.json").read_text())
              pages = []
              for p in r["pages"]:
                  pages.append({
                      "document_ordinal": p["document_ordinal"],
                      "oid_zero": (
                          p.get("oid_dword0") == 0 and p.get("oid_dword1") == 0
                          if p.get("oid_dword0") is not None and p.get("oid_dword1") is not None
                          else None
                      ),
                      "applied_master_raw_type": p.get("applied_master_raw_type"),
                      "pgt_type": p.get("pgt_type"),
                      "previous_document_entry_raw_type": p.get("previous_document_entry_raw_type"),
                      "next_document_entry_raw_type": p.get("next_document_entry_raw_type"),
                      "shape_child_count": p["shape_child_count"],
                      "group_child_count": p["group_child_count"],
                      "child_raw_type_counts": p["child_raw_type_counts"],
                  })
              out["fixtures"].append({
                  "fixture": name,
                  "document_page_list_entry_count": r["document_page_list_entry_count"],
                  "confirmed_page_count": r["confirmed_page_count"],
                  "special_entry_count": r["special_entry_count"],
                  "pages": pages,
                  "controlling": [
                      {
                          "parent_seq_num": item.get("parent_seq_num"),
                          "fully_decoded": item["fully_decoded"],
                          "field_ids": [field["id"] for field in item["fields"]],
                          "pgid_counts": [
                              len(field.get("pgids", []))
                              for field in item["fields"]
                              if field.get("pgids")
                          ],
                      }
                      for item in r["controlling"]
                  ],
              })
          (root / "summary.json").write_text(json.dumps(out, indent=2, sort_keys=True) + "\n")
          print(json.dumps(out, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-page-role-witness-census
          path: target/page-role-public/
          if-no-files-found: error
          retention-days: 7
