name: Reader 1050 corpus baseline

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/reader-1050-corpus-baseline.yml'
      - 'vendor/producer-a/crates/pub-reader/data/reader-evidence-registry.json'
      - 'vendor/producer-a/crates/pub-reader/src/salvage_authority.rs'
  push:
    branches:
      - main
      - corpus/reader-1050-baseline
      - validation/reader-salvage-1050-acceptance-01
    paths:
      - '.github/workflows/reader-1050-corpus-baseline.yml'
      - 'tools/corpus/pub_container_extract.py'
      - 'tools/corpus/test_pub_container_extract.py'
      - 'tools/corpus/materialize_corpus_1000.py'
      - 'tools/corpus/profile_olepres_wmf.py'
      - 'tools/corpus/test_profile_olepres_wmf.py'
      - 'tools/corpus/materialization_container_first_wave.csv'
      - 'tools/corpus/receipts/container-first-wave-425-2026-09-29.json'
      - 'tools/corpus/receipts/current-rar-1556.sha256.txt'
      - 'tools/corpus/receipts/reader-1050-baseline-2026-09-29.json'
      - 'tools/corpus/structural_novelty.py'
      - 'vendor/producer-a/crates/pub-contents/**'
      - 'vendor/producer-a/crates/pub-reader/**'
      - 'vendor/producer-a/crates/pub-viewer/**'

permissions:
  contents: read
  actions: read

concurrency:
  group: reader-1050-corpus-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout exact rar2 candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Download pinned exact 1050 materialization
        id: pinned-1050
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Adopt pinned exact 1050 materialization
        if: steps.pinned-1050.outcome == 'success'
        run: |
          set -euo pipefail
          rm -rf out/materialized
          cp -a out/pinned1050/materialized out/materialized

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.1'

      - name: Checkout corpus profiling code
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: main
          path: corpus-src
          sparse-checkout: |
            pub-corpus/data
            pub-corpus/scripts
          sparse-checkout-cone-mode: true

      - name: Checkout 625-file donor only for reconstruction fallback
        if: steps.pinned-1050.outcome != 'success'
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: main
          path: corpus-donor
          sparse-checkout: |
            pub-corpus/corpus
          sparse-checkout-cone-mode: true

      - name: Install profiling dependency
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Install archive fallback tools
        if: steps.pinned-1050.outcome != 'success'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full

      - name: Validate corpus recovery tooling
        run: |
          set -euo pipefail
          python -m py_compile \
            tools/corpus/pub_container_extract.py \
            tools/corpus/test_pub_container_extract.py \
            tools/corpus/materialize_corpus_1000.py \
            tools/corpus/profile_olepres_wmf.py \
            tools/corpus/test_profile_olepres_wmf.py
          python tools/corpus/test_pub_container_extract.py
          python tools/corpus/test_materialize_corpus_1000.py
          python tools/corpus/test_profile_olepres_wmf.py

      - name: Build Reader 1050 Cargo cache key
        id: reader-1050-cache-key
        shell: bash
        env:
          MANIFEST_HASH: ${{ hashFiles('vendor/producer-a/Cargo.toml', 'vendor/producer-a/Cargo.lock', 'vendor/producer-a/crates/**/Cargo.toml') }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST_HASH"
          echo "key=reader-1050-release-v1-${RUNNER_OS}-rust-1.94.1-${MANIFEST_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore Reader 1050 Cargo build cache
        id: reader-1050-cargo-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rar2-target
          key: ${{ steps.reader-1050-cache-key.outputs.key }}

      - name: Build source-free Reader receipt producer
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-viewer \
            --release \
            --bin corpus-reader-receipt \
            --bin corpus-reader-salvage-acceptance \
            --bin recovery-damage-classifier

      - name: Save Reader 1050 Cargo build cache
        if: steps.reader-1050-cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: rar2-target
          key: ${{ steps.reader-1050-cache-key.outputs.key }}

      - name: Restore exact historical 425-SHA tranche
        if: steps.pinned-1050.outcome != 'success'
        id: historical-425-cache
        uses: actions/cache/restore@v4
        with:
          path: out/container
          key: reader-historical-425-b844102681a9f4458aa9e723843d645e5aae6e6b8bd0b70d631e7ae0be9bc8ef-v1

      - name: Rehydrate pinned historical 425-SHA tranche
        if: steps.pinned-1050.outcome != 'success' && steps.historical-425-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p out/container/pub
          python tools/corpus/pub_container_extract.py \
            --seed tools/corpus/materialization_container_first_wave.csv \
            --out out/container/manifest.json \
            --materialize-dir out/container/pub \
            --max-containers 3 \
            --max-container-bytes 200000000 \
            --max-member-bytes 104857600 \
            --max-total-expanded 1073741824 \
            --max-members 600 \
            --max-depth 2 \
            --timeout 45 \
            --command-timeout 90

      - name: Verify exact historical 425-SHA tranche
        if: steps.pinned-1050.outcome != 'success'
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path

          expected_count=425
          expected_digest="b844102681a9f4458aa9e723843d645e5aae6e6b8bd0b70d631e7ae0be9bc8ef"
          paths=sorted(Path("out/container/pub").glob("*.pub"))
          shas=[p.stem.casefold() for p in paths]
          digest=hashlib.sha256("".join(x+"\n" for x in shas).encode("ascii")).hexdigest()
          summary=json.loads(Path("out/container/manifest.summary.json").read_text())
          assert summary["errors"]==0,summary
          assert len(shas)==expected_count,(len(shas),summary)
          assert summary["publisher_cfb_unique_sha256"]==expected_count,summary
          assert digest==expected_digest,(digest,expected_digest)
          print(json.dumps({
              "publisher_unique_sha256":len(shas),
              "sha_list_digest":"sha256:"+digest,
          },indent=2))
          PY

      - name: Save exact historical 425-SHA tranche
        if: steps.pinned-1050.outcome != 'success' && steps.historical-425-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: out/container
          key: reader-historical-425-b844102681a9f4458aa9e723843d645e5aae6e6b8bd0b70d631e7ae0be9bc8ef-v1

      - name: Materialize exact 1050-file working corpus
        if: steps.pinned-1050.outcome != 'success'
        run: |
          set -euo pipefail
          python tools/corpus/materialize_corpus_1000.py \
            --input lalamu_625=corpus-donor/pub-corpus/corpus \
            --input historical_container_first_wave=out/container/pub \
            --authority tools/corpus/receipts/current-rar-1556.sha256.txt \
            --out out/materialized \
            --min-count 1050

          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("out/materialized/summary.json").read_text())
          assert summary["unique_publisher_cfb"] == 1050, summary
          assert summary["authority_overlap"] == 1050, summary
          assert summary["outside_authority"] == 0, summary
          assert summary["rejections"] == 0, summary
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Verify exact 1050 materialization against current authority
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path

          expected_count = 1050
          expected_digest = "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43"
          paths = sorted(Path("out/materialized/native").glob("*.pub"))
          shas = [p.stem.casefold() for p in paths]
          digest = hashlib.sha256("".join(x + "\n" for x in shas).encode("ascii")).hexdigest()
          summary_path = Path("out/materialized/summary.json")
          summary = json.loads(summary_path.read_text())
          authority = {
              line.strip().casefold()
              for line in Path("tools/corpus/receipts/current-rar-1556.sha256.txt").read_text().splitlines()
              if line.strip()
          }
          sha_set = set(shas)
          authority_overlap = len(sha_set & authority)
          outside_authority = len(sha_set - authority)

          assert len(shas) == expected_count, len(shas)
          assert len(sha_set) == expected_count, len(sha_set)
          assert digest == expected_digest, (digest, expected_digest)
          assert len(authority) == 1556, len(authority)
          assert authority_overlap == 1050, authority_overlap
          assert outside_authority == 0, outside_authority
          assert summary["unique_publisher_cfb"] == 1050, summary
          assert summary["rejections"] == 0, summary

          # Artifact bytes are immutable evidence; authority membership is current state.
          summary["authority_count"] = len(authority)
          summary["authority_overlap"] = authority_overlap
          summary["outside_authority"] = outside_authority
          summary_path.write_text(json.dumps(summary, indent=2, sort_keys=True) + "\n")

          print(json.dumps({
              "publisher_unique_sha256": len(shas),
              "sha_list_digest": "sha256:" + digest,
              "authority_count": len(authority),
              "authority_overlap": authority_overlap,
              "outside_authority": outside_authority,
              "source": "pinned_artifact" if Path("out/pinned1050/materialized").exists() else "reconstructed",
          }, indent=2))
          PY

      - name: Replace donor bytes with exact 1050 union
        run: |
          set -euo pipefail
          target=corpus-src/pub-corpus/corpus/native/unclassified
          rm -rf "$target"
          mkdir -p "$target"
          cp out/materialized/native/*.pub "$target"/
          test "$(find "$target" -maxdepth 1 -type f -name '*.pub' | wc -l)" -eq 1050

      - name: Deep-profile full 1050 corpus through current Reader
        run: |
          set -euo pipefail
          rm -rf out/reader1050
          python corpus-src/pub-corpus/scripts/deep_profile.py \
            --corpus-root corpus-src/pub-corpus \
            --rar-tools tools/corpus \
            --reader-receipt-exe "${CARGO_TARGET_DIR}/release/corpus-reader-receipt" \
            --rar-ref "rar2:${GITHUB_SHA}" \
            --out out/reader1050 \
            --workers 8

      - name: Classify exact 1050 Reader salvage outcomes
        run: |
          set -euo pipefail
          "${CARGO_TARGET_DIR}/release/corpus-reader-salvage-acceptance" \
            out/materialized/native \
            out/reader1050/salvage-acceptance.json

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("out/reader1050/salvage-acceptance.json").read_text())
          rows = {row["source_sha256"]: row for row in payload["rows"]}

          assert payload["schema"] == "chaptera.reader-salvage-1050-acceptance.v1", payload["schema"]
          assert payload["corpus_file_count"] == 1050, payload["corpus_file_count"]
          assert payload["outcome_counts"] == {
              "normal_open": 1041,
              "salvage_open": 5,
              "unsupported": 4,
          }, payload["outcome_counts"]
          assert payload["salvage_eligibility_counts"] == {
              "awaiting_typed_corruption_evidence": 4,
              "eligible_damaged_publisher": 1,
              "eligible_known_publisher_corruption": 4,
          }, payload["salvage_eligibility_counts"]

          forced = payload["forced_trigger_summary"]
          assert forced["attempted_count"] == 4, forced
          assert 0 <= forced["cfb_inventory_available_count"] <= 4, forced
          assert 0 <= forced["surviving_evidence_count"] <= 4, forced
          assert 0 <= forced["partial_graph_constructed_count"] <= 4, forced

          awaiting_rows = [
              row for row in payload["rows"]
              if row.get("salvage_eligibility") == "awaiting_typed_corruption_evidence"
          ]
          assert len(awaiting_rows) == 4, len(awaiting_rows)
          for row in awaiting_rows:
              forced_probe = row.get("forced_trigger_probe")
              forced_graph = row.get("forced_partial_graph")
              assert forced_probe is not None, row
              assert forced_graph is not None, row
              assert forced_probe["eligibility"] == "eligible_known_publisher_corruption", row
              assert forced_probe["source_modified"] is False, row
              assert forced_graph["status"] in {"constructed", "error"}, row

          expected_corrupt = {
              "c96df4b2d4ce3d5bb238b2b31d8021501495b9bd15ff44eb9d918495c342430b":
                  "quill_descriptor_node_truncated",
              "b29ed1e9227e67256a58d23cbea58b9bcfb38943dd9ed07a4110f4cf8959dbe4":
                  "quill_strs_service_span_out_of_bounds",
          }
          for sha256, evidence in expected_corrupt.items():
              row = rows[sha256]
              assert row["outcome"] == "salvage_open", row
              assert row["salvage_eligibility"] == "eligible_known_publisher_corruption", row
              assert row["corruption_evidence"] == evidence, row
              assert row["has_surviving_evidence"] is True, row
              assert row["source_modified"] is False, row

          opcls = rows["6cb88d4e02f823876a23d7f7414c7d370ca30996c30f145ec92b62f519b22170"]
          assert opcls["outcome"] == "salvage_open", opcls
          assert opcls["salvage_eligibility"] == "eligible_damaged_publisher", opcls
          assert opcls.get("corruption_evidence") is None, opcls
          assert opcls["has_surviving_evidence"] is True, opcls
          assert opcls["source_modified"] is False, opcls

          opnhous = rows["227961e2fba4a6fb814aa2da47e79b19d55ff04e87e49d9c5ceef8d07ce36d0e"]
          assert opnhous["outcome"] == "salvage_open", opnhous
          assert opnhous["salvage_eligibility"] == "eligible_known_publisher_corruption", opnhous
          assert opnhous["corruption_evidence"] == "exact_sha_typed_corruption_authority", opnhous
          assert opnhous["authority_task_id"] == "PUB-T-650", opnhous
          assert opnhous["authority_run_id"] == 36072949588, opnhous
          assert opnhous["authority_artifact_id"] == 10838639727, opnhous
          assert opnhous["authority_evidence_digest"] == (
              "sha256:b814c65752ecdbfcbafcfb16b869f000313fdb7327a4a6a6ad9865fb294a4aed"
          ), opnhous
          assert opnhous["authority_classification"] == (
              "malformed-or-stale-publisher97-media-variant"
          ), opnhous
          assert opnhous["has_surviving_evidence"] is True, opnhous
          assert opnhous["cfb_inventory_available"] is True, opnhous
          assert opnhous["contents_family"] == "0x22", opnhous
          assert opnhous["salvage_gap_count"] == 3, opnhous
          assert opnhous["source_modified"] is False, opnhous

          trophy = rows[
              "32b857475ae5ca8207942a40dc708d63153c9140bb06ee740d7e235944c0a027"
          ]
          assert trophy["outcome"] == "salvage_open", trophy
          assert trophy["salvage_eligibility"] == "eligible_known_publisher_corruption", trophy
          assert trophy["corruption_evidence"] == "exact_sha_typed_corruption_authority", trophy
          assert trophy["authority_task_id"] == "READER1050-TROPHY-QUILL-CENSUS-01", trophy
          assert trophy["authority_run_id"] == 37125662981, trophy
          assert trophy["authority_artifact_id"] == 11275135765, trophy
          assert trophy["authority_evidence_digest"] == (
              "sha256:cc3655207b887ccf55b20494b066c5af394ddc1d0ef579cb9cf0a48bc751fe63"
          ), trophy
          assert trophy["authority_classification"] == (
              "quill_descriptor_tail_overwritten_or_malformed"
          ), trophy
          assert trophy["has_surviving_evidence"] is True, trophy
          assert trophy["cfb_inventory_available"] is True, trophy
          assert trophy["contents_family"] == "0x2c", trophy
          assert trophy["salvage_gap_count"] == 2, trophy
          assert trophy["source_modified"] is False, trophy

          assert payload["corruption_evidence_counts"] == {
              "exact_sha_typed_corruption_authority": 2,
              "quill_descriptor_node_truncated": 1,
              "quill_strs_service_span_out_of_bounds": 1,
          }, payload["corruption_evidence_counts"]

          print(json.dumps({
              "outcome_counts": payload["outcome_counts"],
              "salvage_eligibility_counts": payload["salvage_eligibility_counts"],
              "corruption_evidence_counts": payload["corruption_evidence_counts"],
              "mandatory_witnesses": {
                  sha: {
                      "outcome": rows[sha]["outcome"],
                      "salvage_eligibility": rows[sha].get("salvage_eligibility"),
                      "corruption_evidence": rows[sha].get("corruption_evidence"),
                  }
                  for sha in [
                      *expected_corrupt,
                      "227961e2fba4a6fb814aa2da47e79b19d55ff04e87e49d9c5ceef8d07ce36d0e",
                      "32b857475ae5ca8207942a40dc708d63153c9140bb06ee740d7e235944c0a027",
                  ]
              },
          }, indent=2, sort_keys=True))
          PY

      - name: Classify exact 1050 recovery damage outcomes
        run: |
          set -euo pipefail
          "${CARGO_TARGET_DIR}/release/recovery-damage-classifier" \
            out/materialized/native \
            out/reader1050/recovery-damage-classifier.json

          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("out/reader1050/recovery-damage-classifier.json").read_text())
          assert payload["schema"] == "chaptera.recovery-damage-classifier.v1", payload["schema"]
          assert payload["file_count"] == 1050, payload["file_count"]
          assert payload["reader_outcome_counts"] == {
              "normal_open": 1041,
              "salvage_open": 5,
              "cannot_safely_display": 4,
          }, payload["reader_outcome_counts"]

          verdicts = payload["verdict_counts"]
          assert verdicts.get("open", 0) == 1041, verdicts
          assert verdicts.get("open_partial", 0) == 5, verdicts
          assert verdicts.get("rescue", 0) == 0, verdicts
          assert verdicts.get("no_safe_recovery", 0) == 4, verdicts

          unsupported = [
              row for row in payload["rows"]
              if row["reader_outcome"] == "cannot_safely_display"
          ]
          assert len(unsupported) == 4, len(unsupported)
          for row in unsupported:
              assert row.get("registry_evidence_class") == "format_gap", row
              assert row.get("registry_disposition") == "existing_format_owner", row
              assert row.get("evidence_owner") == "QUILL-STORY-EARLY-TEXT-BOUNDARY-01", row
              assert row.get("promotion_gap") == "existing_format_owner_not_damage_authority", row
              assert row["rescue_outcome"] == "diagnostic_only", row

          inferred_rescue = [
              row for row in payload["rows"]
              if row["compact_verdict"] == "rescue"
          ]
          promotion_gaps = {}
          for row in inferred_rescue:
              key = row.get("promotion_gap") or "none"
              promotion_gaps[key] = promotion_gaps.get(key, 0) + 1

          print(json.dumps({
              "verdict_counts": verdicts,
              "reader_outcome_counts": payload["reader_outcome_counts"],
              "rescue_outcome_counts": payload["rescue_outcome_counts"],
              "inferred_rescue_count": len(inferred_rescue),
              "promotion_gap_counts": promotion_gaps,
          }, indent=2, sort_keys=True))
          PY

      - name: Census persisted OlePres WMF records
        run: |
          set -euo pipefail
          python tools/corpus/profile_olepres_wmf.py \
            --corpus-dir out/materialized/native \
            --out out/reader1050/olepres-wmf-census.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("out/reader1050/olepres-wmf-census.json").read_text())
          assert payload["corpus_file_count"] == 1050, payload
          assert payload["olepres_stream_count"] >= payload["valid_wmf_count"], payload
          print(json.dumps({
              "olepres_stream_count": payload["olepres_stream_count"],
              "valid_wmf_count": payload["valid_wmf_count"],
              "wmf_error_counts": payload["wmf_error_counts"],
              "function_set_profile_count": payload["function_set_profile_count"],
          }, indent=2, sort_keys=True))
          PY

      - name: Summarize source-free legacy residuals
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from collections import defaultdict
          from pathlib import Path

          rows = json.loads(Path("out/reader1050/reader-records.json").read_text())
          counts = defaultdict(lambda: {"object_count": 0, "file_count": 0})

          for row in rows:
              if row.get("opened") is not True or row.get("contents_family") != "0x22":
                  continue
              seen = set()
              for item in row.get("legacy_object_residuals") or []:
                  key = (item.get("raw_type_hex"), item.get("reason"))
                  counts[key]["object_count"] += int(item.get("count") or 0)
                  seen.add(key)
              for key in seen:
                  counts[key]["file_count"] += 1

          entries = [
              {
                  "raw_type_hex": raw_type_hex,
                  "reason": reason,
                  **value,
              }
              for (raw_type_hex, reason), value in sorted(
                  counts.items(),
                  key=lambda item: (
                      -item[1]["object_count"],
                      -item[1]["file_count"],
                      str(item[0][0]),
                      str(item[0][1]),
                  ),
              )
          ]
          payload = {
              "schema": "chaptera.legacy22-residual-census.v2",
              "corpus_file_count": len(rows),
              "entries": entries,
              "total_residual_objects": sum(item["object_count"] for item in entries),
              "files_with_residuals": sum(
                  1 for row in rows
                  if row.get("opened") is True
                  and row.get("contents_family") == "0x22"
                  and bool(row.get("legacy_object_residuals"))
              ),
          }
          Path("out/reader1050/legacy-residual-census.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(payload, indent=2, sort_keys=True))
          PY

      - name: Guard 1050 corpus identity on fresh main
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("out/reader1050/summary.json").read_text())
          materialized = json.loads(Path("out/materialized/summary.json").read_text())
          rows = json.loads(Path("out/reader1050/reader-records.json").read_text())

          PERLOST_SHA = "d72a4c79a378f93299be53220d7809a433235f74103adcffc714748068007e6f"
          perlost_rows = [
              row for row in rows if row.get("source_sha256") == PERLOST_SHA
          ]
          assert len(perlost_rows) == 1, len(perlost_rows)
