name: Package TABLE border oracle Windows helper

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-reader/src/bin/table_border_carrier_oracle_tool.rs"
      - ".github/workflows/package-table-border-oracle-windows.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Build release helper
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo build --locked --release --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --bin table_border_carrier_oracle_tool
          $exe = "vendor/producer-a/target/release/table_border_carrier_oracle_tool.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "helper missing" }
          $hash = (Get-FileHash -LiteralPath $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "TABLE_BORDER_ORACLE_SHA256=$hash" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "table_border_carrier_oracle_tool.exe sha256=$hash" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
      - uses: actions/upload-artifact@v4
        with:
          name: table-border-carrier-oracle-windows-x64
          path: vendor/producer-a/target/release/table_border_carrier_oracle_tool.exe
          retention-days: 30
