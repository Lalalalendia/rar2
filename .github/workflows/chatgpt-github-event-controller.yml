name: ChatGPT GitHub event controller

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to analyze
        required: true
        type: string
      event_action:
        description: GitHub event action that requested analysis
        required: true
        type: string
      head_sha:
        description: Expected pull-request head SHA
        required: false
        type: string

permissions:
  id-token: write
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: chatgpt-github-event-controller-${{ inputs.pr_number }}
  cancel-in-progress: true

jobs:
  triage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout trusted controller from default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned OpenAI SDK
        run: python -m pip install --disable-pip-version-check --no-cache-dir "openai==3.26.0"

      - name: Analyze exact PR state and update controller comment
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR_NUMBER: ${{ inputs.pr_number }}
          EVENT_ACTION: ${{ inputs.event_action }}
          EXPECTED_HEAD_SHA: ${{ inputs.head_sha }}
          OPENAI_WIF_AUDIENCE: ${{ vars.OPENAI_WIF_AUDIENCE }}
          OPENAI_IDENTITY_PROVIDER_ID: ${{ vars.OPENAI_IDENTITY_PROVIDER_ID }}
          OPENAI_SERVICE_ACCOUNT_ID: ${{ vars.OPENAI_SERVICE_ACCOUNT_ID }}
          OPENAI_MODEL: ${{ vars.CHAPTERA_GITHUB_AGENT_MODEL || 'gpt-5.6-terra' }}
        run: python tools/ci/chatgpt_github_event_controller.py
