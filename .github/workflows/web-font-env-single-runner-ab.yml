name: WEB-FONT-ENV single-runner A/B control

on:
  pull_request:
    paths:
      - "apps/web/font-environment-v1.test.mjs"
      - ".github/workflows/web-font-env-single-runner-ab.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  single-runner:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install "jsonschema==4.23.0"
      - name: Validate font environment protocol
        run: python tools/validate_font_environment.py
      - name: Test browser font policy adapter
        run: node --test apps/web/font-environment-v1.test.mjs

      - name: Validate pinned real Viewer receipt
        run: python tools/validate_viewer_geometry_receipt.py apps/web/acceptance/receipts/viewer-geometry.real.json

      - name: Materialize pinned real Scene V1
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/web-font-env-real
          python tools/adapt_viewer_scene_v1.py \
            apps/web/acceptance/receipts/viewer-geometry.real.json \
            target/web-font-env-real/SampleNewsletter.scene.json \
            --document-id 9c2f8d5e-3f1b-4a57-9d40-6a7e2c11b001 \
            --revision-id sha256:853fa2471bbf5ce479340e391550c5ee7b972f208a36d81c26808ab52c672d6c
          python - <<'PY'
          import json
          from pathlib import Path
          scene=json.loads(Path("target/web-font-env-real/SampleNewsletter.scene.json").read_text())
          # Exact snapshot for the refreshed canonical Viewer receipt on this productization branch.\n          assert scene["snapshot_id"] == "sha256:39775f7b401aa0aa9798dee8e1abdabe651720bc0158a07d4fa3eef513294a11", scene["snapshot_id"]
          assert len(scene["stories"]) == 44
          assert len(scene["story_frames"]) == 61
          text=next((c for c in scene["capabilities"] if c["key"]=="render.text"), None)
          assert text and text["state"] == "partial", text
          print({
              "snapshot_id": scene["snapshot_id"],
              "stories": len(scene["stories"]),
              "story_frames": len(scene["story_frames"]),
              "render_text": text["state"],
          })
          PY

      - name: Build geometry-only real font environment
        run: |
          python tools/build_geometry_only_font_environment.py \
            target/web-font-env-real/SampleNewsletter.scene.json \
            target/web-font-env-real/font-environment.real.json


      - name: Install both real Playwright browsers on one runner
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium firefox

      - name: Prove real StoryFrame geometry in Chromium and Firefox
        run: |
          set -euo pipefail
          node tools/run_web_font_environment_real.mjs chromium
          node tools/run_web_font_environment_real.mjs firefox

      - uses: actions/upload-artifact@v4
        with:
          name: web-font-env-real-chromium
          if-no-files-found: error
          retention-days: 90
          path: target/web-font-env-real/chromium-receipt.json

      - uses: actions/upload-artifact@v4
        with:
          name: web-font-env-real-firefox
          if-no-files-found: error
          retention-days: 90
          path: target/web-font-env-real/firefox-receipt.json

      - name: Prepare both local receipts for the unchanged cross-browser proof
        run: |
          set -euo pipefail
          mkdir -p target/web-font-env-cross/input
          cp target/web-font-env-real/chromium-receipt.json target/web-font-env-cross/input/
          cp target/web-font-env-real/firefox-receipt.json target/web-font-env-cross/input/

      - name: Cross-check browser receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p target/web-font-env-cross
          python - <<'PY'
          import json
          from pathlib import Path

          root=Path("target/web-font-env-cross/input")
          paths=sorted(root.glob("*-receipt.json"))
          assert len(paths)==2, [str(p) for p in paths]
          rows=[json.loads(path.read_text()) for path in paths]
          by_engine={row["browser"]["engine"]: row for row in rows}
          assert set(by_engine)=={"chromium","firefox"}, set(by_engine)

          chromium=by_engine["chromium"]
          firefox=by_engine["firefox"]

          identity_fields=[
              "document_id",
              "source_hash",
              "revision_id",
              "scene_snapshot_id",
              "layout_environment_id",
              "font_set_fingerprint",
              "preview_authority",
              "scene_text_capability",
          ]
          for field in identity_fields:
              assert chromium[field] == firefox[field], (field, chromium[field], firefox[field])

          for row in rows:
              assert row["real_pub"] is True
              assert row["preview_authority"] == "server_frame_geometry_only"
              assert row["authoritative_comparison"] == "server_frame_geometry_exact"
              assert row["browser_text_metrics_authoritative"] is False
              assert row["all_authoritative_geometry_matches"] is True
              assert row["scene_mutated"] is False
              assert row["font_environment_mutated"] is False
              assert row["selected_story_frame_count"] >= 3

          c_frames={item["node_id"]: item for item in chromium["frames"]}
          f_frames={item["node_id"]: item for item in firefox["frames"]}
          assert set(c_frames) == set(f_frames)
          observations=[]
          for node_id in sorted(c_frames):
              c=c_frames[node_id]
              f=f_frames[node_id]
              assert c["authoritative_bounds_emu"] == f["authoritative_bounds_emu"]
              assert c["page_id"] == f["page_id"]
              assert c["story_id"] == f["story_id"]
              assert c["authoritative_geometry_match"] is True
              assert f["authoritative_geometry_match"] is True
              observations.append({
                  "node_id": node_id,
                  "story_id": c["story_id"],
                  "authoritative_bounds_emu": c["authoritative_bounds_emu"],
                  "chromium_native_text_metric": c["native_text_metric_observation"],
                  "firefox_native_text_metric": f["native_text_metric_observation"],
                  "native_metric_equal": c["native_text_metric_observation"] == f["native_text_metric_observation"],
                  "authority": "observation_only_not_document_truth",
              })

          receipt={
              "receipt_kind": "chaptera.web-font-environment-cross-browser.v1",
              "real_pub": True,
              "browser_engines": sorted(by_engine),
              "document_id": chromium["document_id"],
              "source_hash": chromium["source_hash"],
              "revision_id": chromium["revision_id"],
              "scene_snapshot_id": chromium["scene_snapshot_id"],
              "layout_environment_id": chromium["layout_environment_id"],
              "font_set_fingerprint": chromium["font_set_fingerprint"],
              "preview_authority": chromium["preview_authority"],
              "scene_text_capability": chromium["scene_text_capability"],
              "authoritative_comparison": "server_frame_geometry_exact",
              "all_authoritative_geometry_matches": True,
              "browser_text_metrics_authoritative": False,
              "native_metric_comparison": "recorded_not_required_equal",
              "frames": observations,
          }
          out=Path("target/web-font-env-cross/receipt.json")
          out.write_text(json.dumps(receipt,indent=2,sort_keys=True)+"\n")
          print(json.dumps(receipt,indent=2,sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: web-font-env-real-cross-browser
          if-no-files-found: error
          retention-days: 90
          path: target/web-font-env-cross/receipt.json
