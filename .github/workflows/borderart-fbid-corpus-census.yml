name: BorderArt Fbid corpus census

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/borderart-fbid-corpus-census.yml"
      - "vendor/producer-a/crates/pub-reader/src/bin/borderart-fbid-census.rs"
      - "vendor/producer-a/crates/pub-contents/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: borderart-fbid-corpus-census-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Download pinned exact 1050 corpus
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Verify pinned corpus identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path

          paths = sorted(Path("out/pinned1050/materialized/native").glob("*.pub"))
          shas = [p.stem.casefold() for p in paths]
          digest = hashlib.sha256("".join(x + "\n" for x in shas).encode("ascii")).hexdigest()

          assert len(shas) == 1050, len(shas)
          assert len(set(shas)) == 1050, len(set(shas))
          assert digest == "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43", digest
          print({"count": len(shas), "sha_list_digest": "sha256:" + digest})
          PY

      - name: Build bounded BorderArt Fbid census
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --release \
            --bin borderart-fbid-census

      - name: Scan exact mature Contents coordinates
        run: |
          set -euo pipefail
          "${CARGO_TARGET_DIR}/release/borderart-fbid-census" \
            out/pinned1050/materialized/native \
            out/borderart-fbid-corpus-census.json \
            > out/borderart-fbid-corpus-census.stdout.json

      - name: Recover positive witness provenance
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          census = json.loads(Path("out/borderart-fbid-corpus-census.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("out/pinned1050/materialized/manifest.json").read_text(encoding="utf-8"))
          by_sha = {row["sha256"]: row for row in manifest}
          rows = []
          for row in census["rows"]:
              if not row["shape_fbid_observations"] and not row["ifbmax_observations"]:
                  continue
              source = by_sha[row["source_sha256"]]
              rows.append({
                  "sha256": row["source_sha256"],
                  "fbid_values": [item["value"] for item in row["shape_fbid_observations"]],
                  "ifbmax_values": [item["value"] for item in row["ifbmax_observations"]],
                  "sources": source["sources"],
                  "source_basenames": sorted({Path(p).name for p in source["source_paths"]}),
                  "authority_member": source["authority_member"],
              })
          out = {
              "schema": "chaptera.borderart-fbid-positive-provenance.v1",
              "rows": rows,
          }
          Path("out/borderart-fbid-positive-provenance.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )
          killer = next(
              row for row in rows
              if row["sha256"] == "3a49adaad5f701d14e16f1f901f0770c358407029040a8c18959c2abc39d88f2"
          )
          print(json.dumps(killer, ensure_ascii=False, indent=2))
          PY

      - name: Summarize census
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path

          p = Path("out/borderart-fbid-corpus-census.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          assert d["schema"] == "chaptera.borderart-fbid-corpus-census.v1", d["schema"]
          assert d["corpus_file_count"] == 1050, d["corpus_file_count"]

          # Exact pinned-corpus proof. These are physical-coordinate facts, not
          # an application-level BorderArt API assertion.
          assert d["mature_0x2c_file_count"] == 396, d["mature_0x2c_file_count"]
          assert d["files_with_shape_fbid"] == 20, d["files_with_shape_fbid"]
          assert d["files_with_nonzero_shape_fbid"] == 11, d["files_with_nonzero_shape_fbid"]
          assert d["max_shape_fbid"] == 5, d["max_shape_fbid"]
          assert d["shape_fbid_value_counts"] == {
              "0": 49, "1": 14, "2": 8, "3": 8, "4": 1, "5": 2,
          }, d["shape_fbid_value_counts"]
          assert d["files_with_ifbmax"] == 33, d["files_with_ifbmax"]
          assert d["files_with_ifbmax_gt1"] == 17, d["files_with_ifbmax_gt1"]
          assert d["max_ifbmax"] == 26, d["max_ifbmax"]
          assert d["ifbmax_value_counts"] == {
              "1": 16, "2": 5, "3": 2, "6": 2, "11": 6, "15": 1, "26": 1,
          }, d["ifbmax_value_counts"]
          assert d["files_with_fbid_and_single_ifbmax"] == 20, d["files_with_fbid_and_single_ifbmax"]
          assert d["files_with_fbid_out_of_range_when_single_ifbmax"] == 0, d["files_with_fbid_out_of_range_when_single_ifbmax"]
          assert sum(row["shape_fbid_wrong_wire_count"] for row in d["rows"]) == 0
          assert sum(row["ifbmax_wrong_wire_count"] for row in d["rows"]) == 0

          full_domain_sha = "3a49adaad5f701d14e16f1f901f0770c358407029040a8c18959c2abc39d88f2"
          [full_domain] = [
              row for row in d["rows"]
              if row["source_sha256"] == full_domain_sha
          ]
          full_domain_values = [
              item["value"] for item in full_domain["shape_fbid_observations"]
          ]
          assert full_domain["single_ifbmax"] == 6, full_domain
          assert set(full_domain_values) == set(range(6)), full_domain_values
          assert max(full_domain_values) == full_domain["single_ifbmax"] - 1, full_domain
          assert full_domain["all_fbid_in_range_when_single_ifbmax"] is True, full_domain
          assert full_domain["shape_chunks_with_opaque_tail"] == 0, full_domain
          assert full_domain["shape_fbid_wrong_wire_count"] == 0, full_domain
          assert full_domain["ifbmax_wrong_wire_count"] == 0, full_domain

          keys = [
              "mature_0x2c_file_count",
              "skipped_non_0x2c_count",
              "error_count",
              "shape_chunk_count",
              "shape_chunks_with_opaque_tail",
              "files_with_shape_fbid",
              "files_with_nonzero_shape_fbid",
              "max_shape_fbid",
              "files_with_fancy_borders_object",
              "files_with_ifbmax",
              "files_with_ifbmax_gt1",
              "max_ifbmax",
              "files_with_fbid_and_single_ifbmax",
              "files_with_fbid_out_of_range_when_single_ifbmax",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("## BorderArt Fbid corpus census\n\n")
              for key in keys:
                  f.write(f"- {key}: `{d.get(key)}`\n")
              f.write(f"- Fbid values: `{d['shape_fbid_value_counts']}`\n")
              f.write(f"- IfbMax values: `{d['ifbmax_value_counts']}`\n")

              positives = [
                  row for row in d["rows"]
                  if row["shape_fbid_observations"] or row["ifbmax_observations"]
              ]
              f.write("\n### Positive rows\n\n")
              for row in positives[:100]:
                  f.write(
                      f"- `{row['source_sha256']}`: "
                      f"Fbid={[x['value'] for x in row['shape_fbid_observations']]}; "
                      f"IfbMax={[x['value'] for x in row['ifbmax_observations']]}; "
                      f"in_range={row['all_fbid_in_range_when_single_ifbmax']}\n"
                  )
          print(json.dumps({key: d.get(key) for key in keys}, indent=2, sort_keys=True))
          print("Fbid values", d["shape_fbid_value_counts"])
          print("IfbMax values", d["ifbmax_value_counts"])
          PY

      - name: Upload source-free census
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: borderart-fbid-corpus-census
          path: |
            out/borderart-fbid-corpus-census.json
            out/borderart-fbid-corpus-census.stdout.json
            out/borderart-fbid-positive-provenance.json
          if-no-files-found: error
          retention-days: 90
