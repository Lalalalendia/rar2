name: Free PUB Editable CLI V1

on:
  pull_request:
    paths:
      - ".github/workflows/free-pub-editable-cli-v1.yml"
      - "vendor/producer-a/crates/pub-cli/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  pinned-convert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Format and build public CLI
        run: |
          rustfmt --edition 2024 --check vendor/producer-a/crates/pub-cli/src/main.rs
          cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-cli --bin pub

      - name: Acquire pinned Apache POI SampleNewsletter
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/SampleNewsletter.pub"
          curl --fail --location --silent --show-error \
            "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" \
            --output "$fixture"
          actual_sha="$(sha256sum "$fixture" | awk '{print $1}')"
          actual_size="$(wc -c < "$fixture" | tr -d ' ')"
          test "$actual_sha" = "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"
          test "$actual_size" = "291840"
          echo "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" >> "$GITHUB_ENV"

      - name: Convert both editable targets twice
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/free-pub-editable-cli-v1"
          mkdir -p "$out"
          cli="vendor/producer-a/target/debug/pub"

          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to idml --output "$out/a.idml" --json > "$out/idml-cli.json"
          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to idml --output "$out/b.idml" > "$out/idml-human.txt"
          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to odg --output "$out/a.odg" --json > "$out/odg-cli.json"
          "$cli" convert "$CHAPTERA_SAMPLE_NEWSLETTER" --to odg --output "$out/b.odg" > "$out/odg-human.txt"

          cmp "$out/a.idml" "$out/b.idml"
          cmp "$out/a.odg" "$out/b.odg"
          cmp "$out/a.idml.loss.json" "$out/b.idml.loss.json"
          cmp "$out/a.odg.loss.json" "$out/b.odg.loss.json"

          unzip -t "$out/a.idml" >/dev/null
          unzip -t "$out/a.odg" >/dev/null

          for file in \
            "$out/a.idml.loss.json" "$out/a.idml.loss.txt" \
            "$out/a.odg.loss.json" "$out/a.odg.loss.txt"; do
            test -s "$file"
          done

          echo "CHAPTERA_CLI_OUT=$out" >> "$GITHUB_ENV"

      - name: Validate reports and retain source-safe receipt
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          import pathlib

          out = pathlib.Path(os.environ["CHAPTERA_CLI_OUT"])
          expected = "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf"

          def load(name):
              return json.loads((out / name).read_text(encoding="utf-8"))

          idml_cli = load("idml-cli.json")
          odg_cli = load("odg-cli.json")
          idml_report = load("a.idml.loss.json")
          odg_report = load("a.odg.loss.json")

          for cli, report, target in [
              (idml_cli, idml_report, "idml"),
              (odg_cli, odg_report, "odg"),
          ]:
              assert cli["schema"] == "chaptera.pub-convert-cli.v1"
              assert cli["source_sha256"] == expected
              assert cli["target"] == target
              assert report["source"]["source_hash"] == expected
              assert report["can_serialize"] is True
              assert report["counts"]["blocking"] == 0

          def digest(name):
              return hashlib.sha256((out / name).read_bytes()).hexdigest()

          receipt = {
              "schema": "chaptera.free-pub-editable-cli-acceptance.v1",
              "source_sha256": expected,
              "idml_sha256": digest("a.idml"),
              "odg_sha256": digest("a.odg"),
              "idml_loss_sha256": digest("a.idml.loss.json"),
              "odg_loss_sha256": digest("a.odg.loss.json"),
              "idml_blocking": idml_report["counts"]["blocking"],
              "odg_blocking": odg_report["counts"]["blocking"],
              "invariants": {
                  "runtime_source_hash": True,
                  "deterministic_target_bytes": True,
                  "deterministic_loss_report": True,
                  "canonical_json_sidecar": True,
                  "human_loss_sidecar": True,
              },
          }
          (out / "acceptance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: free-pub-editable-cli-v1
          path: ${{ env.CHAPTERA_CLI_OUT }}/acceptance.json
          if-no-files-found: error
          retention-days: 30
