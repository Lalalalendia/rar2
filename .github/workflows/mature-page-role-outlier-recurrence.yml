name: Mature PAGE-role outlier recurrence

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/mature-page-role-outlier-recurrence.yml"
      - "tools/mature_page_role_outlier_recurrence_v1.py"
      - "vendor/producer-a/crates/pub-reader/src/lib.rs"
      - "vendor/producer-a/crates/pub-reader/src/bin/page-role-receipt.rs"

permissions:
  contents: read
  actions: read

concurrency:
  group: mature-page-role-outlier-recurrence-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/mature-page-role-outlier

jobs:
  census:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Verify pinned corpus identity
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          from pathlib import Path
          paths = sorted(Path("out/pinned1050/materialized/native").glob("*.pub"))
          shas = [path.stem.casefold() for path in paths]
          digest = hashlib.sha256("".join(sha + "\n" for sha in shas).encode("ascii")).hexdigest()
          assert len(shas) == 1050, len(shas)
          assert digest == "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43", digest
          print("pinned exact-1050 verified:", digest)
          PY

      - name: Build source-safe PAGE-role analyzer
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --bin page-role-receipt

      - name: Scan exact-1050 for mature PAGE-role receipts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mature-page-role-receipts"
          analyzer="$CARGO_TARGET_DIR/debug/page-role-receipt"
          mature=0
          rejected=0
          for pub in out/pinned1050/materialized/native/*.pub; do
            sha="$(basename "$pub" .pub)"
            if "$analyzer" "$pub" "$RUNNER_TEMP/mature-page-role-receipts/$sha.json" >/dev/null 2>&1; then
              mature=$((mature + 1))
            else
              rm -f "$RUNNER_TEMP/mature-page-role-receipts/$sha.json"
              rejected=$((rejected + 1))
            fi
          done
          echo "parseable_mature=$mature"
          echo "non_mature_or_rejected=$rejected"
          test "$mature" -ge 390
          test "$mature" -le 400
          test $((mature + rejected)) -eq 1050

      - name: Build outlier recurrence census
        shell: bash
        run: |
          set -euo pipefail
          python tools/mature_page_role_outlier_recurrence_v1.py             "$RUNNER_TEMP/mature-page-role-receipts"             target/mature-page-role-outlier/summary.json

      - name: Assert research fences
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("target/mature-page-role-outlier/summary.json").read_text())
          assert d["schema"] == "chaptera.mature-page-role-outlier-recurrence.v1"
          assert d["target_count"] == 11
          assert 390 <= d["parseable_mature_receipt_count"] <= 400
          c = d["claims"]
          assert c["measurement_only"] is True
          assert c["publisher_or_pdf_reference_used"] is False
          assert c["product_selection_changed"] is False
          assert c["field_presence_promoted_to_authority"] is False
          assert c["raw_story_text_emitted"] is False
          assert c["raw_contents_seq_nums_emitted"] is False
          print("recurrence census fences verified")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mature-page-role-outlier-recurrence
          path: target/mature-page-role-outlier/summary.json
          if-no-files-found: error
          retention-days: 30
