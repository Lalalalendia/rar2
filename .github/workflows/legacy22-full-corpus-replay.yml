name: Legacy22 full corpus replay

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/legacy22-full-corpus-replay.yml"
      - "vendor/producer-a/crates/pub-contents/src/legacy22_directory.rs"
      - "vendor/producer-a/crates/pub-reader/src/family_classifier.rs"
      - "vendor/producer-a/crates/pub-reader/src/legacy22_graph.rs"
      - "vendor/producer-a/crates/pub-reader/src/legacy22_noquill_graph.rs"
      - "vendor/producer-a/crates/pub-reader/src/bin/legacy22_raw0022_companion_profile.rs"
      - "vendor/producer-a/crates/pub-viewer/src/bin/corpus-reader-receipt.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy22-full-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target
  LALAMU_CORPUS_REF: f78cc6f455f4dc222868f9cc035511a6ca7a91ea

jobs:
  replay:
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.draft == false }}
    name: Replay 625 strict PUB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Reader candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout pinned 625-file corpus
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: ${{ env.LALAMU_CORPUS_REF }}
          path: corpus-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Install pinned CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Build exact Reader structural receipt
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-viewer \
            --release \
            --bin corpus-reader-receipt

      - name: Validate raw0022 companion profiler
        run: |
          set -euo pipefail
          rustfmt \
            --check \
            --edition 2021 \
            vendor/producer-a/crates/pub-reader/src/bin/legacy22_raw0022_companion_profile.rs
          cargo test \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin legacy22_raw0022_companion_profile
          cargo clippy \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin legacy22_raw0022_companion_profile \
            -- \
            -D warnings
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --release \
            --bin legacy22_raw0022_companion_profile

      - name: Replay full pinned corpus
        run: |
          set -euo pipefail
          rm -rf out/legacy625
          python corpus-src/pub-corpus/scripts/deep_profile.py \
            --corpus-root corpus-src/pub-corpus \
            --rar-tools tools/corpus \
            --reader-receipt-exe "${CARGO_TARGET_DIR}/release/corpus-reader-receipt" \
            --rar-ref "rar2:${GITHUB_SHA}" \
            --out out/legacy625 \
            --workers 4

      - name: Classify raw 0x0022 companions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          corpus = Path("corpus-src/pub-corpus/corpus/native/unclassified")
          paths = sorted(corpus.glob("*.pub"))
          assert len(paths) == 625, len(paths)

          exe = (
              Path(os.environ["CARGO_TARGET_DIR"])
              / "release"
              / "legacy22_raw0022_companion_profile"
          )

          def run(path, out_dir):
              target = out_dir / f"{path.stem}.json"
              cp = subprocess.run(
                  [str(exe), str(path), str(target)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  timeout=45,
                  check=False,
              )
              if cp.returncode != 0:
                  raise RuntimeError(
                      f"{path.name}: profiler rc={cp.returncode}: {cp.stderr[-2000:]}"
                  )
              return json.loads(target.read_text())

          rows = []
          with tempfile.TemporaryDirectory(prefix="legacy22-raw0022-") as td:
              out_dir = Path(td)
              with ThreadPoolExecutor(max_workers=8) as pool:
                  futures = {pool.submit(run, path, out_dir): path for path in paths}
                  for future in as_completed(futures):
                      rows.append(future.result())

          rows.sort(key=lambda row: row["source_sha256"])
          eligible = [row for row in rows if row.get("eligible_reader_open") is True]
          affected = [row for row in eligible if int(row.get("candidate_count") or 0) > 0]

          candidates = []
          for row in affected:
              for item in row.get("candidates") or []:
                  candidates.append({"source_sha256": row["source_sha256"], **item})

          assert len(candidates) == 305, len(candidates)
          assert len(affected) == 102, len(affected)
          assert all(
              int(item["child_parent_id"]) == int(item["parent_object_id"])
              for item in candidates
          )

          Path("/tmp/raw0022-candidates.json").write_text(
              json.dumps(candidates, sort_keys=True) + "\n"
          )

          child_lengths = Counter(str(item["child_chunk_len"]) for item in candidates)
          child_service_words = Counter(str(item["child_service_word"]) for item in candidates)
          child_exact = Counter(str(item["child_chunk_sha256"]) for item in candidates)
          child_prefix = Counter(str(item["child_prefix32_sha256"]) for item in candidates)
          child_suffix = Counter(str(item["child_suffix32_sha256"]) for item in candidates)
          parent_profiles = Counter(
              f"{item['parent_chunk_len']}:{item['parent_service_word']}"
              for item in candidates
          )
          parent_child_pairs = Counter(
              (
                  str(item["parent_normalized_chunk_sha256"]),
                  str(item["child_chunk_sha256"]),
              )
              for item in candidates
          )

          u16_values = defaultdict(Counter)
          u32_values = defaultdict(Counter)
          for item in candidates:
              for offset, value in (item.get("child_u16_first64") or {}).items():
                  u16_values[offset][str(value)] += 1
              for offset, value in (item.get("child_u32_first64") or {}).items():
                  u32_values[offset][str(value)] += 1

          def summarize(values):
              result = {}
              for offset in sorted(values, key=lambda value: int(value, 16)):
                  counter = values[offset]
                  result[offset] = {
                      "observed_count": sum(counter.values()),
                      "distinct_count": len(counter),
                      "invariant": len(counter) == 1,
                      "top_values": [
                          {"value": value, "count": count}
                          for value, count in counter.most_common(12)
                      ],
                  }
              return result

          u16_summary = summarize(u16_values)
          u32_summary = summarize(u32_values)

          summary = {
              "schema": "chaptera.legacy22-raw0022-companion-census.v1",
              "corpus_file_count": len(paths),
              "eligible_noquill_reader_file_count": len(eligible),
              "candidate_count": len(candidates),
              "candidate_file_count": len(affected),
              "child_parent_identity_match_count": sum(
                  int(item["child_parent_id"]) == int(item["parent_object_id"])
                  for item in candidates
              ),
              "child_chunk_length_counts": dict(
                  sorted(child_lengths.items(), key=lambda item: int(item[0]))
              ),
              "child_service_word_counts": dict(
                  sorted(child_service_words.items(), key=lambda item: int(item[0]))
              ),
              "child_exact_cluster_count": len(child_exact),
              "child_exact_singleton_count": sum(
                  count == 1 for count in child_exact.values()
              ),
              "largest_child_exact_cluster_size": max(child_exact.values(), default=0),
              "child_prefix32_cluster_count": len(child_prefix),
              "child_suffix32_cluster_count": len(child_suffix),
              "parent_profile_counts": dict(parent_profiles.most_common()),
              "parent_child_pair_cluster_count": len(parent_child_pairs),
              "parent_child_pair_singleton_count": sum(
                  count == 1 for count in parent_child_pairs.values()
              ),
              "largest_parent_child_pair_cluster_size": max(
                  parent_child_pairs.values(), default=0
              ),
              "child_u16_first64_offsets": u16_summary,
              "child_u32_first64_offsets": u32_summary,
              "child_u16_invariant_offsets": [
                  offset
                  for offset, profile in u16_summary.items()
                  if profile["invariant"]
                  and profile["observed_count"] == len(candidates)
              ],
              "child_u32_invariant_offsets": [
                  offset
                  for offset, profile in u32_summary.items()
                  if profile["invariant"]
                  and profile["observed_count"] == len(candidates)
              ],
              "child_u16_low_cardinality_offsets": [
                  offset
                  for offset, profile in u16_summary.items()
                  if profile["observed_count"] == len(candidates)
                  and profile["distinct_count"] <= 8
              ],
              "child_u32_low_cardinality_offsets": [
                  offset
                  for offset, profile in u32_summary.items()
                  if profile["observed_count"] == len(candidates)
                  and profile["distinct_count"] <= 8
              ],
              "top_child_exact_clusters": [
                  {"chunk_sha256": key, "count": count}
                  for key, count in child_exact.most_common(30)
              ],
              "top_parent_child_pair_clusters": [
                  {
                      "parent_normalized_chunk_sha256": parent_hash,
                      "child_chunk_sha256": child_hash,
                      "count": count,
                  }
                  for (parent_hash, child_hash), count
                  in parent_child_pairs.most_common(30)
              ],
              "evidence_boundary": (
                  "source-free structural census of the single raw 0x0022 child "
                  "owned by matching-parent PAGE-list positive raw 0x0003 candidates; "
                  "scalar offsets are observations only and carry no semantic names"
              ),
          }

          Path("out/legacy625/raw0022-companion-census.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Select controlled WordArt F0/F8000 fixture pairs
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import re
          from collections import Counter, defaultdict
          from pathlib import Path

          import olefile

          WORDART2 = "000212F0-0000-0000-C000-000000000046"
          candidates = json.loads(Path("/tmp/raw0022-candidates.json").read_text())
          corpus = Path("corpus-src/pub-corpus/corpus/native/unclassified")
          sha_to_path = {path.stem.lower(): path for path in corpus.glob("*.pub")}

          def u32(raw, offset):
              if offset < 0 or offset + 4 > len(raw):
                  raise ValueError(f"u32 out of bounds at {offset} / {len(raw)}")
              return int.from_bytes(raw[offset:offset + 4], "little", signed=False)

          def digest(raw):
              return hashlib.sha256(raw).hexdigest()[:16]

          def parse_clipboard(raw, offset):
              marker = u32(raw, offset)
              offset += 4
              if marker in (0xFFFFFFFF, 0xFFFFFFFE):
                  return f"std:{u32(raw, offset)}", offset + 4
              if marker == 0:
                  return "none", offset
              if marker > 0x201 or offset + marker > len(raw):
                  raise ValueError(f"invalid clipboard marker/length {marker}")
              return f"registered:{digest(raw[offset:offset + marker].rstrip(bytes([0])))}", offset + marker

          def parse_compobj_clipboard(raw):
              if len(raw) < 32:
                  raise ValueError(f"CompObj too short: {len(raw)}")
              length = u32(raw, 28)
              offset = 32 + length
              if length > 4096 or offset > len(raw):
                  raise ValueError(f"invalid CompObj user type length {length}")
              value, _ = parse_clipboard(raw, offset)
              return value

          def parse_olepres_header(raw):
              clipboard, offset = parse_clipboard(raw, 0)
              target_device_size = u32(raw, offset)
              if target_device_size < 4:
                  raise ValueError(f"invalid target device size {target_device_size}")
              offset += target_device_size
              if offset + 28 > len(raw):
                  raise ValueError("truncated OlePres header")
              return {
                  "clipboard": clipboard,
                  "aspect": u32(raw, offset),
                  "lindex": u32(raw, offset + 4),
                  "advf": u32(raw, offset + 8),
                  "width": u32(raw, offset + 16),
                  "height": u32(raw, offset + 20),
                  "data_size": u32(raw, offset + 24),
              }

          by_sha = defaultdict(list)
          for item in candidates:
              by_sha[str(item["source_sha256"]).lower()].append(item)

          rows = []
          for source_sha, items in sorted(by_sha.items()):
              source_path = sha_to_path.get(source_sha)
              if source_path is None:
                  raise RuntimeError(f"{source_sha}: pinned corpus source missing")

              with olefile.OleFileIO(str(source_path)) as ole:
                  entries = ole.listdir(streams=True, storages=True)
                  roots = {}
                  streams_by_root = defaultdict(list)
                  for parts in entries:
                      if len(parts) < 2 or parts[0].casefold() != "objects":
                          continue
                      match = re.fullmatch(r"Object\s*(\d+)", parts[1], flags=re.IGNORECASE)
                      if not match:
                          continue
                      number = int(match.group(1))
                      roots[number] = parts[:2]
                      if len(parts) > 2:
                          streams_by_root[number].append(parts)

                  for item in items:
                      u16 = item.get("child_u16_first64") or {}
                      v = int(u16["0x0a"])
                      f = int(u16["0x0e"])
                      root = roots.get(v)
                      if root is None:
                          raise RuntimeError(f"{source_sha}: missing Objects/Object {v}")

                      clsid = str(ole.getclsid(root) or "").upper()
                      if clsid != WORDART2:
                          continue

                      compobj_paths = []
                      olepres_paths = []
                      for stream_path in streams_by_root.get(v, []):
                          leaf = stream_path[-1].casefold()
                          normalized = leaf.lstrip("\x00\x01\x02")
                          if normalized == "compobj":
                              compobj_paths.append(stream_path)
                          if "olepres" in leaf:
                              olepres_paths.append(stream_path)

                      if len(compobj_paths) > 1:
                          raise RuntimeError(f"{source_sha}: Object {v} multiple CompObj")
                      compobj_clipboard = "missing"
                      compobj_hash = "missing"
                      if compobj_paths:
                          raw = ole.openstream(compobj_paths[0]).read(16384)
                          compobj_hash = digest(raw)
                          compobj_clipboard = parse_compobj_clipboard(raw)

                      pres = []
                      for pres_path in sorted(olepres_paths):
                          raw = ole.openstream(pres_path).read(131072)
                          p = parse_olepres_header(raw)
                          pres.append(
                              (
                                  p["clipboard"],
                                  p["aspect"],
                                  p["lindex"],
                                  p["advf"],
                              )
                          )
                      profile_json = json.dumps(sorted(pres), separators=(",", ":"))
                      profile_hash = digest(profile_json.encode("utf-8"))

                      rows.append(
                          {
                              "source_sha256": source_sha,
                              "storage_number": v,
                              "raw_flag": f,
                              "storage_clsid": clsid,
                              "presentation_profile_hash": profile_hash,
                              "compobj_clipboard": compobj_clipboard,
                              "compobj_hash": compobj_hash,
                              "olepres_count": len(pres),
                          }
                      )

          assert Counter(row["raw_flag"] for row in rows) == Counter({0: 41, 32768: 113})

          exact_groups = defaultdict(lambda: defaultdict(list))
          profile_groups = defaultdict(lambda: defaultdict(list))
          for row in rows:
              exact_key = (
                  row["storage_clsid"],
                  row["presentation_profile_hash"],
                  row["compobj_clipboard"],
              )
              profile_key = (
                  row["storage_clsid"],
                  row["presentation_profile_hash"],
              )
              exact_groups[exact_key][row["raw_flag"]].append(row)
              profile_groups[profile_key][row["raw_flag"]].append(row)

          def pair_rows(groups):
              out = []
              for key, by_flag in sorted(groups.items(), key=lambda item: str(item[0])):
                  left = sorted(
                      by_flag.get(0, []),
                      key=lambda row: (row["source_sha256"], row["storage_number"]),
                  )
                  right = sorted(
                      by_flag.get(32768, []),
                      key=lambda row: (row["source_sha256"], row["storage_number"]),
                  )
                  for a, b in zip(left, right):
                      out.append(
                          {
                              "control": a,
                              "flagged": b,
                              "shared_key": list(key),
                          }
                      )
              return out

          exact_pairs = pair_rows(exact_groups)
          profile_pairs = pair_rows(profile_groups)
          assert profile_pairs, "no same CLSID+presentation F0/F8000 pairs"

          summary = {
              "schema": "chaptera.legacy22-wordart-f-pair-selection.v1",
              "wordart_candidate_count": len(rows),
              "flag_counts": {
                  str(k): v for k, v in sorted(Counter(row["raw_flag"] for row in rows).items())
              },
              "same_profile_clipboard_pair_count": len(exact_pairs),
              "same_profile_pair_count": len(profile_pairs),
              "selected_same_profile_clipboard_pairs": exact_pairs[:12],
              "selected_same_profile_pairs": profile_pairs[:12],
              "selection_rule": (
                  "deterministic source_sha256/storage_number ordering inside identical "
                  "MS WordArt 2.0 CLSID + OlePres aggregate profile, preferring identical "
                  "CompObj clipboard class"
              ),
              "evidence_boundary": (
                  "source-safe fixture identities only; no PUB bytes, OLE stream bytes, "
                  "strings or presentation payload are retained"
              ),
          }

          Path("out/legacy625/raw0022-wordart-f-pairs.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Guard legacy22 product depth
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("out/legacy625/summary.json").read_text())
          rows = json.loads(Path("out/legacy625/reader-records.json").read_text())
          companion = json.loads(
              Path("out/legacy625/raw0022-companion-census.json").read_text()
          )
          reader = summary["reader"]

          assert summary["corpus_file_count"] == 625, summary["corpus_file_count"]
          assert reader["opened_by_family"].get("0x22") == 226, reader["opened_by_family"]

          legacy_open = [
              row for row in rows
              if row.get("opened") is True and row.get("contents_family") == "0x22"
          ]
          legacy_with_scene = [
              row for row in legacy_open if int(row.get("scene_node_count") or 0) > 0
          ]
          legacy_scene_nodes = sum(int(row.get("scene_node_count") or 0) for row in legacy_open)
          legacy_story_frames = sum(int(row.get("story_frame_count") or 0) for row in legacy_open)
          legacy_text_fragments = sum(int(row.get("text_fragment_count") or 0) for row in legacy_open)

          unresolved_encoding_files = sum(
              "viewer.text.legacy_encoding_unresolved" in (row.get("diagnostic_codes") or [])
              for row in legacy_open
          )

          assert companion["candidate_count"] == 305, companion["candidate_count"]
          assert len(legacy_with_scene) == 217, len(legacy_with_scene)
          # #160 admits the 305 authoritative PAGE OLE candidates. #93 then
          # admits bounded non-degenerate raw0x0004 LINE endpoint geometry,
          # raising the pinned-625 scene baseline from 2268 to 2556 without
          # changing open/fail, Story, text, or encoding counts.
          assert legacy_scene_nodes == 2556, legacy_scene_nodes
          assert legacy_story_frames == 1430, legacy_story_frames
          assert legacy_text_fragments == 1383, legacy_text_fragments
          assert unresolved_encoding_files == 58, unresolved_encoding_files

          receipt = {
              "corpus_file_count": summary["corpus_file_count"],
              "opened_count": reader["opened_count"],
              "failed_count": reader["failed_count"],
              "opened_by_family": reader["opened_by_family"],
              "failed_by_family": reader["failed_by_family"],
              "legacy_opened": len(legacy_open),
              "legacy_files_with_scene_nodes": len(legacy_with_scene),
              "legacy_scene_node_count": legacy_scene_nodes,
              "legacy_ole_candidate_count": companion["candidate_count"],
              "legacy_story_frame_count": legacy_story_frames,
              "legacy_text_fragment_count": legacy_text_fragments,
              "legacy_unresolved_encoding_file_count": unresolved_encoding_files,
              "lalamu_corpus_ref": "f78cc6f455f4dc222868f9cc035511a6ca7a91ea",
          }
          Path("out/legacy625/acceptance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy22-full-corpus-${{ github.run_id }}
          path: out/legacy625/**
          if-no-files-found: error
          retention-days: 30
