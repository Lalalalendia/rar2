name: Legacy22 full corpus replay

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "vendor/producer-a/crates/pub-contents/src/legacy22_directory.rs"
      - "vendor/producer-a/crates/pub-reader/src/family_classifier.rs"
      - "vendor/producer-a/crates/pub-reader/src/legacy22_graph.rs"
      - "vendor/producer-a/crates/pub-reader/src/legacy22_noquill_graph.rs"
      - "vendor/producer-a/crates/pub-reader/src/bin/legacy22_raw0003_profile.rs"
      - "vendor/producer-a/crates/pub-viewer/src/bin/corpus-reader-receipt.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy22-full-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target
  LALAMU_CORPUS_REF: f78cc6f455f4dc222868f9cc035511a6ca7a91ea

jobs:
  replay:
    name: Replay 625 strict PUB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Reader candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout pinned 625-file corpus
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: ${{ env.LALAMU_CORPUS_REF }}
          path: corpus-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Install pinned CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Build exact Reader structural receipt
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-viewer \
            --release \
            --bin corpus-reader-receipt

      - name: Validate raw0003 structural profiler
        run: |
          set -euo pipefail
          rustfmt \
            --check \
            --edition 2021 \
            vendor/producer-a/crates/pub-reader/src/bin/legacy22_raw0003_profile.rs
          cargo test \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin legacy22_raw0003_profile
          cargo clippy \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin legacy22_raw0003_profile \
            -- \
            -D warnings
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --release \
            --bin legacy22_raw0003_profile

      - name: Replay full pinned corpus
        run: |
          set -euo pipefail
          rm -rf out/legacy625
          python corpus-src/pub-corpus/scripts/deep_profile.py \
            --corpus-root corpus-src/pub-corpus \
            --rar-tools tools/corpus \
            --reader-receipt-exe "${CARGO_TARGET_DIR}/release/corpus-reader-receipt" \
            --rar-ref "rar2:${GITHUB_SHA}" \
            --out out/legacy625 \
            --workers 4

      - name: Classify current raw 0x0003 population
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          corpus = Path("corpus-src/pub-corpus/corpus/native/unclassified")
          paths = sorted(corpus.glob("*.pub"))
          assert len(paths) == 625, len(paths)

          exe = Path(os.environ["CARGO_TARGET_DIR"]) / "release" / "legacy22_raw0003_profile"

          def run(path, out_dir):
              target = out_dir / f"{path.stem}.json"
              cp = subprocess.run(
                  [str(exe), str(path), str(target)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  timeout=45,
                  check=False,
              )
              if cp.returncode != 0:
                  raise RuntimeError(
                      f"{path.name}: profiler rc={cp.returncode}: {cp.stderr[-2000:]}"
                  )
              return json.loads(target.read_text())

          rows = []
          with tempfile.TemporaryDirectory(prefix="legacy22-raw0003-") as td:
              out_dir = Path(td)
              with ThreadPoolExecutor(max_workers=8) as pool:
                  futures = {pool.submit(run, path, out_dir): path for path in paths}
                  for future in as_completed(futures):
                      rows.append(future.result())

          rows.sort(key=lambda row: row["source_sha256"])
          eligible = [row for row in rows if row.get("eligible_reader_open") is True]
          affected = [
              row for row in eligible
              if int(row.get("raw0003_instance_count") or 0) > 0
          ]

          instances = []
          for row in affected:
              for item in row.get("instances") or []:
                  instances.append({"source_sha256": row["source_sha256"], **item})

          object_like = [
              item for item in instances
              if (item.get("child_raw_type_counts") or {}) == {"0x0022": 1}
              and (item.get("geometry") or {}).get("positive_rect") is True
          ]
          service_prototypes = [
              item for item in instances
              if item.get("parent_raw_type") == "0x0014"
              and (item.get("child_raw_type_counts") or {}) == {}
              and int(item.get("service_word") or 0) == 5696
              and (item.get("geometry") or {}).get("positive_rect") is False
              and (item.get("sibling_raw_type_counts") or {}) == {
                  "0x0000": 1,
                  "0x0001": 1,
                  "0x0002": 1,
                  "0x0004": 1,
                  "0x0005": 1,
                  "0x0006": 1,
                  "0x0007": 1,
              }
              and item.get("previous_directory_raw_type") == "0x0002"
              and item.get("next_directory_raw_type") == "0x0004"
          ]
          candidates = [
              item for item in object_like
              if item.get("matching_parent_page_membership") is True
          ]
          parent_mismatches = [
              item for item in object_like
              if int(item.get("page_child_membership_count") or 0) > 0
              and item.get("matching_parent_page_membership") is not True
          ]
          unlisted_or_nested = [
              item for item in instances
              if item not in service_prototypes
              and item not in candidates
              and item not in parent_mismatches
          ]
          candidate_files = {item["source_sha256"] for item in candidates}
          mismatch_files = {item["source_sha256"] for item in parent_mismatches}
          service_files = {item["source_sha256"] for item in service_prototypes}
          unlisted_files = {item["source_sha256"] for item in unlisted_or_nested}

          parent_types = Counter(
              str(item.get("parent_raw_type") or "none") for item in candidates
          )
          chunk_lengths = Counter(str(item["chunk_len"]) for item in candidates)
          service_words = Counter(str(item["service_word"]) for item in candidates)
          adjacency = Counter(
              f"{item.get('previous_directory_raw_type') or 'none'}->"
              f"{item.get('next_directory_raw_type') or 'none'}"
              for item in candidates
          )
          page_adjacency = Counter(
              f"{item.get('matching_page_previous_raw_type') or 'none'}->"
              f"{item.get('matching_page_next_raw_type') or 'none'}"
              for item in candidates
          )
          page_positions = Counter(
              str(item.get("matching_page_child_position"))
              for item in candidates
          )
          sibling_signatures = Counter(
              json.dumps(
                  item.get("sibling_raw_type_counts") or {},
                  sort_keys=True,
                  separators=(",", ":"),
              )
              for item in candidates
          )
          child_signatures = Counter(
              json.dumps(
                  item.get("child_raw_type_counts") or {},
                  sort_keys=True,
                  separators=(",", ":"),
              )
              for item in candidates
          )

          child_profiles = [
              item.get("child_0x0022")
              for item in candidates
              if item.get("child_0x0022")
          ]
          assert len(child_profiles) == len(candidates), (
              len(child_profiles),
              len(candidates),
          )
          child_chunk_lengths = Counter(
              str(item["chunk_len"]) for item in child_profiles
          )
          child_service_words = Counter(
              str(item["service_word"]) for item in child_profiles
          )
          child_exact = Counter(
              str(item["chunk_sha256"]) for item in child_profiles
          )
          child_prefixes = Counter(
              str(item["prefix32_sha256"]) for item in child_profiles
          )
          child_suffixes = Counter(
              str(item["suffix32_sha256"]) for item in child_profiles
          )
          child_u16_value_counts = [Counter() for _ in range(9)]
          child_u32_value_counts = [Counter() for _ in range(4)]
          for item in child_profiles:
              words = item.get("u16_le_words") or []
              dwords = item.get("u32_le_dwords") or []
              assert len(words) == 9, len(words)
              assert len(dwords) == 4, len(dwords)
              for index, value in enumerate(words):
                  child_u16_value_counts[index][str(value)] += 1
              for index, value in enumerate(dwords):
                  child_u32_value_counts[index][str(value)] += 1
          parent_child_pairs = Counter(
              (
                  str((item.get("geometry") or {}).get("normalized_chunk_sha256")),
                  str((item.get("child_0x0022") or {}).get("chunk_sha256")),
              )
              for item in candidates
          )

          child_service_flag_counts = Counter()
          parent_service_child_service_counts = Counter()
          parent_service_flag_counts = Counter()
          variable_equals_page_position = 0
          variable_equals_parent_object_id = 0
          variable_equals_child_object_id = 0
          variable_equals_page_parent_id = 0
          variable_value_by_child_service = {}
          variable_value_by_parent_service = {}

          for item in candidates:
              child = item.get("child_0x0022") or {}
              words = child.get("u16_le_words") or []
              assert len(words) == 9, len(words)
              variable = int(words[5])
              flag = int(words[7])
              child_service = int(child["service_word"])
              parent_service = int(item["service_word"])

              child_service_flag_counts[(child_service, flag)] += 1
              parent_service_child_service_counts[(parent_service, child_service)] += 1
              parent_service_flag_counts[(parent_service, flag)] += 1
              variable_value_by_child_service.setdefault(str(child_service), Counter())[str(variable)] += 1
              variable_value_by_parent_service.setdefault(str(parent_service), Counter())[str(variable)] += 1

              page_position = item.get("matching_page_child_position")
              if page_position is not None and variable == int(page_position):
                  variable_equals_page_position += 1
              if variable == int(item["object_id"]):
                  variable_equals_parent_object_id += 1
              if variable == int(child["object_id"]):
                  variable_equals_child_object_id += 1
              if variable == int(item["parent_id"]):
                  variable_equals_page_parent_id += 1

          geometry_present = sum(
              bool((item.get("geometry") or {}).get("carrier_present"))
              for item in candidates
          )
          geometry_positive = sum(
              (item.get("geometry") or {}).get("positive_rect") is True
              for item in candidates
          )
          normalized = Counter(
              str((item.get("geometry") or {}).get("normalized_chunk_sha256"))
              for item in candidates
              if (item.get("geometry") or {}).get("normalized_chunk_sha256")
          )
          exact = Counter(str(item["chunk_sha256"]) for item in candidates)
          prefixes = Counter(str(item["prefix32_sha256"]) for item in candidates)
          suffixes = Counter(str(item["suffix32_sha256"]) for item in candidates)

          child_profiles = [
              item.get("child_0x0022")
              for item in candidates
              if isinstance(item.get("child_0x0022"), dict)
          ]
          child_chunk_lengths = Counter(
              str(item["chunk_len"]) for item in child_profiles
          )
          child_service_words = Counter(
              str(item["service_word"]) for item in child_profiles
          )
          child_exact = Counter(
              str(item["chunk_sha256"]) for item in child_profiles
          )
          child_prefixes = Counter(
              str(item["prefix32_sha256"]) for item in child_profiles
          )
          child_suffixes = Counter(
              str(item["suffix32_sha256"]) for item in child_profiles
          )

          representatives = {}
          for item in candidates:
              key = (item.get("geometry") or {}).get("normalized_chunk_sha256")
              if not key:
                  continue
              representatives.setdefault(key, [])
              if len(representatives[key]) < 5:
                  representatives[key].append(
                      {
                          "source_sha256": item["source_sha256"],
                          "object_id": item["object_id"],
                          "parent_id": item["parent_id"],
                          "chunk_len": item["chunk_len"],
                          "parent_raw_type": item.get("parent_raw_type"),
                      }
                  )

          summary = {
              "schema": "chaptera.legacy22-raw0003-census.v1",
              "corpus_file_count": len(paths),
              "eligible_noquill_reader_file_count": len(eligible),
              "affected_file_count": len(affected),
              "all_directory_instance_count": len(instances),
              "service_prototype_count": len(service_prototypes),
              "service_prototype_file_count": len(service_files),
              "object_like_count": len(object_like),
              "reader_candidate_count": len(candidates),
              "reader_candidate_file_count": len(candidate_files),
              "page_child_parent_mismatch_count": len(parent_mismatches),
              "page_child_parent_mismatch_file_count": len(mismatch_files),
              "unlisted_or_nested_instance_count": len(unlisted_or_nested),
              "unlisted_or_nested_file_count": len(unlisted_files),
              "parent_raw_type_counts": dict(sorted(parent_types.items())),
              "chunk_length_counts": dict(
                  sorted(chunk_lengths.items(), key=lambda item: int(item[0]))
              ),
              "service_word_counts": dict(
                  sorted(service_words.items(), key=lambda item: int(item[0]))
              ),
              "geometry_carrier_present_count": geometry_present,
              "geometry_positive_rect_count": geometry_positive,
              "normalized_chunk_cluster_count": len(normalized),
              "normalized_chunk_singleton_count": sum(
                  count == 1 for count in normalized.values()
              ),
              "largest_normalized_chunk_cluster_size": max(
                  normalized.values(), default=0
              ),
              "exact_chunk_cluster_count": len(exact),
              "prefix32_cluster_count": len(prefixes),
              "suffix32_cluster_count": len(suffixes),
              "directory_adjacency_counts": dict(adjacency.most_common()),
              "page_child_adjacency_counts": dict(page_adjacency.most_common()),
              "page_child_position_counts": dict(
                  sorted(page_positions.items(), key=lambda item: int(item[0]))
              ),
              "sibling_signature_counts": dict(sibling_signatures.most_common()),
              "child_signature_counts": dict(child_signatures.most_common()),
              "child_0x0022_count": len(child_profiles),
              "child_0x0022_chunk_length_counts": dict(
                  sorted(
                      child_chunk_lengths.items(),
                      key=lambda item: int(item[0]),
                  )
              ),
              "child_0x0022_service_word_counts": dict(
                  sorted(
                      child_service_words.items(),
                      key=lambda item: int(item[0]),
                  )
              ),
              "child_0x0022_exact_cluster_count": len(child_exact),
              "child_0x0022_exact_singleton_count": sum(
                  count == 1 for count in child_exact.values()
              ),
              "child_0x0022_largest_exact_cluster_size": max(
                  child_exact.values(), default=0
              ),
              "child_0x0022_prefix32_cluster_count": len(child_prefixes),
              "child_0x0022_suffix32_cluster_count": len(child_suffixes),
              "child_0x0022_u16_le_value_counts": {
                  f"0x{index * 2:02x}": dict(
                      sorted(counter.items(), key=lambda item: int(item[0]))
                  )
                  for index, counter in enumerate(child_u16_value_counts)
              },
              "child_0x0022_u32_le_value_counts": {
                  f"0x{index * 4:02x}": dict(
                      sorted(counter.items(), key=lambda item: int(item[0]))
                  )
                  for index, counter in enumerate(child_u32_value_counts)
              },
              "child_0x0022_service_word_flag_counts": {
                  f"{service_word}:0x{flag:04x}": count
                  for (service_word, flag), count
                  in sorted(child_service_flag_counts.items())
              },
              "parent_service_word_child_service_word_counts": {
                  f"{parent_service}:{child_service}": count
                  for (parent_service, child_service), count
                  in sorted(parent_service_child_service_counts.items())
              },
              "parent_service_word_child_flag_counts": {
                  f"{parent_service}:0x{flag:04x}": count
                  for (parent_service, flag), count
                  in sorted(parent_service_flag_counts.items())
              },
              "child_0x0022_u16_0a_alias_checks": {
                  "equals_page_child_position_count": variable_equals_page_position,
                  "equals_parent_object_id_count": variable_equals_parent_object_id,
                  "equals_child_object_id_count": variable_equals_child_object_id,
                  "equals_page_parent_id_count": variable_equals_page_parent_id,
              },
              "child_0x0022_u16_0a_distinct_by_child_service_word": {
                  service_word: len(values)
                  for service_word, values
                  in sorted(variable_value_by_child_service.items())
              },
              "child_0x0022_u16_0a_distinct_by_parent_service_word": {
                  service_word: len(values)
                  for service_word, values
                  in sorted(variable_value_by_parent_service.items())
              },
              "parent_child_exact_pair_cluster_count": len(parent_child_pairs),
              "parent_child_exact_pair_singleton_count": sum(
                  count == 1 for count in parent_child_pairs.values()
              ),
              "largest_parent_child_exact_pair_cluster_size": max(
                  parent_child_pairs.values(), default=0
              ),
              "top_child_0x0022_exact_clusters": [
                  {
                      "chunk_sha256": key,
                      "count": count,
                  }
                  for key, count in child_exact.most_common(30)
              ],
              "top_parent_child_exact_pair_clusters": [
                  {
                      "parent_normalized_chunk_sha256": parent_hash,
                      "child_chunk_sha256": child_hash,
                      "count": count,
                  }
                  for (parent_hash, child_hash), count
                  in parent_child_pairs.most_common(30)
              ],
              "top_normalized_clusters": [
                  {
                      "normalized_chunk_sha256": key,
                      "count": count,
                      "representatives": representatives.get(key, []),
                  }
                  for key, count in normalized.most_common(30)
              ],
              "evidence_boundary": (
                  "structural classification only; raw 0x0003 splits into a "
                  "223-file service/prototype class and an object-like class with "
                  "one 0x0022 child plus positive geometry; only matching-parent "
                  "PAGE members enter candidate metrics; child 0x0022 payload "
                  "clusters are profiled independently before any semantic admission"
              ),
          }

          # Scalar words are retained only as aggregate distributions in the
          # census. Remove per-instance values before writing source-free artifacts.
          for item in instances:
              child = item.get("child_0x0022")
              if isinstance(child, dict):
                  child.pop("u16_le_words", None)
                  child.pop("u32_le_dwords", None)

          Path("out/legacy625/raw0003-instances.json").write_text(
              json.dumps(instances, indent=2, sort_keys=True) + "\n"
          )
          Path("out/legacy625/raw0003-census.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          # Fail closed only after preserving the research artifact so counterexamples
          # remain available for inspection on red runs.
          assert len(service_prototypes) == 223, len(service_prototypes)
          assert len(service_files) == 223, len(service_files)
          assert len(object_like) == 552, len(object_like)
          assert len(candidates) == 305, len(candidates)
          assert len(candidate_files) == 102, len(candidate_files)
          assert len(parent_mismatches) == 9, len(parent_mismatches)
          assert len(mismatch_files) == 5, len(mismatch_files)
          assert len(child_profiles) == 305, len(child_profiles)
          assert (
              len(service_prototypes)
              + len(candidates)
              + len(parent_mismatches)
              + len(unlisted_or_nested)
              == len(instances)
          )
          PY

      - name: Guard legacy22 product depth
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("out/legacy625/summary.json").read_text())
          rows = json.loads(Path("out/legacy625/reader-records.json").read_text())
          reader = summary["reader"]

          assert summary["corpus_file_count"] == 625, summary["corpus_file_count"]
          assert reader["opened_by_family"].get("0x2c") == 379, reader["opened_by_family"]
          assert reader["opened_by_family"].get("0x22") == 226, reader["opened_by_family"]

          legacy_open = [
              row for row in rows
              if row.get("opened") is True and row.get("contents_family") == "0x22"
          ]
          legacy_with_scene = [
              row for row in legacy_open if int(row.get("scene_node_count") or 0) > 0
          ]
          legacy_scene_nodes = sum(int(row.get("scene_node_count") or 0) for row in legacy_open)
          legacy_story_frames = sum(int(row.get("story_frame_count") or 0) for row in legacy_open)
          legacy_text_fragments = sum(int(row.get("text_fragment_count") or 0) for row in legacy_open)

          unresolved_encoding_files = sum(
              "viewer.text.legacy_encoding_unresolved" in (row.get("diagnostic_codes") or [])
              for row in legacy_open
          )

          assert len(legacy_with_scene) == 215, len(legacy_with_scene)
          assert legacy_scene_nodes == 1963, legacy_scene_nodes
          assert legacy_story_frames == 1430, legacy_story_frames
          assert legacy_text_fragments == 1383, legacy_text_fragments
          assert unresolved_encoding_files == 58, unresolved_encoding_files

          receipt = {
              "corpus_file_count": summary["corpus_file_count"],
              "opened_count": reader["opened_count"],
              "failed_count": reader["failed_count"],
              "opened_by_family": reader["opened_by_family"],
              "failed_by_family": reader["failed_by_family"],
              "legacy_opened": len(legacy_open),
              "legacy_files_with_scene_nodes": len(legacy_with_scene),
              "legacy_scene_node_count": legacy_scene_nodes,
              "legacy_story_frame_count": legacy_story_frames,
              "legacy_text_fragment_count": legacy_text_fragments,
              "legacy_unresolved_encoding_file_count": unresolved_encoding_files,
              "lalamu_corpus_ref": "f78cc6f455f4dc222868f9cc035511a6ca7a91ea",
          }
          Path("out/legacy625/acceptance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy22-full-corpus-${{ github.run_id }}
          path: out/legacy625/**
          if-no-files-found: error
          retention-days: 30
