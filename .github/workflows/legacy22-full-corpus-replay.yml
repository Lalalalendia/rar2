name: Legacy22 full corpus replay

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/legacy22-full-corpus-replay.yml"
      - "vendor/producer-a/crates/pub-contents/src/legacy22_directory.rs"
      - "vendor/producer-a/crates/pub-reader/src/family_classifier.rs"
      - "vendor/producer-a/crates/pub-reader/src/legacy22_graph.rs"
      - "vendor/producer-a/crates/pub-reader/src/legacy22_noquill_graph.rs"
      - "vendor/producer-a/crates/pub-reader/src/bin/legacy22_raw0022_companion_profile.rs"
      - "vendor/producer-a/crates/pub-viewer/src/bin/corpus-reader-receipt.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy22-full-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target
  LALAMU_CORPUS_REF: f78cc6f455f4dc222868f9cc035511a6ca7a91ea

jobs:
  replay:
    name: Replay 625 strict PUB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Reader candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout pinned 625-file corpus
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: ${{ env.LALAMU_CORPUS_REF }}
          path: corpus-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Install pinned CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Build exact Reader structural receipt
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-viewer \
            --release \
            --bin corpus-reader-receipt

      - name: Validate raw0022 companion profiler
        run: |
          set -euo pipefail
          rustfmt \
            --check \
            --edition 2021 \
            vendor/producer-a/crates/pub-reader/src/bin/legacy22_raw0022_companion_profile.rs
          cargo test \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin legacy22_raw0022_companion_profile
          cargo clippy \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --bin legacy22_raw0022_companion_profile \
            -- \
            -D warnings
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-reader \
            --release \
            --bin legacy22_raw0022_companion_profile

      - name: Replay full pinned corpus
        run: |
          set -euo pipefail
          rm -rf out/legacy625
          python corpus-src/pub-corpus/scripts/deep_profile.py \
            --corpus-root corpus-src/pub-corpus \
            --rar-tools tools/corpus \
            --reader-receipt-exe "${CARGO_TARGET_DIR}/release/corpus-reader-receipt" \
            --rar-ref "rar2:${GITHUB_SHA}" \
            --out out/legacy625 \
            --workers 4

      - name: Classify raw 0x0022 companions
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from collections import Counter, defaultdict
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          corpus = Path("corpus-src/pub-corpus/corpus/native/unclassified")
          paths = sorted(corpus.glob("*.pub"))
          assert len(paths) == 625, len(paths)

          exe = (
              Path(os.environ["CARGO_TARGET_DIR"])
              / "release"
              / "legacy22_raw0022_companion_profile"
          )

          def run(path, out_dir):
              target = out_dir / f"{path.stem}.json"
              cp = subprocess.run(
                  [str(exe), str(path), str(target)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  timeout=45,
                  check=False,
              )
              if cp.returncode != 0:
                  raise RuntimeError(
                      f"{path.name}: profiler rc={cp.returncode}: {cp.stderr[-2000:]}"
                  )
              return json.loads(target.read_text())

          rows = []
          with tempfile.TemporaryDirectory(prefix="legacy22-raw0022-") as td:
              out_dir = Path(td)
              with ThreadPoolExecutor(max_workers=8) as pool:
                  futures = {pool.submit(run, path, out_dir): path for path in paths}
                  for future in as_completed(futures):
                      rows.append(future.result())

          rows.sort(key=lambda row: row["source_sha256"])
          eligible = [row for row in rows if row.get("eligible_reader_open") is True]
          affected = [row for row in eligible if int(row.get("candidate_count") or 0) > 0]

          candidates = []
          for row in affected:
              for item in row.get("candidates") or []:
                  candidates.append({"source_sha256": row["source_sha256"], **item})

          assert len(candidates) == 305, len(candidates)
          assert len(affected) == 102, len(affected)
          assert all(
              int(item["child_parent_id"]) == int(item["parent_object_id"])
              for item in candidates
          )

          child_lengths = Counter(str(item["child_chunk_len"]) for item in candidates)
          child_service_words = Counter(str(item["child_service_word"]) for item in candidates)
          child_exact = Counter(str(item["child_chunk_sha256"]) for item in candidates)
          child_prefix = Counter(str(item["child_prefix32_sha256"]) for item in candidates)
          child_suffix = Counter(str(item["child_suffix32_sha256"]) for item in candidates)
          parent_profiles = Counter(
              f"{item['parent_chunk_len']}:{item['parent_service_word']}"
              for item in candidates
          )
          parent_child_pairs = Counter(
              (
                  str(item["parent_normalized_chunk_sha256"]),
                  str(item["child_chunk_sha256"]),
              )
              for item in candidates
          )

          u16_values = defaultdict(Counter)
          u32_values = defaultdict(Counter)
          for item in candidates:
              for offset, value in (item.get("child_u16_first64") or {}).items():
                  u16_values[offset][str(value)] += 1
              for offset, value in (item.get("child_u32_first64") or {}).items():
                  u32_values[offset][str(value)] += 1

          def summarize(values):
              result = {}
              for offset in sorted(values, key=lambda value: int(value, 16)):
                  counter = values[offset]
                  result[offset] = {
                      "observed_count": sum(counter.values()),
                      "distinct_count": len(counter),
                      "invariant": len(counter) == 1,
                      "top_values": [
                          {"value": value, "count": count}
                          for value, count in counter.most_common(12)
                      ],
                  }
              return result

          u16_summary = summarize(u16_values)
          u32_summary = summarize(u32_values)

          # Hosted/offline causal join for LEGACY22-RAW0022-CAUSAL-01.
          # Reuse stream-path receipts already produced by deep_profile instead of
          # reparsing the same CFB files. Compare OleData.V (+0x0A) against exact
          # /Objects/Object N roots and correlate F (+0x0E) with matched-root topology.
          import re
          import olefile

          fingerprints = json.loads(
              Path("out/legacy625/fingerprints.json").read_text()
          )
          fingerprints_by_sha = {
              str(row.get("sha256") or "").lower(): row
              for row in fingerprints
              if row.get("sha256")
          }
          sha_to_path = {path.stem.lower(): path for path in paths}

          cfb_join = {
              "candidate_count": len(candidates),
              "candidate_file_count": len(affected),
              "files_with_objects_storage": 0,
              "files_with_object_substorage": 0,
              "files_with_olepres": 0,
              "v_in_object_storage_number": 0,
              "v_plus_1_in_object_storage_number": 0,
              "v_minus_1_in_object_storage_number": 0,
              "v_in_olepres_suffix": 0,
              "v_in_any_numeric_cfb_component": 0,
              "v_matched_root_has_olepres": 0,
              "v_matched_root_has_ole10native": 0,
              "v_matched_root_has_ole_stream": 0,
              "v_matched_root_has_compobj": 0,
              "v_matched_root_has_contents": 0,
              "v_matched_root_ole_header_present": 0,
              "v_matched_root_ole_header_missing": 0,
              "files_v_set_equals_object_root_set": 0,
              "files_v_set_subset_object_root_set": 0,
              "files_object_root_set_subset_v_set": 0,
              "files_v_set_disjoint_object_root_set": 0,
          }
          object_storage_counts = Counter()
          olepres_counts = Counter()
          v_values = Counter()
          matched_root_signatures = Counter()
          matched_root_signature_by_f = Counter()
          direct_match_by_f = Counter()
          direct_match_by_revision = Counter()
          f_by_revision = Counter()
          ole_wire_version_counts = Counter()
          ole_wire_flags_counts = Counter()
          ole_wire_update_option_counts = Counter()
          f_by_ole_flags = Counter()
          f_by_ole_update_option = Counter()
          f_by_ole_flags_update = Counter()
          no_ole_stream_by_f = Counter()
          ole_wire_short_by_f = Counter()
          candidate_file_revisions = Counter()
          candidate_instance_revisions = Counter()
          ole_stream_version_counts = Counter()
          ole_stream_flags_counts = Counter()
          ole_stream_update_option_counts = Counter()
          f_by_ole_stream_presence = Counter()
          f_by_ole_stream_flags = Counter()
          f_by_ole_stream_update_option = Counter()
          f_by_ole_stream_flags_update = Counter()
          topology_by_sha = {}
          logical_groups = defaultdict(list)

          sha_to_path = {path.stem.lower(): path for path in paths}

          candidate_by_sha = defaultdict(list)
          for item in candidates:
              candidate_by_sha[item["source_sha256"].lower()].append(item)

          for row in affected:
              source_sha = row["source_sha256"].lower()
              fingerprint = fingerprints_by_sha.get(source_sha)
              if fingerprint is None:
                  raise RuntimeError(
                      f"{source_sha}: candidate source missing from deep_profile fingerprints"
                  )

              revision = str(fingerprint.get("contents_serialization_revision"))
              candidate_file_revisions[revision] += 1
              logical_identity = str(
                  fingerprint.get("content_topology_fingerprint_sha256") or ""
              )
              if not logical_identity:
                  raise RuntimeError(f"{source_sha}: missing logical stream-set identity")
              logical_groups[logical_identity].append(source_sha)

              object_features = defaultdict(set)
              ole_stream_parts_by_object = {}
              object_numbers = set()
              olepres_numbers = set()
              any_numbers = set()
              has_objects = False
              stream_paths = [
                  str(stream.get("path") or "")
                  for stream in (fingerprint.get("streams") or [])
                  if isinstance(stream, dict)
              ]

              for stream_path in stream_paths:
                  parts = [part for part in stream_path.strip("/").split("/") if part]
                  if parts and parts[0].casefold() == "objects":
                      has_objects = True
                  if len(parts) >= 2 and parts[0].casefold() == "objects":
                      object_match = re.fullmatch(
                          r"Object\s*(\d+)", parts[1], flags=re.IGNORECASE
                      )
                      if object_match:
                          object_number = int(object_match.group(1))
                          object_numbers.add(object_number)
                          for component in parts[2:]:
                              folded = component.casefold()
                              if "olepres" in folded:
                                  object_features[object_number].add("olepres")
                              if "ole10native" in folded:
                                  object_features[object_number].add("ole10native")
                              normalized = folded.lstrip("\x00\x01\x02")
                              if normalized == "ole":
                                  object_features[object_number].add("ole")
                                  if object_number in ole_stream_paths:
                                      raise RuntimeError(
                                          f"{source_sha}: multiple x01Ole streams under Object {object_number}"
                                      )
                                  ole_stream_paths[object_number] = parts
                                  previous = ole_stream_parts_by_object.get(object_number)
                                  if previous is not None and previous != parts:
                                      raise RuntimeError(
                                          f"{source_sha}: multiple distinct \\x01Ole streams "
                                          f"under Object {object_number}"
                                      )
                                  ole_stream_parts_by_object[object_number] = parts
                              if "compobj" in folded:
                                  object_features[object_number].add("compobj")
                              if normalized == "contents":
                                  object_features[object_number].add("contents")

                  for component in parts:
                      olepres_match = re.search(
                          r"OlePres(\d+)", component, flags=re.IGNORECASE
                      )
                      if olepres_match:
                          olepres_numbers.add(int(olepres_match.group(1)))
                      for numeric in re.finditer(r"\d+", component):
                          any_numbers.add(int(numeric.group(0)))

              ole_headers = {}
              if ole_stream_parts_by_object:
                  source_path = sha_to_path.get(source_sha)
                  if source_path is None:
                      raise RuntimeError(
                          f"{source_sha}: candidate source is missing from pinned corpus paths"
                      )
                  try:
                      with olefile.OleFileIO(str(source_path)) as ole:
                          for object_number, parts in sorted(
                              ole_stream_parts_by_object.items()
                          ):
                              raw_header = ole.openstream(parts).read(12)
                              if len(raw_header) < 12:
                                  raise RuntimeError(
                                      f"Object {object_number} \\x01Ole stream is shorter than "
                                      f"the 12-byte standard header: {len(raw_header)}"
                                  )
                              ole_headers[object_number] = {
                                  "version": int.from_bytes(
                                      raw_header[0:4], "little", signed=False
                                  ),
                                  "flags": int.from_bytes(
                                      raw_header[4:8], "little", signed=False
                                  ),
                                  "update_option": int.from_bytes(
                                      raw_header[8:12], "little", signed=False
                                  ),
                              }
                  except Exception as exc:
                      raise RuntimeError(
                          f"{source_sha}: failed to read bounded \\x01Ole headers: {exc}"
                      ) from exc

              topology_by_sha[source_sha] = {
                  "object_numbers": object_numbers,
                  "olepres_numbers": olepres_numbers,
                  "any_numbers": any_numbers,
                  "object_features": object_features,
                  "ole_headers": ole_headers,
                  "revision": revision,
              }

              if has_objects:
                  cfb_join["files_with_objects_storage"] += 1
              if object_numbers:
                  cfb_join["files_with_object_substorage"] += 1
              if olepres_numbers:
                  cfb_join["files_with_olepres"] += 1
              object_storage_counts[str(len(object_numbers))] += 1
              olepres_counts[str(len(olepres_numbers))] += 1

              file_v_values = {
                  int((item.get("child_u16_first64") or {})["0x0a"])
                  for item in candidate_by_sha[source_sha]
                  if "0x0a" in (item.get("child_u16_first64") or {})
              }
              if file_v_values == object_numbers:
                  cfb_join["files_v_set_equals_object_root_set"] += 1
              if file_v_values.issubset(object_numbers):
                  cfb_join["files_v_set_subset_object_root_set"] += 1
              if object_numbers.issubset(file_v_values):
                  cfb_join["files_object_root_set_subset_v_set"] += 1
              if file_v_values.isdisjoint(object_numbers):
                  cfb_join["files_v_set_disjoint_object_root_set"] += 1

          for item in candidates:
              source_sha = item["source_sha256"].lower()
              topology = topology_by_sha[source_sha]
              raw_v = (item.get("child_u16_first64") or {}).get("0x0a")
              raw_f = (item.get("child_u16_first64") or {}).get("0x0e")
              if raw_v is None or raw_f is None:
                  raise RuntimeError(
                      f"{source_sha}: missing complete OleData V/F scalar profile"
                  )

              v = int(raw_v)
              f = int(raw_f)
              revision = topology["revision"]
              object_numbers = topology["object_numbers"]
              olepres_numbers = topology["olepres_numbers"]
              any_numbers = topology["any_numbers"]
              object_features = topology["object_features"]
              ole_headers = topology["ole_headers"]

              v_values[str(v)] += 1
              candidate_instance_revisions[revision] += 1
              f_by_revision[(revision, str(f))] += 1

              direct = v in object_numbers
              direct_match_by_f[(str(f), str(direct).lower())] += 1
              direct_match_by_revision[(revision, str(direct).lower())] += 1
              if direct:
                  cfb_join["v_in_object_storage_number"] += 1
                  features = object_features.get(v, set())
                  signature = "|".join(sorted(features)) or "none"
                  matched_root_signatures[signature] += 1
                  matched_root_signature_by_f[(str(f), signature)] += 1
                  if "olepres" in features:
                      cfb_join["v_matched_root_has_olepres"] += 1
                  if "ole10native" in features:
                      cfb_join["v_matched_root_has_ole10native"] += 1
                  if "ole" in features:
                      cfb_join["v_matched_root_has_ole_stream"] += 1
                  if "compobj" in features:
                      cfb_join["v_matched_root_has_compobj"] += 1
                  if "contents" in features:
                      cfb_join["v_matched_root_has_contents"] += 1

                  ole_header = ole_headers.get(v)
                  if ole_header is None:
                      cfb_join["v_matched_root_ole_header_missing"] += 1
                      f_by_ole_stream_presence[(str(f), "missing")] += 1
                  else:
                      cfb_join["v_matched_root_ole_header_present"] += 1
                      f_by_ole_stream_presence[(str(f), "present")] += 1
                      version = str(ole_header["version"])
                      flags = str(ole_header["flags"])
                      update_option = str(ole_header["update_option"])
                      ole_stream_version_counts[version] += 1
                      ole_stream_flags_counts[flags] += 1
                      ole_stream_update_option_counts[update_option] += 1
                      f_by_ole_stream_flags[(str(f), flags)] += 1
                      f_by_ole_stream_update_option[
                          (str(f), update_option)
                      ] += 1
                      f_by_ole_stream_flags_update[
                          (str(f), flags, update_option)
                      ] += 1

              if v + 1 in object_numbers:
                  cfb_join["v_plus_1_in_object_storage_number"] += 1
              if v > 0 and v - 1 in object_numbers:
                  cfb_join["v_minus_1_in_object_storage_number"] += 1
              if v in olepres_numbers:
                  cfb_join["v_in_olepres_suffix"] += 1
              if v in any_numbers:
                  cfb_join["v_in_any_numeric_cfb_component"] += 1

          # Normative MS-OLEDS x01Ole wire join. Read only the fixed header
          # (Version, Flags, LinkUpdateOption) from the exact V-matched Object root.
          # Do not retain monikers, paths, native payload or other source bytes.
          ole_wire_parse_count = 0
          ole_wire_short_count = 0
          for source_sha, file_candidates in candidate_by_sha.items():
              source_path = sha_to_path.get(source_sha)
              if source_path is None:
                  raise RuntimeError(f"{source_sha}: source path missing for x01Ole wire join")
              topology = topology_by_sha[source_sha]
              with olefile.OleFileIO(str(source_path)) as ole:
                  for item in file_candidates:
                      raw_v = (item.get("child_u16_first64") or {}).get("0x0a")
                      raw_f = (item.get("child_u16_first64") or {}).get("0x0e")
                      if raw_v is None or raw_f is None:
                          raise RuntimeError(
                              f"{source_sha}: missing V/F for x01Ole wire join"
                          )
                      v = int(raw_v)
                      f = int(raw_f)
                      ole_parts = topology["ole_stream_paths"].get(v)
                      if ole_parts is None:
                          no_ole_stream_by_f[str(f)] += 1
                          continue
                      header = ole.openstream(ole_parts).read(12)
                      if len(header) < 12:
                          ole_wire_short_count += 1
                          ole_wire_short_by_f[str(f)] += 1
                          continue

                      version = int.from_bytes(header[0:4], "little")
                      flags = int.from_bytes(header[4:8], "little")
                      update_option = int.from_bytes(header[8:12], "little")
                      ole_wire_parse_count += 1
                      ole_wire_version_counts[str(version)] += 1
                      ole_wire_flags_counts[str(flags)] += 1
                      ole_wire_update_option_counts[str(update_option)] += 1
                      f_by_ole_flags[(str(f), str(flags))] += 1
                      f_by_ole_update_option[(str(f), str(update_option))] += 1
                      f_by_ole_flags_update[
                          (str(f), str(flags), str(update_option))
                      ] += 1

          cfb_join["x01ole_wire_parse_count"] = ole_wire_parse_count
          cfb_join["x01ole_wire_short_count"] = ole_wire_short_count
          cfb_join["x01ole_version_counts"] = dict(
              sorted(ole_wire_version_counts.items(), key=lambda item: int(item[0]))
          )
          cfb_join["x01ole_flags_counts"] = dict(
              sorted(ole_wire_flags_counts.items(), key=lambda item: int(item[0]))
          )
          cfb_join["x01ole_link_update_option_counts"] = dict(
              sorted(
                  ole_wire_update_option_counts.items(),
                  key=lambda item: int(item[0]),
              )
          )
          cfb_join["no_x01ole_stream_by_f_counts"] = dict(
              sorted(no_ole_stream_by_f.items(), key=lambda item: int(item[0]))
          )
          cfb_join["x01ole_short_by_f_counts"] = dict(
              sorted(ole_wire_short_by_f.items(), key=lambda item: int(item[0]))
          )
          cfb_join["f_by_x01ole_flags_counts"] = {
              f"{f}:{flags}": count
              for (f, flags), count in sorted(f_by_ole_flags.items())
          }
          cfb_join["f_by_x01ole_link_update_option_counts"] = {
              f"{f}:{update_option}": count
              for (f, update_option), count
              in sorted(f_by_ole_update_option.items())
          }
          cfb_join["f_by_x01ole_flags_update_counts"] = {
              f"{f}:{flags}:{update_option}": count
              for (f, flags, update_option), count
              in sorted(f_by_ole_flags_update.items())
          }

          cfb_join["object_storage_count_distribution"] = dict(
              sorted(object_storage_counts.items(), key=lambda item: int(item[0]))
          )
          cfb_join["olepres_count_distribution"] = dict(
              sorted(olepres_counts.items(), key=lambda item: int(item[0]))
          )
          cfb_join["v_distinct_count"] = len(v_values)
          cfb_join["v_top_values"] = [
              {"value": value, "count": count}
              for value, count in v_values.most_common(20)
          ]
          cfb_join["matched_object_root_signature_counts"] = dict(
              matched_root_signatures.most_common()
          )
          cfb_join["matched_object_root_signature_by_f_counts"] = {
              f"{f}:{signature}": count
              for (f, signature), count in sorted(
                  matched_root_signature_by_f.items()
              )
          }
          cfb_join["direct_v_match_by_f_counts"] = {
              f"{f}:{matched}": count
              for (f, matched), count in sorted(direct_match_by_f.items())
          }
          cfb_join["candidate_file_contents_revision_counts"] = dict(
              sorted(candidate_file_revisions.items())
          )
          cfb_join["candidate_instance_contents_revision_counts"] = dict(
              sorted(candidate_instance_revisions.items())
          )
          cfb_join["direct_v_match_by_revision_counts"] = {
              f"{revision}:{matched}": count
              for (revision, matched), count
              in sorted(direct_match_by_revision.items())
          }
          cfb_join["f_by_revision_counts"] = {
              f"{revision}:{f}": count
              for (revision, f), count in sorted(f_by_revision.items())
          }
          cfb_join["ole_stream_version_counts"] = dict(
              sorted(
                  ole_stream_version_counts.items(),
                  key=lambda item: int(item[0]),
              )
          )
          cfb_join["ole_stream_flags_counts"] = dict(
              sorted(
                  ole_stream_flags_counts.items(),
                  key=lambda item: int(item[0]),
              )
          )
          cfb_join["ole_stream_update_option_counts"] = dict(
              sorted(
                  ole_stream_update_option_counts.items(),
                  key=lambda item: int(item[0]),
              )
          )
          cfb_join["f_by_ole_stream_presence_counts"] = {
              f"{f}:{presence}": count
              for (f, presence), count in sorted(f_by_ole_stream_presence.items())
          }
          cfb_join["f_by_ole_stream_flags_counts"] = {
              f"{f}:{flags}": count
              for (f, flags), count in sorted(f_by_ole_stream_flags.items())
          }
          cfb_join["f_by_ole_stream_update_option_counts"] = {
              f"{f}:{update}": count
              for (f, update), count
              in sorted(f_by_ole_stream_update_option.items())
          }
          cfb_join["f_by_ole_stream_flags_update_counts"] = {
              f"{f}:{flags}:{update}": count
              for (f, flags, update), count
              in sorted(f_by_ole_stream_flags_update.items())
          }
          cfb_join["candidate_file_logical_identity_count"] = len(logical_groups)
          cfb_join["candidate_file_duplicate_logical_group_count"] = sum(
              len(group) > 1 for group in logical_groups.values()
          )
          cfb_join["candidate_file_largest_logical_duplicate_group_size"] = max(
              (len(group) for group in logical_groups.values()),
              default=0,
          )

          summary = {
              "schema": "chaptera.legacy22-raw0022-companion-census.v1",
              "corpus_file_count": len(paths),
              "eligible_noquill_reader_file_count": len(eligible),
              "candidate_count": len(candidates),
              "candidate_file_count": len(affected),
              "child_parent_identity_match_count": sum(
                  int(item["child_parent_id"]) == int(item["parent_object_id"])
                  for item in candidates
              ),
              "child_chunk_length_counts": dict(
                  sorted(child_lengths.items(), key=lambda item: int(item[0]))
              ),
              "child_service_word_counts": dict(
                  sorted(child_service_words.items(), key=lambda item: int(item[0]))
              ),
              "child_exact_cluster_count": len(child_exact),
              "child_exact_singleton_count": sum(
                  count == 1 for count in child_exact.values()
              ),
              "largest_child_exact_cluster_size": max(child_exact.values(), default=0),
              "child_prefix32_cluster_count": len(child_prefix),
              "child_suffix32_cluster_count": len(child_suffix),
              "parent_profile_counts": dict(parent_profiles.most_common()),
              "parent_child_pair_cluster_count": len(parent_child_pairs),
              "parent_child_pair_singleton_count": sum(
                  count == 1 for count in parent_child_pairs.values()
              ),
              "largest_parent_child_pair_cluster_size": max(
                  parent_child_pairs.values(), default=0
              ),
              "child_u16_first64_offsets": u16_summary,
              "child_u32_first64_offsets": u32_summary,
              "child_u16_invariant_offsets": [
                  offset
                  for offset, profile in u16_summary.items()
                  if profile["invariant"]
                  and profile["observed_count"] == len(candidates)
              ],
              "child_u32_invariant_offsets": [
                  offset
                  for offset, profile in u32_summary.items()
                  if profile["invariant"]
                  and profile["observed_count"] == len(candidates)
              ],
              "child_u16_low_cardinality_offsets": [
                  offset
                  for offset, profile in u16_summary.items()
                  if profile["observed_count"] == len(candidates)
                  and profile["distinct_count"] <= 8
              ],
              "cfb_oledata_identity_join": cfb_join,
              "child_u32_low_cardinality_offsets": [
                  offset
                  for offset, profile in u32_summary.items()
                  if profile["observed_count"] == len(candidates)
                  and profile["distinct_count"] <= 8
              ],
              "top_child_exact_clusters": [
                  {"chunk_sha256": key, "count": count}
                  for key, count in child_exact.most_common(30)
              ],
              "top_parent_child_pair_clusters": [
                  {
                      "parent_normalized_chunk_sha256": parent_hash,
                      "child_chunk_sha256": child_hash,
                      "count": count,
                  }
                  for (parent_hash, child_hash), count
                  in parent_child_pairs.most_common(30)
              ],
              "evidence_boundary": (
                  "source-free structural census of the single raw 0x0022 child "
                  "owned by matching-parent PAGE-list positive raw 0x0003 candidates; "
                  "scalar offsets are observations only and carry no semantic names"
              ),
          }

          Path("out/legacy625/raw0022-companion-census.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Guard legacy22 product depth
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("out/legacy625/summary.json").read_text())
          rows = json.loads(Path("out/legacy625/reader-records.json").read_text())
          reader = summary["reader"]

          assert summary["corpus_file_count"] == 625, summary["corpus_file_count"]
          assert reader["opened_by_family"].get("0x2c") == 379, reader["opened_by_family"]
          assert reader["opened_by_family"].get("0x22") == 226, reader["opened_by_family"]

          legacy_open = [
              row for row in rows
              if row.get("opened") is True and row.get("contents_family") == "0x22"
          ]
          legacy_with_scene = [
              row for row in legacy_open if int(row.get("scene_node_count") or 0) > 0
          ]
          legacy_scene_nodes = sum(int(row.get("scene_node_count") or 0) for row in legacy_open)
          legacy_story_frames = sum(int(row.get("story_frame_count") or 0) for row in legacy_open)
          legacy_text_fragments = sum(int(row.get("text_fragment_count") or 0) for row in legacy_open)

          unresolved_encoding_files = sum(
              "viewer.text.legacy_encoding_unresolved" in (row.get("diagnostic_codes") or [])
              for row in legacy_open
          )

          assert len(legacy_with_scene) == 215, len(legacy_with_scene)
          assert legacy_scene_nodes == 1963, legacy_scene_nodes
          assert legacy_story_frames == 1430, legacy_story_frames
          assert legacy_text_fragments == 1383, legacy_text_fragments
          assert unresolved_encoding_files == 58, unresolved_encoding_files

          receipt = {
              "corpus_file_count": summary["corpus_file_count"],
              "opened_count": reader["opened_count"],
              "failed_count": reader["failed_count"],
              "opened_by_family": reader["opened_by_family"],
              "failed_by_family": reader["failed_by_family"],
              "legacy_opened": len(legacy_open),
              "legacy_files_with_scene_nodes": len(legacy_with_scene),
              "legacy_scene_node_count": legacy_scene_nodes,
              "legacy_story_frame_count": legacy_story_frames,
              "legacy_text_fragment_count": legacy_text_fragments,
              "legacy_unresolved_encoding_file_count": unresolved_encoding_files,
              "lalamu_corpus_ref": "f78cc6f455f4dc222868f9cc035511a6ca7a91ea",
          }
          Path("out/legacy625/acceptance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy22-full-corpus-${{ github.run_id }}
          path: out/legacy625/**
          if-no-files-found: error
          retention-days: 30
