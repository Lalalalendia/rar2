name: Legacy22 full corpus replay

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "vendor/producer-a/crates/pub-contents/src/legacy22_directory.rs"
      - "vendor/producer-a/crates/pub-reader/src/family_classifier.rs"
      - "vendor/producer-a/crates/pub-reader/src/legacy22_graph.rs"
      - "vendor/producer-a/crates/pub-reader/src/legacy22_noquill_graph.rs"
      - "vendor/producer-a/crates/pub-viewer/src/bin/corpus-reader-receipt.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: legacy22-full-corpus-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target
  LALAMU_CORPUS_REF: f78cc6f455f4dc222868f9cc035511a6ca7a91ea

jobs:
  replay:
    name: Replay 625 strict PUB
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout exact Reader candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Checkout pinned 625-file corpus
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: ${{ env.LALAMU_CORPUS_REF }}
          path: corpus-src

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Install pinned CFB parser
        run: python -m pip install --disable-pip-version-check olefile==0.47

      - name: Build exact Reader structural receipt
        run: |
          set -euo pipefail
          cargo build \
            --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-viewer \
            --release \
            --bin corpus-reader-receipt

      - name: Validate legacy22 geometry profiler
        run: |
          set -euo pipefail
          rustfmt             --check             --edition 2021             vendor/producer-a/crates/pub-reader/src/bin/legacy22_geometry_profile.rs
          cargo test             --manifest-path vendor/producer-a/Cargo.toml             -p pub-reader             --bin legacy22_geometry_profile
          cargo clippy             --manifest-path vendor/producer-a/Cargo.toml             -p pub-reader             --bin legacy22_geometry_profile             --             -D warnings
          cargo build             --manifest-path vendor/producer-a/Cargo.toml             -p pub-reader             --release             --bin legacy22_geometry_profile

      - name: Replay full pinned corpus
        run: |
          set -euo pipefail
          rm -rf out/legacy625
          python corpus-src/pub-corpus/scripts/deep_profile.py \
            --corpus-root corpus-src/pub-corpus \
            --rar-tools tools/corpus \
            --reader-receipt-exe "${CARGO_TARGET_DIR}/release/corpus-reader-receipt" \
            --rar-ref "rar2:${GITHUB_SHA}" \
            --out out/legacy625 \
            --workers 4

      - name: Classify raw 0x0004 geometry residuals
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          import tempfile
          from collections import Counter
          from concurrent.futures import ThreadPoolExecutor, as_completed
          from pathlib import Path

          corpus = Path("corpus-src/pub-corpus/corpus/native/unclassified")
          paths = sorted(corpus.glob("*.pub"))
          assert len(paths) == 625, len(paths)
          exe = Path(os.environ["CARGO_TARGET_DIR"]) / "release" / "legacy22_geometry_profile"

          def run(path, out_dir):
              target = out_dir / f"{path.stem}.json"
              cp = subprocess.run(
                  [str(exe), str(path), str(target)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  text=True,
                  timeout=45,
                  check=False,
              )
              if cp.returncode != 0:
                  raise RuntimeError(
                      f"{path.name}: profiler rc={cp.returncode}: {cp.stderr[-2000:]}"
                  )
              return json.loads(target.read_text())

          rows = []
          with tempfile.TemporaryDirectory(prefix="legacy22-geometry-") as td:
              out_dir = Path(td)
              with ThreadPoolExecutor(max_workers=8) as pool:
                  futures = {pool.submit(run, path, out_dir): path for path in paths}
                  for future in as_completed(futures):
                      rows.append(future.result())

          rows.sort(key=lambda row: row["source_sha256"])
          eligible = [row for row in rows if row.get("eligible_reader_open") is True]
          instances = [
              {"source_sha256": row["source_sha256"], **item}
              for row in eligible
              for item in (row.get("instances") or [])
          ]

          active = [
              item for item in instances
              if item.get("matching_parent_page_membership") is True
          ]
          nonactive = [
              item for item in instances
              if item.get("matching_parent_page_membership") is not True
          ]
          invalid_current = [
              item for item in instances
              if (item.get("geometry_current") or {}).get("positive_rect") is not True
          ]
          invalid_active = [
              item for item in active
              if (item.get("geometry_current") or {}).get("positive_rect") is not True
          ]

          def positive_at(items, field):
              return sum(
                  (item.get(field) or {}).get("positive_rect") is True
                  for item in items
              )

          summary = {
              "schema": "chaptera.legacy22-geometry-census.v1",
              "corpus_file_count": len(paths),
              "eligible_noquill_reader_file_count": len(eligible),
              "raw0004_instance_count": len(instances),
              "matching_parent_active_page_count": len(active),
              "non_matching_or_nonactive_count": len(nonactive),
              "current_invalid_geometry_count": len(invalid_current),
              "active_current_invalid_geometry_count": len(invalid_active),
              "active_invalid_positive_at_0x04": positive_at(
                  invalid_active, "geometry_start_0x04"
              ),
              "active_invalid_positive_at_0x08": positive_at(
                  invalid_active, "geometry_start_0x08"
              ),
              "invalid_chunk_length_counts": dict(
                  Counter(str(item["chunk_len"]) for item in invalid_current).most_common()
              ),
              "invalid_parent_raw_type_counts": dict(
                  Counter(
                      str(item.get("parent_raw_type") or "none")
                      for item in invalid_current
                  ).most_common()
              ),
              "invalid_normalized_geometry_cluster_count": len({
                  item.get("normalized_geometry_sha256")
                  for item in invalid_current
                  if item.get("normalized_geometry_sha256")
              }),
              "evidence_boundary": (
                  "research-only partition of raw 0x0004 LINE records; +0x04/+0x08 "
                  "are observational alternate carrier probes only and do not change "
                  "Reader decoding without repeated active-page evidence"
              ),
          }

          Path("out/legacy625/raw0004-geometry-census.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))
          PY

      - name: Guard legacy22 product depth
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          summary = json.loads(Path("out/legacy625/summary.json").read_text())
          rows = json.loads(Path("out/legacy625/reader-records.json").read_text())
          reader = summary["reader"]

          assert summary["corpus_file_count"] == 625, summary["corpus_file_count"]
          assert reader["opened_by_family"].get("0x2c") == 379, reader["opened_by_family"]
          assert reader["opened_by_family"].get("0x22") == 226, reader["opened_by_family"]

          legacy_open = [
              row for row in rows
              if row.get("opened") is True and row.get("contents_family") == "0x22"
          ]
          legacy_with_scene = [
              row for row in legacy_open if int(row.get("scene_node_count") or 0) > 0
          ]
          legacy_scene_nodes = sum(int(row.get("scene_node_count") or 0) for row in legacy_open)
          legacy_story_frames = sum(int(row.get("story_frame_count") or 0) for row in legacy_open)
          legacy_text_fragments = sum(int(row.get("text_fragment_count") or 0) for row in legacy_open)

          unresolved_encoding_files = sum(
              "viewer.text.legacy_encoding_unresolved" in (row.get("diagnostic_codes") or [])
              for row in legacy_open
          )

          assert len(legacy_with_scene) == 215, len(legacy_with_scene)
          assert legacy_scene_nodes == 1963, legacy_scene_nodes
          assert legacy_story_frames == 1430, legacy_story_frames
          assert legacy_text_fragments == 1383, legacy_text_fragments
          assert unresolved_encoding_files == 58, unresolved_encoding_files

          receipt = {
              "corpus_file_count": summary["corpus_file_count"],
              "opened_count": reader["opened_count"],
              "failed_count": reader["failed_count"],
              "opened_by_family": reader["opened_by_family"],
              "failed_by_family": reader["failed_by_family"],
              "legacy_opened": len(legacy_open),
              "legacy_files_with_scene_nodes": len(legacy_with_scene),
              "legacy_scene_node_count": legacy_scene_nodes,
              "legacy_story_frame_count": legacy_story_frames,
              "legacy_text_fragment_count": legacy_text_fragments,
              "legacy_unresolved_encoding_file_count": unresolved_encoding_files,
              "lalamu_corpus_ref": "f78cc6f455f4dc222868f9cc035511a6ca7a91ea",
          }
          Path("out/legacy625/acceptance.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: legacy22-full-corpus-${{ github.run_id }}
          path: out/legacy625/**
          if-no-files-found: error
          retention-days: 30
