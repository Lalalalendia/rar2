name: paragraph-v13-exact-blob-smoke

on:
  push:
    branches:
      - delivery/paragraph-exact-fixture-v12-smoke
    paths:
      - .github/workflows/paragraph-v13-exact-blob-smoke.yml

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 10
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch exact v13 launcher blob and verify bytes
        shell: powershell
        run: |
          $headers = @{
            Authorization = "Bearer $env:GITHUB_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          $blob = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/Lalalalendia/rar2/git/blobs/114ea2722e3ad633b47f558c209bfed628a4a768"
          $raw = ($blob.content -replace '\s','')
          $bytes = [Convert]::FromBase64String($raw)
          $path = Join-Path $env:RUNNER_TEMP 'RUN_NATIVE-v13.ps1'
          [IO.File]::WriteAllBytes($path,$bytes)
          $sha = (Get-FileHash -LiteralPath $path -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "launcher_sha256=$sha"
          if($sha -ne '931e2f8bc98995feff106cb25f2197a14250db97b4ba9dd1d05770ecdb2ed190'){ throw "launcher SHA mismatch: $sha" }

          $tokens=$null
          $errors=$null
          [void][System.Management.Automation.Language.Parser]::ParseFile($path,[ref]$tokens,[ref]$errors)
          if($errors.Count -ne 0){
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }
          Write-Host 'PARSER PASS'

          powershell.exe -NoLogo -NoProfile -ExecutionPolicy Bypass -File $path -SelfTest
          if($LASTEXITCODE -ne 0){ exit $LASTEXITCODE }
          Write-Host 'SELFTEST PASS'
