name: Rescue corpus replay v1

on:
  pull_request:
    paths:
      - 'tools/rescue_corpus_replay_v1.py'
      - 'tools/test_rescue_corpus_replay_v1.py'
      - '.github/workflows/rescue-corpus-replay-v1.yml'
  push:
    branches: [main]
    paths:
      - 'tools/rescue_corpus_replay_v1.py'
      - 'tools/test_rescue_corpus_replay_v1.py'
      - '.github/workflows/rescue-corpus-replay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: rescue-corpus-replay-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  source-safe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test corpus replay and CFB identity contracts
        run: |
          python -m unittest tools.test_rescue_corpus_replay_v1 tools.test_rescue_cfb_stream_identity -v
          python -m py_compile tools/rescue_corpus_replay_v1.py tools/test_rescue_corpus_replay_v1.py
      - name: Run real physical exporter and verifier through corpus CLI
        shell: bash
        run: |
          python - <<'PY'
          import hashlib, json, subprocess, sys, tempfile
          from pathlib import Path
          from tools.test_rescue_cfb_stream_identity import collision_fixture

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              source = root / 'source'
              source.mkdir()
              raw = collision_fixture()
              sha = hashlib.sha256(raw).hexdigest()
              original = source / (sha + '.pub')
              original.write_bytes(raw)
              authority = root / 'authority.sha256.txt'
              authority.write_text(sha + '\n', encoding='ascii')
              out = root / 'out'
              command = [sys.executable, 'tools/rescue_corpus_replay_v1.py',
                         '--root', str(source), '--authority', str(authority), '--output', str(out)]
              def execute():
                  completed = subprocess.run(command, capture_output=True, check=False)
                  return completed.returncode, json.loads((out / 'summary.json').read_text())
              code, first = execute()
              assert code == 0 and first['counts'] == {'extracted': 1}, first
              assert first['entries'][0]['verified_streams'] == 2
              code, second = execute()
              assert code == 0 and second['counts'] == {'reused': 1}, second
              bundle = out / 'bundles' / sha
              artifact = sorted((bundle / 'streams').glob('*.bin'))[0]
              artifact.write_bytes(b'bad')
              code, third = execute()
              assert code == 1 and third['counts'] == {'failed': 1}, third
              assert third['entries'][0]['reason'] == 'invalid_existing_bundle'
              assert original.read_bytes() == raw
              print(json.dumps({'fixture_sha256': sha, 'verified_streams': 2,
                                'first': 'extracted', 'second': 'reused',
                                'tamper': 'failed_closed', 'source_unchanged': True}, sort_keys=True))
          PY

  windows-lock:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify crash recovery, live lock contention and atomic CSV on Windows
        shell: pwsh
        run: |
          python -m unittest tools.test_rescue_corpus_replay_v1.ReplayTests.test_abrupt_child_exit_does_not_block_resume tools.test_rescue_corpus_replay_v1.ReplayTests.test_output_lock_survives_prior_run_and_rejects_live_contention tools.test_rescue_corpus_replay_v1.ReplayTests.test_csv_write_is_atomic_when_serialization_fails -v

  authority-overlap:
    name: Reconcile accepted 1050 SHAs against authority v5 (1556)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch immutable source-free 1050 SHA ledger, never PUB bytes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 3 \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/Lalalalendia/rar2/actions/artifacts/12134191514/zip" \
            -o "$RUNNER_TEMP/rescue-1050-source-free-ledger.zip"
      - name: Prove exact 1556/1050 membership and emit SHA-only uncovered registry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from zipfile import ZipFile
          from tools.rescue_corpus_replay_v1 import DEFAULT_AUTHORITY, source_free_sha_overlap

          source_free_zip = Path(os.environ["RUNNER_TEMP"]) / "rescue-1050-source-free-ledger.zip"
          with ZipFile(source_free_zip) as z:
              ledger_raw = z.read("rescue-cell-proof/sha-only-ledger.json")
              summary_raw = z.read("rescue-cell-proof/summary.json")
          if hashlib.sha256(ledger_raw).hexdigest() != "851321556a2d65ec53c4887decf3f50e5d75e1a8855ee29af3d21569806275ab":
              raise SystemExit("source_free_ledger_identity_mismatch")
          if hashlib.sha256(summary_raw).hexdigest() != "c278f10723f80f0ee251b35f80056e1da37a3b2032a85de3cbcb4c8d27ff39ff":
              raise SystemExit("source_free_corpus_receipt_identity_mismatch")
          accepted = json.loads(summary_raw)
          if (accepted.get("source_artifact_id") != 11038217075
                  or accepted.get("source_archive_sha256") != "687f1a5a5225e41344814a671cccd3ed9073203e5244c13a768baff566ea288e"
                  or accepted.get("source_free") is not True
                  or accepted.get("source_immutable") is not True
                  or accepted.get("exact_input_count") != 1050):
              raise SystemExit("untrusted_real_corpus_proof")
          ledger = json.loads(ledger_raw)
          receipt, uncovered = source_free_sha_overlap(DEFAULT_AUTHORITY, ledger)
          if (receipt["authority_count"] != 1556
                  or receipt["authority_digest_sha256"] != "950af4b1a1346168a55835b80bda062bbe1ebf9d926a4c5dc92a3d8bdb855073"
                  or receipt["evidence_count"] != 1050
                  or receipt["covered_in_evidence"] != 1050
                  or receipt["outside_authority"] != 0
                  or receipt["not_covered_by_evidence"] != 506
                  or len(uncovered) != 506):
              raise SystemExit("sha_authority_overlap_regression")
          output = Path(os.environ["RUNNER_TEMP"])
          (output / "source-free-sha-overlap-1556-v1.json").write_text(
              json.dumps(receipt, sort_keys=True, indent=2) + "\n", encoding="ascii"
          )
          (output / "uncovered-506.sha256.txt").write_text(
              "".join(sha + "\n" for sha in uncovered), encoding="ascii"
          )
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-free-sha-overlap-1556-v1
          path: |
            ${{ runner.temp }}/source-free-sha-overlap-1556-v1.json
            ${{ runner.temp }}/uncovered-506.sha256.txt
          if-no-files-found: warn
          retention-days: 7

  public-originals-2:
    name: Verify 2 previously uncovered public original PUB via real Replay
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Reacquire two SHA-pinned public Apache POI originals privately on runner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/rescue-real-originals/sources"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            "https://raw.githubusercontent.com/apache/poi/trunk/test-data/publisher/SampleBrochure.pub" \
            -o "$RUNNER_TEMP/rescue-real-originals/sources/ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87.pub"
          curl --fail --location --silent --show-error --retry 2 --max-time 60 \
            "https://raw.githubusercontent.com/apache/poi/trunk/test-data/publisher/SampleNewsletter.pub" \
            -o "$RUNNER_TEMP/rescue-real-originals/sources/6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf.pub"
          printf '%s\n' \
            'ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87  '"$RUNNER_TEMP/rescue-real-originals/sources/ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87.pub" \
            '6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf  '"$RUNNER_TEMP/rescue-real-originals/sources/6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf.pub" \
            | sha256sum --check --status
      - name: Existing CFB exporter + independent verifier on real original byte sources
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, sys
          from pathlib import Path
          from tools.rescue_corpus_replay_v1 import DEFAULT_AUTHORITY, load_authority, sha_file
          root = Path(os.environ["RUNNER_TEMP"]) / "rescue-real-originals"
          source = root / "sources"
          output = root / "output"
          expected = {
              "ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87",
              "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf",
          }
          assert expected <= set(load_authority(DEFAULT_AUTHORITY))
          assert {p.stem for p in source.glob("*.pub")} == expected
          before = {p.stem: sha_file(p) for p in source.glob("*.pub")}
          assert before == {sha: sha for sha in expected}
          command = [sys.executable, "tools/rescue_corpus_replay_v1.py",
                     "--root", str(source), "--output", str(output)]
          def replay():
              completed = subprocess.run(command, capture_output=True, check=False, timeout=480)
              if completed.returncode != 1 or not (output / "summary.json").exists():
                  # This CLI reports an incomplete 1556-authority replay as exit=1.
                  raise SystemExit("untrusted_real_replay_execution")
              return json.loads((output / "summary.json").read_text(encoding="utf-8"))
          first = replay()
          if (first["authority_count"] != 1556 or first["counts"].get("extracted") != 2
                  or first["counts"].get("missing") != 1554):
              raise SystemExit("real_original_extraction_or_denominator_failed")
          second = replay()
          if (second["counts"].get("reused") != 2
                  or second["counts"].get("missing") != 1554
                  or any(e["status"] != "reused" for e in second["entries"]
                         if e["source_sha256"] in expected)
                  or {p.stem: sha_file(p) for p in source.glob("*.pub")} != before):
              raise SystemExit("real_original_immutable_reuse_failed")
          streams = sum(e["verified_streams"] for e in second["entries"]
                        if e["source_sha256"] in expected)
          if streams < 1:
              raise SystemExit("real_originals_no_independently_verified_cfb_streams")
          receipt = {
              "schema": "chaptera.rescue-corpus-public-originals-two.v1",
              "source_free": True,
              "authority_sha_count": 1556,
              "physical_originals_verified": 2,
              "source_sha256": sorted(expected),
              "verified_streams": streams,
              "restart_reused": 2,
              "source_immutable": True,
              "status": "partial_2_of_1556_not_full_corpus",
              "native_pub_repaired": False,
          }
          path = Path(os.environ["RUNNER_TEMP"]) / "rescue-public-originals-two-receipt.json"
          path.write_text(json.dumps(receipt, sort_keys=True, indent=2) + "\n",
                          encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-source-free-public-originals-two
          path: ${{ runner.temp }}/rescue-public-originals-two-receipt.json
          if-no-files-found: warn
          retention-days: 7

  public-training-6:
    name: Verify 6 pinned training archive PUB via real Replay
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Acquire exactly pinned INTUIT Publisher practice archive privately
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error --retry 2 --max-time 75 \
            "https://intuit.ru/upload/lections/course/228/1/publisher.zip" \
            -o "$RUNNER_TEMP/rescue-publisher2002-original.zip"
          printf '%s  %s\n' \
            "29bf94cc61e081fff50031945750465de233234991aab3f79995f6edd2f1e261" \
            "$RUNNER_TEMP/rescue-publisher2002-original.zip" | sha256sum --check --status
      - name: Reverify six real originals against registered SHA and replay source-safely
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, json, os, subprocess, sys, tempfile
          from pathlib import Path
          from zipfile import ZipFile
          from tools.rescue_corpus_replay_v1 import DEFAULT_AUTHORITY, load_authority, sha_file

          receipt_meta = json.loads(Path("tools/corpus/receipts/publisher2002-sbs-06-input-2026-09-25.json").read_text(encoding="utf-8"))
          expected = {f["filename"]: f["sha256"] for f in receipt_meta["files"]}
          if len(expected) != 6 or len(set(expected.values())) != 6:
              raise SystemExit("untrusted_publisher2002_authority")
          if not set(expected.values()) <= set(load_authority(DEFAULT_AUTHORITY)):
              raise SystemExit("publisher2002_not_in_current_authority")
          carrier = Path(os.environ["RUNNER_TEMP"]) / "rescue-publisher2002-original.zip"
          source = Path(os.environ["RUNNER_TEMP"]) / "publisher2002-originals"
          output = Path(os.environ["RUNNER_TEMP"]) / "publisher2002-bundles"
          source.mkdir()
          with ZipFile(carrier) as archive:
              pubs = [info for info in archive.infolist()
                      if info.filename.lower().endswith(".pub") and not info.is_dir()]
              if len(pubs) != 6 or len(archive.infolist()) > 256:
                  raise SystemExit("unexpected_publisher2002_archive_members")
              admitted = set()
              for info in pubs:
                  filename = info.filename.split("/")[-1]
                  if (filename not in expected or filename in admitted
                          or info.file_size < 8 or info.file_size > 8 * 1024 * 1024
                          or ((info.external_attr >> 16) & 0o170000) == 0o120000):
                      raise SystemExit("unsafe_or_unexpected_publisher2002_member")
                  data = archive.read(info)
                  actual = hashlib.sha256(data).hexdigest()
                  if actual != expected[filename] or data[:8] != bytes.fromhex("d0cf11e0a1b11ae1"):
                      raise SystemExit("publisher2002_source_bytes_changed")
                  (source / (actual + ".pub")).write_bytes(data)
                  admitted.add(filename)
          if admitted != set(expected):
              raise SystemExit("publisher2002_coverage_incomplete")
          initial_hashes = {p.stem: sha_file(p) for p in source.glob("*.pub")}
          assert set(initial_hashes) == set(expected.values())
          command = [sys.executable, "tools/rescue_corpus_replay_v1.py",
                     "--root", str(source), "--output", str(output)]
          def replay():
              proc = subprocess.run(command, capture_output=True, check=False, timeout=480)
              if proc.returncode != 1 or not (output / "summary.json").exists():
                  raise SystemExit("publisher2002_replay_untrusted_exit")
              return json.loads((output / "summary.json").read_text(encoding="utf-8"))
          first = replay()
          if first["authority_count"] != 1556 or first["counts"] != {"extracted": 6, "missing": 1550}:
              raise SystemExit("publisher2002_extraction_or_denominator_failed")
          second = replay()
          if (second["counts"] != {"missing": 1550, "reused": 6}
                  or {p.stem: sha_file(p) for p in source.glob("*.pub")} != initial_hashes):
              raise SystemExit("publisher2002_reuse_or_source_integrity_failed")
          streams = sum(e["verified_streams"] for e in second["entries"]
                        if e["source_sha256"] in set(expected.values()))
          if streams < 6:
              raise SystemExit("publisher2002_no_verified_stream_evidence")
          receipt = {
              "schema": "chaptera.rescue-corpus-public-training-six.v1",
              "source_free": True,
              "authority_count": 1556,
              "physical_originals_verified": 6,
              "source_sha256": sorted(expected.values()),
              "verified_streams": streams,
              "restart_reused": 6,
              "source_immutable": True,
              "status": "partial_6_of_1556_not_full_corpus",
              "native_pub_repaired": False,
          }
          (Path(os.environ["RUNNER_TEMP"]) / "rescue-public-training-six-receipt.json").write_text(
              json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          print(json.dumps(receipt, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: rescue-source-free-public-training-six
          path: ${{ runner.temp }}/rescue-public-training-six-receipt.json
          if-no-files-found: warn
          retention-days: 7
