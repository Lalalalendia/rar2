name: Editor Desktop Page Nav Shortcuts V1

on:
  pull_request:
    paths:
      - "apps/chaptera-desktop/src/page_navigation.rs"
      - "apps/chaptera-desktop/src/page_navigation_gui_tests.rs"
      - ".github/workflows/editor-desktop-page-nav-shortcuts-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Format page navigation Desktop slice
        run: cargo fmt --manifest-path apps/chaptera-desktop/Cargo.toml -- --check

      - name: Check page navigation Desktop integration
        run: cargo check -p chaptera-desktop --all-targets

      - name: Clippy page navigation Desktop integration
        run: >-
          cargo clippy -p chaptera-desktop --all-targets --
          -D warnings
          -A dead_code
          -A unused_variables
          -A clippy::type_complexity
          -A clippy::collapsible_if
          -A clippy::too_many_arguments

  gui-real-pub:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt

      - name: Acquire pinned Apache POI SampleNewsletter
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          $url = "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub"
          Invoke-WebRequest -Uri $url -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $fixture).Length
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $hash"
          }
          if ($bytes -ne 291840) {
            throw "SampleNewsletter byte length mismatch: $bytes"
          }
          "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove Ctrl PageUp PageDown page navigation
        run: >-
          cargo test -p chaptera-desktop
          gui_ctrl_page_shortcuts_reuse_canonical_page_navigation_without_revision
          -- --ignored --nocapture

      - name: Prove real GUI customer-page reorder
        run: >-
          cargo test -p chaptera-desktop
          gui_move_page_command_commits_one_reorder_and_replays_on_real_pub
          -- --ignored --nocapture
