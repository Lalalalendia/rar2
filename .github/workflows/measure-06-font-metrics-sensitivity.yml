name: MEASURE exact 06 font metrics sensitivity

on:
  push:
    branches:
      - "measure/06-font-metrics-sensitivity-01"
    paths:
      - ".github/workflows/measure-06-font-metrics-sensitivity.yml"
      - "apps/cloud-reader/real-browser.test.mjs"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/publisher-visual-supplemental-rust

jobs:
  exact-06:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build supplemental Cargo cache key
        id: cargo-key
        env:
          MANIFEST_HASH: ${{ hashFiles('Cargo.toml', 'Cargo.lock', 'apps/chaptera-server/Cargo.toml', 'crates/**/Cargo.toml', 'vendor/producer-a/Cargo.toml', 'vendor/producer-a/Cargo.lock', 'vendor/producer-a/crates/**/Cargo.toml') }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST_HASH"
          echo "key=publisher-visual-supplemental-rust-v1-${RUNNER_OS}-rust-1.94.1-${MANIFEST_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore existing Cargo build cache only
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/publisher-visual-supplemental-rust
          key: ${{ steps.cargo-key.outputs.key }}

      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Prepare exact 06 fixture only
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "Pillow==12.3.0"
          root="$RUNNER_TEMP/exact06-fonts"
          rm -rf "$root"
          mkdir -p "$root"
          python tools/cloud_reader_visual_supplemental_v1.py prepare \
            tools/corpus/receipts/publisher-visual-golden-supplemental-2026-10-06-pairs.csv \
            out/pinned1050/materialized/native \
            "$root/fixtures" \
            "$root/manifest.json"
          python - "$root/manifest.json" <<'PY'
          import json, sys
          from pathlib import Path
          path = Path(sys.argv[1])
          data = json.loads(path.read_text())
          rows = [row for row in data["fixtures"] if row["name"] == "06-modern2c-image-heavy"]
          assert len(rows) == 1, rows
          data["fixtures"] = rows
          path.write_text(json.dumps(data, indent=2, sort_keys=True) + "\n")
          PY
          test "$(sha256sum "$root/fixtures/06-modern2c-image-heavy.pub" | awk '{print $1}')" = "059dde4bcb408374f14273275febd8158dc8d02960966488dd4324cfd4dcc238"

      - name: Build canonical Cloud Reader worker
        run: |
          set -euo pipefail
          cargo build -p chaptera-server --bin chaptera --jobs 2

      - name: Restore pinned Playwright Chromium cache only
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: publisher-visual-supplemental-${{ runner.os }}-playwright-1.55.0-chromium

      - name: Install pinned browser runtime
        run: |
          set -euo pipefail
          npm install --no-save playwright@1.55.0
          npx playwright install chromium

      - name: Install metric-compatible sensitivity fonts
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fonts-urw-base35
          fc-cache -f
          fc-match 'P052:style=Roman'
          fc-match 'URW Bookman:style=Light'

      - name: Build explicit sensitivity font registries
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/exact06-fonts"
          mkdir -p "$root/registry-antiqua" "$root/registry-both"

          antiqua_line="$(fc-match -f '%{file}|%{family}\n' 'P052:style=Roman' | head -n 1)"
          antiqua_file="${antiqua_line%%|*}"
          antiqua_family="${antiqua_line#*|}"
          echo "FONT_SENSITIVITY_CANDIDATE role=BookAntiqua actual_family=$antiqua_family file=$antiqua_file"
          test -f "$antiqua_file"
          case "$antiqua_family" in
            *"P052"*) ;;
            *) echo "P052 candidate unavailable" >&2; exit 1 ;;
          esac

          bookman_line="$(fc-match -f '%{file}|%{family}\n' 'URW Bookman:style=Light' | head -n 1)"
          bookman_file="${bookman_line%%|*}"
          bookman_family="${bookman_line#*|}"
          echo "FONT_SENSITIVITY_CANDIDATE role=BookmanOldStyle actual_family=$bookman_family file=$bookman_file"
          test -f "$bookman_file"
          case "$bookman_family" in
            *"URW Bookman"*) ;;
            *) echo "URW Bookman candidate unavailable" >&2; exit 1 ;;
          esac

          case "$antiqua_file" in *.otf) antiqua_mime="font/otf";; *.ttf) antiqua_mime="font/ttf";; *) echo "Unsupported P052 font extension" >&2; exit 1;; esac
          case "$bookman_file" in *.otf) bookman_mime="font/otf";; *.ttf) bookman_mime="font/ttf";; *) echo "Unsupported Bookman font extension" >&2; exit 1;; esac

          antiqua_ext="${antiqua_file##*.}"
          bookman_ext="${bookman_file##*.}"
          cp "$antiqua_file" "$root/registry-antiqua/book-antiqua.$antiqua_ext"
          cp "$antiqua_file" "$root/registry-both/book-antiqua.$antiqua_ext"
          cp "$bookman_file" "$root/registry-both/bookman-old-style.$bookman_ext"
          antiqua_sha="$(sha256sum "$antiqua_file" | awk '{print $1}')"
          bookman_sha="$(sha256sum "$bookman_file" | awk '{print $1}')"

          python - "$root" "$antiqua_sha" "$bookman_sha" "$antiqua_mime" "$bookman_mime" "$antiqua_ext" "$bookman_ext" <<'PY'
          import json, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          antiqua_sha, bookman_sha, antiqua_mime, bookman_mime, antiqua_ext, bookman_ext = sys.argv[2:8]
          protocol = "chaptera.reader-configured-font-manifest.v1"
          antiqua = {
              "source_family": "Book Antiqua",
              "expected_sha256": antiqua_sha,
              "face_index": 0,
              "mime": antiqua_mime,
              "file_name": f"book-antiqua.{antiqua_ext}",
          }
          bookman = {
              "source_family": "Bookman Old Style",
              "expected_sha256": bookman_sha,
              "face_index": 0,
              "mime": bookman_mime,
              "file_name": f"bookman-old-style.{bookman_ext}",
          }
          (root / "registry-antiqua" / "manifest.json").write_text(
              json.dumps({"protocol_version": protocol, "resources": [antiqua]}, indent=2, sort_keys=True) + "\n"
          )
          (root / "registry-both" / "manifest.json").write_text(
              json.dumps({"protocol_version": protocol, "resources": [antiqua, bookman]}, indent=2, sort_keys=True) + "\n"
          )
          print("EXACT06_FONT_REGISTRY " + json.dumps({
              "book_antiqua_candidate_sha256": antiqua_sha,
              "bookman_candidate_sha256": bookman_sha,
              "book_antiqua_mime": antiqua_mime,
              "bookman_mime": bookman_mime,
          }, sort_keys=True))
          PY

      - name: Render exact 06 baseline
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.sha }}
          READER_CORPUS_DIAGNOSTIC: "1"
          READER_WORKER_BINARY: ${{ github.workspace }}/target/publisher-visual-supplemental-rust/debug/chaptera
          READER_REAL_MANIFEST: ${{ runner.temp }}/exact06-fonts/manifest.json
          READER_REAL_OUTPUT: ${{ runner.temp }}/exact06-fonts/browser-baseline
          READER_REFERENCE_RASTER_DPI: "144"
          READER_CONTINUE_WORKER_FAILURES: "1"
          READER_WORKER_TIMEOUT_SECONDS: "120"
          READER_WORKER_CPU_SECONDS: "90"
          READER_WORKER_ADDRESS_SPACE_MB: "768"
        run: node apps/cloud-reader/real-browser.test.mjs

      - name: Render exact 06 Book Antiqua-like arm
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.sha }}
          READER_CORPUS_DIAGNOSTIC: "1"
          READER_FONT_REGISTRY: ${{ runner.temp }}/exact06-fonts/registry-antiqua/manifest.json
          READER_WORKER_BINARY: ${{ github.workspace }}/target/publisher-visual-supplemental-rust/debug/chaptera
          READER_REAL_MANIFEST: ${{ runner.temp }}/exact06-fonts/manifest.json
          READER_REAL_OUTPUT: ${{ runner.temp }}/exact06-fonts/browser-antiqua
          READER_REFERENCE_RASTER_DPI: "144"
          READER_CONTINUE_WORKER_FAILURES: "1"
          READER_WORKER_TIMEOUT_SECONDS: "120"
          READER_WORKER_CPU_SECONDS: "90"
          READER_WORKER_ADDRESS_SPACE_MB: "768"
        run: node apps/cloud-reader/real-browser.test.mjs

      - name: Render exact 06 both-family arm
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.sha }}
          READER_CORPUS_DIAGNOSTIC: "1"
          READER_FONT_REGISTRY: ${{ runner.temp }}/exact06-fonts/registry-both/manifest.json
          READER_WORKER_BINARY: ${{ github.workspace }}/target/publisher-visual-supplemental-rust/debug/chaptera
          READER_REAL_MANIFEST: ${{ runner.temp }}/exact06-fonts/manifest.json
          READER_REAL_OUTPUT: ${{ runner.temp }}/exact06-fonts/browser-both
          READER_REFERENCE_RASTER_DPI: "144"
          READER_CONTINUE_WORKER_FAILURES: "1"
          READER_WORKER_TIMEOUT_SECONDS: "120"
          READER_WORKER_CPU_SECONDS: "90"
          READER_WORKER_ADDRESS_SPACE_MB: "768"
        run: node apps/cloud-reader/real-browser.test.mjs

      - name: Compare exact 06 three-arm sensitivity
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/exact06-fonts" <<'PY'
          import json, sys
          from pathlib import Path
          sys.path.insert(0, "tools")
          from cloud_reader_visual_fingerprint_v1 import compare_grid, image_grid, reference_grid

          root = Path(sys.argv[1])
          ref = json.loads(Path(
              "tools/corpus/receipts/publisher-visual-golden-supplemental-reference-available-2026-10-06-fingerprint-v1.json"
          ).read_text())
          pair = [x for x in ref["pairs"] if x["basename"] == "06-modern2c-image-heavy"][0]
          assert len(pair["pages"]) == 1, len(pair["pages"])

          metrics = {}
          for arm in ["baseline", "antiqua", "both"]:
              browser = root / f"browser-{arm}"
              receipt = json.loads((browser / "receipt.json").read_text())
              result = [x for x in receipt["results"] if x["fixture"] == "06-modern2c-image-heavy"][0]
              assert result["rendered"] is True
              assert len(result["screenshots"]) == 1
              codes = result["diagnostic_codes"]
              print("EXACT06_FONT_DIAGNOSTICS arm=" + arm + " codes=" + json.dumps(codes, sort_keys=True))
              row = compare_grid(
                  image_grid(browser / result["screenshots"][0]["filename"]),
                  reference_grid(pair["pages"][0]),
              )
              metrics[arm] = row
              print(
                  "EXACT06_FONT_SENSITIVITY "
                  f"arm={arm} changed={row['changed_cell_fraction']:.12f} "
                  f"mean_abs_channel_delta={row['mean_abs_channel_delta']:.12f}"
              )

          base = metrics["baseline"]["changed_cell_fraction"]
          antiqua = metrics["antiqua"]["changed_cell_fraction"]
          both = metrics["both"]["changed_cell_fraction"]
          print(
              "EXACT06_FONT_INCREMENT "
              f"baseline_to_antiqua={antiqua-base:+.12f} "
              f"antiqua_to_both={both-antiqua:+.12f} "
              f"baseline_to_both={both-base:+.12f}"
          )
          PY
