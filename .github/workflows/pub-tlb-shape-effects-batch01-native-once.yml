name: PUB T891 shape-effects native once

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/pub-tlb-shape-effects-batch01-native-once.yml

permissions:
  contents: read

concurrency:
  group: pub-t891-shape-effects-native-once
  cancel-in-progress: false

env:
  PUB_RESEARCH_PACKET: tools/research-runner/experiments/pub-tlb-shape-effects-batch01.packet.json
  PUB_RESEARCH_ENVIRONMENT: publisher-2019

jobs:
  validate-packet:
    runs-on: windows-latest
    outputs:
      packet_sha256: ${{ steps.packet.outputs.packet_sha256 }}
      experiment_id: ${{ steps.packet.outputs.experiment_id }}
      trusted_sha: ${{ steps.trust.outputs.trusted_sha }}
    steps:
      - name: Pin main push
        id: trust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "T891 native run is main-only."
          }
          "trusted_sha=${{ github.sha }}" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate exact packet
        id: packet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/research-runner/validate_packet.py `
            --packet "$env:PUB_RESEARCH_PACKET" `
            --expected-environment "$env:PUB_RESEARCH_ENVIRONMENT" |
            Tee-Object -FilePath packet-validation.json
          $doc = Get-Content packet-validation.json -Raw | ConvertFrom-Json
          if ([string]$doc.id -ne "PUB-TLB-SHAPE-EFFECTS-BATCH01") {
            throw "Unexpected experiment id: $($doc.id)"
          }
          "packet_sha256=$($doc.packet_sha256)" >> $env:GITHUB_OUTPUT
          "experiment_id=$($doc.id)" >> $env:GITHUB_OUTPUT

      - name: Upload packet validation
        uses: actions/upload-artifact@v4
        with:
          name: pub-t891-packet-validation-${{ github.run_id }}
          path: packet-validation.json
          retention-days: 30

  native-experiment:
    needs: validate-packet
    if: github.ref == 'refs/heads/main'
    environment: pub-native-lab
    runs-on:
      - self-hosted
      - Windows
      - pub-research
      - publisher-2019
    timeout-minutes: 45
    env:
      PUB_RESEARCH_PACKET_SHA256: ${{ needs.validate-packet.outputs.packet_sha256 }}
      PUB_RESEARCH_OUTPUT: ${{ github.workspace }}\out\pub-research\${{ github.run_id }}
      PUB_RESEARCH_PROFILE_ID: publisher-2019
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.validate-packet.outputs.trusted_sha }}
          clean: true
          persist-credentials: false

      - name: Verify exact trusted checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $actual = (git rev-parse HEAD).Trim()
          $expected = "${{ needs.validate-packet.outputs.trusted_sha }}"
          if ($actual -ne $expected) {
            throw "Trusted checkout mismatch: expected $expected got $actual"
          }

      - name: Validate packet again on native runner
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/research-runner/validate_packet.py `
            --packet "$env:PUB_RESEARCH_PACKET" `
            --expected-environment "$env:PUB_RESEARCH_ENVIRONMENT" |
            Out-File -Encoding utf8 "$env:RUNNER_TEMP\packet-validation-native.json"

      - name: Verify Publisher environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path $env:PUB_RESEARCH_OUTPUT | Out-Null
          pwsh -NoProfile -File tools/research-runner/prepare_native_run.ps1 `
            -PacketPath "$env:PUB_RESEARCH_PACKET" `
            -OutputRoot "$env:PUB_RESEARCH_OUTPUT"

      - name: Run T891 bounded batch
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packet = Get-Content $env:PUB_RESEARCH_PACKET -Raw | ConvertFrom-Json
          if ([string]$packet.id -ne "PUB-TLB-SHAPE-EFFECTS-BATCH01") {
            throw "Unexpected packet id."
          }
          $script = Join-Path "${{ github.workspace }}" $packet.operation.script
          & pwsh -NoProfile -File $script `
            -PacketPath "$env:PUB_RESEARCH_PACKET" `
            -OutputRoot "$env:PUB_RESEARCH_OUTPUT"
          if ($LASTEXITCODE -ne 0) {
            throw "Experiment failed with exit code $LASTEXITCODE"
          }

      - name: Validate evidence bundle
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          pwsh -NoProfile -File tools/research-runner/finalize_native_run.ps1 `
            -PacketPath "$env:PUB_RESEARCH_PACKET" `
            -OutputRoot "$env:PUB_RESEARCH_OUTPUT"

      - name: Write summary
        if: always()
        shell: pwsh
        run: |
          "## PUB T891 native shape-effects batch" >> $env:GITHUB_STEP_SUMMARY
          "" >> $env:GITHUB_STEP_SUMMARY
          "- Packet: $env:PUB_RESEARCH_PACKET" >> $env:GITHUB_STEP_SUMMARY
          "- Environment: $env:PUB_RESEARCH_ENVIRONMENT" >> $env:GITHUB_STEP_SUMMARY
          "- Packet SHA-256: $env:PUB_RESEARCH_PACKET_SHA256" >> $env:GITHUB_STEP_SUMMARY
          "- Trusted source SHA: ${{ needs.validate-packet.outputs.trusted_sha }}" >> $env:GITHUB_STEP_SUMMARY

      - name: Upload public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-research-evidence-${{ needs.validate-packet.outputs.experiment_id }}-${{ github.run_id }}
          path: |
            out/pub-research/${{ github.run_id }}/environment.json
            out/pub-research/${{ github.run_id }}/evidence-manifest.json
            out/pub-research/${{ github.run_id }}/logs/**
            out/pub-research/${{ github.run_id }}/analysis/**
          if-no-files-found: error
          retention-days: 30
