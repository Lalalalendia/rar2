name: CI-DEV-FAST-LOOP-01 self-test

on:
  pull_request:
    paths:
      - "tools/dev_fast_loop.py"
      - "tools/test_dev_fast_loop.py"
      - "tools/dev_fast_loop_components.json"
      - "docs/dev-fast-loop.md"
      - ".github/workflows/dev-fast-loop-selftest.yml"
      - ".github/workflows/ci-local-dev-transport-01.yml"
      - "tools/ci/local_dev_transport.py"
      - "tools/ci/test_local_dev_transport.py"
      - "docs/ci-local-dev-transport-01.md"
      - "tools/ci/local_dev_handoff.py"
      - "tools/ci/test_local_dev_handoff.py"
      - "docs/ci-local-dev-handoff-01.md"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Unit-test fast-loop routing
        run: python tools/test_dev_fast_loop.py
      - name: Unit-test isolated Windows dev transport without a self-hosted runner
        run: |
          python -m py_compile tools/ci/local_dev_transport.py
          python -m unittest discover -s tools/ci -p test_local_dev_transport.py
      - name: Unit-test opt-in local task handoff with disposable Git remotes
        run: |
          python -m py_compile tools/ci/local_dev_handoff.py
          python -m unittest discover -s tools/ci -p test_local_dev_handoff.py
      - name: Prove a bounded self-plan
        run: |
          python tools/dev_fast_loop.py \
            --paths tools/dev_fast_loop.py tools/test_dev_fast_loop.py tools/dev_fast_loop_components.json \
            --plan
