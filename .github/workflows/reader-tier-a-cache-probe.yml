name: CONTROL Reader Tier A cache probe

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-reader/CI_TIER_A_CACHE_PROBE.md"
      - ".github/workflows/reader-tier-a-cache-probe.yml"
      - ".github/workflows/reader-consumer-preflight.yml"

permissions:
  contents: read

concurrency:
  group: control-reader-tier-a-cache-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tier-a:
    uses: ./.github/workflows/reader-consumer-preflight.yml
