name: Build DGG TextBox oracle Windows artifact

on:
  pull_request:
    paths:
      - ".github/workflows/build-dgg-textbox-oracle-windows.yml"
      - "vendor/producer-a/**"
      - "crates/pub-plccmob-projection/**"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.85.0"
      - name: Build oracle helper
        shell: pwsh
        run: |
          cargo build --locked --release --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --bin dgg_textbox_oracle_tool
          $exe = "vendor/producer-a/target/release/dgg_textbox_oracle_tool.exe"
          if (-not (Test-Path -LiteralPath $exe)) { throw "oracle helper exe missing" }
          Get-FileHash -Algorithm SHA256 -LiteralPath $exe | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: dgg-textbox-oracle-windows-x64
          path: vendor/producer-a/target/release/dgg_textbox_oracle_tool.exe
          if-no-files-found: error
          retention-days: 7
