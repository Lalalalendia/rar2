name: Migration PDF worker isolation V1

on:
  pull_request:
    paths:
      - "tools/migration_pdf_worker_isolation.py"
      - "tools/test_migration_pdf_worker_isolation.py"
      - "tools/run_product_isolation_security_probe.py"
      - ".github/workflows/migration-pdf-worker-isolation.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  linux-isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify libseccomp is available
        run: |
          python - <<'PY'
          import ctypes.util
          name = ctypes.util.find_library("seccomp")
          assert name, "libseccomp is required for network default-deny"
          print(name)
          PY
      - name: Run per-file isolation regressions
        run: python tools/test_migration_pdf_worker_isolation.py -v
      - name: Prove Product wiring consumes this exact isolation authority
        run: |
          python tools/run_product_isolation_security_probe.py \
            --output target/product-security-isolation/receipt.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: migration-product-isolation-security-receipt-v1
          path: target/product-security-isolation/receipt.json
          if-no-files-found: error
          retention-days: 90
