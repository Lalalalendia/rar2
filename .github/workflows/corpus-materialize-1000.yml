name: CORPUS materialize 1000+

on:
  workflow_dispatch:
  push:
    branches:
      - corpus/materialize-1000
    paths:
      - 'tools/corpus/pub_container_extract.py'
      - 'tools/corpus/materialize_corpus_1000.py'
      - 'tools/corpus/test_materialize_corpus_1000.py'
      - 'tools/corpus/materialization_container_first_wave.csv'
      - 'tools/corpus/receipts/container-first-wave-425-2026-09-29.json'
      - 'tools/corpus/receipts/current-rar-1556.sha256.txt'
      - '.github/workflows/corpus-materialize-1000.yml'

permissions:
  contents: read

concurrency:
  group: corpus-materialize-1000-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Checkout current 625-file materialized donor
        uses: actions/checkout@v4
        with:
          repository: Lalalalendia/lalamu
          ref: main
          path: _donor/lalamu
          sparse-checkout: |
            pub-corpus/corpus
          sparse-checkout-cone-mode: true

      - name: Install archive reader
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y p7zip-full

      - name: Offline validation
        run: |
          set -euo pipefail
          python -m py_compile             tools/corpus/pub_container_extract.py             tools/corpus/materialize_corpus_1000.py             tools/corpus/test_materialize_corpus_1000.py
          python tools/corpus/test_pub_container_extract.py
          python tools/corpus/test_materialize_corpus_1000.py

      - name: Rehydrate pinned 425-SHA historical container wave
        run: |
          set -euo pipefail
          mkdir -p out/container/pub
          python tools/corpus/pub_container_extract.py             --seed tools/corpus/materialization_container_first_wave.csv             --out out/container/manifest.json             --materialize-dir out/container/pub             --max-containers 3             --max-container-bytes 200000000             --max-member-bytes 104857600             --max-total-expanded 1073741824             --max-members 600             --max-depth 2             --timeout 45             --command-timeout 90

      - name: Verify historical first-wave identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          expected_count=425
          expected_digest="b844102681a9f4458aa9e723843d645e5aae6e6b8bd0b70d631e7ae0be9bc8ef"
          paths=sorted(Path("out/container/pub").glob("*.pub"))
          shas=[p.stem.casefold() for p in paths]
          digest=hashlib.sha256("".join(x+"\n" for x in shas).encode("ascii")).hexdigest()
          summary=json.loads(Path("out/container/manifest.summary.json").read_text())
          assert len(shas)==expected_count,(len(shas),summary)
          assert summary["publisher_cfb_unique_sha256"]==expected_count,summary
          assert digest==expected_digest,(digest,expected_digest)
          print(json.dumps({"publisher_unique_sha256":len(shas),"sha_list_digest":"sha256:"+digest},indent=2))
          PY

      - name: Build strict 1000+ corpus
        run: |
          set -euo pipefail
          python tools/corpus/materialize_corpus_1000.py             --input lalamu_625=_donor/lalamu/pub-corpus/corpus             --input historical_container_first_wave=out/container/pub             --authority tools/corpus/receipts/current-rar-1556.sha256.txt             --out out/materialized             --min-count 1000
          cat out/materialized/summary.json

      - name: Upload materialized corpus and receipts
        uses: actions/upload-artifact@v4
        with:
          name: pub-corpus-1000-${{ github.run_id }}
          path: |
            out/materialized/native/**
            out/materialized/manifest.json
            out/materialized/sha256.txt
            out/materialized/summary.json
            out/materialized/rejections.json
            out/container/manifest.json
            out/container/manifest.summary.json
          if-no-files-found: error
          retention-days: 30
