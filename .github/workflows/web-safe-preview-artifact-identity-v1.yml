name: WEB-RESOURCE-SCHEDULER-01 SafePreview artifact identity

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/safe_preview_scene.rs"
      - ".github/workflows/web-safe-preview-artifact-identity-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  host-artifact-identity:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Use repository Rust MSRV
        run: rustup toolchain install 1.94.1 --profile minimal
      - name: Test bounded SafePreview host encoding and artifact hashes
        run: cargo +1.94.1 test -p chaptera-server --lib safe_preview_scene::tests
