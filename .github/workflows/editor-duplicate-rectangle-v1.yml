name: Editor Duplicate Rectangle V1

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-editor/**"
      - "!vendor/producer-a/crates/pub-editor/src/session_table.rs"
      - "!vendor/producer-a/crates/pub-editor/src/session_image.rs"
      - "!vendor/producer-a/crates/pub-editor/src/session_text.rs"
      - "!vendor/producer-a/crates/pub-editor/tests/story_text_session_v1.rs"
      - "vendor/producer-a/crates/pub-editor/src/duplicate_authored_rectangle_v1.rs"
      - "vendor/producer-a/crates/pub-editor/src/lib.rs"
      - "vendor/producer-a/crates/pub-editor/tests/duplicate_authored_rectangle_v1.rs"
      - "apps/chaptera-desktop/src/duplicate_rectangle.rs"
      - "apps/chaptera-desktop/src/duplicate_rectangle_gui_tests.rs"
      - "tools/ci/pub_editor_pr_fanout.py"
      - ".github/workflows/editor-duplicate-rectangle-v1.yml"
  push:
    branches:
      - editor-desktop-duplicate-restore-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pub-editor Duplicate Rectangle scope
    runs-on: ubuntu-latest
    outputs:
      duplicate_rectangle: ${{ steps.scope.outputs.duplicate_rectangle }}
      reason: ${{ steps.scope.outputs.duplicate_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      - id: base-authority
        name: Resolve base-branch classifier authority
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch PR head for classification
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Test base-authority pub-editor classifier
        run: python tools/ci/test_pub_editor_pr_fanout.py

      - id: scope
        name: Classify Duplicate Rectangle ownership
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.base-authority.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p target/pub-editor-pr-fanout
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "duplicate_rectangle=true" >> "$GITHUB_OUTPUT"
            echo "duplicate_reason=non_pr_event_fail_closed" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"schema":"chaptera.pub-editor-pr-fanout.v1","duplicate_rectangle":true,"duplicate_reason":"non_pr_event_fail_closed"}' > target/pub-editor-pr-fanout/receipt.json
            exit 0
          fi
          python tools/ci/pub_editor_pr_fanout.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --receipt target/pub-editor-pr-fanout/receipt.json \
            --github-output "$GITHUB_OUTPUT"
          if ! grep -q '^duplicate_rectangle=' "$GITHUB_OUTPUT"; then
            echo "duplicate_rectangle=true" >> "$GITHUB_OUTPUT"
            echo "duplicate_reason=base_classifier_missing_duplicate_output" >> "$GITHUB_OUTPUT"
            python -c 'import json, pathlib; p=pathlib.Path("target/pub-editor-pr-fanout/receipt.json"); d=json.loads(p.read_text()); d["duplicate_rectangle"]=True; d["duplicate_reason"]="base_classifier_missing_duplicate_output"; p.write_text(json.dumps(d, indent=2, sort_keys=True) + "\n")'
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pub-editor-duplicate-rectangle-scope-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/pub-editor-pr-fanout/receipt.json
          if-no-files-found: warn

  core:
    needs: classify
    if: ${{ !cancelled() && always() && (needs.classify.result != 'success' || needs.classify.outputs.duplicate_rectangle == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Check pub-editor formatting
        run: cargo fmt --manifest-path vendor/producer-a/Cargo.toml -p pub-editor -- --check

      - name: Check pub-editor
        run: cargo check --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --all-targets

      - name: Lint pub-editor
        run: cargo clippy --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --all-targets -- -D warnings

      - name: Prove Duplicate Rectangle core
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --test duplicate_authored_rectangle_v1

      - name: Re-prove CreateShape and authored lane runtime
        run: >-
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor
          --test create_shape_runtime_v1
          --test authored_stack_runtime_v1

      - name: Check Desktop Duplicate formatting
        run: cargo fmt --manifest-path apps/chaptera-desktop/Cargo.toml -- --check

      - name: Check Desktop Duplicate integration
        run: cargo check -p chaptera-desktop --all-targets

      - name: Lint Desktop Duplicate integration
        run: >-
          cargo clippy -p chaptera-desktop --all-targets --
          -D warnings
          -A dead_code
          -A unused_variables
          -A clippy::type_complexity
          -A clippy::collapsible_if
          -A clippy::too_many_arguments

  real-gui:
    needs: [classify, core]
    if: ${{ !cancelled() && always() && needs.core.result == 'success' && (needs.classify.result != 'success' || needs.classify.outputs.duplicate_rectangle == 'true') }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Acquire pinned Apache POI SampleNewsletter
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          $url = "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub"
          Invoke-WebRequest -Uri $url -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $fixture).Length
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $hash"
          }
          if ($bytes -ne 291840) {
            throw "SampleNewsletter byte length mismatch: $bytes"
          }
          "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Prove Duplicate through real Desktop GUI
        run: >-
          cargo test -p chaptera-desktop
          gui_duplicate_button_commits_one_create_shape_and_selects_duplicate_on_real_pub
          -- --ignored --nocapture
