name: Partial EscherDelay strict resync probe binary (one-shot)

on:
  push:
    branches:
      - research/partial-escherdelay-census-post1989-once

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build strict resync probe
        run: cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --bin partial-escherdelay-resync-probe --release
      - name: Upload strict resync probe
        uses: actions/upload-artifact@v4
        with:
          name: partial-escherdelay-resync-probe-linux
          path: vendor/producer-a/target/release/partial-escherdelay-resync-probe
          if-no-files-found: error
          retention-days: 1
