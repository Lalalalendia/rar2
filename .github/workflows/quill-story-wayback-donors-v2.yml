name: Quill exact-three Wayback donor sweep

on:
  pull_request:
    paths:
      - ".github/workflows/quill-story-wayback-donors-v2.yml"
      - "tools/research/quill_story_wayback_donors_v2.py"
      - "vendor/producer-a/crates/pub-reader/src/bin/quill-story-lineage-compare.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quill-story-wayback-donors-v2-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/rar2-target

jobs:
  exact-three:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Checkout exact unresolved source witnesses only
        uses: actions/checkout@v5
        with:
          repository: Lalalalendia/lalamu
          ref: f78cc6f455f4dc222868f9cc035511a6ca7a91ea
          path: _witness/lalamu
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            pub-corpus/corpus/native/unclassified/211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157.pub
            pub-corpus/corpus/native/unclassified/9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569.pub
            pub-corpus/corpus/native/unclassified/ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff.pub

      - name: Verify exact source identities
        shell: bash
        run: |
          set -euo pipefail
          root="_witness/lalamu/pub-corpus/corpus/native/unclassified"
          test "$(find "$root" -maxdepth 1 -type f -name '*.pub' | wc -l)" -eq 3
          for path in "$root"/*.pub; do
            sha="$(basename "$path" .pub)"
            echo "${sha}  ${path}" | sha256sum -c -
          done

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Check targeted research surface
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile tools/research/quill_story_wayback_donors_v2.py
          rustfmt --edition 2021 --check             vendor/producer-a/crates/pub-reader/src/bin/quill-story-lineage-compare.rs
          cargo clippy             --manifest-path vendor/producer-a/Cargo.toml             -p pub-reader             --bin quill-story-lineage-compare             -- -D warnings

      - name: Build exact lineage comparator
        run: |
          cargo build             --manifest-path vendor/producer-a/Cargo.toml             -p pub-reader             --bin quill-story-lineage-compare

      - name: Discover and materialize historical Wayback candidates
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/lineage-receipts
          python tools/research/quill_story_wayback_donors_v2.py

      - name: Compare every historical CFB candidate to its exact source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          source_root = Path("_witness/lalamu/pub-corpus/corpus/native/unclassified")
          variants_root = Path("out/wayback-variants")
          receipts_root = Path("out/lineage-receipts")
          binary = Path(os.environ["CARGO_TARGET_DIR"]) / "debug" / "quill-story-lineage-compare"

          rows = []
          for variant in sorted(variants_root.glob("*.pub")):
              source_sha, timestamp, variant_with_ext = variant.name.split("__", 2)
              variant_sha = variant_with_ext[:-4]
              source = source_root / f"{source_sha}.pub"
              receipt_path = receipts_root / f"{source_sha}__{timestamp}__{variant_sha}.json"
              proc = subprocess.run(
                  [str(binary), str(source), str(variant), str(receipt_path)],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
                  check=False,
              )
              if proc.returncode != 0:
                  rows.append({
                      "source_sha256": source_sha,
                      "timestamp": timestamp,
                      "variant_sha256": variant_sha,
                      "compare_status": "rejected",
                  })
                  continue

              receipt = json.loads(receipt_path.read_text())
              rows.append({
                  "source_sha256": source_sha,
                  "timestamp": timestamp,
                  "variant_sha256": variant_sha,
                  "compare_status": "admitted",
                  "source_byte_len": receipt["source_byte_len"],
                  "variant_byte_len": receipt["variant_byte_len"],
                  "contents_story_count_equal": receipt["contents_story_count_equal"],
                  "contents_text_id_order_equal": receipt["contents_text_id_order_equal"],
                  "contents_text_id_set_equal": receipt["contents_text_id_set_equal"],
                  "text_byte_identical": receipt["text_byte_identical"],
                  "source_text_utf16_units": receipt["source_text_utf16_units"],
                  "variant_text_utf16_units": receipt["variant_text_utf16_units"],
                  "source_fdpp_boundary_count": receipt["source_fdpp_boundary_count"],
                  "variant_fdpp_boundary_count": receipt["variant_fdpp_boundary_count"],
                  "variant_ordinary_quill_admitted": receipt["variant_ordinary_quill_admitted"],
                  "variant_quill_story_count": receipt["variant_quill_story_count"],
                  "variant_story_utf16_lengths": receipt["variant_story_utf16_lengths"],
                  "variant_story_end_utf16": receipt["variant_story_end_utf16"],
                  "variant_story_ends_all_in_source_fdpp": receipt["variant_story_ends_all_in_source_fdpp"],
                  "variant_story_ends_close_source_text": receipt["variant_story_ends_close_source_text"],
                  "variant_story_end_source_fdpp_ordinals_zero_based": receipt[
                      "variant_story_end_source_fdpp_ordinals_zero_based"
                  ],
                  "exact_same_document_partition_donor": receipt[
                      "exact_same_document_partition_donor"
                  ],
              })

          exact_donors = [
              row for row in rows
              if row.get("exact_same_document_partition_donor") is True
          ]
          by_source = {}
          for row in rows:
              by_source.setdefault(row["source_sha256"], []).append(row)

          summary = {
              "schema": "chaptera.quill-story-wayback-donor-sweep.v2",
              "candidate_count": len(rows),
              "admitted_compare_count": sum(row["compare_status"] == "admitted" for row in rows),
              "exact_partition_donor_count": len(exact_donors),
              "exact_partition_donor_source_count": len({
                  row["source_sha256"] for row in exact_donors
              }),
              "rows": rows,
              "evidence_boundary": (
                  "exact three unresolved helenhudspith sources only; donor admission requires "
                  "same source TEXT bytes, grounded Contents Story identity/cardinality, ordinary "
                  "historical Quill catalog and historical cumulative Story ends mapping into the "
                  "original source FDPP boundary set; no document text or PUB bytes retained"
              ),
          }
          Path("out/quill-story-wayback-donor-sweep.json").write_text(
              json.dumps(summary, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(summary, indent=2, sort_keys=True))

          materialize = json.loads(Path("out/quill-story-wayback-materialize.json").read_text())
          by_sha = {row["source_sha256"]: row for row in materialize["targets"]}
          for required in (
              "211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157",
              "ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff",
          ):
              assert by_sha[required]["downloaded_cfb_count"] >= 1, required
          PY

      - name: Remove historical PUB bytes before artifact upload
        if: always()
        shell: bash
        run: |
          rm -rf out/wayback-variants _witness

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: quill-story-wayback-donors-v2-${{ github.run_id }}
          path: |
            out/quill-story-wayback-materialize.json
            out/quill-story-wayback-donor-sweep.json
            out/lineage-receipts/*.json
          if-no-files-found: error
          retention-days: 30
