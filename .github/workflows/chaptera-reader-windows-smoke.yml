name: Chaptera Reader Windows Shared-Core Smoke V1

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shared-core-smoke:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      CARGO_TARGET_DIR: target/reader-fidelity-win
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Build Windows fidelity Cargo cache key
        id: fidelity-cache-key
        shell: pwsh
        env:
          MANIFEST_HASH: ${{ hashFiles('Cargo.toml', 'apps/chaptera-desktop/Cargo.toml', 'crates/chaptera-viewer-render-plan/Cargo.toml', 'vendor/producer-a/Cargo.toml', 'vendor/producer-a/crates/**/Cargo.toml') }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MANIFEST_HASH)) {
            throw "Reader fidelity Cargo manifest hash is empty"
          }
          "key=reader-fidelity-win-v1-${env:RUNNER_OS}-rust-1.94.1-$env:MANIFEST_HASH" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore/save Windows fidelity Cargo build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/reader-fidelity-win
          key: ${{ steps.fidelity-cache-key.outputs.key }}

      - name: Build Reader-only Windows smoke binary
        run: cargo build -p chaptera-desktop --features reader-only

      - name: Run bounded Reader product and real-PUB smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "target/reader-windows-shared-core-smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $built = "target/reader-fidelity-win/debug/chaptera-editor.exe"
          $exe = Join-Path $out "chaptera-reader.exe"
          if (-not (Test-Path $built)) {
            throw "reader-only Windows build did not produce target/debug/chaptera-editor.exe"
          }
          Copy-Item $built $exe -Force

          $binaryHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $binaryBytes = (Get-Item $exe).Length
          $env:CHAPTERA_PRODUCT_SMOKE_BINARY_SHA256 = $binaryHash
          $env:CHAPTERA_PRODUCT_SMOKE_BINARY_BYTE_LEN = [string]$binaryBytes

          $productReceipt = Join-Path $out "product-smoke.json"
          $product = Start-Process -FilePath $exe -ArgumentList @("--product-smoke-v1", $productReceipt) -Wait -PassThru
          if ($product.ExitCode -ne 0) {
            throw "Reader shared-core product smoke failed: exit $($product.ExitCode)"
          }

          $smoke = Get-Content -Raw $productReceipt | ConvertFrom-Json
          if ($smoke.product -ne "Chaptera PUB Reader") { throw "shared-core smoke identified the wrong product" }
          if ($smoke.reader_only -ne $true) { throw "shared-core smoke binary is not reader-only" }
          if ($smoke.editor_controls_enabled -ne $false) { throw "shared-core smoke exposed Editor controls" }
          if ($smoke.native_save_pub_claimed -ne $false) { throw "shared-core smoke widened native PUB save claims" }
          if ($smoke.binary_sha256 -ne $binaryHash) { throw "shared-core product smoke binary hash mismatch" }
          if ([int64]$smoke.binary_byte_len -ne $binaryBytes) { throw "shared-core product smoke binary size mismatch" }

          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" -OutFile $fixture
          $fixtureHash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $fixtureBytes = (Get-Item $fixture).Length
          if ($fixtureHash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $fixtureHash"
          }
          if ($fixtureBytes -ne 291840) {
            throw "SampleNewsletter byte length mismatch: $fixtureBytes"
          }
          "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $brochure = Join-Path $env:RUNNER_TEMP "SampleBrochure.pub"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleBrochure.pub" -OutFile $brochure
          $brochureHash = (Get-FileHash $brochure -Algorithm SHA256).Hash.ToLowerInvariant()
          $brochureBytes = (Get-Item $brochure).Length
          if ($brochureHash -ne "ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87") {
            throw "SampleBrochure SHA-256 mismatch: $brochureHash"
          }
          if ($brochureBytes -ne 161792) {
            throw "SampleBrochure byte length mismatch: $brochureBytes"
          }
          "CHAPTERA_SAMPLE_BROCHURE=$brochure" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $before = $fixtureHash
          $viewer = Start-Process -FilePath $exe -ArgumentList @("--smoke-check", $fixture) -Wait -PassThru
          if ($viewer.ExitCode -ne 0) {
            throw "Reader shared-core real-PUB smoke failed: exit $($viewer.ExitCode)"
          }
          $after = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($before -ne $after) {
            throw "Reader shared-core smoke mutated the source PUB"
          }

          @{
            schema_version = "chaptera.reader-windows-shared-core-smoke.v1"
            product_id = "chaptera.reader"
            target = "x86_64-pc-windows-msvc"
            profile = "debug"
            binary_sha256 = $binaryHash
            binary_byte_len = $binaryBytes
            product_smoke_passed = $true
            fixture_sha256 = $fixtureHash
            fixture_byte_len = $fixtureBytes
            real_pub_smoke_passed = $true
            source_unchanged = $true
            source_commit = "${{ github.sha }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out "receipt.json")

      - name: Run exact mature OfficeArt WMF Viewer acceptance
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer mature_officeart_wmf_exact_product_tests -- --ignored --nocapture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chaptera-reader-windows-shared-core-smoke
          path: |
            target/reader-windows-shared-core-smoke/product-smoke.json
            target/reader-windows-shared-core-smoke/receipt.json
          if-no-files-found: error
