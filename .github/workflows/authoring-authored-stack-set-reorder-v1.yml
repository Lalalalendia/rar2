name: Authored Stack Set Reorder V1

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-editor-authoring-core/src/authored_stack_set_reorder_v1.rs"
      - "vendor/producer-a/crates/pub-editor-authoring-core/tests/authored_stack_set_reorder_v1.rs"
      - "docs/authoring-authored-stack-set-reorder-v1.md"
      - ".github/workflows/authoring-authored-stack-set-reorder-v1.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pure-stack-law:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Rustfmt isolated authoring-core module and tests
        run: |
          rustfmt --edition 2024 --check \
            vendor/producer-a/crates/pub-editor-authoring-core/src/authored_stack_set_reorder_v1.rs \
            vendor/producer-a/crates/pub-editor-authoring-core/tests/authored_stack_set_reorder_v1.rs
      - name: Test exact one-lane selected-set reorder algebra
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-editor-authoring-core --test authored_stack_set_reorder_v1 -- --nocapture
      - name: Recheck existing authored-stack lifecycle invariants
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-editor-authoring-core --test authored_stack_lifecycle_v1
