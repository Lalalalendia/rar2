name: Carlton March Reader visual oracle

on:
  workflow_call:
    inputs:
      run_typography_golden:
        required: false
        type: boolean
        default: false
      run_windows_shared_core_smoke:
        required: false
        type: boolean
        default: false
  workflow_dispatch:

permissions:
  contents: read

jobs:
  visual-oracle:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Acquire pinned SampleNewsletter for combined receipts
        if: inputs.run_typography_golden || inputs.run_windows_shared_core_smoke
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $fixture).Length
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $hash"
          }
          if ($bytes -ne 291840) {
            throw "SampleNewsletter byte length mismatch: $bytes"
          }
          "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if ("${{ inputs.run_typography_golden }}" -eq "true") {
            $out = Join-Path $env:RUNNER_TEMP "chaptera-reader-golden-samplenewsletter"
            New-Item -ItemType Directory -Force -Path $out | Out-Null
            "CHAPTERA_GOLDEN_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
            "CHAPTERA_GOLDEN_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          }

      - name: Check bounded typography parser for combined receipt
        if: inputs.run_typography_golden
        run: cargo test --manifest-path vendor/producer-a/crates/pub-quill/Cargo.toml typography -- --nocapture

      - name: Build Reader-only Windows shared-core smoke binary
        if: inputs.run_windows_shared_core_smoke
        run: cargo build -p chaptera-desktop --features reader-only

      - name: Run bounded Reader product and real-PUB smoke
        if: inputs.run_windows_shared_core_smoke
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $out = "target/reader-windows-shared-core-smoke"
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          $built = "target/debug/chaptera-editor.exe"
          $exe = Join-Path $out "chaptera-reader.exe"
          if (-not (Test-Path $built)) {
            throw "reader-only Windows build did not produce target/debug/chaptera-editor.exe"
          }
          Copy-Item $built $exe -Force

          $binaryHash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLowerInvariant()
          $binaryBytes = (Get-Item $exe).Length
          $env:CHAPTERA_PRODUCT_SMOKE_BINARY_SHA256 = $binaryHash
          $env:CHAPTERA_PRODUCT_SMOKE_BINARY_BYTE_LEN = [string]$binaryBytes

          $productReceipt = Join-Path $out "product-smoke.json"
          $product = Start-Process -FilePath $exe -ArgumentList @("--product-smoke-v1", $productReceipt) -Wait -PassThru
          if ($product.ExitCode -ne 0) {
            throw "Reader shared-core product smoke failed: exit $($product.ExitCode)"
          }

          $smoke = Get-Content -Raw $productReceipt | ConvertFrom-Json
          if ($smoke.product -ne "Chaptera PUB Reader") { throw "shared-core smoke identified the wrong product" }
          if ($smoke.reader_only -ne $true) { throw "shared-core smoke binary is not reader-only" }
          if ($smoke.editor_controls_enabled -ne $false) { throw "shared-core smoke exposed Editor controls" }
          if ($smoke.native_save_pub_claimed -ne $false) { throw "shared-core smoke widened native PUB save claims" }
          if ($smoke.binary_sha256 -ne $binaryHash) { throw "shared-core product smoke binary hash mismatch" }
          if ([int64]$smoke.binary_byte_len -ne $binaryBytes) { throw "shared-core product smoke binary size mismatch" }

          $fixture = $env:CHAPTERA_SAMPLE_NEWSLETTER
          if (-not $fixture -or -not (Test-Path $fixture)) {
            throw "shared-core smoke SampleNewsletter fixture is missing"
          }
          $before = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $fixtureBytes = (Get-Item $fixture).Length
          $viewer = Start-Process -FilePath $exe -ArgumentList @("--smoke-check", $fixture) -Wait -PassThru
          if ($viewer.ExitCode -ne 0) {
            throw "Reader shared-core real-PUB smoke failed: exit $($viewer.ExitCode)"
          }
          $after = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($before -ne $after) {
            throw "Reader shared-core smoke mutated the source PUB"
          }

          @{
            schema_version = "chaptera.reader-windows-shared-core-smoke.v1"
            product_id = "chaptera.reader"
            target = "x86_64-pc-windows-msvc"
            profile = "debug"
            binary_sha256 = $binaryHash
            binary_byte_len = $binaryBytes
            product_smoke_passed = $true
            fixture_sha256 = $before
            fixture_byte_len = $fixtureBytes
            real_pub_smoke_passed = $true
            source_unchanged = $true
            source_commit = "${{ github.sha }}"
          } | ConvertTo-Json | Set-Content -Encoding utf8 (Join-Path $out "receipt.json")

      - name: Upload combined Windows shared-core smoke receipt
        if: inputs.run_windows_shared_core_smoke && always()
        uses: actions/upload-artifact@v4
        with:
          name: chaptera-reader-windows-shared-core-smoke
          path: |
            target/reader-windows-shared-core-smoke/product-smoke.json
            target/reader-windows-shared-core-smoke/receipt.json
          if-no-files-found: error


      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install exact visual-oracle dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5" "PyMuPDF==1.24.14"

      - name: Validate visual-oracle Python tools
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m py_compile tools/acquire_carlton_march_pair.py tools/reader_reference_pdf_raster_v1.py tools/pdf_reference_diff_v1.py
          if ($LASTEXITCODE -ne 0) { throw "visual-oracle Python syntax check failed" }

      - name: Acquire exact public Carlton March PUB/PDF pair
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP "carlton-reader-visual-oracle"
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          python tools/acquire_carlton_march_pair.py $root
          if ($LASTEXITCODE -ne 0) { throw "Carlton acquisition failed" }
          $pub = Join-Path $root "March-2026.pub"
          $pdf = Join-Path $root "March-2026-reference.pdf"
          $out = Join-Path $root "reader-golden"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "CHAPTERA_GOLDEN_CARLTON_MARCH=$pub" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_GOLDEN_CARLTON_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_CARLTON_REFERENCE_PDF=$pdf" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_CARLTON_VISUAL_ROOT=$root" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Check shared render plan
        run: cargo test --manifest-path crates/chaptera-viewer-render-plan/Cargo.toml

      - name: Render pinned Publisher-reference typography customer page 1
        if: inputs.run_typography_golden
        run: cargo test -p chaptera-desktop --features reader-only golden_sample_newsletter_reference_customer_page_1_uses_shared_typography_render_plan -- --ignored --nocapture

      - name: Render all three clean Carlton customer pages
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          cargo test -p chaptera-desktop --features reader-only golden_carlton_march_clean_pages_use_current_reader_render_backend -- --ignored --nocapture
          if ($LASTEXITCODE -ne 0) { throw "Carlton clean Reader render failed" }

      - name: Compare current Reader rasters with published PDF
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $golden = Join-Path $env:CHAPTERA_GOLDEN_CARLTON_OUT "carlton-march-reader-golden-receipt.json"
          $diff = Join-Path $env:CHAPTERA_CARLTON_VISUAL_ROOT "reader-reference-diff.json"
          python tools/reader_reference_pdf_raster_v1.py $golden $env:CHAPTERA_CARLTON_REFERENCE_PDF $diff
          if ($LASTEXITCODE -ne 0) { throw "Carlton Reader/reference comparison failed" }

      - name: Build sanitized baseline visual receipt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["CHAPTERA_CARLTON_VISUAL_ROOT"])
          golden_root = Path(os.environ["CHAPTERA_GOLDEN_CARLTON_OUT"])
          golden = json.loads(
              (golden_root / "carlton-march-reader-golden-receipt.json").read_text()
          )
          diff = json.loads((root / "reader-reference-diff.json").read_text())
          acquisition = json.loads((root / "acquisition.json").read_text())

          expected_pub = "bf9cda0f632b5820ab9dbdbe1b838b2a988b2f3fdd69253c22b4fc3aef9f11c3"
          expected_pdf = "c1288571ee8da91afa27ca5c49191aacefe82123df294c11f58ca047d0ced769"

          if golden["source_sha256"] != expected_pub:
              raise SystemExit("Reader golden source identity drift")
          if diff["reader_source_sha256"] != expected_pub:
              raise SystemExit("comparator source identity drift")
          if diff["reference_sha256"] != expected_pdf:
              raise SystemExit("reference PDF identity drift")
          if acquisition["files"]["March 2026.pub"]["sha256"] != expected_pub:
              raise SystemExit("acquired PUB identity drift")
          if acquisition["files"]["March 2026.pdf"]["sha256"] != expected_pdf:
              raise SystemExit("acquired PDF identity drift")
          if diff["page_count"] != {"candidate": 3, "reference": 3, "match": True}:
              raise SystemExit(f"page-count mismatch: {diff['page_count']!r}")
          if golden["page_count"] != 3 or golden["scene_surface_count"] != 3:
              raise SystemExit("current Reader is not on Carlton 3/3 presentation")
          if golden.get("projected_page_counts") != [1, 2, 1]:
              raise SystemExit(
                  f"canonical Cmo projected-page distribution drift: {golden.get('projected_page_counts')!r}"
              )
          if len(golden.get("projected_scene_instance_ids", [])) != 4:
              raise SystemExit("expected four canonical Cmo SceneInstance ids")

          pages = []
          for golden_page, diff_page in zip(golden["pages"], diff["pages"]):
              visual = diff_page["diff"]
              pages.append({
                  "page_number": golden_page["page_number"],
                  "page_id": golden_page["page_id"],
                  "physical_page_size_matches_reference": diff_page[
                      "physical_page_size_matches_reference"
                  ],
                  "physical_page_size_delta": diff_page[
                      "physical_page_size_delta"
                  ],
                  "raster_size_match": visual["raster_size_match"],
                  "node_count": golden_page["node_count"],
                  "projected_scene_instance_count": golden_page[
                      "projected_scene_instance_count"
                  ],
                  "fill_node_count": golden_page["fill_node_count"],
                  "line_node_count": golden_page["line_node_count"],
                  "image_node_count": golden_page["image_node_count"],
                  "text_node_count": golden_page["text_node_count"],
                  "typography_sections": golden_page["typography_sections"],
                  "executed_text_node_count": golden_page["executed_text_node_count"],
                  "executed_source_typography_sections": golden_page[
                      "executed_source_typography_sections"
                  ],
                  "executed_fallback_typography_sections": golden_page[
                      "executed_fallback_typography_sections"
                  ],
                  "clipped_text_node_count": golden_page["clipped_text_node_count"],
                  "raw_changed_pixel_count": visual.get("raw_changed_pixel_count"),
                  "noise_only_pixel_count": visual.get("noise_only_pixel_count"),
                  "significant_pixel_count": visual.get("significant_pixel_count"),
                  "significant_fraction": visual.get("significant_fraction"),
                  "mean_abs_channel_delta": visual.get("mean_abs_channel_delta"),
                  "max_channel_delta": visual.get("max_channel_delta"),
                  "significant_bbox": visual.get("significant_bbox"),
                  "region_count": len(visual.get("regions", [])),
                  "regions": visual.get("regions", []),
              })

          receipt = {
              "schema": "chaptera.carlton-march-reader-baseline-visual-oracle.v1",
              "source_pub_sha256": expected_pub,
              "reference_pdf_sha256": expected_pdf,
              "page_count": 3,
              "family_profile_applied": golden["family_profile_applied"],
              "viewer_diagnostic_codes": golden["viewer_diagnostic_codes"],
              "projected_scene_instance_count": len(
                  golden["projected_scene_instance_ids"]
              ),
              "projected_page_counts": golden["projected_page_counts"],
              "reader_render": {
                  "backend": golden["render_backend"],
                  "raster_dpi": golden["raster_dpi"],
                  "shell_ui_rendered": golden["shell_ui_rendered"],
                  "selection_overlay_rendered": golden["selection_overlay_rendered"],
                  "preview_warning_overlay_rendered": golden[
                      "preview_warning_overlay_rendered"
                  ],
                  "source_font_face_claimed": golden["source_font_face_claimed"],
                  "publisher_exact_reflow_claimed": golden[
                      "publisher_exact_reflow_claimed"
                  ],
              },
              "comparator": diff["comparator"],
              "pages": pages,
              "claims": {
                  "current_reader_product_semantics": True,
                  "baseline_unedited_source": True,
                  "editor_current_state_export": False,
                  "publisher_visual_parity": False,
                  "visual_differences_are_localized_not_ranked": True,
                  "raw_story_text_emitted": False,
                  "reference_pdf_bytes_emitted": False,
              },
          }
          target = root / "baseline-visual-receipt.json"
          target.write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")

          print("CARLTON READER BASELINE VISUAL RECEIPT")
          print(json.dumps({
              "page_significant_fractions": [
                  page["significant_fraction"] for page in pages
              ],
              "page_region_counts": [page["region_count"] for page in pages],
              "physical_size_matches": [
                  page["physical_page_size_matches_reference"] for page in pages
              ],
              "physical_size_delta_px": [
                  page["physical_page_size_delta"] for page in pages
              ],
              "clipped_text_nodes": [
                  page["clipped_text_node_count"] for page in pages
              ],
              "fallback_typography_sections": [
                  page["executed_fallback_typography_sections"] for page in pages
              ],
              "projected_scene_instance_counts": [
                  page["projected_scene_instance_count"] for page in pages
              ],
          }, indent=2, sort_keys=True))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw "baseline visual receipt failed" }

      - name: Upload combined SampleNewsletter typography receipt
        if: inputs.run_typography_golden && success()
        uses: actions/upload-artifact@v4
        with:
          name: chaptera-reader-golden-samplenewsletter
          path: ${{ env.CHAPTERA_GOLDEN_OUT }}
          if-no-files-found: warn

      - name: Upload sanitized Carlton Reader visual receipt
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: carlton-march-reader-baseline-visual-oracle
          path: |
            ${{ env.CHAPTERA_CARLTON_VISUAL_ROOT }}/acquisition.json
            ${{ env.CHAPTERA_CARLTON_VISUAL_ROOT }}/reader-reference-diff.json
            ${{ env.CHAPTERA_CARLTON_VISUAL_ROOT }}/baseline-visual-receipt.json
            ${{ env.CHAPTERA_GOLDEN_CARLTON_OUT }}/carlton-march-reader-golden-receipt.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload short-lived visual artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: carlton-march-reader-baseline-visual-private
          path: |
            ${{ env.CHAPTERA_CARLTON_REFERENCE_PDF }}
            ${{ env.CHAPTERA_GOLDEN_CARLTON_OUT }}/carlton-march-reader-page-*.png
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
