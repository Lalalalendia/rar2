name: Publisher runner recovery summary contract

on:
  pull_request:
    paths:
      - "tools/sanitize_pub_native_runner_recovery_v1.py"
      - ".github/workflows/pub-native-runner-recovery-summary-contract.yml"

permissions:
  contents: read

concurrency:
  group: pub-native-runner-recovery-summary-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sanitizer
        run: python -m py_compile tools/sanitize_pub_native_runner_recovery_v1.py
      - name: Run source-safe sanitizer self-test
        run: python tools/sanitize_pub_native_runner_recovery_v1.py --self-test
