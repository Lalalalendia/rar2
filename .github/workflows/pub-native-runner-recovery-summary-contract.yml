name: Publisher runner recovery summary contract

on:
  pull_request:
    paths:
      - "tools/sanitize_pub_native_runner_recovery_v1.py"
      - ".github/workflows/pub-native-runner-recovery-summary-contract.yml"
      - "tools/ci/test_pub_native_queue_contract.py"
      - ".github/workflows/pub-native-fixed-footprint-control.yml"
      - ".github/workflows/pub-native-length-preserving-story.yml"
      - ".github/workflows/pub-native-one-unit-delete-control.yml"
      - ".github/workflows/pub-native-saveas-source-control.yml"
      - ".github/workflows/pub-native-story-pwsh7-transport.yml"
      - ".github/workflows/pub-native-story-save-copy.yml"
      - ".github/workflows/pub-native-syid-header-control.yml"
      - ".github/workflows/pub-re-native.yml"
      - ".github/workflows/pub-save-roundtrip-handoff.yml"

permissions:
  contents: read

concurrency:
  group: pub-native-runner-recovery-summary-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile sanitizer
        run: python -m py_compile tools/sanitize_pub_native_runner_recovery_v1.py
      - name: Run source-safe sanitizer self-test
        run: python tools/sanitize_pub_native_runner_recovery_v1.py --self-test
      - name: Enforce lossless exclusive Publisher-native queue
        run: python tools/ci/test_pub_native_queue_contract.py
