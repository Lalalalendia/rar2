name: Receiver Qualification Core V1

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/chaptera-receiver-qualification/**"
      - "packages/protocol/receiver-qualification/v1/**"
      - ".github/workflows/receiver-qualification-core-v1.yml"
  workflow_dispatch:

concurrency:
  group: receiver-qualification-core-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.94.1 --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo +1.94.1 fmt -p chaptera-receiver-qualification -- --check
      - name: Clippy
        run: cargo +1.94.1 clippy -p chaptera-receiver-qualification --all-targets -- -D warnings
      - name: Test
        run: cargo +1.94.1 test -p chaptera-receiver-qualification
