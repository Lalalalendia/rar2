name: TEMP EMF066 source and Viewer vector admission

on:
  push:
    branches:
      - feat/reader-emf066-vector-filled-path-v1
    paths:
      - ".github/workflows/temporary-emf066-product-acceptance.yml"
      - "vendor/producer-a/crates/pub-reader/src/mature_emf.rs"
      - "vendor/producer-a/crates/pub-reader/src/mature_emf_vector.rs"
      - "vendor/producer-a/crates/pub-viewer/src/mature_emf_preview.rs"
      - "vendor/producer-a/crates/pub-viewer/tests/emf_birgb_partial_v1.rs"

permissions:
  contents: read
  actions: read

concurrency:
  group: reader-emf066-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  exact-source:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt,clippy
      - name: Fetch exact pinned Publisher 1050 source corpus
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820
      - name: Verify immutable source SHA identities
        run: |
          python - <<'PY'
          import hashlib
          from pathlib import Path
          root = Path("out/pinned1050/materialized/native")
          assert len(list(root.glob("*.pub"))) == 1050
          for sha in (
              "155f8fd8c191851e4380ab1557638aeabb34b2257fa12a7748ab00b09edb74ba",
              "d8ac6507d86e35c0f43e293760627a01b00a29586a76f8bf05b5fae702a19d13",
          ):
              path = root / f"{sha}.pub"
              assert path.is_file()
              assert hashlib.sha256(path.read_bytes()).hexdigest() == sha
          print("PINNED_EMF_041_066_SHA_VERIFIED")
          PY
      - name: Format transient Rust checkout
        run: |
          rustfmt --edition 2024 vendor/producer-a/crates/pub-reader/src/mature_emf_vector.rs
          rustfmt --edition 2024 vendor/producer-a/crates/pub-viewer/src/mature_emf_preview.rs
          rustfmt --edition 2024 vendor/producer-a/crates/pub-viewer/tests/emf_birgb_partial_v1.rs
      - name: Strict source 066 vector and 041 bitmap arbitration
        env:
          CHAPTERA_PINNED_SOURCE_ROOT: ${{ github.workspace }}/out/pinned1050/materialized/native
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-reader --lib mature_emf::vector::tests -- --nocapture
      - name: Source-bound Viewer 066 two uses and 041 six PNG controls
        env:
          CHAPTERA_PINNED_SOURCE_ROOT: ${{ github.workspace }}/out/pinned1050/materialized/native
        run: |
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer --test emf_birgb_partial_v1 -- --nocapture
      - name: Strict compiler and Clippy acceptance
        run: |
          cargo clippy --manifest-path vendor/producer-a/Cargo.toml -p pub-reader -p pub-viewer --all-targets -- -D warnings
