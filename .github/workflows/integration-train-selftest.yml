name: CI-INTEGRATION-TRAIN-01 self-test

on:
  pull_request:
    paths:
      - "tools/integration_train.py"
      - "tools/test_integration_train.py"
      - "docs/integration-train.md"
      - "AGENTS.md"
      - ".github/workflows/integration-train-selftest.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  self-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test integration-train planner
        run: python tools/test_integration_train.py
      - name: Compile planner
        run: python -m py_compile tools/integration_train.py tools/test_integration_train.py
