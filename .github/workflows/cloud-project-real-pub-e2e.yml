name: CLOUD-B02 real PUB project HTTP acceptance

on:
  pull_request:
    paths:
      - "apps/web/chaptera-cloud-workspace-session-v1.mjs"
      - "apps/web/chaptera-product-editor-service-v1.mjs"
      - "apps/web/chaptera-product-editor-service-v1.test.mjs"
      - "apps/web/rich-reader-editor-shell-v1.mjs"
      - "apps/web/rich-reader-editor-shell-v1.test.mjs"
      - "apps/web/product-editor-entry-v1.mjs"
      - "apps/web/product-editor-entry-v1.test.mjs"
      - "apps/web/product-editor.html"
      - "apps/web/chaptera-cloud-source-ingress-v1.mjs"
      - "apps/web/cloud-project-new-v1.mjs"
      - "apps/web/cloud-project-new.html"
      - "tools/run_secure_origin_real_pub.py"
      - "tools/run_secure_origin_oidc_acceptance.py"
      - "tools/run_secure_origin_real_pub_browser.mjs"
      - "tools/run_secure_origin_real_pub_story_browser.mjs"
      - "tools/run_secure_origin_real_pub_restart_browser.mjs"
      - "tools/run_secure_origin_cross_principal_browser.mjs"
      - "tools/run_product_isolation_security_probe.py"
      - "tools/security_leak_scan_v1.py"
      - ".github/workflows/cloud-project-real-pub-e2e.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  authenticated-real-pub:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FIXTURE_SHA256: 6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf
      FIXTURE_BYTES: "291840"
      STORY_FIXTURE_SHA256: 424c69173ff08948c2529c8084b4ac2403f1ff1057146f4edd02fc29b44481fc
      STORY_FIXTURE_BYTES: "72192"
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@1.94.1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check runner, Docker and native sandbox
        run: |
          set -euo pipefail
          python -m py_compile tools/run_secure_origin_real_pub.py tools/chaptera_local_oidc.py tools/migration_pdf_worker_isolation.py tools/run_product_isolation_security_probe.py
          node --check tools/run_secure_origin_real_pub_browser.mjs
          node --check tools/run_secure_origin_real_pub_story_browser.mjs
          node --check tools/run_secure_origin_real_pub_restart_browser.mjs
          node --check tools/run_secure_origin_cross_principal_browser.mjs
          python - <<'PY'
          import ctypes.util
          assert ctypes.util.find_library("seccomp"), "libseccomp required by isolated PUB scan"
          PY
          docker version

      - name: Fetch pinned real Publisher fixture
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/chaptera-real-pub"
          curl --fail --location --retry 4 --retry-delay 2 \
            "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" \
            --output "$RUNNER_TEMP/chaptera-real-pub/SampleNewsletter.pub"
          printf '%s  %s\n' "$FIXTURE_SHA256" "$RUNNER_TEMP/chaptera-real-pub/SampleNewsletter.pub" | sha256sum -c -
          test "$(stat -c %s "$RUNNER_TEMP/chaptera-real-pub/SampleNewsletter.pub")" = "$FIXTURE_BYTES"
          # Same immutable Apache POI real-PUB source the Rust Editor fixtures use.
          # Fixture bytes never enter CI artifacts or PR discussion.
          python - <<'PY'
          import base64, hashlib, os
          from pathlib import Path
          source = Path("vendor/producer-a/crates/pub-quill/tests/fixtures/Sample3.pub.b64")
          data = base64.b64decode("".join(source.read_text().split()), validate=True)
          assert len(data) == int(os.environ["STORY_FIXTURE_BYTES"])
          assert hashlib.sha256(data).hexdigest() == os.environ["STORY_FIXTURE_SHA256"]
          dest = Path(os.environ["RUNNER_TEMP"]) / "chaptera-real-pub" / "Sample3.pub"
          dest.write_bytes(data)
          PY

      - name: Build canonical HTTP service and real isolated workers
        run: cargo build -p chaptera-server --bin chaptera --jobs 2

      - name: Prove physical Product isolation syscall boundary
        run: |
          python tools/run_product_isolation_security_probe.py \
            --output target/product-security-isolation/receipt.json

      - name: Prove real pinned PUB through Product isolation worker
        run: cargo test -p chaptera-server --test product_isolated_replay_v1 -- --nocapture

      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Real OIDC HTTPS PUB upload, validation and project open
        env:
          CHAPTERA_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/run_secure_origin_real_pub.py \
            --binary target/debug/chaptera \
            --browser-script tools/run_secure_origin_real_pub_browser.mjs \
            --restart-browser-script tools/run_secure_origin_real_pub_restart_browser.mjs \
            --cross-principal-browser-script tools/run_secure_origin_cross_principal_browser.mjs \
            --fixture "$RUNNER_TEMP/chaptera-real-pub/SampleNewsletter.pub" \
            --fixture-sha256 "$FIXTURE_SHA256" \
            --caddy-image caddy:2.10.2-alpine \
          --story-browser-script tools/run_secure_origin_real_pub_story_browser.mjs \
          --story-fixture "$RUNNER_TEMP/chaptera-real-pub/Sample3.pub" \
          --story-fixture-sha256 "$STORY_FIXTURE_SHA256"

      - name: Fail closed on Product Editor acceptance privacy leaks
        id: b02_privacy_scan
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          args=()
          for path in             target/cloud-real-pub-ingress/receipt.json             target/cloud-real-pub-ingress/server.log             target/cloud-real-pub-ingress/worker.log             target/cloud-real-pub-ingress/browser.log             target/cloud-real-pub-ingress/browser-story.log             target/cloud-real-pub-ingress/story-receipt.json             target/cloud-real-pub-ingress/browser-cross-principal.log             target/cloud-real-pub-ingress/server-restart.log             target/cloud-real-pub-ingress/worker-restart.log             target/cloud-real-pub-ingress/browser-restart.log             target/cloud-real-pub-ingress/caddy.log
          do
            if [ -f "$path" ]; then
              args+=("$path")
            fi
          done
          if [ "${#args[@]}" -eq 0 ]; then
            echo "::error::real Product Editor acceptance emitted no receipt/log files to scan"
            exit 1
          fi
          python tools/security_leak_scan_v1.py             "${args[@]}"             --forbid-literal "SampleNewsletter.pub"             --forbid-literal "TruncatedNewsletter.pub"             --forbid-literal "Sample3.pub"             --forbid-literal "$RUNNER_TEMP/chaptera-real-pub/SampleNewsletter.pub"             --forbid-literal "chaptera-local-only-secret"             --forbid-literal "chaptera-secure-origin"             --json-out target/cloud-real-pub-ingress/security-leak-scan.json

      # A failed/missing privacy scan must never publish raw browser/server logs.
      - uses: actions/upload-artifact@v4
        if: ${{ always() && steps.b02_privacy_scan.outcome == 'success' }}
        with:
          name: cloud-b02-real-pub-source-http
          path: |
            target/cloud-real-pub-ingress/receipt.json
            target/cloud-real-pub-ingress/session.png
            target/cloud-real-pub-ingress/server.log
            target/cloud-real-pub-ingress/worker.log
            target/cloud-real-pub-ingress/browser.log
            target/cloud-real-pub-ingress/browser-story.log
            target/cloud-real-pub-ingress/story-receipt.json
            target/cloud-real-pub-ingress/browser-cross-principal.log
            target/cloud-real-pub-ingress/server-restart.log
            target/cloud-real-pub-ingress/worker-restart.log
            target/cloud-real-pub-ingress/browser-restart.log
            target/cloud-real-pub-ingress/caddy.log
            target/cloud-real-pub-ingress/Caddyfile
            target/cloud-real-pub-ingress/security-leak-scan.json
            target/product-security-isolation/receipt.json
          if-no-files-found: warn
          retention-days: 14
