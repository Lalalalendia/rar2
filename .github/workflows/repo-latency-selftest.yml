name: CI-REPO-LATENCY-01 self-test

on:
  pull_request:
    paths:
      - "tools/ci/repo_latency_census.py"
      - "tools/ci/test_repo_latency_census.py"
      - ".github/workflows/repo-latency-selftest.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read
  pull-requests: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Prove repo-wide census semantics without API or external fixtures
        run: python -m unittest tools.ci.test_repo_latency_census -v
      - name: Live API smoke on two previously merged exact heads
        if: ${{ github.event_name == 'pull_request' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci/repo_latency_census.py \
            --repo "${{ github.repository }}" \
            --limit 36 \
            --out target/ci-repo-latency/live-smoke.json
      - name: Print repo-wide latency census findings to job logs
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("target/ci-repo-latency/live-smoke.json").read_text())
          rows=d["prs"]
          print("SAMPLE_COUNT", len(rows))
          for r in rows:
              print("PR_ROW", json.dumps({
                  "pr": r["pr_number"], "class": r["class"],
                  "domains": r["domains"], "feedback_s": r["first_relevant_feedback_s"],
                  "merge_ready_s": r["merge_ready_s"], "post_gate_to_merge_s": r["post_gate_to_merge_s"],
                  "queue_p95_s": r["queue_wait"]["p95_s"],
                  "longest_queue": r["longest_queue"], "critical_tail": r["critical_tail"]
              },sort_keys=True))
          print("BY_CLASS", json.dumps(d["by_class"],sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'pull_request' }}
        with:
          name: ci-repo-latency-live-smoke
          path: target/ci-repo-latency/live-smoke.json
          if-no-files-found: error
          retention-days: 14

  recent-merged-census:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    needs: offline-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Measure actual merged PR feedback, queue and merge-ready latency
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python tools/ci/repo_latency_census.py \
            --repo "${{ github.repository }}" \
            --limit 12 \
            --out target/ci-repo-latency/recent-merged.json
      - uses: actions/upload-artifact@v4
        with:
          name: ci-repo-latency-exact-head
          path: target/ci-repo-latency/recent-merged.json
          if-no-files-found: error
          retention-days: 30
