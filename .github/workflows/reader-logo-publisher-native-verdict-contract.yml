name: Reader Publisher native A/B contract (no external oracle bytes)

on:
  pull_request:
    paths:
      - "tools/reader_logo_publisher_native_verdict_v1.py"
      - "tools/test_reader_logo_publisher_native_verdict_v1.py"
      - "tools/reader_line405_publisher_offline_v1.py"
      - "tools/test_reader_line405_publisher_offline_v1.py"
      - ".github/workflows/reader-logo-publisher-native-verdict-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-publisher-verdict-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-contract:
    name: Native Publisher reference identity fail-closed tests only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic PDF comparator dependencies
        run: python -m pip install --disable-pip-version-check --no-cache-dir "PyMuPDF==1.26.7"
      - name: Verify external Publisher identity and negative controls
        run: |
          python tools/test_reader_logo_publisher_native_verdict_v1.py
          python tools/test_reader_line405_publisher_offline_v1.py
      - name: Verify command line contract
        run: |
          python tools/reader_logo_publisher_native_verdict_v1.py --help
          python tools/reader_line405_publisher_offline_v1.py --help
      - name: State evidence limitations explicitly
        run: |
          echo "Native Publisher PDF bytes are external and are NOT in this CI." >> "$GITHUB_STEP_SUMMARY"
          echo "This job proves only source-free fail-closed tooling; it does NOT claim that LINE405 matches Publisher." >> "$GITHUB_STEP_SUMMARY"
          echo "Run the offline LINE405 tool against two pinned Chromium artifact ZIPs and the local external 10-PDF / 20-page Publisher 2019 ZIP for a native visual delta." >> "$GITHUB_STEP_SUMMARY"
