name: Virginia p22 TABLE layout probe

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-viewer/tests/virginia_table_layout_probe.rs"
      - "apps/chaptera-server/tests/virginia_table_layout_probe.rs"
      - "tools/acquire_virginia_pub_pdf_pairs.py"
      - ".github/workflows/virginia-table-layout-probe.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install acquisition dependency
        run: python -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"

      - name: Reacquire exact Virginia pair
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/virginia-pairs"
          python tools/acquire_virginia_pub_pdf_pairs.py "$RUNNER_TEMP/virginia-pairs"
          test -f "$RUNNER_TEMP/virginia-pairs/virginia-remplacante-modifiable.pub"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Measure p22 TABLE layout authority
        env:
          CHAPTERA_VIRGINIA_TABLE_LAYOUT_FIXTURE: ${{ runner.temp }}/virginia-pairs/virginia-remplacante-modifiable.pub
          CHAPTERA_VIRGINIA_TABLE_LAYOUT_SHA256: 88f57d800aeec808798ea487b9d4ab85dc85c02cd190b987a332709b81018506
          CHAPTERA_VIRGINIA_TABLE_LAYOUT_OUT: ${{ github.workspace }}/target/virginia-table-layout/receipt.json
        run: |
          set -euo pipefail
          mkdir -p target/virginia-table-layout
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer --test virginia_table_layout_probe -- --ignored --nocapture

      - name: Classify Virginia TABLE OfficeArt cell joins
        env:
          CHAPTERA_TABLE_CELL_PAINT_FIXTURE: ${{ runner.temp }}/virginia-pairs/virginia-remplacante-modifiable.pub
        run: |
          set -euo pipefail
          cargo test --manifest-path vendor/producer-a/crates/pub-reader/Cargo.toml --test table_cell_paint_join_probe -- --nocapture

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virginia-p22-table-layout-receipt
          path: target/virginia-table-layout/
          if-no-files-found: warn
          retention-days: 30
