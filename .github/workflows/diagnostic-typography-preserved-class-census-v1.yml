name: Diagnostic Typography Preserved Class Census V1

on:
  pull_request:
    paths:
      - ".github/workflows/diagnostic-typography-preserved-class-census-v1.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  census:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target/typography-class-census
      CORPUS_ROOT: ${{ github.workspace }}/input/corpus/materialized/native
      EVIDENCE_ROOT: ${{ github.workspace }}/target/typography-class-census-evidence
      PINNED_CORPUS_RUN_ID: "36573574820"
      PINNED_CORPUS_ARTIFACT: "pub-corpus-1000-36573574820"
      PINNED_CORPUS_COUNT: "1050"
      PINNED_CORPUS_DIGEST: "21e9c00963410e1004d407e6476f2e909c6561a4374b4ddadad052499e448d43"
      TARGET_FAMILY: "Montserrat"
      TARGET_SIZE_EMU: "304800"

    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact corpus
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.PINNED_CORPUS_ARTIFACT }}
          path: input/corpus
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: ${{ env.PINNED_CORPUS_RUN_ID }}

      - name: Verify exact corpus identity
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib, os
          from pathlib import Path
          root = Path(os.environ["CORPUS_ROOT"])
          paths = sorted(root.glob("*.pub"))
          shas = [p.stem.casefold() for p in paths]
          digest = hashlib.sha256("".join(s + "\n" for s in shas).encode("ascii")).hexdigest()
          assert len(paths) == int(os.environ["PINNED_CORPUS_COUNT"]), len(paths)
          assert digest == os.environ["PINNED_CORPUS_DIGEST"], digest
          print(f"verified {len(paths)} files, digest={digest}")
          PY

      - name: Build typography probe
        run: |
          set -euo pipefail
          cargo build --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-editor --release --bin editable_typography_probe

      - name: Census exact semantic class
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_ROOT"
          python - <<'PY'
          import collections
          import json
          import os
          import subprocess
          from pathlib import Path

          root = Path(os.environ["CORPUS_ROOT"])
          out = Path(os.environ["EVIDENCE_ROOT"])
          probe = Path(os.environ["CARGO_TARGET_DIR"]) / "release" / "editable_typography_probe"
          target_family = os.environ["TARGET_FAMILY"]
          target_size = int(os.environ["TARGET_SIZE_EMU"])

          admitted = 0
          unsupported = 0
          probe_failures = []
          total_items = 0
          target_items = 0
          files_with_target = 0
          unique_target_files = []
          multi_target_files = []
          family_counts = collections.Counter()
          size_counts = collections.Counter()
          eligible_count_hist = collections.Counter()

          for path in sorted(root.glob("*.pub")):
              try:
                  run = subprocess.run(
                      [str(probe), str(path)],
                      check=True,
                      capture_output=True,
                      text=True,
                      timeout=30,
                  )
                  data = json.loads(run.stdout)
              except Exception as exc:
                  probe_failures.append({"source_sha256": path.stem, "error": type(exc).__name__})
                  continue

              if data.get("open_state") != "admitted":
                  unsupported += 1
                  continue
              admitted += 1
              items = data.get("items", [])
              total_items += len(items)
              eligible_count_hist[str(len(items))] += 1
              for item in items:
                  family_counts[item.get("font_family", "")] += 1
                  size_counts[str(item.get("font_size_emu"))] += 1

              matches = [
                  item for item in items
                  if item.get("font_family", "").strip() == target_family
                  and int(item.get("font_size_emu", -1)) == target_size
              ]
              target_items += len(matches)
              if matches:
                  files_with_target += 1
              record = {
                  "source_sha256": path.stem,
                  "eligible_story_count": len(items),
                  "target_story_count": len(matches),
                  "target_story_ids": sorted(item["story_id"] for item in matches),
              }
              if len(matches) == 1:
                  unique_target_files.append(record)
              elif len(matches) > 1:
                  multi_target_files.append(record)

          receipt = {
              "schema": "chaptera.typography-preserved-class-census.v1",
              "corpus_count": int(os.environ["PINNED_CORPUS_COUNT"]),
              "corpus_digest": os.environ["PINNED_CORPUS_DIGEST"],
              "target_class": {
                  "font_family": target_family,
                  "font_size_emu": target_size,
                  "font_size_pt": 24.0,
                  "ordinary_full_story_bounded": True,
              },
              "counts": {
                  "admitted_files": admitted,
                  "non_admitted_files": unsupported,
                  "probe_failures": len(probe_failures),
                  "total_bounded_story_items": total_items,
                  "target_story_items": target_items,
                  "files_with_target": files_with_target,
                  "files_with_exactly_one_target_story": len(unique_target_files),
                  "files_with_multiple_target_stories": len(multi_target_files),
              },
              "unique_target_files": unique_target_files,
              "multi_target_files": multi_target_files,
              "probe_failures": probe_failures,
              "eligible_count_histogram": dict(sorted(eligible_count_hist.items(), key=lambda kv: int(kv[0]))),
              "top_families": family_counts.most_common(40),
              "top_sizes_emu": size_counts.most_common(40),
          }
          (out / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt["counts"], indent=2, sort_keys=True))
          print("unique target files:", len(unique_target_files))
          print("multi target files:", len(multi_target_files))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: typography-preserved-class-census-${{ github.run_id }}
          path: target/typography-class-census-evidence/receipt.json
          if-no-files-found: error
          retention-days: 90
