name: BorderArt Native One-Shot

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: borderart-native-once-publisher-2019
  cancel-in-progress: false

jobs:
  validate:
    runs-on: windows-latest
    outputs:
      trusted_sha: ${{ steps.trust.outputs.trusted_sha }}
    steps:
      - name: Trust exact manual main dispatch
        id: trust
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          if ("${{ github.ref }}" -ne "refs/heads/main") {
            throw "Expected refs/heads/main, got ${{ github.ref }}"
          }
          "trusted_sha=${{ github.sha }}" >> $env:GITHUB_OUTPUT

      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Validate fixed BorderArt packet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python tools/research-runner/validate_packet.py `
            --packet tools/research-runner/experiments/borderart-auth-01.packet.json `
            --expected-environment publisher-2019

      - name: Verify direct-run blob gates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $packet = (git hash-object -- tools/research-runner/experiments/borderart-auth-01.packet.json).Trim()
          $operation = (git hash-object -- tools/research-runner/operations/publisher_borderart_auth_01.ps1).Trim()
          $runner = Get-Content tools/windows/run_borderart_auth_direct.ps1 -Raw
          if ($packet -ne "234d200ccadeedbc1ed12b2d43cbc15e853ca1fc") {
            throw "Unexpected BorderArt packet blob: $packet"
          }
          if ($operation -ne "4aa9406bab8f18004b70421c8efbb304fdbb4a6e") {
            throw "Unexpected BorderArt operation blob: $operation"
          }
          if ($runner -notmatch [regex]::Escape($packet)) {
            throw "Direct runner does not pin packet blob $packet"
          }
          if ($runner -notmatch [regex]::Escape($operation)) {
            throw "Direct runner does not pin operation blob $operation"
          }
