name: Guarded branch garbage collection

on:
  # Destructive branch deletion never runs from pull_request/pull_request_target.
  # A trusted admin can authorize an exact PR head by commenting:
  # /branch-gc <40-char-pr-head-sha>
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      manifest:
        description: "Manifest path under .github/branch-cleanup/"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.event.issue.number || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  branch-gc:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       startsWith(github.event.comment.body, '/branch-gc '))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Resolve manifests
        id: manifests
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_MANIFEST: ${{ inputs.manifest }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          COMMENTER: ${{ github.event.comment.user.login }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          mkdir -p target/branch-gc

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            case "$MANUAL_MANIFEST" in
              .github/branch-cleanup/*.txt) ;;
              *) echo "invalid manifest path: $MANUAL_MANIFEST" >&2; exit 1 ;;
            esac
            [[ -f "$MANUAL_MANIFEST" ]] || { echo "manifest missing: $MANUAL_MANIFEST" >&2; exit 1; }
            printf '%s\n' "$MANUAL_MANIFEST" > target/branch-gc/manifests.txt
            printf 'mode=workflow_dispatch\nmanifest=%s\n' "$MANUAL_MANIFEST" > target/branch-gc/approval.txt
          else
            command=""
            approved_sha=""
            extra=""
            read -r command approved_sha extra <<< "$COMMENT_BODY"
            [[ "$command" == "/branch-gc" && -z "${extra:-}" && "$approved_sha" =~ ^[0-9a-f]{40}$ ]] || {
              echo "invalid branch-gc command; expected: /branch-gc <40-char-pr-head-sha>" >&2
              exit 1
            }

            permission="$(gh api "repos/$GH_REPO/collaborators/$COMMENTER/permission" --jq '.permission')"
            [[ "$permission" == "admin" ]] || {
              echo "branch-gc command requires repository admin permission; user=$COMMENTER permission=$permission" >&2
              exit 1
            }

            pr_state="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.state')"
            pr_draft="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.draft')"
            pr_head_repo="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.repo.full_name')"
            pr_head_sha="$(gh api "repos/$GH_REPO/pulls/$PR_NUMBER" --jq '.head.sha')"
            [[ "$pr_state" == "open" && "$pr_draft" == "true" && "$pr_head_repo" == "$GH_REPO" && "$pr_head_sha" == "$approved_sha" ]] || {
              echo "branch-gc command rejected: require open draft same-repo PR at exact approved head" >&2
              echo "state=$pr_state draft=$pr_draft head_repo=$pr_head_repo head_sha=$pr_head_sha approved_sha=$approved_sha" >&2
              exit 1
            }

            mapfile -t changed < <(
              gh api --paginate "repos/$GH_REPO/pulls/$PR_NUMBER/files?per_page=100" --jq '.[].filename'
            )
            [[ "${#changed[@]}" -eq 1 ]] || {
              echo "branch-gc command requires exactly one changed file; observed=${#changed[@]}" >&2
              printf '%s\n' "${changed[@]}" >&2
              exit 1
            }

            manifest="${changed[0]}"
            case "$manifest" in
              .github/branch-cleanup/*.txt) ;;
              *) echo "branch-gc command requires one branch-cleanup manifest, got: $manifest" >&2; exit 1 ;;
            esac

            approved_manifest="target/branch-gc/approved-manifest.txt"
            gh api               -H "Accept: application/vnd.github.raw+json"               "repos/$GH_REPO/contents/$manifest?ref=$approved_sha" > "$approved_manifest"
            [[ -s "$approved_manifest" ]] || { echo "approved manifest is empty" >&2; exit 1; }
            printf '%s\n' "$approved_manifest" > target/branch-gc/manifests.txt
            printf 'mode=admin_issue_comment\npr=%s\nadmin=%s\napproved_sha=%s\nmanifest=%s\n'               "$PR_NUMBER" "$COMMENTER" "$approved_sha" "$manifest" > target/branch-gc/approval.txt
          fi

          cat target/branch-gc/approval.txt
          cat target/branch-gc/manifests.txt

      - name: Delete only literal vetted refs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail

          mkdir -p target/branch-gc
          : > target/branch-gc/deleted.txt
          : > target/branch-gc/absent.txt
          : > target/branch-gc/skipped-open-pr.txt
          : > target/branch-gc/skipped-sha-mismatch.txt
          : > target/branch-gc/failed.txt

          gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | select(.head.repo.full_name == "'"$GH_REPO"'") | .head.ref' |
            sort -u > target/branch-gc/open-heads.txt

          # An open stacked PR may use a non-default branch as its base.
          # Protect those refs even when they are not open PR heads.
          gh api --paginate "repos/$GH_REPO/pulls?state=open&per_page=100" \
            --jq '.[] | .base.ref' |
            sort -u > target/branch-gc/open-bases.txt

          mapfile -t manifests < target/branch-gc/manifests.txt
          declare -A seen=()

          for manifest in "${manifests[@]}"; do
            while IFS= read -r raw || [[ -n "$raw" ]]; do
              entry="${raw%%#*}"
              entry="$(printf '%s' "$entry" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')"
              [[ -z "$entry" ]] && continue

              branch=""
              expected_sha=""
              extra=""
              read -r branch expected_sha extra <<< "$entry"

              if [[ -n "${extra:-}" ]]; then
                echo "invalid manifest entry (expected: <branch> [sha]): $entry" >&2
                printf '%s\n' "$entry" >> target/branch-gc/failed.txt
                continue
              fi

              if [[ -z "${expected_sha:-}" || ! "$expected_sha" =~ ^[0-9a-f]{40}$ ]]; then
                echo "missing or invalid expected SHA for $branch: ${expected_sha:-<missing>}" >&2
                printf '%s\n' "$entry" >> target/branch-gc/failed.txt
                continue
              fi

              if [[ -n "${seen[$branch]+x}" ]]; then
                continue
              fi
              seen["$branch"]=1

              if [[ "$branch" == "main" || "$branch" == "master" || "$branch" == "$DEFAULT_BRANCH" ]]; then
                echo "refusing protected/current branch: $branch" >&2
                printf '%s\n' "$branch" >> target/branch-gc/failed.txt
                continue
              fi

              if grep -Fxq "$branch" target/branch-gc/open-heads.txt; then
                echo "SKIP open PR head: $branch"
                printf '%s\n' "$branch" >> target/branch-gc/skipped-open-pr.txt
                continue
              fi

              if grep -Fxq "$branch" target/branch-gc/open-bases.txt; then
                echo "SKIP open PR base: $branch"
                printf '%s\n' "$branch" >> target/branch-gc/skipped-open-pr.txt
                continue
              fi

              remote_sha="$(git ls-remote --heads origin "refs/heads/$branch" | awk 'NR==1 {print $1}')"
              if [[ -z "$remote_sha" ]]; then
                echo "ABSENT $branch"
                printf '%s\n' "$branch" >> target/branch-gc/absent.txt
                continue
              fi

              if [[ "$remote_sha" != "$expected_sha" ]]; then
                echo "SKIP sha mismatch: $branch expected=$expected_sha actual=$remote_sha"
                printf '%s\t%s\t%s\n' "$branch" "$expected_sha" "$remote_sha" >> target/branch-gc/skipped-sha-mismatch.txt
                continue
              fi

              # Atomic compare-and-delete: a moved ref must survive.
              if git push --force-with-lease="refs/heads/$branch:$expected_sha" origin ":refs/heads/$branch"; then
                echo "DELETED $branch"
                printf '%s\n' "$branch" >> target/branch-gc/deleted.txt
              else
                echo "FAILED $branch" >&2
                printf '%s\n' "$branch" >> target/branch-gc/failed.txt
              fi
            done < "$manifest"
          done

          python - <<'PY'
          import json, pathlib
          root = pathlib.Path("target/branch-gc")
          def lines(name):
              p = root / name
              return [x.strip() for x in p.read_text().splitlines() if x.strip()]
          receipt = {
              "schema_version": "rar.branch-gc.v3",
              "deleted": lines("deleted.txt"),
              "already_absent": lines("absent.txt"),
              "skipped_open_pr": lines("skipped-open-pr.txt"),
              "skipped_sha_mismatch": lines("skipped-sha-mismatch.txt"),
              "failed": lines("failed.txt"),
          }
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2) + "\n")
          print(json.dumps(receipt, indent=2))
          if receipt["failed"]:
              raise SystemExit(1)
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: branch-gc-receipt
          path: target/branch-gc/
          if-no-files-found: error
