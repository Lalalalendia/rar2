name: Reader Consumer Preflight V1

on:
  workflow_call:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  tier-a:
    name: Reader consumer Tier A
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Test Reader preflight planner
        run: python tools/ci/test_reader_consumer_preflight.py

      - name: Run exact-head Reader seam preflight
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          python tools/ci/reader_consumer_preflight.py \
            --base "$base" \
            --head "$HEAD_SHA" \
            --receipt target/reader-consumer-preflight/receipt.json

      - name: Print final preflight receipt
        if: always()
        run: cat target/reader-consumer-preflight/receipt.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-consumer-preflight-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/reader-consumer-preflight/receipt.json
          if-no-files-found: error
