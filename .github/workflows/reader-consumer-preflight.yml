name: Reader Consumer Preflight V1

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tier-a:
    name: Reader consumer Tier A
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Share Cargo artifacts across the donor workspace and root product checks.
      # This keeps equivalent package compilations in one job-local cache.
      CARGO_TARGET_DIR: target/reader-tier-a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Restore Reader Tier A Cargo cache
        id: tier-a-cargo-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target/reader-tier-a
          key: ${{ runner.os }}-rust-1.94.1-reader-tier-a-${{ hashFiles('Cargo.lock', 'vendor/producer-a/Cargo.lock') }}-${{ github.event.pull_request.head.sha || github.sha }}
          restore-keys: |
            ${{ runner.os }}-rust-1.94.1-reader-tier-a-${{ hashFiles('Cargo.lock', 'vendor/producer-a/Cargo.lock') }}-

      - name: Report Reader Tier A Cargo cache
        run: echo "cache-hit=${{ steps.tier-a-cargo-cache.outputs.cache-hit }}"

      - name: Test Reader preflight planner
        run: python tools/ci/test_reader_consumer_preflight.py

      - name: Test Reader PR fanout classifier
        run: python tools/ci/test_reader_pr_fanout.py

      - name: Enforce active-content inertness
        run: |
          python tools/reader_active_content_guard.py --self-test
          python tools/reader_active_content_guard.py

      - name: Run exact-head Reader seam preflight
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          python tools/ci/reader_consumer_preflight.py \
            --base "$base" \
            --head "$HEAD_SHA" \
            --receipt target/reader-consumer-preflight/receipt.json

      - name: Print final preflight receipt
        if: always()
        run: cat target/reader-consumer-preflight/receipt.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-consumer-preflight-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/reader-consumer-preflight/receipt.json
          if-no-files-found: error
