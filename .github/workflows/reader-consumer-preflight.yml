name: Reader Consumer Preflight V1

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "apps/chaptera-desktop/**"
      - "crates/chaptera-mobile-reader-core/**"
      - "crates/chaptera-viewer-render-plan/**"
      - "vendor/producer-a/Cargo.toml"
      - "vendor/producer-a/Cargo.lock"
      - "vendor/producer-a/crates/pub-core/**"
      - "vendor/producer-a/crates/pub-cfb/**"
      - "vendor/producer-a/crates/pub-contents/**"
      - "vendor/producer-a/crates/pub-escher/**"
      - "vendor/producer-a/crates/pub-model/**"
      - "vendor/producer-a/crates/pub-quill/**"
      - "vendor/producer-a/crates/pub-reader/**"
      - "vendor/producer-a/crates/pub-layout/**"
      - "vendor/producer-a/crates/pub-viewer/**"

permissions:
  contents: read

jobs:
  tier-a:
    name: Reader consumer Tier A
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Share Cargo artifacts across the donor workspace and root product checks.
      # This keeps equivalent package compilations in one job-local cache.
      CARGO_TARGET_DIR: target/reader-tier-a
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Build Tier A Cargo cache key
        id: tier-a-cache-key
        shell: bash
        env:
          MANIFEST_HASH: ${{ hashFiles('Cargo.toml', 'apps/chaptera-desktop/Cargo.toml', 'crates/chaptera-mobile-reader-core/Cargo.toml', 'crates/chaptera-viewer-render-plan/Cargo.toml', 'vendor/producer-a/Cargo.toml', 'vendor/producer-a/crates/**/Cargo.toml') }}
        run: |
          set -euo pipefail
          test -n "$MANIFEST_HASH"
          echo "key=reader-tier-a-v2-${RUNNER_OS}-rust-1.94.1-${MANIFEST_HASH}" >> "$GITHUB_OUTPUT"

      - name: Restore/save Tier A Cargo build cache
        id: tier-a-cargo-cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: target/reader-tier-a
          key: ${{ steps.tier-a-cache-key.outputs.key }}

      - name: Test Reader preflight planner
        run: python tools/ci/test_reader_consumer_preflight.py

      - name: Test Reader PR fanout classifier
        run: python tools/ci/test_reader_pr_fanout.py

      - name: Enforce active-content inertness
        run: |
          python tools/reader_active_content_guard.py --self-test
          python tools/reader_active_content_guard.py

      - name: Run exact-head Reader seam preflight
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          base="$BASE_SHA"
          if [[ -z "$base" ]]; then
            base="$(git rev-parse "$HEAD_SHA^")"
          fi
          python tools/ci/reader_consumer_preflight.py \
            --base "$base" \
            --head "$HEAD_SHA" \
            --receipt target/reader-consumer-preflight/receipt.json

      - name: Print final preflight receipt
        if: always()
        run: cat target/reader-consumer-preflight/receipt.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-consumer-preflight-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/reader-consumer-preflight/receipt.json
          if-no-files-found: error
