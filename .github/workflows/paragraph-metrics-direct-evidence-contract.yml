name: Paragraph metrics direct evidence chain contract

on:
  pull_request:
    paths:
      - "tools/windows/run_paragraph_metrics_auth_direct.ps1"
      - ".github/workflows/paragraph-metrics-direct-evidence-contract.yml"

permissions:
  contents: read

concurrency:
  group: paragraph-metrics-direct-evidence-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Parse launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $path = "tools/windows/run_paragraph_metrics_auth_direct.ps1"
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path $path).Path,
            [ref]$tokens,
            [ref]$errors
          )
          if ($errors.Count -ne 0) {
            $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
            throw "PowerShell parser rejected direct paragraph launcher"
          }

      - name: Enforce complete evidence ordering
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $text = Get-Content "tools/windows/run_paragraph_metrics_auth_direct.ps1" -Raw
          foreach ($required in @(
            "ExpectedStructuralMerge",
            "git diff --quiet",
            "build --offline --locked --release",
            "paragraph_metrics_auth_01_blast_radius.py",
            "paragraph_metrics_auth_01_structural.py",
            "paragraph-metrics-auth-01-structural.json",
            "paragraph_metric_semantics_granted",
            "effective_line_origins_and_heights",
            "evidence-manifest.json"
          )) {
            if (-not $text.Contains($required)) {
              throw "Missing complete-direct marker: $required"
            }
          }
          $blast = $text.IndexOf('& $python.Source $Analyzer --output-root $OutputRoot')
          $structural = $text.IndexOf('& $python.Source $Structural --output-root $OutputRoot --snapshot-tool $Probe')
          $finalize = $text.IndexOf('& powershell.exe -NoProfile -ExecutionPolicy Bypass -File $Finalize')
          if ($blast -lt 0 -or $structural -lt 0 -or $finalize -lt 0) {
            throw "Could not locate evidence-chain steps"
          }
          if (-not ($blast -lt $structural -and $structural -lt $finalize)) {
            throw "Evidence chain must be native -> blast -> structural -> finalize"
          }
