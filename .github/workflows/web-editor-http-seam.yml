name: Web Editor HTTP seam V1

on:
  pull_request:
    paths:
      - "apps/web/editor-service-client-v1.mjs"
      - "apps/web/current-authoring-graph-scene-v1.mjs"
      - "apps/web/current-authoring-graph-scene-v1.test.mjs"
      - "apps/web/chaptera-product-editor-service-v1.mjs"
      - "apps/web/chaptera-product-editor-service-v1.test.mjs"
      - "apps/web/observability-v1.mjs"
      - "apps/web/observability-v1.test.mjs"
      - "apps/web/editor-shell-http-harness.html"
      - "apps/web/editor-shell-v1.mjs"
      - "apps/web/reader-scene-editor-interaction-v1.mjs"
      - "apps/web/reader-scene-editor-interaction-v1.test.mjs"
      - "apps/web/rich-reader-editor-shell-v1.mjs"
      - "apps/web/rich-reader-editor-shell-v1.test.mjs"
      - "apps/web/rich-reader-editor-harness.html"
      - "apps/web/product-editor.html"
      - "apps/web/cloud-project-new.html"
      - "apps/web/cloud-project-new.css"
      - "apps/web/cloud-project-new-v1.mjs"
      - "apps/web/chaptera-cloud-workspace-session-v1.mjs"
      - "apps/web/chaptera-cloud-workspace-session-v1.test.mjs"
      - "apps/web/chaptera-cloud-source-ingress-v1.mjs"
      - "apps/web/chaptera-cloud-source-ingress-v1.test.mjs"
      - "apps/web/product-editor.css"
      - "apps/web/product-editor-entry-v1.mjs"
      - "apps/web/product-editor-entry-v1.test.mjs"
      - "tools/run_rich_reader_editor_harness.mjs"
      - "tools/run_product_editor_entry_harness.mjs"
      - "tools/run_cloud_project_new_harness.mjs"
      - "services/editor-api/web_shell_http_harness.py"
      - "services/editor-api/observability.py"
      - "services/editor-api/test_observability.py"
      - "services/editor-api/revision_store.py"
      - "tools/run_web_editor_http_harness.mjs"
      - "docs/web-editor-http-seam-v1.md"
      - "docs/cloud-editor-observability-v1.md"
      - ".github/workflows/web-editor-http-seam.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  http-seam:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Regression revision service kernel
        working-directory: services/editor-api
        run: python -m unittest -v test_revision_store.py test_observability.py
      - name: Regression browser shell primitives
        run: |
          node --test apps/web/interaction-v1.test.mjs
          node --test apps/web/current-authoring-graph-scene-v1.test.mjs
          node --test apps/web/chaptera-product-editor-service-v1.test.mjs
          node --test apps/web/render-v1.test.mjs
          node --test apps/web/observability-v1.test.mjs
          node --test apps/web/reader-scene-editor-interaction-v1.test.mjs
          node --test apps/web/rich-reader-editor-shell-v1.test.mjs
          node --test apps/web/product-editor-entry-v1.test.mjs
          node --test apps/web/file-entry-v1.test.mjs
          node --test apps/web/chaptera-cloud-workspace-session-v1.test.mjs
          node --test apps/web/chaptera-cloud-source-ingress-v1.test.mjs
      - name: Install Playwright
        run: npm install --no-save playwright@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser-to-HTTP process boundary
        run: node tools/run_web_editor_http_harness.mjs
      - name: Smoke rich Reader pixels with canonical MoveNode overlay
        run: node tools/run_rich_reader_editor_harness.mjs
      - name: Smoke same-origin Product Editor entry with synthetic AuthN/Product API
        run: node tools/run_product_editor_entry_harness.mjs
      - name: Smoke new PUB project file picker against synthetic SourceIngress transport
        run: node tools/run_cloud_project_new_harness.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: web-editor-http-seam-chromium
          path: |
            target/web-editor-http/chromium-http-*
            target/web-editor-rich/chromium-rich-editor-smoke.json
            target/web-editor-product/chromium-product-editor-entry-smoke.json
            target/web-editor-product/chromium-project-new-synthetic.json
          if-no-files-found: error
