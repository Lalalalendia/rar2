name: struct-writer-replay-rustfmt-artifact

on:
  push:
    branches:
      - writer/struct-writer-replay-01
  workflow_dispatch:

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.89.0
          components: rustfmt
      - name: Format T406 writer files
        run: |
          rustfmt --edition 2024 vendor/producer-a/crates/pub-writer/src/lib.rs vendor/producer-a/crates/pub-writer/src/structural_replay.rs
      - uses: actions/upload-artifact@v4
        with:
          name: t406-rustfmt
          path: |
            vendor/producer-a/crates/pub-writer/src/lib.rs
            vendor/producer-a/crates/pub-writer/src/structural_replay.rs
          if-no-files-found: error
