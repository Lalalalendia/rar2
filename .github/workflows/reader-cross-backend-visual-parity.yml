name: Reader cross-backend visual parity
# Manual parity owner also emits linked-Story slice proof censuses.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/reader-cross-backend-visual-parity.yml"

permissions:
  contents: read

jobs:
  cloud-raster:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_TARGET_DIR: target/reader-cross-backend-cloud
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Acquire pinned SampleNewsletter
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/SampleNewsletter.pub"
          curl -fsSL --retry 3 \
            "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" \
            -o "$fixture"
          echo "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf  $fixture" | sha256sum -c -
          test "$(stat -c%s "$fixture")" = "291840"
          echo "CHAPTERA_READER_SCENE_PROBE_PUB=$fixture" >> "$GITHUB_ENV"
          echo "CHAPTERA_READER_SCENE_PROBE_SHA256=6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" >> "$GITHUB_ENV"
          cat > "$RUNNER_TEMP/cross-backend-manifest.json" <<EOF
          {
            "fixtures": [{
              "name": "SampleNewsletter",
              "sha256": "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf",
              "bytes": 291840,
              "pages": 4,
              "require_render": true,
              "require_shared_text": true,
              "source_path": "$fixture"
            }]
          }
          EOF

      - name: Install Chromium acceptance runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Build canonical Cloud Reader scene producer
        run: cargo build -p chaptera-server --bin chaptera --jobs 2

      - name: Census Cloud shared-layout fallback causes
        run: cargo test -p chaptera-server real_reference_text_layout_fallback_census_probe -- --ignored --nocapture

      - name: Census Story extent mismatch causes
        run: cargo test -p chaptera-server --test reader_story_extent_census sample_newsletter_story_extent_mismatch_census -- --ignored --nocapture

      - name: Render Cloud Reader pages at 144 DPI
        env:
          READER_REAL_MANIFEST: ${{ runner.temp }}/cross-backend-manifest.json
          READER_REAL_OUTPUT: target/reader-cross-backend-cloud-pages
          READER_REFERENCE_RASTER_DPI: "144"
          READER_WORKER_BINARY: target/reader-cross-backend-cloud/debug/chaptera
        run: node apps/cloud-reader/real-browser.test.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: reader-cross-backend-cloud
          path: |
            target/reader-cross-backend-cloud-pages/SampleNewsletter-page-*.png
            target/reader-cross-backend-cloud-pages/receipt.json
          if-no-files-found: error
          retention-days: 7

  local-raster:
    runs-on: windows-latest
    timeout-minutes: 35
    env:
      CARGO_TARGET_DIR: target/reader-cross-backend-local
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Acquire pinned SampleNewsletter
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $hash"
          }
          if ((Get-Item $fixture).Length -ne 291840) {
            throw "SampleNewsletter byte length mismatch"
          }
          $out = Join-Path $env:RUNNER_TEMP "reader-cross-backend-local-pages"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          "CHAPTERA_CROSS_BACKEND_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CHAPTERA_CROSS_BACKEND_DESKTOP_OUT=$out" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Render local Reader pages at 144 DPI
        run: cargo test -p chaptera-desktop --features reader-only sample_newsletter_cross_backend_page_rasters_144dpi -- --ignored --nocapture

      - uses: actions/upload-artifact@v4
        with:
          name: reader-cross-backend-local
          path: ${{ env.CHAPTERA_CROSS_BACKEND_DESKTOP_OUT }}
          if-no-files-found: error
          retention-days: 7

  compare:
    needs: [cloud-raster, local-raster]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned image comparator
        run: python -m pip install --disable-pip-version-check --no-cache-dir "Pillow==11.3.0"
      - uses: actions/download-artifact@v4
        with:
          name: reader-cross-backend-cloud
          path: target/cross-backend/cloud
      - uses: actions/download-artifact@v4
        with:
          name: reader-cross-backend-local
          path: target/cross-backend/local
      - name: Emit cross-backend visual differential
        run: |
          python tools/reader_cross_backend_visual_diff.py \
            --local-dir target/cross-backend/local \
            --cloud-dir target/cross-backend/cloud \
            --out target/cross-backend/reader-cross-backend-diff.json \
            --fixture SampleNewsletter \
            --pages 4 \
            --dpi 144
      - uses: actions/upload-artifact@v4
        with:
          name: reader-cross-backend-visual-diff
          path: target/cross-backend/reader-cross-backend-diff.json
          if-no-files-found: error
          retention-days: 30
