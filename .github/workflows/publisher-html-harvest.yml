name: Publisher HTML Metadata Harvest

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/publisher-html-harvest.yml"
      - "research/publisher_html_harvest.py"
      - "research/publisher_html_seed_urls.json"
  workflow_dispatch:

concurrency:
  group: publisher-html-harvest-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  harvest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Ensure PDF text extraction
        run: |
          command -v pdftotext || (sudo apt-get update && sudo apt-get install -y poppler-utils)

      - name: Test Publisher hidden-XML inference guards
        run: |
          python -m unittest research/test_publisher_html_harvest.py

      - name: Harvest public Publisher hidden XML
        run: |
          python research/publisher_html_harvest.py \
            --seeds research/publisher_html_seed_urls.json \
            --out out/publisher-html-harvest

      - name: Build legacy OplOdpo frontier receipt
        run: |
          python research/publisher_html_legacy_frontier.py \
            --harvest out/publisher-html-harvest/harvest.json \
            --out out/publisher-html-harvest/legacy-odpo-frontier.json

      - name: Close Publisher 11 FBID to FancyBorders catalog join
        run: |
          python research/publisher_html_borderart_join.py \
            --properties out/publisher-html-harvest/properties.json \
            --objects out/publisher-html-harvest/objects.json \
            --out out/publisher-html-harvest/borderart-fbid-join.json

      - name: Publish summary
        if: always()
        run: |
          if [ -f out/publisher-html-harvest/harvest.json ]; then
            python - <<'PY'
          import json
          from pathlib import Path
          d = json.loads(Path("out/publisher-html-harvest/harvest.json").read_text(encoding="utf-8"))
          keys = [
              "seed_count", "sources_ok", "sources_failed",
              "sources_with_properties", "deduplicated_payloads",
              "object_observations", "property_candidates_total",
              "property_observations", "property_observations_explicit",
              "property_observations_inferred", "property_observations_unresolved",
              "ambiguous_inference_key_count",
              "registry_entries", "unique_opl_classes", "unique_property_names",
              "publisher_versions"
          ]
          with open(Path.home() / "summary.md", "w", encoding="utf-8") as f:
              f.write("## Publisher HTML harvest\n\n")
              for key in keys:
                  f.write(f"- {key}: \`{d.get(key)}\`\n")
              f.write("\n### OPL classes\n\n")
              for value in d.get("classes", []):
                  f.write(f"- \`{value}\`\n")
          PY
            cat "$HOME/summary.md" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f out/publisher-html-harvest/legacy-odpo-frontier.json ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path("out/publisher-html-harvest/legacy-odpo-frontier.json").read_text(encoding="utf-8"))
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n## Legacy OplOdpo frontier\n\n")
              f.write(f"- present: `{d['present_count']}/{d['watch_count']}`\n")
              f.write(f"- missing: `{d['missing_count']}`\n")
              for row in d["rows"]:
                  mark = "present" if row["present"] else "missing"
                  f.write(f"- `{row['property_name']} {row['priv']}`: **{mark}**, sources={row['source_count']}\n")
          PY
          fi
          if [ -f out/publisher-html-harvest/borderart-fbid-join.json ]; then
            python - <<'PY'
          import json, os
          from pathlib import Path
          d = json.loads(Path("out/publisher-html-harvest/borderart-fbid-join.json").read_text(encoding="utf-8"))
          t = d["target"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as f:
              f.write("\n## FBID -> FancyBorders same-document join\n\n")
              f.write(f"- verdict: `{d['verdict']}`\n")
              f.write(f"- FBID: `{t['fbid_value']}` / priv `{t['fbid_priv']}`\n")
              f.write(f"- catalog-name match: `{t['catalog_name_match']}`\n")
              f.write(f"- Publication.OhFancyBorders <-> OplPlbFb handle join: `{','.join(t['handle_join'])}`\n")
              f.write(f"- four-way join: `{t['four_way_join']}`\n")
          PY
          fi

      - name: Upload derived corpus metadata
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: publisher-html-harvest
          path: |
            out/publisher-html-harvest/harvest.json
            out/publisher-html-harvest/objects.json
            out/publisher-html-harvest/properties.json
            out/publisher-html-harvest/properties.tsv
            out/publisher-html-harvest/registry.tsv
            out/publisher-html-harvest/version-diff.json
            out/publisher-html-harvest/legacy-odpo-frontier.json
            out/publisher-html-harvest/borderart-fbid-join.json
          if-no-files-found: error
          retention-days: 30
