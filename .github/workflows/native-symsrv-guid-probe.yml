name: Native SymSrv GUID Probe

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Probe exact PDB identities through DbgHelp and SymSrv
        shell: pwsh
        run: |
          python research\native_symsrv_probe.py
          Get-Content out\native-symsrv.json | Add-Content $env:GITHUB_STEP_SUMMARY
      - name: Guard binary boundary
        if: always()
        shell: pwsh
        run: |
          Remove-Item out\native-symcache -Recurse -Force -ErrorAction SilentlyContinue
      - name: Upload metadata only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-symsrv-probe-${{ github.run_id }}
          path: out/native-symsrv.json
          if-no-files-found: error
          retention-days: 30
