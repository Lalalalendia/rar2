name: Cloud Reader live HTTPS acceptance

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/guest_reader_http.rs"
      - "apps/web/temporary-editor-preview.html"
      - "apps/web/temporary-editor-preview.mjs"
      - "apps/web/temporary-editor-preview.css"
      - "apps/web/temporary-edit-browser-session-v0.mjs"
      - "apps/web/temporary-edit-move-client-v1.mjs"
      - "apps/web/reader-scene-editor-interaction-v1.mjs"
      - "apps/web/interaction-v1.mjs"
      - "apps/cloud-reader/render-v1.mjs"
      - "apps/chaptera-server/src/guest_reader_worker.rs"
      - "apps/chaptera-server/src/untrusted_pub_worker.rs"
      - "apps/chaptera-server/src/source_ingress_security.rs"
      - "apps/chaptera-server/src/blob_store.rs"
      - "apps/chaptera-server/src/blob_runtime.rs"
      - "apps/chaptera-server/src/s3_blob_provider.rs"
      - "apps/chaptera-server/src/config.rs"
      - "apps/chaptera-server/src/main.rs"
      - "apps/chaptera-server/migrations/**"
      - "crates/chaptera-untrusted-pub-scan/**"
      - "deploy/caddy/CloudReader.Caddyfile.example"
      - "tools/migration_pdf_worker_isolation.py"
      - "tools/run_cloud_reader_live_acceptance.py"
      - "tools/run_temporary_editor_current_acceptance.py"
      - "tools/run_temporary_editor_real_pub_browser_acceptance.py"
      - "tools/run_temporary_editor_real_pub_browser.mjs"
      - "tools/run_temporary_editor_real_pub_story_browser.mjs"
      - "tools/run_temporary_editor_real_pub_create_browser.mjs"
      - "tools/verify_temporary_guest_created_shape_export.py"
      - "tools/ci/verify_authored_rectangle_export.py"
      - "tools/verify_temporary_guest_story_export.py"
      - "tools/verify_temporary_guest_pdf_geometry.py"
      - "tools/verify_temporary_guest_resize_export.py"
      - ".github/workflows/cloud-reader-live-https-acceptance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  live-https:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      FIXTURE_SHA256: ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87
      FIXTURE_URL: https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleBrochure.pub
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify acceptance host dependencies
        run: |
          set -euo pipefail
          python -m py_compile tools/run_cloud_reader_live_acceptance.py tools/run_temporary_editor_current_acceptance.py tools/run_temporary_editor_real_pub_browser_acceptance.py tools/migration_pdf_worker_isolation.py tools/verify_temporary_guest_pdf_geometry.py tools/verify_temporary_guest_story_export.py tools/verify_temporary_guest_resize_export.py
          python -m unittest discover -s tools -p 'test_temporary_browser_log_safety.py'
          node --check tools/run_temporary_editor_real_pub_browser.mjs
          node --check tools/run_temporary_editor_real_pub_story_browser.mjs
          node --check tools/run_temporary_editor_real_pub_create_browser.mjs
          python -m py_compile tools/verify_temporary_guest_created_shape_export.py
          python - <<'PY'
          import ctypes.util
          assert ctypes.util.find_library("seccomp"), "libseccomp is required"
          PY
          curl --version
          sudo sh -c 'printf "%s\n" "127.0.0.1 s3.chaptera.test chaptera-quarantine.s3.chaptera.test chaptera-private.s3.chaptera.test" >> /etc/hosts'
          getent hosts s3.chaptera.test chaptera-quarantine.s3.chaptera.test chaptera-private.s3.chaptera.test

      - name: Fetch pinned renderable PUB
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-reader"
          curl --fail --location --retry 4 --retry-delay 2             "$FIXTURE_URL"             --output "$RUNNER_TEMP/live-reader/source.pub"
          printf '%s  %s\n' "$FIXTURE_SHA256" "$RUNNER_TEMP/live-reader/source.pub" | sha256sum -c -
          test "$(stat -c '%s' "$RUNNER_TEMP/live-reader/source.pub")" = "161792"

      - name: Fetch pinned authorable PUB for temporary-current proof
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" --output "$RUNNER_TEMP/live-reader/temp-current.pub"
          printf '%s  %s\n' "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" "$RUNNER_TEMP/live-reader/temp-current.pub" | sha256sum -c -
          test "$(stat -c '%s' "$RUNNER_TEMP/live-reader/temp-current.pub")" = "291840"

      - name: Materialize immutable Publisher Sample3 Story source without raw artifacts
        env:
          STORY_FIXTURE_SHA256: 424c69173ff08948c2529c8084b4ac2403f1ff1057146f4edd02fc29b44481fc
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import hashlib
          import os
          from pathlib import Path
          source = Path("vendor/producer-a/crates/pub-quill/tests/fixtures/Sample3.pub.b64")
          original = base64.b64decode("".join(source.read_text().split()), validate=True)
          assert len(original) == 72192
          assert hashlib.sha256(original).hexdigest() == os.environ["STORY_FIXTURE_SHA256"]
          (Path(os.environ["RUNNER_TEMP"]) / "live-reader" / "story.pub").write_bytes(original)
          PY

      - name: Install pinned Caddy
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz             --output "$RUNNER_TEMP/live-reader/caddy.tar.gz"
          echo "5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd  $RUNNER_TEMP/live-reader/caddy.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/live-reader/caddy.tar.gz" -C "$RUNNER_TEMP/live-reader" caddy
          "$RUNNER_TEMP/live-reader/caddy" version

      - name: Build canonical one-binary server and isolated workers
        run: cargo build -p chaptera-server --bin chaptera --jobs 2

      - name: Exercise HTTPS upload open Scene and TTL deletion
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/run_cloud_reader_live_acceptance.py             --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera"             --structural-worker "$GITHUB_WORKSPACE/target/debug/chaptera"             --caddy "$RUNNER_TEMP/live-reader/caddy"             --fixture "$RUNNER_TEMP/live-reader/source.pub"             --fixture-sha256 "$FIXTURE_SHA256"             --repository-commit "$REPOSITORY_COMMIT_SHA"             --out "$GITHUB_WORKSPACE/target/cloud-reader-live-https"

      - name: Prove filesystem-only temporary EditorSession current through real HTTPS
        run: |
          python tools/run_temporary_editor_current_acceptance.py \
            --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
            --caddy "$RUNNER_TEMP/live-reader/caddy" \
            --fixture "$RUNNER_TEMP/live-reader/temp-current.pub" \
            --fixture-sha256 "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" \
            --out "$GITHUB_WORKSPACE/target/temporary-editor-current"

      - name: Install pinned physical Chromium acceptance dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove real no-login PUB browser upload MoveNode reload and edited download over HTTPS
        run: |
          python tools/run_temporary_editor_real_pub_browser_acceptance.py \
            --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
            --caddy "$RUNNER_TEMP/live-reader/caddy" \
            --fixture "$RUNNER_TEMP/live-reader/temp-current.pub" \
            --fixture-sha256 "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" \
            --out "$GITHUB_WORKSPACE/target/temporary-editor-browser"

      # Reuse the same built Rust binary and pinned real PUB. This is a
      # separate anonymous browser session with a PDF physical geometry oracle.
      - name: Prove real PUB Chromium HTTPS MoveNode to current PDF physical rectangle
        run: |
          python tools/run_temporary_editor_real_pub_browser_acceptance.py \
            --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
            --caddy "$RUNNER_TEMP/live-reader/caddy" \
            --fixture "$RUNNER_TEMP/live-reader/temp-current.pub" \
            --fixture-sha256 "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" \
            --target pdf \
            --out "$GITHUB_WORKSPACE/target/temporary-editor-browser-pdf"

      - name: Install independent editable-output consumers
        run: |
          set -euo pipefail
          # Never time out apt while dpkg is installing: download the verified
          # Ubuntu package closure first, then install it without networking.
          apt_opts=(-o Acquire::Retries=1 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15)
          consumers=(scribus libreoffice-draw xvfb)
          if ! sudo timeout --kill-after=10s 120s apt-get "${apt_opts[@]}" update ||
             ! sudo timeout --kill-after=10s 180s apt-get "${apt_opts[@]}" install -y --download-only --no-install-recommends "${consumers[@]}"; then
            # The default GitHub Ubuntu image advertises a signed Ubuntu mirror
            # list: switch away from intermittent azure.archive download stalls.
            mirror_file=/etc/apt/apt-mirrors.txt
            if [[ ! -f "$mirror_file" ]] || ! grep -Fq "http://azure.archive.ubuntu.com/ubuntu" "$mirror_file"; then
              echo "::error::Expected Ubuntu Azure mirrorlist unavailable; no untrusted package source fallback" >&2
              exit 1
            fi
            echo "::warning::Primary Ubuntu mirror exceeded bounded budget; retrying official archive.ubuntu.com"
            sudo sed -i 's@http://azure.archive.ubuntu.com/ubuntu@http://archive.ubuntu.com/ubuntu@g' "$mirror_file"
            sudo timeout --kill-after=10s 120s apt-get "${apt_opts[@]}" update
            sudo timeout --kill-after=10s 300s apt-get "${apt_opts[@]}" install -y --download-only --no-install-recommends "${consumers[@]}"
          fi
          # Ubuntu's apt signatures/package checks remain authoritative. No
          # consumer or independent product assertion may be skipped on errors.
          sudo apt-get "${apt_opts[@]}" install -y --no-download --no-install-recommends "${consumers[@]}"
          command -v scribus
          command -v libreoffice
          command -v xvfb-run

      - name: Prove real Chromium ArrowRight via canonical MoveNode and Scribus IDML consumer
        run: |
          python tools/run_temporary_editor_real_pub_browser_acceptance.py \
            --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
            --caddy "$RUNNER_TEMP/live-reader/caddy" \
            --fixture "$RUNNER_TEMP/live-reader/temp-current.pub" \
            --fixture-sha256 "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" \
            --target keyboard-idml \
            --out "$GITHUB_WORKSPACE/target/temporary-editor-keyboard-idml"

      - name: Prove real Chromium ResizeNode via physical IDML/ODG target geometry
        run: |
          set -euo pipefail
          # This uses the canonical eight-handle browser flow, not a direct
          # synthetic mutation. Independent XML consumers inspect the actual
          # files downloaded by Chromium, not a generated expected project.
          for target in idml odg; do
            python tools/run_temporary_editor_real_pub_browser_acceptance.py \
              --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
              --caddy "$RUNNER_TEMP/live-reader/caddy" \
              --fixture "$RUNNER_TEMP/live-reader/temp-current.pub" \
              --fixture-sha256 "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" \
              --target "resize-$target" \
              --out "$GITHUB_WORKSPACE/target/temporary-editor-resize-$target"
          done


      # Real Chromium/Caddy/Rust isolation, not the synthetic browser seam.
      - name: Prove real PUB Chromium CreateShape and IDML/ODG physical consumers
        run: |
          set -euo pipefail
          for target in idml odg; do
            python tools/run_temporary_editor_real_pub_browser_acceptance.py \
              --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
              --caddy "$RUNNER_TEMP/live-reader/caddy" \
              --fixture "$RUNNER_TEMP/live-reader/temp-current.pub" \
              --fixture-sha256 "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" \
              --target "create-$target" \
              --out "$GITHUB_WORKSPACE/target/temporary-editor-create-$target"
          done

      - name: Prove real Guest Story edit through isolated worker and physical IDML/ODG consumer
        run: |
          set -euo pipefail
          for target in idml odg; do
            python tools/run_temporary_editor_real_pub_browser_acceptance.py \
              --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
              --caddy "$RUNNER_TEMP/live-reader/caddy" \
              --fixture "$RUNNER_TEMP/live-reader/story.pub" \
              --fixture-sha256 "424c69173ff08948c2529c8084b4ac2403f1ff1057146f4edd02fc29b44481fc" \
              --target "story-$target" \
              --out "$GITHUB_WORKSPACE/target/temporary-editor-story-$target"
          done

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-reader-live-https-acceptance
          path: |
            target/cloud-reader-live-https/receipt.json
            target/cloud-reader-live-https/chaptera.log
            target/cloud-reader-live-https/caddy.log
            target/temporary-editor-current/receipt.json
            target/temporary-editor-current/chaptera.log
            target/temporary-editor-current/caddy.log
            target/temporary-editor-browser/receipt.json
            target/temporary-editor-browser/chaptera.log
            target/temporary-editor-browser/caddy.log
            target/temporary-editor-browser-pdf/receipt.json
            target/temporary-editor-browser-pdf/chaptera.log
            target/temporary-editor-browser-pdf/caddy.log
            target/temporary-editor-story-idml/receipt.json
            target/temporary-editor-story-odg/receipt.json
            target/temporary-editor-keyboard-idml/receipt.json
            target/temporary-editor-resize-idml/receipt.json
            target/temporary-editor-resize-odg/receipt.json
            target/temporary-editor-create-idml/receipt.json
            target/temporary-editor-create-odg/receipt.json
          if-no-files-found: warn
          retention-days: 30
