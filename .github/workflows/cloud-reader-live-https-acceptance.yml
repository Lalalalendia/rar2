name: Cloud Reader live HTTPS acceptance

on:
  pull_request:
    paths:
      - "apps/chaptera-server/src/guest_reader_http.rs"
      - "apps/web/temporary-editor-preview.html"
      - "apps/web/temporary-editor-preview.mjs"
      - "apps/web/temporary-editor-preview.css"
      - "apps/web/temporary-edit-browser-session-v0.mjs"
      - "apps/web/temporary-edit-move-client-v1.mjs"
      - "apps/web/reader-scene-editor-interaction-v1.mjs"
      - "apps/web/interaction-v1.mjs"
      - "apps/cloud-reader/render-v1.mjs"
      - "apps/chaptera-server/src/guest_reader_worker.rs"
      - "apps/chaptera-server/src/untrusted_pub_worker.rs"
      - "apps/chaptera-server/src/source_ingress_security.rs"
      - "apps/chaptera-server/src/blob_store.rs"
      - "apps/chaptera-server/src/blob_runtime.rs"
      - "apps/chaptera-server/src/s3_blob_provider.rs"
      - "apps/chaptera-server/src/config.rs"
      - "apps/chaptera-server/src/main.rs"
      - "apps/chaptera-server/migrations/**"
      - "crates/chaptera-untrusted-pub-scan/**"
      - "deploy/caddy/CloudReader.Caddyfile.example"
      - "tools/migration_pdf_worker_isolation.py"
      - "tools/run_cloud_reader_live_acceptance.py"
      - "tools/run_temporary_editor_current_acceptance.py"
      - "tools/run_temporary_editor_real_pub_browser_acceptance.py"
      - "tools/run_temporary_editor_real_pub_browser.mjs"
      - ".github/workflows/cloud-reader-live-https-acceptance.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  live-https:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      FIXTURE_SHA256: ffed034ac87e679f0bd08ff9cf74ad11c0e0e510a42b1bc1a7502415f6c29c87
      FIXTURE_URL: https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleBrochure.pub
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify acceptance host dependencies
        run: |
          set -euo pipefail
          python -m py_compile tools/run_cloud_reader_live_acceptance.py tools/run_temporary_editor_current_acceptance.py tools/run_temporary_editor_real_pub_browser_acceptance.py tools/migration_pdf_worker_isolation.py
          python - <<'PY'
          import ctypes.util
          assert ctypes.util.find_library("seccomp"), "libseccomp is required"
          PY
          curl --version
          sudo sh -c 'printf "%s\n" "127.0.0.1 s3.chaptera.test chaptera-quarantine.s3.chaptera.test chaptera-private.s3.chaptera.test" >> /etc/hosts'
          getent hosts s3.chaptera.test chaptera-quarantine.s3.chaptera.test chaptera-private.s3.chaptera.test

      - name: Fetch pinned renderable PUB
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/live-reader"
          curl --fail --location --retry 4 --retry-delay 2             "$FIXTURE_URL"             --output "$RUNNER_TEMP/live-reader/source.pub"
          printf '%s  %s\n' "$FIXTURE_SHA256" "$RUNNER_TEMP/live-reader/source.pub" | sha256sum -c -
          test "$(stat -c '%s' "$RUNNER_TEMP/live-reader/source.pub")" = "161792"

      - name: Fetch pinned authorable PUB for temporary-current proof
        run: |
          set -euo pipefail
          curl --fail --location --retry 4 --retry-delay 2 "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" --output "$RUNNER_TEMP/live-reader/temp-current.pub"
          printf '%s  %s\n' "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" "$RUNNER_TEMP/live-reader/temp-current.pub" | sha256sum -c -
          test "$(stat -c '%s' "$RUNNER_TEMP/live-reader/temp-current.pub")" = "291840"

      - name: Install pinned Caddy
        run: |
          set -euo pipefail
          curl --fail --location --retry 3             https://github.com/caddyserver/caddy/releases/download/v2.10.2/caddy_2.10.2_linux_amd64.tar.gz             --output "$RUNNER_TEMP/live-reader/caddy.tar.gz"
          echo "5c218bc34c9197369263da7e9317a83acdbd80ef45d94dca5eff76e727c67cdd  $RUNNER_TEMP/live-reader/caddy.tar.gz" | sha256sum --check
          tar --no-same-owner -xzf "$RUNNER_TEMP/live-reader/caddy.tar.gz" -C "$RUNNER_TEMP/live-reader" caddy
          "$RUNNER_TEMP/live-reader/caddy" version

      - name: Build canonical one-binary server and isolated workers
        run: cargo build -p chaptera-server --bin chaptera --jobs 2

      - name: Exercise HTTPS upload open Scene and TTL deletion
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python tools/run_cloud_reader_live_acceptance.py             --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera"             --structural-worker "$GITHUB_WORKSPACE/target/debug/chaptera"             --caddy "$RUNNER_TEMP/live-reader/caddy"             --fixture "$RUNNER_TEMP/live-reader/source.pub"             --fixture-sha256 "$FIXTURE_SHA256"             --repository-commit "$REPOSITORY_COMMIT_SHA"             --out "$GITHUB_WORKSPACE/target/cloud-reader-live-https"

      - name: Prove filesystem-only temporary EditorSession current through real HTTPS
        run: |
          python tools/run_temporary_editor_current_acceptance.py \
            --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
            --caddy "$RUNNER_TEMP/live-reader/caddy" \
            --fixture "$RUNNER_TEMP/live-reader/temp-current.pub" \
            --fixture-sha256 "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" \
            --out "$GITHUB_WORKSPACE/target/temporary-editor-current"

      - name: Install pinned physical Chromium acceptance dependencies
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Prove real no-login PUB browser upload MoveNode reload and edited download over HTTPS
        run: |
          python tools/run_temporary_editor_real_pub_browser_acceptance.py \
            --chaptera "$GITHUB_WORKSPACE/target/debug/chaptera" \
            --caddy "$RUNNER_TEMP/live-reader/caddy" \
            --fixture "$RUNNER_TEMP/live-reader/temp-current.pub" \
            --fixture-sha256 "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf" \
            --out "$GITHUB_WORKSPACE/target/temporary-editor-browser"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cloud-reader-live-https-acceptance
          path: |
            target/cloud-reader-live-https/receipt.json
            target/cloud-reader-live-https/chaptera.log
            target/cloud-reader-live-https/caddy.log
            target/temporary-editor-current/receipt.json
            target/temporary-editor-current/chaptera.log
            target/temporary-editor-current/caddy.log
            target/temporary-editor-browser/receipt.json
            target/temporary-editor-browser/chaptera.log
            target/temporary-editor-browser/caddy.log
          if-no-files-found: warn
          retention-days: 30
