name: PUB manual research kit

on:
  workflow_dispatch:
    inputs:
      experiment:
        description: Manual Publisher experiment
        required: true
        type: choice
        options:
          - opentype-stylisticsets-2019-01
          - autofit-2019-01

permissions:
  contents: read

jobs:
  build-kit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Assemble manual experiment kit
        shell: bash
        run: |
          set -euo pipefail
          case "${{ inputs.experiment }}" in
            opentype-stylisticsets-2019-01)
              source_path="tools/research-runner/manual/opentype-stylisticsets-2019-01.md"
              ;;
            autofit-2019-01)
              source_path="tools/research-runner/manual/autofit-2019-01.md"
              ;;
            *)
              echo "Unknown experiment" >&2
              exit 1
              ;;
          esac

          mkdir -p out/pub-manual-kit
          cp "$source_path" out/pub-manual-kit/INSTRUCTIONS.md
          sha256sum "$source_path" > out/pub-manual-kit/runbook.sha256
          cat > out/pub-manual-kit/RETURN.txt <<'EOF'
          After completing the Publisher steps, return the named PUB outputs through a controlled/private channel.
          Do not commit native PUB outputs to the public rar2 repository.
          Attaching the outputs directly in the Chaptera/ChatGPT project is acceptable.
          EOF

      - name: Upload manual experiment kit
        uses: actions/upload-artifact@v4
        with:
          name: pub-manual-kit-${{ inputs.experiment }}-${{ github.run_id }}
          path: out/pub-manual-kit/**
          if-no-files-found: error
          retention-days: 30
