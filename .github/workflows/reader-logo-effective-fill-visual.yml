name: Reader PAGE LOGO effective-fill candidate visual A/B against LibreOffice

on:
  pull_request:
    paths:
      - ".github/workflows/reader-logo-effective-fill-visual.yml"
      - "tools/reader_logo_effective_fill_visual_v1.py"
      - "tools/test_reader_logo_0x31_visual_ab_v1.py"
  push:
    branches: [measure-logo-fill-2644]
    paths:
      - ".github/workflows/reader-logo-effective-fill-visual.yml"
      - "tools/reader_logo_effective_fill_visual_v1.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reader-logo-fill-visual-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  exact-raster:
    name: Exact ${{ matrix.arm }} Chromium raster
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arm: before
            source_ref: 33ee33d239c50cd8488579c37dc81679f8c04afa
          - arm: after
            source_ref: 2777a574e9eac1ccd1d24c3054f00f9dbe133f2a
    env:
      CARGO_TARGET_DIR: target/logo-visual-rust
      REPOSITORY_COMMIT_SHA: ${{ matrix.source_ref }}
      READER_REAL_MANIFEST: ${{ github.workspace }}/target/logo-source-manifest.json
      READER_REAL_OUTPUT: ${{ github.workspace }}/target/logo-reader-raster
      READER_REFERENCE_RASTER_DPI: "144"
      READER_WORKER_BINARY: ${{ github.workspace }}/target/logo-visual-rust/debug/chaptera
      READER_WORKER_TIMEOUT_SECONDS: "120"
      READER_WORKER_CPU_SECONDS: "90"
      READER_WORKER_ADDRESS_SPACE_MB: "768"

    steps:
      - name: Checkout exact pinned Reader source
        uses: actions/checkout@v5
        with:
          ref: ${{ matrix.source_ref }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Reacquire SHA-verified public PUB in temporary storage
        shell: bash
        run: |
          set -euo pipefail
          fixture="$RUNNER_TEMP/SampleNewsletter.pub"
          curl -fsSL --retry 3 --max-time 45 \
            "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" \
            -o "$fixture"
          echo "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf  $fixture" | sha256sum -c -
          test "$(stat -c%s "$fixture")" = "291840"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          temp = Path(os.environ["RUNNER_TEMP"])
          manifest = {"schema": "chaptera.cloud-reader-real-fixtures.v1", "fixtures": [{
              "name": "SampleNewsletter",
              "sha256": "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf",
              "bytes": 291840, "pages": 4, "require_render": True,
              "require_shared_text": True,
              "source_path": str(temp / "SampleNewsletter.pub"),
          }]}
          Path(os.environ["READER_REAL_MANIFEST"]).parent.mkdir(parents=True, exist_ok=True)
          Path(os.environ["READER_REAL_MANIFEST"]).write_text(json.dumps(manifest), encoding="utf-8")
          PY

      - name: Build exact Reader worker
        run: cargo build -p chaptera-server --bin chaptera --jobs 2

      - name: Install controlled Chromium
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture exact Reader customer-page PNGs at 144 DPI
        run: node apps/cloud-reader/real-browser.test.mjs

      - name: Upload derived page rasters and source-safe receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-logo-fill-${{ matrix.arm }}
          path: |
            target/logo-reader-raster/receipt.json
            target/logo-reader-raster/SampleNewsletter-page-*.png
          if-no-files-found: error
          retention-days: 7

  visual-delta:
    name: LO PDF proxy vs two exact Reader revisions
    needs: exact-raster
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact PDF comparator
        run: python -m pip install --disable-pip-version-check --no-cache-dir "PyMuPDF==1.26.7"
      - name: Run source identity and fail-closed measurement tests
        run: python tools/test_reader_logo_0x31_visual_ab_v1.py
      - uses: actions/download-artifact@v4
        with:
          name: reader-logo-fill-before
          path: target/logo-visual/before
      - uses: actions/download-artifact@v4
        with:
          name: reader-logo-fill-after
          path: target/logo-visual/after

      - name: Install LibreOffice Draw Publisher importer
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends libreoffice-draw

      - name: SHA-verify source and export independent LibreOffice PDF
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/logo-visual-reference" target/logo-visual/report
          fixture="$RUNNER_TEMP/logo-visual-reference/SampleNewsletter.pub"
          curl -fsSL --retry 3 --max-time 45 \
            "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub" \
            -o "$fixture"
          echo "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf  $fixture" | sha256sum -c -
          test "$(stat -c%s "$fixture")" = "291840"
          libreoffice --version > "$RUNNER_TEMP/logo-visual-reference/lo-version.txt"
          timeout 120s libreoffice \
            -env:UserInstallation="file://$RUNNER_TEMP/logo-visual-private-profile" \
            --headless --convert-to pdf \
            --outdir "$RUNNER_TEMP/logo-visual-reference" "$fixture"
          test -s "$RUNNER_TEMP/logo-visual-reference/SampleNewsletter.pdf"
          python - <<'PY'
          import os
          from pathlib import Path
          import fitz
          source = Path(os.environ["RUNNER_TEMP"]) / "logo-visual-reference" / "SampleNewsletter.pdf"
          with fitz.open(source) as doc:
              assert doc.page_count == 4, f"LibreOffice pages: {doc.page_count} (expected 4)"
              pix = doc.load_page(3).get_pixmap(dpi=144, colorspace=fitz.csRGB, alpha=False)
              pix.save("target/logo-visual/report/libreoffice-customer-page-4.png")
          PY

      - name: Measure actual before/after pixels against one PDF
        shell: bash
        run: |
          set -euo pipefail
          python tools/reader_logo_effective_fill_visual_v1.py \
            --baseline target/logo-visual/before/receipt.json \
            --candidate target/logo-visual/after/receipt.json \
            --reference "$RUNNER_TEMP/logo-visual-reference/SampleNewsletter.pdf" \
            --lo-version-file "$RUNNER_TEMP/logo-visual-reference/lo-version.txt" \
            --output target/logo-visual/report/visual-ab.json
          cp target/logo-visual/before/SampleNewsletter-page-4.png target/logo-visual/report/reader-before-customer-page-4.png
          cp target/logo-visual/after/SampleNewsletter-page-4.png target/logo-visual/report/reader-after-customer-page-4.png
          cat target/logo-visual/report/visual-ab.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload source-safe numerical and p4 visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reader-logo-effective-fill-visual-ab
          path: target/logo-visual/report/
          if-no-files-found: warn
          retention-days: 14
