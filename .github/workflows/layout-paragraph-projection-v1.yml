name: Layout Paragraph Projection V1

on:
  pull_request:
    paths:
      - "crates/chaptera-layout-projection/**"
      - ".github/workflows/layout-paragraph-projection-v1.yml"
  workflow_dispatch:

concurrency:
  group: layout-paragraph-projection-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt -p chaptera-layout-projection -- --check
      - name: Check workspace
        run: cargo check -p chaptera-layout-projection --all-targets
      - name: Lint projection crate
        run: cargo clippy -p chaptera-layout-projection --all-targets -- -D warnings
      - name: Test paragraph projection
        run: cargo test -p chaptera-layout-projection
