name: Authoring AuthoredStack Runtime V1

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-editor/**"
      - "vendor/producer-a/crates/pub-editor/src/authored_stack_lifecycle_v1.rs"
      - "vendor/producer-a/crates/pub-editor/src/authored_stack_runtime_v1.rs"
      - "vendor/producer-a/crates/pub-editor/src/create_shape_runtime_v1.rs"
      - "vendor/producer-a/crates/pub-editor/src/lib.rs"
      - "vendor/producer-a/crates/pub-editor/tests/authored_stack_lifecycle_v1.rs"
      - "vendor/producer-a/crates/pub-editor/tests/authored_stack_runtime_v1.rs"
      - "vendor/producer-a/crates/pub-editor/tests/create_shape_runtime_v1.rs"
      - "vendor/producer-a/crates/pub-editor/tests/delete_node_runtime_v1.rs"
      - "apps/chaptera-server/src/revision_materializer.rs"
      - "apps/chaptera-desktop/src/agent.rs"
      - "tools/ci/pub_editor_pr_fanout.py"
      - "tools/ci/test_pub_editor_pr_fanout.py"
      - ".github/workflows/authoring-authored-stack-runtime-v1.yml"
  push:
    branches:
      - authoring-authored-stack-runtime-01
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pub-editor AuthoredStack Runtime scope
    runs-on: ubuntu-latest
    outputs:
      authored_stack_runtime: ${{ steps.scope.outputs.authored_stack_runtime }}
      reason: ${{ steps.scope.outputs.authored_stack_runtime_reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      - id: base-authority
        name: Resolve base-branch classifier authority
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch PR head for classification
        if: ${{ github.event_name == 'pull_request' }}
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Test base-authority pub-editor classifier
        run: python tools/ci/test_pub_editor_pr_fanout.py

      - id: scope
        name: Classify AuthoredStack Runtime ownership
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.base-authority.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p target/pub-editor-pr-fanout
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "authored_stack_runtime=true" >> "$GITHUB_OUTPUT"
            echo "authored_stack_runtime_reason=non_pr_event_fail_closed" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"schema":"chaptera.pub-editor-pr-fanout.v1","authored_stack_runtime":true,"authored_stack_runtime_reason":"non_pr_event_fail_closed"}' > target/pub-editor-pr-fanout/receipt.json
            exit 0
          fi
          python tools/ci/pub_editor_pr_fanout.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --receipt target/pub-editor-pr-fanout/receipt.json \
            --github-output "$GITHUB_OUTPUT"
          if ! grep -q '^authored_stack_runtime=' "$GITHUB_OUTPUT"; then
            echo "authored_stack_runtime=true" >> "$GITHUB_OUTPUT"
            echo "authored_stack_runtime_reason=base_classifier_missing_authored_stack_runtime_output" >> "$GITHUB_OUTPUT"
            python -c 'import json, pathlib; p=pathlib.Path("target/pub-editor-pr-fanout/receipt.json"); d=json.loads(p.read_text()); d["authored_stack_runtime"]=True; d["authored_stack_runtime_reason"]="base_classifier_missing_authored_stack_runtime_output"; p.write_text(json.dumps(d, indent=2, sort_keys=True) + "\n")'
          fi

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pub-editor-authored-stack-runtime-scope-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/pub-editor-pr-fanout/receipt.json
          if-no-files-found: warn

  runtime:
    needs: classify
    if: ${{ !cancelled() && always() && (needs.classify.result != 'success' || needs.classify.outputs.authored_stack_runtime == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Check pub-editor formatting
        run: cargo fmt --manifest-path vendor/producer-a/Cargo.toml -p pub-editor -- --check

      - name: Check pub-editor
        run: cargo check --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --all-targets

      - name: Lint pub-editor
        run: cargo clippy --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --all-targets -- -D warnings

      - name: Prove AuthoredStack runtime
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor --test authored_stack_runtime_v1 -- --nocapture

      - name: Re-run lifecycle CreateShape and DeleteNode
        run: >-
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-editor
          --test authored_stack_lifecycle_v1
          --test create_shape_runtime_v1
          --test delete_node_runtime_v1

      - name: Check server exhaustive consumer
        run: cargo check -p chaptera-server

      - name: Check desktop exhaustive consumer
        run: cargo check -p chaptera-desktop
