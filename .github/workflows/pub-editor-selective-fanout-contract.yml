name: Pub Editor selective fanout contract

on:
  pull_request:
    paths:
      - ".github/workflows/pub-editor-selective-fanout-contract.yml"
      - ".github/workflows/editor-desktop-continuity-v2-windows.yml"
      - ".github/workflows/editor-desktop-textbox-restore-v1.yml"
      - ".github/workflows/editor-fixed-pdf-current-revision.yml"
      - ".github/workflows/editor-duplicate-rectangle-v1.yml"
      - ".github/workflows/authoring-authored-stack-runtime-v1.yml"
      - "tools/ci/pub_editor_pr_fanout.py"
      - "tools/ci/test_pub_editor_pr_fanout.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pub-editor-selective-fanout-contract-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Compile classifier
        run: python -m py_compile tools/ci/pub_editor_pr_fanout.py tools/ci/test_pub_editor_pr_fanout.py

      - name: Test conservative pub-editor scope classifier
        run: python tools/ci/test_pub_editor_pr_fanout.py
