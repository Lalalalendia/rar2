name: Cancel stale native main runs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-main-obsolete-run-canceller.yml"
      - ".github/workflows/mature-029-native-page-spread-once.yml"
      - "tools/research-runner/operations/mature_029_native_page_spread_oracle_01.ps1"
      - ".github/workflows/quill-story-readonly-oracle-v2.yml"
      - "tools/research-runner/experiments/quill-story-readonly-oracle-02.packet.json"
      - "tools/research-runner/operations/quill_story_readonly_oracle_02.ps1"
      - "tools/windows/run_quill_story_readonly_oracle_direct.ps1"
      - "vendor/producer-a/crates/pub-reader/src/bin/quill-story-readonly-oracle-resolver.rs"

permissions:
  actions: write
  contents: read

concurrency:
  group: native-main-obsolete-run-canceller
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Keep newest active native push run per workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_WORKFLOW_PATHS: |
            .github/workflows/mature-029-native-page-spread-once.yml
            .github/workflows/quill-story-readonly-oracle-v2.yml
        run: |
          set -euo pipefail

          total_cancelled=0
          total_forced=0
          total_preserved=0

          while IFS= read -r workflow_path; do
            [[ -n "$workflow_path" ]] || continue

            runs_file="$(mktemp)"
            gh api --paginate --method GET "repos/$GH_REPO/actions/runs" \
              -f event=push \
              -f per_page=100 \
              | jq -r --arg path "$workflow_path" '
                  .workflow_runs[]
                  | select(.path == $path)
                  | select(
                      .status == "queued"
                      or .status == "pending"
                      or .status == "in_progress"
                      or .status == "waiting"
                      or .status == "requested"
                    )
                  | [.run_number, .id, .status, .head_sha, .created_at]
                  | @tsv
                ' >"$runs_file"

            if [[ ! -s "$runs_file" ]]; then
              echo "NONE workflow=$workflow_path"
              rm -f "$runs_file"
              continue
            fi

            newest_run_number="$(cut -f1 "$runs_file" | sort -nr | head -n1)"
            echo "WORKFLOW $workflow_path newest_active_run=$newest_run_number"

            while IFS=$'\t' read -r run_number id status head_sha created_at; do
              [[ -n "$id" ]] || continue

              if [[ "$run_number" == "$newest_run_number" ]]; then
                echo "KEEP   workflow=$workflow_path run=$run_number id=$id status=$status sha=${head_sha:0:12}"
                total_preserved=$((total_preserved + 1))
                continue
              fi

              echo "CANCEL workflow=$workflow_path run=$run_number id=$id status=$status sha=${head_sha:0:12}"
              if gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" >/dev/null 2>&1; then
                total_cancelled=$((total_cancelled + 1))
                continue
              fi

              echo "FORCE  workflow=$workflow_path run=$run_number id=$id status=$status sha=${head_sha:0:12}"
              if gh api --method POST "repos/$GH_REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1; then
                total_forced=$((total_forced + 1))
              else
                echo "::warning::Could not cancel or force-cancel run $id; it may have completed concurrently."
              fi
            done <"$runs_file"

            rm -f "$runs_file"
          done <<<"$TARGET_WORKFLOW_PATHS"

          echo "Preserved newest active native runs: $total_preserved"
          echo "Cancelled stale native runs: $total_cancelled"
          echo "Force-cancelled stale native runs: $total_forced"
