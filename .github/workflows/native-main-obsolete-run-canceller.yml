name: Cancel obsolete Publisher native run records

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-main-obsolete-run-canceller.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: native-main-obsolete-run-canceller
  cancel-in-progress: true

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel explicit legacy Publisher/provider runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          STALE_RUN_IDS: |
            36715683731
            36715220690
            36714192669
            37501126927
            37497839246
        run: |
          set -euo pipefail

          cancelled=0
          forced=0
          deleted=0
          unresolved=0

          cancel_run() {
            local id="$1"
            if gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" >/dev/null 2>&1; then
              echo "CANCEL id=$id"
              cancelled=$((cancelled + 1))
              return 0
            fi
            if gh api --method POST "repos/$GH_REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1; then
              echo "FORCE id=$id"
              forced=$((forced + 1))
              return 0
            fi
            return 1
          }

          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            state="$(gh api --method GET "repos/$GH_REPO/actions/runs/$id" --jq '.status' 2>/dev/null || true)"
            [[ -n "$state" ]] || continue
            if [[ "$state" == "completed" ]]; then
              echo "DONE id=$id"
              continue
            fi

            echo "STALE id=$id status=$state"
            if cancel_run "$id"; then
              continue
            fi

            if gh api --method DELETE "repos/$GH_REPO/actions/runs/$id" >/dev/null 2>&1; then
              echo "DELETE id=$id"
              deleted=$((deleted + 1))
            else
              echo "::warning::Run $id could not be cancelled, force-cancelled, or deleted"
              unresolved=$((unresolved + 1))
            fi
          done <<<"$STALE_RUN_IDS"

          {
            echo "### Publisher/native stale-run cleanup"
            echo "- cancelled: $cancelled"
            echo "- force-cancelled: $forced"
            echo "- deleted stale records: $deleted"
            echo "- unresolved provider records: $unresolved"
            echo "- no repository-wide Actions-history scan is performed"
            echo "- Publisher-native self-hosted execution remains forbidden"
          } >>"$GITHUB_STEP_SUMMARY"
