name: Reap obsolete provider-orphan workflow runs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-main-obsolete-run-canceller.yml"

permissions:
  actions: write
  checks: write
  contents: read

concurrency:
  group: native-main-obsolete-run-canceller
  cancel-in-progress: true

jobs:
  reap-orphans:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reap explicit provider-orphan runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ORPHANS: |
            36715683731 99434189605
            36715220690 99432872213
            36714192669 99429916465
        run: |
          set -u

          for row in $ORPHANS; do
            :
          done

          while read -r run_id suite_id; do
            [[ -n "${run_id:-}" ]] || continue

            echo "::group::orphan run=$run_id suite=$suite_id"
            state="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.status' 2>/dev/null || true)"
            echo "initial_state=$state"

            if [[ "$state" == "completed" ]]; then
              gh api --method DELETE "repos/$GH_REPO/actions/runs/$run_id" || true
              echo "::endgroup::"
              continue
            fi

            echo "--- cancel ---"
            gh api --include --method POST "repos/$GH_REPO/actions/runs/$run_id/cancel" || true

            echo "--- force-cancel ---"
            gh api --include --method POST "repos/$GH_REPO/actions/runs/$run_id/force-cancel" || true

            echo "--- rerequest check suite ---"
            gh api --include --method POST "repos/$GH_REPO/check-suites/$suite_id/rerequest" || true

            sleep 2
            state="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.status' 2>/dev/null || true)"
            echo "post_rerequest_state=$state"

            echo "--- delete workflow run ---"
            gh api --include --method DELETE "repos/$GH_REPO/actions/runs/$run_id" || true

            echo "::endgroup::"
          done <<<"$ORPHANS"

          echo "### Provider-orphan reaper" >> "$GITHUB_STEP_SUMMARY"
          while read -r run_id suite_id; do
            [[ -n "${run_id:-}" ]] || continue
            state="$(gh api "repos/$GH_REPO/actions/runs/$run_id" --jq '.status' 2>/dev/null || echo deleted)"
            echo "- $run_id: $state" >> "$GITHUB_STEP_SUMMARY"
          done <<<"$ORPHANS"
