name: Cancel obsolete automatic Publisher native runs

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-main-obsolete-run-canceller.yml"
      - ".github/workflows/mature-029-native-page-spread-once.yml"
      - ".github/workflows/master-projection-stack-auth-once.yml"
      - ".github/workflows/quill-story-readonly-oracle-v2.yml"
      - ".github/workflows/carlton-heading-alignment-native-once.yml"
      - ".github/workflows/borderart-native-once.yml"
      - ".github/workflows/paragraph-metrics-auth-once.yml"

permissions:
  actions: write
  contents: read

concurrency:
  group: native-main-obsolete-run-canceller
  cancel-in-progress: true

jobs:
  cancel-obsolete:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel automatic Publisher native backlog
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_WORKFLOW_PATHS: |
            .github/workflows/mature-029-native-page-spread-once.yml
            .github/workflows/master-projection-stack-auth-once.yml
            .github/workflows/quill-story-readonly-oracle-v2.yml
            .github/workflows/carlton-heading-alignment-native-once.yml
            .github/workflows/borderart-native-once.yml
            .github/workflows/paragraph-metrics-auth-once.yml
            .github/workflows/publisher-supplemental-native-surface-once.yml
            .github/workflows/t828-ignore-master-native-once.yml
            .github/workflows/supplemental-surface-stage-once.yml
          STALE_PROVIDER_RUN_IDS: |
            36715683731
            36715220690
            36714192669
            37501126927
            37497839246
        run: |
          set -euo pipefail

          cancelled=0
          forced=0
          deleted=0
          unresolved=0

          cancel_run() {
            local id="$1"
            if gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" >/dev/null 2>&1; then
              echo "CANCEL id=$id"
              cancelled=$((cancelled + 1))
              return 0
            fi
            if gh api --method POST "repos/$GH_REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1; then
              echo "FORCE id=$id"
              forced=$((forced + 1))
              return 0
            fi
            return 1
          }

          while IFS= read -r workflow_path; do
            [[ -n "$workflow_path" ]] || continue
            runs_file="$(mktemp)"
            gh api --paginate --method GET "repos/$GH_REPO/actions/runs" \
              -f event=push \
              -f per_page=100 \
              | jq -r --arg path "$workflow_path" '
                  .workflow_runs[]
                  | select(.path == $path)
                  | select(.head_branch == "main")
                  | select(
                      .status == "queued"
                      or .status == "pending"
                      or .status == "in_progress"
                      or .status == "waiting"
                      or .status == "requested"
                    )
                  | [.id, .run_number, .status, .head_sha]
                  | @tsv
                ' >"$runs_file"

            while IFS=$'\t' read -r id run_number status head_sha; do
              [[ -n "$id" ]] || continue
              echo "OBSOLETE workflow=$workflow_path run=$run_number id=$id status=$status sha=${head_sha:0:12}"
              if ! cancel_run "$id"; then
                echo "::warning::Could not cancel active automatic native run $id"
                unresolved=$((unresolved + 1))
              fi
            done <"$runs_file"
            rm -f "$runs_file"
          done <<<"$TARGET_WORKFLOW_PATHS"

          while IFS= read -r id; do
            [[ -n "$id" ]] || continue
            state="$(gh api --method GET "repos/$GH_REPO/actions/runs/$id" --jq '.status' 2>/dev/null || true)"
            [[ -n "$state" ]] || continue
            if [[ "$state" == "completed" ]]; then
              continue
            fi
            echo "STALE_PROVIDER id=$id status=$state"
            if cancel_run "$id"; then
              continue
            fi
            if gh api --method DELETE "repos/$GH_REPO/actions/runs/$id" >/dev/null 2>&1; then
              echo "DELETE id=$id"
              deleted=$((deleted + 1))
            else
              echo "::warning::Provider-orphan run $id could not be cancelled, force-cancelled, or deleted"
              unresolved=$((unresolved + 1))
            fi
          done <<<"$STALE_PROVIDER_RUN_IDS"

          {
            echo "### Publisher native queue cleanup"
            echo "- cancelled: $cancelled"
            echo "- force-cancelled: $forced"
            echo "- deleted stale records: $deleted"
            echo "- unresolved provider records: $unresolved"
            echo "- GitHub Publisher-native self-hosted execution: forbidden; native execution is local/manual handoff only"
          } >>"$GITHUB_STEP_SUMMARY"
