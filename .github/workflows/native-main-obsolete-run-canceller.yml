name: Cancel stale native main runs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/native-main-obsolete-run-canceller.yml"
      - ".github/workflows/mature-029-native-page-spread-once.yml"
      - "tools/research-runner/operations/mature_029_native_page_spread_oracle_01.ps1"
      - "tools/windows/run_mature_029_native_page_spread_direct.ps1"
      - ".github/workflows/master-projection-stack-auth-once.yml"
      - "tools/research-runner/operations/master_projection_stack_auth_01.ps1"
      - "tools/windows/run_master_projection_stack_auth_direct.ps1"

permissions:
  actions: write
  contents: read

concurrency:
  group: native-main-obsolete-run-canceller
  cancel-in-progress: true

jobs:
  cancel-stale:
    runs-on: ubuntu-latest
    steps:
      - name: Keep newest active native push run per Publisher workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          targets=(
            ".github/workflows/mature-029-native-page-spread-once.yml"
            ".github/workflows/master-projection-stack-auth-once.yml"
          )

          for target in "${targets[@]}"; do
            echo "Inspecting $target"
            runs_file="$(mktemp)"

            gh api --paginate --method GET "repos/$GH_REPO/actions/runs"               -f event=push               -f per_page=100               --jq ".workflow_runs[]
                  | select(.path == \"$target\")
                  | select(.head_branch == \"main\")
                  | select(.status == \"queued\"
                        or .status == \"pending\"
                        or .status == \"in_progress\"
                        or .status == \"waiting\"
                        or .status == \"requested\")
                  | [.run_number, .id, .status, .head_sha, .created_at] | @tsv"               >"$runs_file"

            if [[ ! -s "$runs_file" ]]; then
              echo "No active main-push runs for $target."
              rm -f "$runs_file"
              continue
            fi

            newest_run_number="$(cut -f1 "$runs_file" | sort -nr | head -n1)"
            echo "Newest active run for $target: $newest_run_number"

            cancelled=0
            forced=0
            preserved=0
            while IFS=$'\t' read -r run_number id status head_sha created_at; do
              [[ -n "$id" ]] || continue
              if [[ "$run_number" == "$newest_run_number" ]]; then
                echo "KEEP   workflow=$target run=$run_number id=$id status=$status sha=${head_sha:0:12}"
                preserved=$((preserved + 1))
                continue
              fi

              echo "CANCEL workflow=$target run=$run_number id=$id status=$status sha=${head_sha:0:12}"
              if gh api --method POST "repos/$GH_REPO/actions/runs/$id/cancel" >/dev/null 2>&1; then
                cancelled=$((cancelled + 1))
                continue
              fi

              echo "FORCE  workflow=$target run=$run_number id=$id status=$status sha=${head_sha:0:12}"
              if gh api --method POST "repos/$GH_REPO/actions/runs/$id/force-cancel" >/dev/null 2>&1; then
                forced=$((forced + 1))
              else
                echo "::warning::Could not cancel or force-cancel run $id; it may have completed concurrently."
              fi
            done <"$runs_file"

            rm -f "$runs_file"
            echo "workflow=$target preserved=$preserved cancelled=$cancelled force_cancelled=$forced"
          done
