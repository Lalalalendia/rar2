name: PUB native Story PowerShell 7 transport discriminator

on:
  pull_request:
    paths:
      - ".github/workflows/pub-native-story-pwsh7-transport.yml"
      - "tools/windows/pub-runtime/Invoke-StoryNativeRoundtripGuarded.ps1"
      - "tools/ci/test_pub_story_pwsh7_probe.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/pub-native-story-pwsh7-transport.yml"
permissions:
  contents: read

concurrency:
  group: pub-native-story-pwsh7-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate-transport:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Parse guarded native scripts under PowerShell 5.1 (no COM)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($relative in @(
            'tools/windows/pub-runtime/Invoke-StoryNativeRoundtripGuarded.ps1',
            'tools/windows/pub-runtime/run_story_native_roundtrip.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path -LiteralPath $relative).Path, [ref]$tokens, [ref]$errors
            )
            if ($errors.Count -ne 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw 'pwsh7_transport_parse_failed'
            }
          }

      - name: Assert fail-closed portable runner gate without COM
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $wrapper = Get-Content tools/windows/pub-runtime/Invoke-StoryNativeRoundtripGuarded.ps1 -Raw
          if (-not $wrapper.Contains('pwsh7_portable_path_not_allowlisted') -or
              -not $wrapper.Contains('pwsh7_portable_version_or_arch_mismatch') -or
              -not $wrapper.Contains("7.6.5")) {
            throw 'portable_pwsh7_guard_missing'
          }
      - name: Prove literal PowerShell7 preflight probe survives child transport (no COM)
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/ci/test_pub_story_pwsh7_probe.py
          if ($LASTEXITCODE -ne 0) { throw 'pwsh7_encoded_probe_smoke_failed' }

      - name: Verify existing native stage writer without Publisher
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & tools/windows/pub-runtime/test_story_native_stage_writer.ps1
          if (-not $?) { throw 'native_stage_smoke_failed' }

  prepare-original:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Materialize exact original Sample3 from existing writer handoff
        run: |
          set -euo pipefail
          cargo run --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-writer --bin pub_story_native_handoff -- generate \
            --output-dir out/native-story-pwsh7
      - name: Materialize pinned one-unit Story candidate without Publisher
        run: |
          set -euo pipefail
          cargo run --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-writer --bin pub_story_native_handoff -- generate-one-unit \
            --output-dir out/native-story-pwsh7-one-unit
      - name: Verify original source and manifest before handoff
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("out/native-story-pwsh7")
          manifest = json.loads((root / "handoff.json").read_text())
          assert manifest["schema"] == "chaptera.pub-native-story-handoff.v1"
          assert hashlib.sha256((root / "source.pub").read_bytes()).hexdigest() == manifest["source_sha256"]
          assert hashlib.sha256((root / "candidate.pub").read_bytes()).hexdigest() == manifest["candidate_sha256"]
          if manifest["source_sha256"] != "424c69173ff08948c2529c8084b4ac2403f1ff1057146f4edd02fc29b44481fc":
              raise SystemExit("wrong pinned Sample3 source")
          if manifest["candidate_sha256"] != "a92543b6f2b6ac3a8ae2481e15a2188a338ddc2a92832580f8987079fa4f70f8":
              raise SystemExit("wrong pinned six-unit candidate")
          if len((root / "source.pub").read_bytes()) != 72192 or len((root / "candidate.pub").read_bytes()) != 72192:
              raise SystemExit("unexpected CFB byte length")
          print("PASS exact Sep/Oct matched candidate SHA and pinned source")
          PY
      - name: Pin one-unit handoff bytes and Story identity before native admission
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("out/native-story-pwsh7-one-unit")
          manifest = json.loads((root / "handoff.json").read_text())
          assert manifest["schema"] == "chaptera.pub-native-story-handoff.v1"
          assert manifest["research_variant"] == "one_utf16_unit_delete"
          assert manifest["story_syid"] == 4
          assert manifest["mutation"]["removed_utf16_units"] == 1
          assert manifest["after_utf16_len"] == 69
          assert hashlib.sha256((root / "source.pub").read_bytes()).hexdigest() == manifest["source_sha256"]
          assert hashlib.sha256((root / "candidate.pub").read_bytes()).hexdigest() == manifest["candidate_sha256"]
          if manifest["source_sha256"] != "424c69173ff08948c2529c8084b4ac2403f1ff1057146f4edd02fc29b44481fc":
              raise SystemExit("one-unit source identity mismatch")
          if manifest["candidate_sha256"] != "b9b789f35a34e016faceb27acf50bf0621273a7d612762ecc17c56ca450fe715":
              raise SystemExit("one-unit candidate identity mismatch")
          if len((root / "source.pub").read_bytes()) != 72192 or len((root / "candidate.pub").read_bytes()) != 72192:
              raise SystemExit("one-unit CFB length mismatch")
          print("PASS SHA-pinned one-unit Story candidate (offline only)")
          PY
      - name: Verify exact deleted Story under current Reader
        run: |
          set -euo pipefail
          cargo run --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-writer --bin pub_story_native_handoff -- verify \
            --pub out/native-story-pwsh7/candidate.pub \
            --manifest out/native-story-pwsh7/handoff.json
      - name: Verify one-unit deleted Story through current Reader (no Publisher)
        run: |
          set -euo pipefail
          cargo run --manifest-path vendor/producer-a/Cargo.toml \
            -p pub-writer --bin pub_story_native_handoff -- verify \
            --pub out/native-story-pwsh7-one-unit/candidate.pub \
            --manifest out/native-story-pwsh7-one-unit/handoff.json
      - uses: actions/upload-artifact@v4
        with:
          name: pub-story-pwsh7-${{ github.run_id }}
          path: |
            out/native-story-pwsh7/source.pub
            out/native-story-pwsh7/candidate.pub
            out/native-story-pwsh7/handoff.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: pub-story-pwsh7-one-unit-${{ github.run_id }}
          path: |
            out/native-story-pwsh7-one-unit/source.pub
            out/native-story-pwsh7-one-unit/candidate.pub
            out/native-story-pwsh7-one-unit/handoff.json
          if-no-files-found: error
          retention-days: 14

  native-pwsh7:
    needs: [prepare-original, validate-transport]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'Lalalalendia/rar2' }}
    runs-on: [self-hosted, Windows, X64, chaptera-publisher-oracle]
    timeout-minutes: 27
    concurrency:
      group: pub-re-native-publisher-oracle
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download matched source and candidate from this exact run
        uses: actions/download-artifact@v4
        with:
          name: pub-story-pwsh7-${{ github.run_id }}
          path: ${{ runner.temp }}/chaptera-story-pwsh7/input
      - name: Download independently pinned one-unit candidate from this exact run
        uses: actions/download-artifact@v4
        with:
          name: pub-story-pwsh7-one-unit-${{ github.run_id }}
          path: ${{ runner.temp }}/chaptera-story-pwsh7/input-one-unit
      - name: Supply Git Bash to current Rust verifier
        shell: powershell
        run: |
          $gitBashDir = 'C:\Program Files\Git\bin'
          if (-not (Test-Path -LiteralPath (Join-Path $gitBashDir 'bash.exe') -PathType Leaf)) {
            throw 'git_bash_unavailable'
          }
          $gitBashDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Prebuild matched candidate Reader verifier
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-writer --bin pub_story_native_handoff
          if ($LASTEXITCODE -ne 0) { throw 'matched_candidate_verifier_build_failed' }
      - name: Stage verified PowerShell 7.6.5 x64 ZIP without system installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $root = Join-Path $env:RUNNER_TEMP 'chaptera-story-pwsh7'
          $portable = Join-Path $root 'portable'
          $zip = Join-Path $root 'PowerShell-7.6.5-win-x64.zip'
          if (Test-Path -LiteralPath $portable) { throw 'portable_pwsh7_destination_already_exists' }
          $url = 'https://github.com/PowerShell/PowerShell/releases/download/v7.6.5/PowerShell-7.6.5-win-x64.zip'
          $expected = '32eb8f6cdce08f86e987d625a2733e54ac3e289ae7e1621b14c0b5bcec2434ea'
          Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing -ErrorAction Stop
          $actual = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -cne $expected) { throw 'portable_pwsh7_archive_sha256_mismatch' }
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Expand-Archive -LiteralPath $zip -DestinationPath $portable -Force
          $exe = Join-Path $portable 'pwsh.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw 'portable_pwsh7_executable_missing_from_verified_archive'
          }
          $version = @(& $exe -NoLogo -NoProfile -NonInteractive -Command '$PSVersionTable.PSVersion.ToString()')
          if ($LASTEXITCODE -ne 0 -or $version.Count -ne 1 -or [string]$version[0] -ne '7.6.5') {
            throw 'portable_pwsh7_version_preflight_failed'
          }
          Remove-Item -LiteralPath $zip -Force
          Write-Host 'Pinned portable PowerShell 7.6.5 x64 is ready (source: official SHA-256 release)'
      - name: Execute isolated original Publisher SaveAs control
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & tools/windows/pub-runtime/Invoke-StoryNativeSourceControl.ps1 `
            -BundleDir (Join-Path $env:RUNNER_TEMP 'chaptera-story-pwsh7/input') `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'chaptera-story-pwsh7/private')
          if (-not $?) { throw 'source_control_script_failed' }
      - name: Run exact writer candidate SaveAs in PowerShell 7 guarded child
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & tools/windows/pub-runtime/Invoke-StoryNativeRoundtripGuarded.ps1 `
            -BundleDir (Join-Path $env:RUNNER_TEMP 'chaptera-story-pwsh7/input') `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'chaptera-story-pwsh7/private-candidate') `
            -ChildPowerShell PowerShell7 `
            -PinnedPwsh7Executable (Join-Path $env:RUNNER_TEMP 'chaptera-story-pwsh7\portable\pwsh.exe')
          if (-not $?) { throw 'matched_writer_candidate_roundtrip_failed' }
      - name: Test one-unit Writer candidate under the same verified PowerShell 7 transport
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & tools/windows/pub-runtime/Invoke-StoryNativeRoundtripGuarded.ps1 `
            -BundleDir (Join-Path $env:RUNNER_TEMP 'chaptera-story-pwsh7/input-one-unit') `
            -OutputRoot (Join-Path $env:RUNNER_TEMP 'chaptera-story-pwsh7/private-one-unit') `
            -TimeoutSeconds 360 `
            -ChildPowerShell PowerShell7 `
            -PinnedPwsh7Executable (Join-Path $env:RUNNER_TEMP 'chaptera-story-pwsh7\portable\pwsh.exe')
          if (-not $?) { throw 'one_unit_candidate_roundtrip_failed' }
      - name: Upload source-safe control receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-story-pwsh7-receipt-${{ github.run_id }}
          path: ${{ runner.temp }}/chaptera-story-pwsh7/private/source-control-status.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload source-safe writer candidate receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-matched-writer-candidate-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/chaptera-story-pwsh7/private-candidate/native-roundtrip-status.json
            ${{ runner.temp }}/chaptera-story-pwsh7/private-candidate/native-roundtrip-stage.json
            ${{ runner.temp }}/chaptera-story-pwsh7/private-candidate/native-roundtrip-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: Upload source-safe one-unit Publisher receipt only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pub-one-unit-pwsh7-candidate-receipt-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/chaptera-story-pwsh7/private-one-unit/native-roundtrip-status.json
            ${{ runner.temp }}/chaptera-story-pwsh7/private-one-unit/native-roundtrip-stage.json
            ${{ runner.temp }}/chaptera-story-pwsh7/private-one-unit/native-roundtrip-receipt.json
          if-no-files-found: warn
          retention-days: 30
      - name: Remove private original, SaveAs output and logs
        if: always()
        shell: powershell
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'chaptera-story-pwsh7'
          if (Test-Path -LiteralPath $root) {
            Remove-Item -LiteralPath $root -Recurse -Force -ErrorAction Stop
          }
