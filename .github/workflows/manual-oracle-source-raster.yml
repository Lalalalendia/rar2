name: Manual Publisher oracle source-only Reader rasters

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-source-raster.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: target/manual-oracle-rust
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore/save Rust build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: target/manual-oracle-rust
          key: manual-oracle-rust-v1-${{ runner.os }}-${{ hashFiles('Cargo.toml', 'Cargo.lock', 'apps/chaptera-server/Cargo.toml', 'crates/**/Cargo.toml', 'vendor/producer-a/Cargo.toml', 'vendor/producer-a/Cargo.lock', 'vendor/producer-a/crates/**/Cargo.toml') }}

      - name: Restore/save pinned Playwright Chromium cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/ms-playwright
          key: cloud-reader-playwright-v1-${{ runner.os }}-1.55.0-chromium

      - name: Install pinned browser runtime
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Acquire exact public Apache POI Publisher fixtures
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/manual-oracle-pubs"
          python - <<'PY'
          import hashlib
          import json
          import urllib.request
          from pathlib import Path

          names = [
              "Sample98",
              "Sample2000",
              "SampleBrochure",
              "SampleNewsletter",
              "51318",
              "60685",
              "Sample_2010",
              "Sample2_2010",
              "Sample3_2010",
              "Sample4_2010",
          ]
          base = "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher"
          root = Path(__import__("os").environ["RUNNER_TEMP"]) / "manual-oracle-pubs"
          fixtures = []
          for name in names:
              target = root / f"{name}.pub"
              with urllib.request.urlopen(f"{base}/{name}.pub", timeout=30) as response:
                  data = response.read()
              target.write_bytes(data)
              fixtures.append({
                  "name": name,
                  "sha256": hashlib.sha256(data).hexdigest(),
                  "bytes": len(data),
                  "require_render": False,
                  "require_shared_text": False,
                  "source_path": str(target),
              })
          manifest = {
              "schema": "chaptera.cloud-reader-real-fixtures.v1",
              "fixtures": fixtures,
          }
          path = Path(__import__("os").environ["RUNNER_TEMP"]) / "manual-oracle-fixtures.json"
          path.write_text(json.dumps(manifest, indent=2, sort_keys=True) + "\n")
          print(json.dumps(fixtures, indent=2, sort_keys=True))
          PY

      - name: Build canonical guest Scene producer
        run: cargo build -p chaptera-server --bin chaptera --jobs 2

      - name: Render ten public PUB fixtures at 144 DPI
        env:
          REPOSITORY_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          READER_WORKER_BINARY: ${{ github.workspace }}/target/manual-oracle-rust/debug/chaptera
          READER_REAL_MANIFEST: ${{ runner.temp }}/manual-oracle-fixtures.json
          READER_REAL_OUTPUT: ${{ runner.temp }}/manual-oracle-reader
          READER_REFERENCE_RASTER_DPI: "144"
        run: node apps/cloud-reader/real-browser.test.mjs

      - name: Build source-neutral summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "manual-oracle-reader"
          receipt = json.loads((root / "receipt.json").read_text())
          rows = []
          for item in receipt["results"]:
              rows.append({
                  "fixture": item["fixture"],
                  "source_sha256": item["source_sha256"],
                  "source_byte_len": item["source_byte_len"],
                  "classification": item["classification"],
                  "rendered": item["rendered"],
                  "pages": item.get("pages"),
                  "nodes": item.get("nodes"),
                  "descriptor_only_resource_count": item.get("descriptor_only_resource_count"),
                  "fidelity_reasons": item.get("fidelity_reasons", []),
                  "diagnostic_codes": item.get("diagnostic_codes", []),
                  "screenshots": item.get("screenshots", []),
              })
          out = Path("target/manual-oracle-source-raster")
          out.mkdir(parents=True, exist_ok=True)
          (out / "summary.json").write_text(json.dumps({
              "schema": "chaptera.manual-oracle-source-raster.v1",
              "repository_commit_sha": receipt["repository_commit_sha"],
              "fixtures": rows,
          }, indent=2, sort_keys=True) + "\n")
          print(json.dumps(rows, indent=2, sort_keys=True))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: manual-oracle-reader-rasters
          path: |
            ${{ runner.temp }}/manual-oracle-reader/*.png
            ${{ runner.temp }}/manual-oracle-reader/receipt.json
            target/manual-oracle-source-raster/summary.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
