name: Editor Desktop Continuity V2 Windows

on:
  workflow_call:
    inputs:
      editor_binary_artifact_name:
        required: false
        type: string
        default: ""
  pull_request:
    paths:
      - ".github/workflows/editor-desktop-continuity-v2-windows.yml"
      - "tools/ci/test_pub_editor_pr_fanout.py"
      - "tools/ci/pub_editor_pr_fanout.py"
      - "apps/chaptera-desktop/src/acceptance.rs"
      - "apps/chaptera-desktop/src/acceptance_v2.rs"
      - "apps/chaptera-desktop/src/acceptance_v2_cli.rs"
      - "packages/product/editor-desktop-continuity/v2/**"
      - "tools/run_editor_desktop_continuity_v2.py"
      - "tools/validate_editor_desktop_continuity_v2_receipt.py"
      - "tools/verify_editable_export_geometry.py"
      - "vendor/producer-a/crates/pub-editor/**"
      - "vendor/producer-a/crates/pub-odg/**"
      - "crates/chaptera-scene-instance/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify pub-editor Continuity V2 scope
    runs-on: ubuntu-latest
    outputs:
      continuity_v2_windows: ${{ steps.scope.outputs.continuity_v2_windows }}
      reason: ${{ steps.scope.outputs.reason }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Trust only the base-branch classifier. The PR head is fetched as
          # diff input and cannot teach this job to skip its own Windows proof.
          ref: ${{ github.event.pull_request.base.ref || github.sha }}
          fetch-depth: 0

      - id: base-authority
        name: Resolve base-branch classifier authority
        shell: bash
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fetch PR head for classification
        if: ${{ github.event.pull_request.head.sha != '' }}
        shell: bash
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git fetch --no-tags origin "$HEAD_SHA"

      - name: Test base-authority pub-editor classifier
        run: python tools/ci/test_pub_editor_pr_fanout.py

      - id: scope
        name: Classify Continuity V2 Windows ownership
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ steps.base-authority.outputs.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          mkdir -p target/pub-editor-pr-fanout
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "continuity_v2_windows=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch_fail_closed" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"schema":"chaptera.pub-editor-pr-fanout.v1","continuity_v2_windows":true,"reason":"workflow_dispatch_fail_closed"}' > target/pub-editor-pr-fanout/receipt.json
            exit 0
          fi
          python tools/ci/pub_editor_pr_fanout.py \
            --base "$BASE_SHA" \
            --head "$HEAD_SHA" \
            --receipt target/pub-editor-pr-fanout/receipt.json \
            --github-output "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: pub-editor-continuity-v2-scope-${{ github.event.pull_request.head.sha || github.sha }}
          path: target/pub-editor-pr-fanout/receipt.json
          if-no-files-found: warn

  real-continuity-v2:
    needs: classify
    # Classifier failure is fail-closed: preserve the expensive Windows proof.
    if: ${{ !cancelled() && always() && (needs.classify.result != 'success' || needs.classify.outputs.continuity_v2_windows == 'true') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download exact-candidate Editor binary
        if: inputs.editor_binary_artifact_name != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ inputs.editor_binary_artifact_name }}
          path: ${{ runner.temp }}/chaptera-editor-prebuilt

      - name: Validate exact-candidate Editor binary
        if: inputs.editor_binary_artifact_name != ''
        run: python tools/ci/validate_editor_binary_artifact.py --artifact-dir "${{ runner.temp }}/chaptera-editor-prebuilt" --expected-candidate-sha "${{ github.sha }}"

      - name: Stage exact-candidate Editor binary
        if: inputs.editor_binary_artifact_name != ''
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "target/release" | Out-Null
          Copy-Item "${{ runner.temp }}/chaptera-editor-prebuilt/chaptera-editor.exe" "target/release/chaptera-editor.exe" -Force

      - name: Install receipt validator
        run: python -m pip install "jsonschema==4.23.0"

      - name: Acquire pinned Apache POI SampleNewsletter
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          $url = "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub"
          Invoke-WebRequest -Uri $url -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $fixture).Length
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $hash"
          }
          if ($bytes -ne 291840) {
            throw "SampleNewsletter byte length mismatch: $bytes"
          }
          "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate deterministic replacement PNG witness
        shell: pwsh
        run: |
          $replacement = Join-Path $env:RUNNER_TEMP "continuity-v2-replacement.png"
          $env:CHAPTERA_CONTINUITY_REPLACEMENT = $replacement
          @'
          import binascii
          import pathlib
          import struct
          import zlib
          import os

          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", binascii.crc32(body) & 0xffffffff)

          width = 2
          height = 2
          ihdr = struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
          row0 = b"\x00" + bytes([0x18, 0x62, 0xA0, 0xFF, 0xF2, 0xC1, 0x4E, 0xFF])
          row1 = b"\x00" + bytes([0x51, 0xA8, 0x54, 0xFF, 0xD9, 0x50, 0x50, 0xFF])
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", ihdr)
              + chunk(b"IDAT", zlib.compress(row0 + row1, 9))
              + chunk(b"IEND", b"")
          )
          pathlib.Path(os.environ["CHAPTERA_CONTINUITY_REPLACEMENT"]).write_bytes(png)
          '@ | python -
          if (-not (Test-Path $replacement)) { throw "replacement PNG was not generated" }
          $bytes = (Get-Item $replacement).Length
          if ($bytes -le 32) { throw "replacement PNG is unexpectedly small" }
          "CHAPTERA_CONTINUITY_REPLACEMENT=$replacement" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build current Chaptera desktop
        if: inputs.editor_binary_artifact_name == ''
        run: cargo build -p chaptera-desktop --release

      - name: Run real imported-PUB continuity V2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $out = Join-Path $env:RUNNER_TEMP "chaptera-desktop-continuity-v2"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $project = Join-Path $out "continuity-v2.project.json"
          $export = Join-Path $out "continuity-v2.edited.odg"
          $receipt = Join-Path $out "editor-desktop-continuity-v2.real.json"
          python tools/run_editor_desktop_continuity_v2.py --fixture "$env:CHAPTERA_SAMPLE_NEWSLETTER" --replacement "$env:CHAPTERA_CONTINUITY_REPLACEMENT" --project-output "$project" --export-output "$export" --receipt-output "$receipt" -- target/release/chaptera-editor.exe --desktop-acceptance-v2 "{fixture}" "{replacement}" "{project}" "{export}"
          python tools/validate_editor_desktop_continuity_v2_receipt.py "$receipt"
          Copy-Item "$receipt" "target/release/editor-desktop-continuity-v2.real.json"

      - name: Ensure retained evidence is source-safe
        shell: pwsh
        run: |
          $receipt = Get-Content "target/release/editor-desktop-continuity-v2.real.json" -Raw
          $replacementSha = (Get-FileHash $env:CHAPTERA_CONTINUITY_REPLACEMENT -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receipt.Contains($replacementSha)) {
            throw "retained V2 receipt leaked replacement asset SHA"
          }
          if ($receipt.Contains((Resolve-Path $env:CHAPTERA_SAMPLE_NEWSLETTER).Path)) {
            throw "retained V2 receipt leaked local fixture path"
          }
          if ($receipt.Contains((Resolve-Path $env:CHAPTERA_CONTINUITY_REPLACEMENT).Path)) {
            throw "retained V2 receipt leaked local replacement path"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: editor-desktop-continuity-v2-real
          path: target/release/editor-desktop-continuity-v2.real.json
          if-no-files-found: error
