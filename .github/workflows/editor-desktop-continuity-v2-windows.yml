name: Editor Desktop Continuity V2 Windows

on:
  pull_request:
    paths:
      - ".github/workflows/editor-desktop-continuity-v2-windows.yml"
      - "apps/chaptera-desktop/src/acceptance.rs"
      - "apps/chaptera-desktop/src/acceptance_v2.rs"
      - "apps/chaptera-desktop/src/main.rs"
      - "packages/product/editor-desktop-continuity/v2/**"
      - "tools/run_editor_desktop_continuity_v2.py"
      - "tools/validate_editor_desktop_continuity_v2_receipt.py"
      - "tools/verify_editable_export_geometry.py"
      - "vendor/producer-a/crates/pub-editor/**"
      - "vendor/producer-a/crates/pub-odg/**"
      - "crates/chaptera-scene-instance/**"
      - "crates/chaptera-desktop-shaped-flow-runtime/**"
      - "crates/chaptera-desktop-fallback-font-resource/**"
      - "tools/run_editor_fixed_pdf_current_revision_v1.py"
      - "tools/run_yab259_editor_packet_renderer.py"
      - "tools/yab259_editor_packet_renderer.rs"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  real-continuity-v2:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install receipt validator
        run: python -m pip install "jsonschema==4.23.0"

      - name: Acquire pinned Apache POI SampleNewsletter
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP "SampleNewsletter.pub"
          $url = "https://raw.githubusercontent.com/apache/poi/942d95d85b15d0dfdb3bc9ba1b4f273f277757c8/test-data/publisher/SampleNewsletter.pub"
          Invoke-WebRequest -Uri $url -OutFile $fixture
          $hash = (Get-FileHash $fixture -Algorithm SHA256).Hash.ToLowerInvariant()
          $bytes = (Get-Item $fixture).Length
          if ($hash -ne "6a825ba26ba35d6e885acdc62e859591ed37cb0ff7480b554b9cb362b644dfcf") {
            throw "SampleNewsletter SHA-256 mismatch: $hash"
          }
          if ($bytes -ne 291840) {
            throw "SampleNewsletter byte length mismatch: $bytes"
          }
          "CHAPTERA_SAMPLE_NEWSLETTER=$fixture" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Generate deterministic replacement PNG witness
        shell: pwsh
        run: |
          $replacement = Join-Path $env:RUNNER_TEMP "continuity-v2-replacement.png"
          $env:CHAPTERA_CONTINUITY_REPLACEMENT = $replacement
          @'
          import binascii
          import pathlib
          import struct
          import zlib
          import os

          def chunk(kind, data):
              body = kind + data
              return struct.pack(">I", len(data)) + body + struct.pack(">I", binascii.crc32(body) & 0xffffffff)

          width = 2
          height = 2
          ihdr = struct.pack(">IIBBBBB", width, height, 8, 6, 0, 0, 0)
          row0 = b"\x00" + bytes([0x18, 0x62, 0xA0, 0xFF, 0xF2, 0xC1, 0x4E, 0xFF])
          row1 = b"\x00" + bytes([0x51, 0xA8, 0x54, 0xFF, 0xD9, 0x50, 0x50, 0xFF])
          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", ihdr)
              + chunk(b"IDAT", zlib.compress(row0 + row1, 9))
              + chunk(b"IEND", b"")
          )
          pathlib.Path(os.environ["CHAPTERA_CONTINUITY_REPLACEMENT"]).write_bytes(png)
          '@ | python -
          if (-not (Test-Path $replacement)) { throw "replacement PNG was not generated" }
          $bytes = (Get-Item $replacement).Length
          if ($bytes -le 32) { throw "replacement PNG is unexpectedly small" }
          "CHAPTERA_CONTINUITY_REPLACEMENT=$replacement" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build current Chaptera desktop
        run: cargo build -p chaptera-desktop --release

      - name: Run real imported-PUB continuity V2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $out = Join-Path $env:RUNNER_TEMP "chaptera-desktop-continuity-v2"
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          $project = Join-Path $out "continuity-v2.project.json"
          $export = Join-Path $out "continuity-v2.edited.odg"
          $receipt = Join-Path $out "editor-desktop-continuity-v2.real.json"
          python tools/run_editor_desktop_continuity_v2.py --fixture "$env:CHAPTERA_SAMPLE_NEWSLETTER" --replacement "$env:CHAPTERA_CONTINUITY_REPLACEMENT" --project-output "$project" --export-output "$export" --receipt-output "$receipt" -- target/release/chaptera-editor.exe --desktop-acceptance-v2 "{fixture}" "{replacement}" "{project}" "{export}"
          python tools/validate_editor_desktop_continuity_v2_receipt.py "$receipt"
          Copy-Item "$receipt" "target/release/editor-desktop-continuity-v2.real.json"

      - name: Ensure retained evidence is source-safe
        shell: pwsh
        run: |
          $receipt = Get-Content "target/release/editor-desktop-continuity-v2.real.json" -Raw
          $replacementSha = (Get-FileHash $env:CHAPTERA_CONTINUITY_REPLACEMENT -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receipt.Contains($replacementSha)) {
            throw "retained V2 receipt leaked replacement asset SHA"
          }
          if ($receipt.Contains((Resolve-Path $env:CHAPTERA_SAMPLE_NEWSLETTER).Path)) {
            throw "retained V2 receipt leaked local fixture path"
          }
          if ($receipt.Contains((Resolve-Path $env:CHAPTERA_CONTINUITY_REPLACEMENT).Path)) {
            throw "retained V2 receipt leaked local replacement path"
          }

      - name: Materialize pinned fixed-output font
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $font = Join-Path $env:RUNNER_TEMP "chaptera-fixed-output-font.ttf"
          cargo run --quiet -p chaptera-desktop-fallback-font-resource --bin materialize-fallback-font -- "$font"
          if (-not (Test-Path $font)) { throw "pinned fixed-output font was not materialized" }
          $bytes = (Get-Item $font).Length
          if ($bytes -ne 361676) { throw "pinned fixed-output font byte length mismatch: $bytes" }
          "CHAPTERA_FIXED_OUTPUT_FONT=$font" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build current Editor source-neutral fixed-output packet
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $out = Join-Path $env:RUNNER_TEMP "chaptera-desktop-continuity-v2"
          $project = Join-Path $out "continuity-v2.project.json"
          $packet = Join-Path $out "current-fixed-output.packet.json"
          cargo run --quiet --manifest-path crates/chaptera-desktop-shaped-flow-runtime/Cargo.toml --bin current_fixed_output_packet -- --source "$env:CHAPTERA_SAMPLE_NEWSLETTER" --project "$project" --asset "$env:CHAPTERA_CONTINUITY_REPLACEMENT" --font "$env:CHAPTERA_FIXED_OUTPUT_FONT" --output "$packet"
          if (-not (Test-Path $packet)) { throw "current fixed-output packet was not written" }
          "CHAPTERA_CURRENT_FIXED_OUTPUT_PACKET=$packet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Acquire exact public Yab renderer donor
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $yab = Join-Path $env:RUNNER_TEMP "yab259-editor-fixed-output"
          git clone --quiet https://github.com/HeisLuka/yab "$yab"
          git -C "$yab" cat-file -e "4f5d8a57abc089d1ed8eb1326cf9bed602281f7e^{commit}"
          "CHAPTERA_YAB259_CHECKOUT=$yab" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Produce real PDF from fresh-reopened V2 current revision
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          $out = Join-Path $env:RUNNER_TEMP "chaptera-desktop-continuity-v2"
          $project = Join-Path $out "continuity-v2.project.json"
          $stage01 = Join-Path $out "editor-desktop-continuity-v2.real.json"
          $pdf = Join-Path $out "current-revision.pdf"
          $receipt = Join-Path $out "editor-fixed-pdf-current-revision.real.json"
          python tools/run_editor_fixed_pdf_current_revision_v1.py --source "$env:CHAPTERA_SAMPLE_NEWSLETTER" --project "$project" --replacement "$env:CHAPTERA_CONTINUITY_REPLACEMENT" --stage01-receipt "$stage01" --packet "$env:CHAPTERA_CURRENT_FIXED_OUTPUT_PACKET" --pdf-output "$pdf" --receipt-output "$receipt" -- python tools/run_yab259_editor_packet_renderer.py --yab-checkout "$env:CHAPTERA_YAB259_CHECKOUT"
          if (-not (Test-Path $pdf)) { throw "current-revision PDF was not written" }
          if (-not (Test-Path $receipt)) { throw "current-revision receipt was not written" }
          $bytes = [System.IO.File]::ReadAllBytes($pdf)
          $header = [System.Text.Encoding]::ASCII.GetString($bytes[0..7])
          if (-not $header.StartsWith("%PDF-")) { throw "current-revision artifact is not PDF" }
          Copy-Item "$pdf" "target/release/editor-fixed-pdf-current-revision.real.pdf"
          Copy-Item "$receipt" "target/release/editor-fixed-pdf-current-revision.real.json"

      - name: Verify Stage 0.2 retained receipt privacy
        shell: pwsh
        run: |
          $receipt = Get-Content "target/release/editor-fixed-pdf-current-revision.real.json" -Raw
          $replacementSha = (Get-FileHash $env:CHAPTERA_CONTINUITY_REPLACEMENT -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($receipt.Contains($replacementSha)) {
            throw "Stage 0.2 receipt leaked replacement asset SHA"
          }
          if ($receipt.Contains((Resolve-Path $env:CHAPTERA_SAMPLE_NEWSLETTER).Path)) {
            throw "Stage 0.2 receipt leaked local source path"
          }
          if ($receipt.Contains("replacement_text")) {
            throw "Stage 0.2 receipt leaked raw replacement text"
          }

      - uses: actions/upload-artifact@v4
        with:
          name: editor-desktop-continuity-v2-real
          path: |
            target/release/editor-desktop-continuity-v2.real.json
            target/release/editor-fixed-pdf-current-revision.real.json
            target/release/editor-fixed-pdf-current-revision.real.pdf
          if-no-files-found: error
