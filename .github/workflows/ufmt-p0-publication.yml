          fn prepare_dual_file_case() -> (Store, Head, Head) {
              let s = Store::fresh();
              let old = s.select().unwrap().1;
              let new = candidate_for(&s, old);
              (s, old, new)
          }

          #[test]
          fn b2_dual_file_systematic_cut_matrix() {
              let cuts = [0usize,1,8,16,24,32,40,48,55,56,63,64];
              for cut in cuts {
                  for variant in 0..3 {
                      let (s, old, new) = prepare_dual_file_case();
                      let nb = encode(new).to_vec();
                      let ob = encode(old).to_vec();
                      let fallback = match variant {
                          0 => vec![0u8; ROOT_LEN],
                          1 => ob.clone(),
                          _ => vec![0xA5u8; ROOT_LEN],
                      };
                      fs::write(s.root_path(Slot::B), mix(&nb, &fallback, cut)).unwrap();
                      let selected = oracle_select_dual_file(&s.dir).expect("old root must survive");
                      assert!(selected == old || selected == new, "cut={cut} variant={variant}");
                  }
              }
          }

          fn encode4k(h: Head) -> [u8; SLOT4K] {
              let mut out = [0u8; SLOT4K];
              out[..ROOT_LEN].copy_from_slice(&encode(h));
              out
          }

          fn decode4k(bytes: &[u8]) -> Option<Head> {
              if bytes.len() != SLOT4K || bytes[ROOT_LEN..].iter().any(|b| *b != 0) { return None; }
              decode(&bytes[..ROOT_LEN])
          }

          struct DualSlotStore { dir: PathBuf }

          impl DualSlotStore {
              fn fresh() -> Self {
                  let s = Store::fresh();
                  let dir = s.dir.clone();
                  std::mem::forget(s);
                  let root = dir.join("root.bin");
                  let f = File::create(&root).unwrap();
                  f.set_len((SLOT4K * 2) as u64).unwrap();
                  drop(f);
                  let old = Head { epoch:0, content_gen:0, content_commit:10, maint_epoch:0, maint_state:20 };
                  Self::write_slot_raw(&root, 0, &encode4k(old));
                  File::open(&root).unwrap().sync_all().unwrap();
                  Self { dir }
              }
              fn root(&self) -> PathBuf { self.dir.join("root.bin") }
              fn write_slot_raw(path: &Path, index: usize, bytes: &[u8]) {
                  let mut f = OpenOptions::new().read(true).write(true).open(path).unwrap();
                  f.seek(SeekFrom::Start((index * SLOT4K) as u64)).unwrap();
                  f.write_all(bytes).unwrap();
              }
              fn read_slot(&self, index: usize) -> Option<Head> {
                  let mut f = File::open(self.root()).ok()?;
                  f.seek(SeekFrom::Start((index * SLOT4K) as u64)).ok()?;
                  let mut buf = vec![0u8; SLOT4K];
                  f.read_exact(&mut buf).ok()?;
                  let h = decode4k(&buf)?;
                  (obj_path(&self.dir, h.content_commit).is_file() && obj_path(&self.dir, h.maint_state).is_file()).then_some(h)
              }
              fn select(&self) -> Option<Head> {
                  match (self.read_slot(0), self.read_slot(1)) {
                      (Some(x), Some(y)) if x.epoch == y.epoch && x != y => None,
                      (Some(x), Some(y)) => Some(if y.epoch > x.epoch { y } else { x }),
                      (Some(x), None) => Some(x),
                      (None, Some(y)) => Some(y),
                      _ => None,
                  }
              }
          }

          impl Drop for DualSlotStore {
              fn drop(&mut self) { let _ = fs::remove_dir_all(&self.dir); }
          }

          #[test]
          fn b1_dual_slot_4k_cut_matrix() {
              let cuts = [0usize,1,8,16,24,32,40,48,55,56,64,512,4095,4096];
              for cut in cuts {
                  for variant in 0..3 {
                      let s = DualSlotStore::fresh();
                      let old = s.select().unwrap();
                      let helper = Store { dir: s.dir.clone() };
                      let new = candidate_for(&helper, old);
                      std::mem::forget(helper);
                      let nb = encode4k(new);
                      let ob = encode4k(old);
                      let fallback = match variant {
                          0 => vec![0u8; SLOT4K],
                          1 => ob.to_vec(),
                          _ => vec![0xA5u8; SLOT4K],
                      };
                      let mutated = mix(&nb, &fallback, cut);
                      DualSlotStore::write_slot_raw(&s.root(), 1, &mutated);
                      File::open(s.root()).unwrap().sync_all().unwrap();
                      let selected = s.select().expect("old root must survive or new root become valid");
                      assert!(selected == old || selected == new, "cut={cut} variant={variant}");
                  }
              }
          }

          #[test]
          #[ignore]
          fn kill_child_worker() {
              if env::var("UFMT_KILL_CHILD").ok().as_deref() != Some("1") { return; }
              let dir = PathBuf::from(env::var("UFMT_KILL_DIR").unwrap());
              let stage = env::var("UFMT_KILL_STAGE").unwrap();
              let s = Store { dir: dir.clone() };
              let old = s.select().unwrap().1;
              let new = candidate_for(&s, old);
              let (active, _) = s.select().unwrap();
              let inactive = Store::inactive(active);
              let tmp = dir.join(match inactive { Slot::A => "root.A.tmp", Slot::B => "root.B.tmp" });
              let mut f = File::create(&tmp).unwrap();
              f.write_all(&encode(new)).unwrap();
              f.sync_all().unwrap();
              if stage == "pre-rename" {
                  fs::write(dir.join("kill-stage"), b"ready").unwrap();
                  thread::sleep(Duration::from_secs(30));
                  return;
              }
              fs::rename(&tmp, s.root_path(inactive)).unwrap();
              fs::write(dir.join("kill-stage"), b"ready").unwrap();
              thread::sleep(Duration::from_secs(30));
          }

          fn run_kill_case(stage: &str, expect_new_allowed: bool) {
              let s = Store::fresh();
              let old = s.select().unwrap().1;
              let exe = env::current_exe().unwrap();
              let mut child = Command::new(exe)
                  .arg("extended::kill_child_worker")
                  .arg("--exact")
                  .arg("--ignored")
                  .arg("--nocapture")
                  .env("UFMT_KILL_CHILD", "1")
                  .env("UFMT_KILL_DIR", &s.dir)
                  .env("UFMT_KILL_STAGE", stage)
                  .stdout(Stdio::null())
                  .stderr(Stdio::null())
                  .spawn().unwrap();
              let marker = s.dir.join("kill-stage");
              let start = Instant::now();
              while !marker.exists() && start.elapsed() < Duration::from_secs(10) {
                  thread::sleep(Duration::from_millis(20));
              }
              assert!(marker.exists(), "child did not reach {stage}");
              let status = Command::new("kill").arg("-9").arg(child.id().to_string()).status().unwrap();
              assert!(status.success());
              let _ = child.wait();
              let selected = oracle_select_dual_file(&s.dir).expect("root after kill");
              if expect_new_allowed {
                  assert!(selected == old || selected.epoch == old.epoch + 1);
              } else {
                  assert_eq!(selected, old);
              }
          }

          #[test]
          fn subprocess_kill_reopen_subset() {
              run_kill_case("pre-rename", false);
              run_kill_case("post-rename", true);
          }
