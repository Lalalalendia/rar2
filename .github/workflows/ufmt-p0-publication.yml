          fn checked_bytes(payload: &[u8]) -> Vec<u8> {
              let mut out = fnv64(payload).to_le_bytes().to_vec();
              out.extend_from_slice(payload);
              out
          }

          fn put_checked(dir: &Path, id: u64, payload: &[u8]) {
              fs::write(
                  dir.join("objects").join(format!("{id:016x}")),
                  checked_bytes(payload),
              ).unwrap();
          }

          fn read_checked(dir: &Path, id: u64) -> Option<Vec<u8>> {
              let bytes = fs::read(dir.join("objects").join(format!("{id:016x}"))).ok()?;
              if bytes.len() < 8 { return None; }
              let expected = u64::from_le_bytes(bytes[..8].try_into().ok()?);
              let payload = bytes[8..].to_vec();
              (fnv64(&payload) == expected).then_some(payload)
          }

          fn payload_u64(bytes: &[u8]) -> Option<u64> {
              let raw: [u8;8] = bytes.try_into().ok()?;
              Some(u64::from_le_bytes(raw))
          }

          struct GraphStore { dir: PathBuf }

          impl GraphStore {
              fn fresh() -> Self {
                  let s = Store::fresh();
                  let dir = s.dir.clone();
                  std::mem::forget(s);
                  let g = Self { dir };
                  let old = g.build_graph(100, 0);
                  g.write_root(Slot::A, old);
                  let _ = fs::remove_file(g.root_path(Slot::B));
                  old_graph_sanity(&g, old);
                  g
              }

              fn root_path(&self, slot: Slot) -> PathBuf {
                  self.dir.join(match slot { Slot::A => "root.A", Slot::B => "root.B" })
              }

              fn build_graph(&self, base: u64, generation: u64) -> Head {
                  let content = base;
                  let manifest = base + 1;
                  let commit = base + 2;
                  put_checked(&self.dir, content, format!("content-generation-{generation}").as_bytes());
                  put_checked(&self.dir, manifest, &content.to_le_bytes());
                  put_checked(&self.dir, commit, &manifest.to_le_bytes());
                  Head {
                      epoch: generation,
                      content_gen: generation,
                      content_commit: commit,
                      maint_epoch: 0,
                      maint_state: 20,
                  }
              }

              fn write_root(&self, slot: Slot, h: Head) {
                  let mut f = File::create(self.root_path(slot)).unwrap();
                  use std::io::Write;
                  f.write_all(&encode(h)).unwrap();
                  f.sync_all().unwrap();
              }
          }

          impl Drop for GraphStore {
              fn drop(&mut self) { let _ = fs::remove_dir_all(&self.dir); }
          }

          fn graph_closure(dir: &Path, h: Head) -> bool {
              let Some(commit) = read_checked(dir, h.content_commit) else { return false; };
              let Some(manifest_id) = payload_u64(&commit) else { return false; };
              let Some(manifest) = read_checked(dir, manifest_id) else { return false; };
              let Some(content_id) = payload_u64(&manifest) else { return false; };
              read_checked(dir, content_id).is_some()
                  && dir.join("objects").join(format!("{:016x}", h.maint_state)).is_file()
          }

          fn old_graph_sanity(g: &GraphStore, old: Head) {
              assert!(graph_closure(&g.dir, old));
          }

          fn oracle_graph_slot(g: &GraphStore, slot: Slot) -> Option<Head> {
              let bytes = fs::read(g.root_path(slot)).ok()?;
              let h = decode(&bytes)?;
              graph_closure(&g.dir, h).then_some(h)
          }

          fn oracle_graph_select(g: &GraphStore) -> Option<Head> {
              match (oracle_graph_slot(g, Slot::A), oracle_graph_slot(g, Slot::B)) {
                  (Some(x), Some(y)) if x.epoch == y.epoch && x != y => None,
                  (Some(x), Some(y)) => Some(if y.epoch > x.epoch { y } else { x }),
                  (Some(x), None) => Some(x),
                  (None, Some(y)) => Some(y),
                  _ => None,
              }
          }

          fn corrupt_checked(g: &GraphStore, id: u64) {
              let path = g.dir.join("objects").join(format!("{id:016x}"));
              let mut bytes = fs::read(&path).unwrap();
              let i = if bytes.len() > 8 { 8 } else { 0 };
              bytes[i] ^= 0x5a;
              fs::write(path, bytes).unwrap();
          }

          #[test]
          fn f4_closure_damage_matrix() {
              let cases = [
                  ("remove-commit", 202u64, false),
                  ("remove-manifest", 201u64, false),
                  ("remove-content", 200u64, false),
                  ("corrupt-commit", 202u64, true),
                  ("corrupt-manifest", 201u64, true),
                  ("corrupt-content", 200u64, true),
              ];
              for (name, id, corrupt) in cases {
