          #[derive(Clone)]
          struct GcPlan {
              expected: Head,
              targets: Vec<u64>,
          }

          fn graph_reachable(dir: &Path, h: Head) -> BTreeSet<u64> {
              let mut out = BTreeSet::new();
              out.insert(h.maint_state);
              out.insert(h.content_commit);
              if let Some(commit) = read_checked(dir, h.content_commit) {
                  if let Some(manifest_id) = payload_u64(&commit) {
                      out.insert(manifest_id);
                      if let Some(manifest) = read_checked(dir, manifest_id) {
                          if let Some(content_id) = payload_u64(&manifest) {
                              out.insert(content_id);
                          }
                      }
                  }
              }
              out
          }

          fn plan_gc(g: &GraphStore) -> GcPlan {
              let expected = oracle_graph_select(g).unwrap();
              let reachable = graph_reachable(&g.dir, expected);
              let mut targets = Vec::new();
              for entry in fs::read_dir(g.dir.join("objects")).unwrap() {
                  let entry = entry.unwrap();
                  let name = entry.file_name().to_string_lossy().into_owned();
                  if let Ok(id) = u64::from_str_radix(&name, 16) {
                      if !reachable.contains(&id) {
                          targets.push(id);
                      }
                  }
              }
              targets.sort_unstable();
              GcPlan { expected, targets }
          }

          fn apply_gc_safe(g: &GraphStore, plan: &GcPlan) -> Result<(), ()> {
              if oracle_graph_select(g) != Some(plan.expected) { return Err(()); }
              let reachable = graph_reachable(&g.dir, plan.expected);
              for id in &plan.targets {
                  if !reachable.contains(id) {
                      let _ = fs::remove_file(g.dir.join("objects").join(format!("{id:016x}")));
                  }
              }
              Ok(())
          }

          fn apply_gc_broken(g: &GraphStore, plan: &GcPlan) {
              for id in &plan.targets {
                  let _ = fs::remove_file(g.dir.join("objects").join(format!("{id:016x}")));
              }
          }

