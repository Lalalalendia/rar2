          }

          fn run_kill_case(stage: &str, expect_new_allowed: bool) {
              let s = Store::fresh();
              let old = s.select().unwrap().1;
              let exe = env::current_exe().unwrap();
              let mut child = Command::new(exe)
                  .arg("extended::kill_child_worker")
                  .arg("--exact")
                  .arg("--ignored")
                  .arg("--nocapture")
                  .env("UFMT_KILL_CHILD", "1")
                  .env("UFMT_KILL_DIR", &s.dir)
                  .env("UFMT_KILL_STAGE", stage)
                  .stdout(Stdio::null())
                  .stderr(Stdio::null())
                  .spawn().unwrap();
              let marker = s.dir.join("kill-stage");
              let start = Instant::now();
              while !marker.exists() && start.elapsed() < Duration::from_secs(10) {
                  thread::sleep(Duration::from_millis(20));
              }
              assert!(marker.exists(), "child did not reach {stage}");
              let status = Command::new("kill").arg("-9").arg(child.id().to_string()).status().unwrap();
              assert!(status.success());
              let _ = child.wait();
              let selected = oracle_select_dual_file(&s.dir).expect("root after kill");
              if expect_new_allowed {
                  assert!(selected == old || selected.epoch == old.epoch + 1);
              } else {
                  assert_eq!(selected, old);
              }
          }

