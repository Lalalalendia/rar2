          use super::*;
          use std::env;
          use std::fs::{self, File, OpenOptions};
          use std::io::{Read, Seek, SeekFrom, Write};
          use std::path::{Path, PathBuf};
          use std::process::{Command, Stdio};
          use std::thread;
          use std::time::{Duration, Instant};

          const SLOT4K: usize = 4096;

          fn point_name(p: CrashPoint) -> &'static str {
              match p {
                  CrashPoint::P0 => "P0", CrashPoint::P1 => "P1",
                  CrashPoint::P2 => "P2", CrashPoint::P3 => "P3",
                  CrashPoint::P4 => "P4", CrashPoint::P5 => "P5",
                  CrashPoint::P6 => "P6", CrashPoint::P7 => "P7",
                  CrashPoint::P8 => "P8", CrashPoint::P9 => "P9",
                  CrashPoint::P10 => "P10",
              }
          }

          fn obj_path(dir: &Path, id: u64) -> PathBuf {
              dir.join("objects").join(format!("{id:016x}"))
          }

          fn oracle_read_dual_file(dir: &Path, slot: Slot) -> Option<Head> {
              let path = dir.join(match slot { Slot::A => "root.A", Slot::B => "root.B" });
              let bytes = fs::read(path).ok()?;
              let h = decode(&bytes)?;
              (obj_path(dir, h.content_commit).is_file() && obj_path(dir, h.maint_state).is_file()).then_some(h)
          }

          fn oracle_select_dual_file(dir: &Path) -> Option<Head> {
              let a = oracle_read_dual_file(dir, Slot::A);
              let b = oracle_read_dual_file(dir, Slot::B);
              match (a, b) {
                  (Some(x), Some(y)) if x.epoch == y.epoch && x != y => None,
                  (Some(x), Some(y)) => Some(if y.epoch > x.epoch { y } else { x }),
                  (Some(x), None) => Some(x),
                  (None, Some(y)) => Some(y),
                  (None, None) => None,
              }
          }

          fn candidate_for(s: &Store, old: Head) -> Head {
              let content = 1011;
              let manifest = 1012;
              let commit = 1013;
              s.put_obj(content, b"content");
              s.put_obj(manifest, b"manifest");
              s.put_obj(commit, b"commit");
              Head {
                  epoch: old.epoch + 1,
                  content_gen: old.content_gen + 1,
                  content_commit: commit,
                  maint_epoch: old.maint_epoch,
                  maint_state: old.maint_state,
              }
          }

          fn mix(prefix: &[u8], fallback: &[u8], cut: usize) -> Vec<u8> {
              let cut = cut.min(prefix.len()).min(fallback.len());
              let mut out = fallback.to_vec();
              out[..cut].copy_from_slice(&prefix[..cut]);
              out
          }

          #[test]
          fn exp05_named_faultio_trace_corpus() {
              let evidence = PathBuf::from(env::var("UFMT_EVIDENCE_DIR").expect("UFMT_EVIDENCE_DIR"));
