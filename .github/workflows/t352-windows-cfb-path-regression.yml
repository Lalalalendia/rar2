name: T352 Windows CFB path regression

on:
  pull_request:
    paths:
      - "tools/pub-re/src/bin/val_xproj_patch.rs"
      - "tools/pub-re/Cargo.toml"
      - "tools/pub-re/src/bin/t352_crosswalk_census.rs"
      - "tools/pub-re/src/bin/t352_pathlen_layout.rs"
      - "tools/windows/run_t352_pathlen_native.ps1"
      - "tools/windows/run_t352_height_native.ps1"
      - "tools/windows/run_t352_independent_native.ps1"
      - ".github/workflows/t352-windows-cfb-path-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: t352-cfb-win-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  canonical-stream-paths:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - name: Enforce committed independent patcher rustfmt
        shell: pwsh
        run: rustfmt --edition 2024 --check tools/pub-re/src/bin/val_xproj_patch.rs

      - name: Enforce identity-first crosswalk rustfmt
        shell: pwsh
        run: rustfmt --edition 2024 --check tools/pub-re/src/bin/t352_crosswalk_census.rs

      - name: Enforce source-safe Contents layout probe rustfmt
        shell: pwsh
        run: rustfmt --edition 2024 --check tools/pub-re/src/bin/t352_pathlen_layout.rs

      - name: Parse independent Publisher-native Width, Height, and Path-Length controllers
        shell: pwsh
        run: |
          foreach ($script in @(
            'tools/windows/run_t352_independent_native.ps1',
            'tools/windows/run_t352_height_native.ps1',
            'tools/windows/run_t352_pathlen_native.ps1'
          )) {
            $tokens = $null
            $errors = $null
            $path = (Resolve-Path $script).Path
            [void][System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$errors)
            if (@($errors).Count -gt 0) {
              throw "Native T352 PowerShell syntax error in $($script): $($errors | Out-String)"
            }
          }

      - name: Verify Windows stream-path normalization and exact four-arm patches
        shell: pwsh
        run: |
          cargo test --manifest-path tools/pub-re/Cargo.toml --bin val_xproj_patch -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "T352 patcher regression failed" }
          cargo test --manifest-path tools/pub-re/Cargo.toml --bin t352_pathlen_layout -- --nocapture
          if ($LASTEXITCODE -ne 0) { throw "T352 path-length layout probe failed" }
