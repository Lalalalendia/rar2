name: Mixed layout candidate cost trace

on:
  pull_request:
    paths:
      - ".github/workflows/mixed-layout-candidate-cost-trace.yml"
      - "crates/chaptera-viewer-render-plan/src/lib.rs"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: mixed-layout-candidate-cost-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TARGET_DIR: ${{ github.workspace }}/target/mixed-layout-candidate-cost

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"

      - name: Download pinned exact 1050 materialization
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820

      - name: Build canonical Reader worker
        run: cargo build -p chaptera-server --bin chaptera --jobs 2

      - name: Trace mixed-layout candidate cost
        run: |
          set -euo pipefail
          mkdir -p target/mixed-layout-candidate-cost
          python - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          source_root = root / "out/pinned1050/materialized/native"
          worker = root / "target/mixed-layout-candidate-cost/debug/chaptera"
          harness = root / "tools/migration_pdf_worker_isolation.py"
          out_root = root / "target/mixed-layout-candidate-cost"

          fixtures = [
              ("029", "c0688f73b9bf8fc7677a1eecaadd30fa00fc1813f6b12dc39b8aa5eac973f81e", 496640),
              ("064", "fb2927045c23292717df0a67ccb1e879d526a4ad8a6bb3c1046c72119fba3910", 750080),
          ]

          policy_re = re.compile(r"^CHAPTERA_READER_PERF mixed_layout:policy_candidates:(\d+)$")
          candidate_re = re.compile(r"^CHAPTERA_READER_PERF mixed_layout:line:(\d+):candidate:(\d+):(start|done)$")

          rows = []
          for index, (fixture_id, sha, byte_len) in enumerate(fixtures, 1):
              source = source_root / f"{sha}.pub"
              data = source.read_bytes()
              assert len(data) == byte_len
              assert hashlib.sha256(data).hexdigest() == sha
              output_dir = out_root / f"fixture-{fixture_id}"
              command = [
                  "python3", str(harness), "run",
                  "--output-dir", str(output_dir),
                  "--input", str(source),
                  "--timeout", "120",
                  "--address-space-mb", "768",
                  "--cpu-seconds", "90",
                  "--open-files", "64",
                  "--output-file-mb", "32",
                  "--clear-environment",
                  "--",
                  str(worker),
                  "guest-reader-scene",
                  "--session-id", "guest:" + str(index).zfill(32),
                  "--expected-sha256", sha,
                  "--expected-byte-len", str(byte_len),
              ]
              completed = subprocess.run(
                  command,
                  cwd=root,
                  text=True,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
                  timeout=135,
                  check=False,
              )
              isolation = json.loads(completed.stdout)
              stderr_tail = str(isolation.get("stderr_tail") or "")
              policies = []
              last_candidate = None
              for line in stderr_tail.splitlines():
                  m = policy_re.match(line)
                  if m:
                      policies.append(int(m.group(1)))
                  m = candidate_re.match(line)
                  if m:
                      last_candidate = {
                          "line_index": int(m.group(1)),
                          "candidate_ordinal": int(m.group(2)),
                          "event": m.group(3),
                      }
              row = {
                  "fixture_id": fixture_id,
                  "source_sha256": sha,
                  "source_byte_len": byte_len,
                  "status": isolation.get("status"),
                  "exit_code": isolation.get("exit_code"),
                  "timed_out": isolation.get("timed_out"),
                  "policy_candidate_counts_seen": policies,
                  "last_candidate_marker": last_candidate,
              }
              rows.append(row)
              print(json.dumps(row, sort_keys=True))

          payload = {
              "schema": "chaptera.mixed-layout-candidate-cost.v1",
              "repository_commit_sha": "${{ github.sha }}",
              "worker_limits": {"wall_seconds": 120, "cpu_seconds": 90, "address_space_mb": 768},
              "raw_stderr_emitted": False,
              "source_text_emitted": False,
              "fixtures": rows,
          }
          (out_root / "summary.json").write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mixed-layout-candidate-cost
          path: target/mixed-layout-candidate-cost/summary.json
          if-no-files-found: error
          retention-days: 30
