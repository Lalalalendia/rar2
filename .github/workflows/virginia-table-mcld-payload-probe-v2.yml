name: Virginia TABLE MCLD payload probe v2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-viewer/tests/virginia_table_mcld_payload_probe.rs"
      - "vendor/producer-a/crates/pub-viewer/Cargo.toml"
      - "tools/acquire_virginia_pub_pdf_pairs.py"
      - ".github/workflows/virginia-table-mcld-payload-probe-v2.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check --no-cache-dir "requests==2.32.5"
      - name: Reacquire exact Virginia pair
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/virginia-pairs"
          python tools/acquire_virginia_pub_pdf_pairs.py "$RUNNER_TEMP/virginia-pairs"
          test -f "$RUNNER_TEMP/virginia-pairs/virginia-remplacante-modifiable.pub"
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
      - name: Classify opaque MCLD TABLE payload equality
        env:
          CHAPTERA_VIRGINIA_TABLE_PAYLOAD_FIXTURE: ${{ runner.temp }}/virginia-pairs/virginia-remplacante-modifiable.pub
          CHAPTERA_VIRGINIA_TABLE_PAYLOAD_SHA256: 88f57d800aeec808798ea487b9d4ab85dc85c02cd190b987a332709b81018506
          CHAPTERA_VIRGINIA_TABLE_PAYLOAD_OUT: ${{ github.workspace }}/target/virginia-table-mcld-payload/receipt.json
        run: |
          set -euo pipefail
          mkdir -p target/virginia-table-mcld-payload
          cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-viewer --test virginia_table_mcld_payload_probe -- --ignored --nocapture
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: virginia-table-mcld-payload-receipt-v2
          path: target/virginia-table-mcld-payload/
          if-no-files-found: warn
          retention-days: 30
