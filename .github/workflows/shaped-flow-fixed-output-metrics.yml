name: Shaped flow fixed-output metrics

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-layout/src/shaped_flow.rs"
      - "crates/chaptera-caret-layout-feed/src/lib.rs"
      - ".github/workflows/shaped-flow-fixed-output-metrics.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shaped-flow-fixed-output-metrics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - name: Check pub-layout formatting
        run: cargo fmt --manifest-path vendor/producer-a/Cargo.toml -p pub-layout -- --check
      - name: Test pub-layout shaped flow
        run: cargo test --manifest-path vendor/producer-a/Cargo.toml -p pub-layout shaped_flow -- --nocapture
      - name: Check caret feed formatting
        run: cargo fmt --manifest-path crates/chaptera-caret-layout-feed/Cargo.toml -- --check
      - name: Test caret feed
        run: cargo test --manifest-path crates/chaptera-caret-layout-feed/Cargo.toml
