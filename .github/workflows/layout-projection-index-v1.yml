name: LAYOUT-PROJECTION-INDEX-01

on:
  pull_request:
    paths:
      - "vendor/producer-a/crates/pub-layout/**"
      - ".github/workflows/layout-projection-index-v1.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  layout-projection-index:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vendor/producer-a
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check pub-layout formatting
        run: cargo fmt -p pub-layout -- --check
      - name: Check pub-layout
        run: cargo check -p pub-layout --all-targets
      - name: Lint pub-layout
        run: cargo clippy -p pub-layout --all-targets -- -D warnings
      - name: Test exact projection semantics
        run: cargo test -p pub-layout
