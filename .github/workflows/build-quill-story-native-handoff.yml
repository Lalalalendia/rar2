name: Build self-contained Quill native handoff

on:
  push:
    branches:
      - delivery/quill-story-oracle-portable-20261004
    paths:
      - ".github/workflows/build-quill-story-native-handoff.yml"
      - "tools/delivery/build_quill_story_native_handoff.py"
      - "tools/research-runner/experiments/quill-story-readonly-oracle-02.packet.json"
      - "tools/research-runner/operations/quill_story_readonly_oracle_02.ps1"
      - "tools/research-runner/prepare_native_run.ps1"
      - "tools/research-runner/finalize_native_run.ps1"
      - "tools/windows/pub-runtime/PubRuntime.psm1"

permissions:
  contents: read

concurrency:
  group: quill-story-native-handoff-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: Checkout exact four public witnesses
        uses: actions/checkout@v5
        with:
          repository: Lalalalendia/lalamu
          ref: f78cc6f455f4dc222868f9cc035511a6ca7a91ea
          path: _witness/lalamu
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            pub-corpus/corpus/native/unclassified/211c2c6b4bf432fcc85fafa41b6219d328541f1a6e1fa2aaa8cb2134949e3157.pub
            pub-corpus/corpus/native/unclassified/6b5d5b269be7ca74b03d47423aec985676c45be7033e007792fcc3eb35ad929a.pub
            pub-corpus/corpus/native/unclassified/9c03c6e897be6abb4538bbb12cee3041fe4eab3af9109ce1df5d64b46e4c0569.pub
            pub-corpus/corpus/native/unclassified/ccfcbadc8951acece4d10cc27d71f28f318685845b94ae07fd46331c3571f3ff.pub

      - name: Build exact self-contained ZIP
        run: python tools/delivery/build_quill_story_native_handoff.py

      - name: Verify archive contents
        run: |
          python - <<'PY'
          import hashlib, json, zipfile
          from pathlib import Path
          p = Path("out/QUILL-STORY-READONLY-NATIVE-HANDOFF.zip")
          assert p.is_file()
          with zipfile.ZipFile(p) as z:
              names=set(z.namelist())
          prefix="QUILL-STORY-READONLY-NATIVE-HANDOFF/"
          required=[
              "RUN_NATIVE.cmd",
              "RUN_NATIVE.ps1",
              "README.txt",
              "BUNDLE-MANIFEST.json",
              "tools/research-runner/experiments/quill-story-readonly-oracle-02.packet.json",
              "tools/research-runner/operations/quill_story_readonly_oracle_02.ps1",
              "tools/research-runner/prepare_native_run.ps1",
              "tools/research-runner/finalize_native_run.ps1",
              "tools/windows/pub-runtime/PubRuntime.psm1",
          ]
          for rel in required:
              assert prefix+rel in names, rel
          pubs=[n for n in names if n.startswith(prefix+"witnesses/") and n.endswith(".pub")]
          assert len(pubs)==4, pubs
          summary=json.loads(Path("out/native-handoff-summary.json").read_text())
          assert summary["sha256"]==hashlib.sha256(p.read_bytes()).hexdigest()
          print(json.dumps(summary, indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: QUILL-STORY-READONLY-NATIVE-HANDOFF-${{ github.run_id }}
          path: |
            out/QUILL-STORY-READONLY-NATIVE-HANDOFF.zip
            out/native-handoff-summary.json
          if-no-files-found: error
          retention-days: 30
