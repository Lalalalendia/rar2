name: PUB PDF source-window semantics measure

on:
  pull_request:
    paths:
      - ".github/workflows/pub-pdf-source-window-semantics-measure.yml"
      - "vendor/producer-a/crates/pub-cli/Cargo.toml"
      - "vendor/producer-a/crates/pub-cli/src/bin/pub_image_window_census.rs"

permissions:
  contents: read
  actions: read

jobs:
  census:
    if: github.event.pull_request.head.ref == 'measure/pub-pdf-source-window-semantics-01'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt
      - name: Format and compile measurement binary
        run: |
          rustfmt --edition 2024 --check vendor/producer-a/crates/pub-cli/src/bin/pub_image_window_census.rs
          cargo build --manifest-path vendor/producer-a/Cargo.toml -p pub-cli --bin pub-image-window-census
      - name: Acquire pinned exact-1050 corpus
        uses: actions/download-artifact@v4
        with:
          name: pub-corpus-1000-36573574820
          path: out/pinned1050
          github-token: ${{ github.token }}
          repository: Lalalalendia/rar2
          run-id: 36573574820
      - name: Measure exact changed source-window witnesses
        shell: bash
        run: |
          set -euo pipefail
          out="target/pub-pdf-source-window-semantics"
          mkdir -p "$out"
          while IFS='|' read -r fixture sha; do
            src="out/pinned1050/materialized/native/$sha.pub"
            test -s "$src"
            test "$(sha256sum "$src" | awk '{print $1}')" = "$sha"
            vendor/producer-a/target/debug/pub-image-window-census "$src" > "$out/$fixture.json"
          done <<'EOF'
          021_942759e9d092e60f|942759e9d092e60f5ec4af574219590de729b2091abec94fd79c3563eccaaa70
          023_6bbfbf7b4c9b2400|6bbfbf7b4c9b240026399fcc114ee0eb78fbc954c8f258f5baf3a388d3f188c8
          034_0d2278960a0101ce|0d2278960a0101ced0a1ba6d5922f5a26ea37b76b3ab00ef21e21873359d4a5a
          041_155f8fd8c191851e|155f8fd8c191851e4380ab1557638aeabb34b2257fa12a7748ab00b09edb74ba
          048_e36966ede5f44ae1|e36966ede5f44ae11a633afccca29f7205993f7dbb13eff233897f3d41e0cb6d
          049_b42a332495173174|b42a332495173174c5386d21beb6f663b6ef7b16bc49d03499bc8b97ada99e2e
          053_70f21e6856945d09|70f21e6856945d091469fd79f815674128e1cbf7e160e352aa0e80968ae924f8
          057_f4f23d04d29f2040|f4f23d04d29f20407b9e5c1f57f8df84e71084d9e8cd4f0c1cc0064737053de7
          081_8ca766c139a8e011|8ca766c139a8e01149668aa57171ba17f69d67c5212401494205718e71f23b61
          090_770daf58c214d6f8|770daf58c214d6f848af676b6a53c04934f7c1499e5674837a18a2f63875dc90
          094_bbaefcbdcdd2dbe5|bbaefcbdcdd2dbe51a636ed554c14d6f5353c98e795b5f88d26f79542e5d93ba
          EOF
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path("target/pub-pdf-source-window-semantics")
          rows = [json.loads(path.read_text()) for path in sorted(root.glob("*.json"))]
          receipt = {"schema": "chaptera.pub-pdf-source-window-semantics-receipt.v1", "fixtures": rows}
          (root / "receipt.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n")
          print(json.dumps(receipt, indent=2, sort_keys=True))
          PY
      - name: Upload source-safe source-window semantics receipt
        uses: actions/upload-artifact@v4
        with:
          name: pub-pdf-source-window-semantics
          path: target/pub-pdf-source-window-semantics/receipt.json
          retention-days: 30
